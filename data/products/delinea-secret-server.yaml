id: delinea-secret-server
vendor: Delinea
product: Secret Server Cloud and Delinea Platform API
website: https://delinea.com
docs: https://docs.delinea.com/online-help/platform-api/start.htm
category: security
status: listed
summary: >-
  Workloads reach Secret Server Cloud with a static secret: a Platform service user's password used
  as an OAuth client secret, an application account password, or an SDK onboarding key. Access
  tokens last an hour, but no OIDC, cloud identity or token exchange exists. Machine accounts are
  least-privilege, API-managed and show last login, but never expire and are not GitHub
  partner-revoked. Outbound, every cloud integration wants a pasted access key, JSON key or client
  secret.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      Delinea Platform service user (client_credentials grant, the service user's password is the
      client_secret) or a Secret Server application account (password grant on /oauth2/token), each
      returning a bearer token valid for up to an hour. The SDK for DevOps (tss) onboards with a rule
      name plus a static onboarding key and optional IP allowlist, then caches client credentials on
      disk.
    evidence:
      - url: https://docs.delinea.com/online-help/platform-api/start.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service users are specifically designed for non-interactive, programmatic access to the platform."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/add-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Integrations use the service user's password as the OAuth 2.0 client_secret when requesting an access token with the client_credentials grant type."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/add-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API authentication: MFA does not apply. Integrations authenticate with the service user's password only."
      - url: https://docs.delinea.com/online-help/platform-api/secret-server-apis-from-platform.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A Client Credentials - Platform service account credential (client ID and secret)"
      - url: https://docs.delinea.com/online-help/platform-api/secret-server-apis-from-platform.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The access token is valid for a specific period up to 3600 seconds."
      - url: https://docs.delinea.com/online-help/delinea-platform/api/ss-apis.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Some Secret Server features, such as Session Connector, authenticate directly to Secret Server's oauth2/token endpoint using SS-native Application Accounts rather than Platform Service Users."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server has user and application accounts. Both types of accounts can access Secret Server via the REST API."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Clients must provide a generated additional key string when authenticating."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server will only allow clients to use this rule if they connect from a valid IP address."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/authentication/script-token-auth/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Entra ID authentication is not supported"
      - url: https://docs.delinea.com/online-help/secret-server/setup/config-best-practices/api.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "IWA is only available for Secret Server On-Premises."
      - url: https://docs.delinea.com/online-help/secret-server/admin/app-settings/prevent-direct-api-authentication/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Application accounts (exempted by design)"
      - url: https://docs.delinea.com/online-help/dsv/usage/auth-general/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Because client credentials are static and must be handled by your automation, prefer the federated cloud authentication methods (AWS IAM, Azure MSI, GCP service accounts) when the workload runs in a cloud provider."
    notes: >-
      Graded on Secret Server Cloud as reached through the Delinea Platform. Every documented
      machine path starts from a long-lived secret: the Platform service user's password (sent as
      client_secret; MFA does not apply to API auth), a Secret Server application account password
      (password grant; application accounts are exempt from "Prevent Direct API Authentication"),
      or the SDK's onboarding key, which with an optional CIDR allowlist mints client credentials
      that tss stores on disk (DPAPI on Windows, a customer-supplied certificate on Linux, otherwise
      unencrypted). The resulting tokens are short-lived (up to 3600 s; refresh tokens bounded by
      the API session timeout), hence C. No OIDC, JWT bearer, GitHub Actions, cloud workload
      identity or token-exchange path exists for workloads on Secret Server Cloud or the Platform API;
      Platform "federation" (Entra, Okta, Ping, ADFS and others) and Secret Server OpenID Connect are
      human sign-in, the scripting guide states Entra ID authentication is not supported for scripts,
      and Integrated Windows Authentication is on-premises only. Sibling: DevOps Secrets Vault (DSV)
      does accept AWS IAM, Azure managed identity and GCP service-account identity for workloads
      (its "OIDC" provider is human login via Thycotic One), but DSV is a separate product and does
      not lift this grade. Moves to B or A only if the Platform or Secret Server accepts a federated
      workload token.
  outbound:
    grade: D
    mechanism: >-
      External vault links (AWS Secrets Manager, Azure Key Vault, Google Secret Manager, HashiCorp
      Vault, DSV sync), customer-managed encryption keys (AWS KMS, Azure Managed HSM) and discovery
      (AWS, GCP, Entra ID) all authenticate with a static credential stored as a secret: an IAM user
      access key, a GCP service-account JSON key, an Entra app client secret, or a Vault token or
      AppRole SecretID. Minimum permissions are documented and Secret Server can rotate several of
      these keys itself.
    evidence:
      - url: https://docs.delinea.com/online-help/secret-server/discovery/vendor-specific-topics/aws-discovery/enabling-aws-discovery/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "AWS only allows programmatic integration through access keys."
      - url: https://docs.delinea.com/online-help/secret-server/discovery/vendor-specific-topics/aws-discovery/enabling-aws-discovery/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The account used to do this requires the following AWS IAM permissions to discover users and access keys:"
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/aws/aws-sm-integration.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Fill in the text boxes with asterisks for the username, access key, and secret access key using the recorded values from the last step."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/aws/aws-sm-integration.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The included, default SecretsManagerReadWrite policy in the Attach Permissions Policies table should suffice."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-templates/specific-templates/key-management-ssc/aws_kms_config.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Be sure to save both the access key ID and the secret access key!"
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/gc-secret-manager.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server authenticates using a JSON service account key."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/gc-secret-manager.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Two permission approaches are supported: predefined IAM roles (recommended) or a custom set of minimum permissions."
      - url: https://docs.delinea.com/online-help/secret-server/discovery/vendor-specific-topics/google-cloud-platform-discovery/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Click the Create button. This creates and downloads a JSON private key file."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/akv/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Client Secret: Type in the Client Secret (Value) for the Azure AD Application."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/akv/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The App Registration / Service Principal used by the credential secret requires the following minimum Azure Key Vault data plane permissions for secret management operations:"
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-templates/specific-templates/key-management-ssc/azure_hsm_config.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Type in your Azure Managed HSM Principal Secret (the secret value of the client secret)."
      - url: https://docs.delinea.com/online-help/secret-server/discovery/vendor-specific-topics/entra-id/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The minimum required Microsoft Graph application permissions for discovery are:"
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/hashicorp-vault-integration.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server provides two HashiCorp Vault credential templates—pick the one that matches the auth method created in Vault."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/dsv-syncing/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server can push its secrets to DevOps Secrets Vault by creating a secret based on the \"DevOps Secret Vault Client Credentials\" template, which holds the client credentials for a DevOps Secrets Vault tenant."
      - url: https://docs.delinea.com/online-help/secret-server/rpc-heartbeat/rpc/rpc-secret-templates/templates/amazon_iam_key_secret_template_for_rpc.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "With Remote Password Changing (RPC), secrets can automatically change remote account passwords when a secret expires, either immediately or on a defined schedule."
      - url: https://docs.delinea.com/online-help/secret-server/rpc-heartbeat/rpc/rpc-secret-templates/templates/azure_application_registration_secret_template_for_rpc.htm
        checked_on: 2026-10-22
        checked_by: tehreet
