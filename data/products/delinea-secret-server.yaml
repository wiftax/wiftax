id: delinea-secret-server
vendor: Delinea
product: Secret Server Cloud
covers: Secret Server Cloud and the Delinea Platform API.
aliases:
  - Delinea Platform
  - Secret Server
website: https://delinea.com
docs: https://docs.delinea.com/online-help/platform-api/start.htm
category: security
status: listed
summary: >-
  To call Secret Server Cloud, your code holds a static secret: a service user's password, an
  application account password or an SDK onboarding key. It trades that for an hour-long token. When
  Secret Server reaches into your clouds, it uses pasted access keys, JSON keys or client secrets.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      A Platform service user's password sent as an OAuth client secret, an application account
      password, or an SDK onboarding key. Each is traded for a bearer token lasting up to an hour.
    evidence:
      - url: https://docs.delinea.com/online-help/platform-api/start.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service users are specifically designed for non-interactive, programmatic access to the platform."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/add-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Integrations use the service user's password as the OAuth 2.0 client_secret when requesting an access token with the client_credentials grant type."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/add-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API authentication: MFA does not apply. Integrations authenticate with the service user's password only."
      - url: https://docs.delinea.com/online-help/platform-api/secret-server-apis-from-platform.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A Client Credentials - Platform service account credential (client ID and secret)"
      - url: https://docs.delinea.com/online-help/platform-api/secret-server-apis-from-platform.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The access token is valid for a specific period up to 3600 seconds."
      - url: https://docs.delinea.com/online-help/delinea-platform/api/ss-apis.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Some Secret Server features, such as Session Connector, authenticate directly to Secret Server's oauth2/token endpoint using SS-native Application Accounts rather than Platform Service Users."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server has user and application accounts. Both types of accounts can access Secret Server via the REST API."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Clients must provide a generated additional key string when authenticating."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server will only allow clients to use this rule if they connect from a valid IP address."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/authentication/script-token-auth/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Entra ID authentication is not supported"
      - url: https://docs.delinea.com/online-help/secret-server/setup/config-best-practices/api.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "IWA is only available for Secret Server On-Premises."
      - url: https://docs.delinea.com/online-help/secret-server/admin/app-settings/prevent-direct-api-authentication/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Application accounts (exempted by design)"
      - url: https://docs.delinea.com/online-help/dsv/usage/auth-general/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Because client credentials are static and must be handled by your automation, prefer the federated cloud authentication methods (AWS IAM, Azure MSI, GCP service accounts) when the workload runs in a cloud provider."
    notes: >-
      Graded on Secret Server Cloud through the Delinea Platform. Every machine login starts from a
      long-lived secret, and the tokens it buys last up to an hour, hence C. There is no OIDC, cloud
      workload identity or token exchange for workloads. Platform federation and Secret Server
      OpenID Connect are for human sign-in, and scripts cannot use Entra ID. Windows integrated
      login is on-premises only. DevOps Secrets Vault does accept AWS, Azure and GCP workload
      identity, but it is a separate product and does not lift this grade.
  outbound:
    grade: D
    mechanism: >-
      Vault sync, customer-managed encryption keys and discovery all use a stored static credential:
      an IAM user access key, a GCP JSON key, an Entra client secret or a Vault token.
    evidence:
      - url: https://docs.delinea.com/online-help/secret-server/discovery/vendor-specific-topics/aws-discovery/enabling-aws-discovery/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "AWS only allows programmatic integration through access keys."
      - url: https://docs.delinea.com/online-help/secret-server/discovery/vendor-specific-topics/aws-discovery/enabling-aws-discovery/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The account used to do this requires the following AWS IAM permissions to discover users and access keys:"
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/aws/aws-sm-integration.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Fill in the text boxes with asterisks for the username, access key, and secret access key using the recorded values from the last step."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/aws/aws-sm-integration.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The included, default SecretsManagerReadWrite policy in the Attach Permissions Policies table should suffice."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-templates/specific-templates/key-management-ssc/aws_kms_config.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Be sure to save both the access key ID and the secret access key!"
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/gc-secret-manager.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server authenticates using a JSON service account key."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/gc-secret-manager.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Two permission approaches are supported: predefined IAM roles (recommended) or a custom set of minimum permissions."
      - url: https://docs.delinea.com/online-help/secret-server/discovery/vendor-specific-topics/google-cloud-platform-discovery/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Click the Create button. This creates and downloads a JSON private key file."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/akv/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Client Secret: Type in the Client Secret (Value) for the Azure AD Application."
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/akv/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The App Registration / Service Principal used by the credential secret requires the following minimum Azure Key Vault data plane permissions for secret management operations:"
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-templates/specific-templates/key-management-ssc/azure_hsm_config.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Type in your Azure Managed HSM Principal Secret (the secret value of the client secret)."
      - url: https://docs.delinea.com/online-help/secret-server/discovery/vendor-specific-topics/entra-id/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The minimum required Microsoft Graph application permissions for discovery are:"
      - url: https://docs.delinea.com/online-help/secret-server/secret-operations/secret-management/external-secrets/hashicorp-vault-integration.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server provides two HashiCorp Vault credential templates—pick the one that matches the auth method created in Vault."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/dsv-syncing/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret Server can push its secrets to DevOps Secrets Vault by creating a secret based on the \"DevOps Secret Vault Client Credentials\" template, which holds the client credentials for a DevOps Secrets Vault tenant."
      - url: https://docs.delinea.com/online-help/secret-server/rpc-heartbeat/rpc/rpc-secret-templates/templates/amazon_iam_key_secret_template_for_rpc.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "With Remote Password Changing (RPC), secrets can automatically change remote account passwords when a secret expires, either immediately or on a defined schedule."
      - url: https://docs.delinea.com/online-help/secret-server/rpc-heartbeat/rpc/rpc-secret-templates/templates/azure_application_registration_secret_template_for_rpc.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This template rotates the client secret of an App Registration through the Microsoft Graph API, authenticating as a privileged “rotator” App Registration."
    notes: >-
      Vault sync, encryption keys and discovery on AWS, GCP and Azure all take a static key. None
      offers an AWS role, GCP impersonation or an Azure federated credential. The AWS discovery page
      says access keys are the only option. It is D, not F, because each integration documents
      minimum permissions and Secret Server can rotate the AWS, GCP and Entra keys it holds. The AWS
      Secrets Manager walk-through still defaults to a broad managed policy. Distributed engines in
      your network cannot use their own cloud identity either.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Application accounts can only access Secret Server via the REST API. Both account types never expire."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/password-settings.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter 0 (zero) if you do not want to specify a password expiration period."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/manage-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Regardless of the \"Maximum password age\" setting, the password for this account never expires."
    notes: >-
      Application accounts never expire. Platform password age can be disabled or overridden per
      account, and the docs do not say an aged password stops API logins. A changeable default
      fails, as on elastic-cloud-api. The SDK rotates a local encryption key, not the credential.
  rotation_api:
    pass: true
    evidence:
      - url: https://updates.thycotic.net/secretserver/restapiguide/TokenAuth/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Whether this is an application account. Application accounts are used for automation, cannot log in using the UI, and do not consume a user license."
      - url: https://updates.thycotic.net/secretserver/restapiguide/TokenAuth/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Reset a user password as an admin"
      - url: https://updates.thycotic.net/secretserver/restapiguide/TokenAuth/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Revoke a single SDK Client account by ID"
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "These credentials can be revoked, but will remain valid for 15 minutes after revocation, after which their validity expires."
    notes: >-
      The Secret Server REST API creates application accounts, resets their passwords, deletes them
      and revokes SDK clients.
  scoping:
    pass: true
    evidence:
      - url: https://docs.delinea.com/online-help/platform-api/start.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service users have no permissions except those explicitly granted."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/add-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Add the user to the appropriate group or role to give it only the permissions it needs for its headless use case."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Do NOT give an application account the Administrator Role or all role permissions."
    notes: >-
      Service users and application accounts are machine identities with their own roles and
      per-folder or per-secret permissions. Service users can log in to the Platform UI unless a
      policy blocks it.
  last_used:
    pass: true
    evidence:
      - url: https://docs.delinea.com/online-help/delinea-platform/users/manage-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The top of the Overview tab displays the user account’s basic information, including status, directory source, creation date, last login, and last password change."
      - url: https://updates.thycotic.net/secretserver/restapiguide/TokenAuth/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Time of last login"
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Select the Audit tab to see date and time-stamped SDK client activity concerning onboarding rules and client secrets."
    notes: >-
      The credential is the account's password, so the account's last login reveals dead
      credentials, as on the snowflake card. The docs don't say API token requests update last
      login.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Delinea is not in GitHub's secret scanning partner list, and its credentials have no
      recognizable prefix.

notes: >-
  Covers Secret Server Cloud and the Delinea Platform API in front of it. Self-hosted adds Windows
  integrated login, which is Kerberos, not federation. DevOps Secrets Vault has workload cloud
  identity and would need its own card. Inbound moves up only with a federated workload token.
  Outbound moves up with any role-based or federated integration.
