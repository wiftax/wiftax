    notes: >-
      Checked: external vault links to AWS Secrets Manager (IAM user access key), Azure Key Vault
      (Entra app client secret), Google Cloud Secret Manager (service-account JSON key), HashiCorp
      Vault (token or AppRole RoleId/SecretId) and DSV (DSV client credentials); Secret Server Cloud
      customer-managed keys in AWS KMS (IAM access key) and Azure Managed HSM (app client secret);
      discovery of AWS IAM/EC2 (access key), GCP (JSON key) and Entra ID (app client secret). None
      offers an IAM role with external ID, GCP impersonation or workload identity federation, or an
      Azure federated credential, and the AWS discovery page says access keys are the only option.
      D rather than F because each integration documents minimum permissions (IAM actions, GCP
      custom role, Key Vault data-plane rights, Graph application permissions; the AWS Secrets
      Manager walk-through does default to the broad SecretsManagerReadWrite managed policy) and
      Secret Server's own remote password changing can rotate AWS IAM keys, GCP service-account
      keys and Entra app client secrets it holds. Distributed engines run in your network but the
      docs give them no ambient-identity option for these integrations. Delinea Platform's separate
      cloud entitlement products were not graded here.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Application accounts can only access Secret Server via the REST API. Both account types never expire."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/password-settings.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter 0 (zero) if you do not want to specify a password expiration period."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/manage-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Regardless of the \"Maximum password age\" setting, the password for this account never expires."
    notes: >-
      Fails. Secret Server application accounts never expire. Platform identity policies have a
      "Maximum password age" (default 365 days) and an optional account expiration date, but 0
      disables the age, any account can be flagged "Password never expires" over the policy, and
      expiry is described as a prompt to change the password at sign-in; the docs do not say an aged
      password stops client_credentials API auth. A changeable default is not an enforced expiry
      (same call as elastic-cloud-api). The SDK client's roughly 90-day key rotation is its local
      config-encryption key, not the onboarding key or account credential.
  rotation_api:
    pass: true
    evidence:
      - url: https://updates.thycotic.net/secretserver/restapiguide/TokenAuth/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Whether this is an application account. Application accounts are used for automation, cannot log in using the UI, and do not consume a user license."
      - url: https://updates.thycotic.net/secretserver/restapiguide/TokenAuth/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Reset a user password as an admin"
      - url: https://updates.thycotic.net/secretserver/restapiguide/TokenAuth/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Revoke a single SDK Client account by ID"
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "These credentials can be revoked, but will remain valid for 15 minutes after revocation, after which their validity expires."
    notes: >-
      The Secret Server REST API (published 11.4 guide) creates users with isApplicationAccount,
      resets passwords, deletes users, creates and deletes SDK client rules, reads onboarding keys
      and revokes SDK client accounts; /v1/oauth-expiration expires issued tokens. Platform service
      users are created in the UI per the docs; the Platform Identity API reference is a JS-rendered
      page and its user-management calls were not verified.
  scoping:
    pass: true
    evidence:
      - url: https://docs.delinea.com/online-help/platform-api/start.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service users have no permissions except those explicitly granted."
      - url: https://docs.delinea.com/online-help/delinea-platform/users/add-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Add the user to the appropriate group or role to give it only the permissions it needs for its headless use case."
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Do NOT give an application account the Administrator Role or all role permissions."
    notes: >-
      Service users and application accounts are purpose-built machine principals with their own
      roles and per-secret/folder permissions; SDK clients inherit the application account bound to
      their rule. Service users can sign in to the Platform UI by default unless an identity policy
      disables interactive login.
  last_used:
    pass: true
    evidence:
      - url: https://docs.delinea.com/online-help/delinea-platform/users/manage-users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The top of the Overview tab displays the user account’s basic information, including status, directory source, creation date, last login, and last password change."
      - url: https://updates.thycotic.net/secretserver/restapiguide/TokenAuth/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Time of last login"
      - url: https://docs.delinea.com/online-help/secret-server/api-scripting/sdk-devops/using-sdk/index.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Select the Audit tab to see date and time-stamped SDK client activity concerning onboarding rules and client secrets."
    notes: >-
      The credential is the account's password, so the account's last login (Platform user page,
      Secret Server User lastLogin field) plus the SDK client audit tab serve to find dead machine
      credentials, the same reading as snowflake's login history. The docs do not state explicitly
      that client_credentials token issuance updates "last login"; a reviewer may want to confirm.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Neither Delinea nor Thycotic appears in GitHub's supported secret scanning patterns table, so
      a leaked service user password, application account password or SDK onboarding key is not
      reported to Delinea. These credentials are free-form passwords and base64 keys with no
      recognizable prefix.

notes: >-
  One card for Secret Server Cloud and the Delinea Platform API it is fronted by (Platform service
  users auto-create a matching Secret Server application account). Self-hosted Secret Server adds
  Integrated Windows Authentication, which is Windows-domain Kerberos rather than federation and is
  not available in the cloud. DevOps Secrets Vault is a separate Delinea product with cloud-identity
  workload auth (AWS IAM, Azure MSI, GCP) and would merit its own card. Three of five hygiene checks
  pass; an enforced maximum lifetime on service-user secrets and GitHub partner revocation would add
  the rest. Inbound moves to B or A only if workloads can present a federated token (GitHub Actions
  OIDC, cloud workload identity, or a bring-your-own issuer); outbound moves up with an IAM role,
  GCP impersonation or Azure federated credential option on any integration.
