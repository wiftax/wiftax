id: hot-aisle
vendor: Hot Aisle
product: GPU Cloud
covers: "The API, CLI and SSH admin TUI."
website: https://hotaisle.xyz
docs: https://admin.hotaisle.app/api/docs/
category: cloud
status: listed
confidence:
  level: low
  reason: >-
    API keys are managed in a login-only SSH admin tool. The public API shows no expiry or last-used
    field. If the tool enforced either, plus one more fix, inbound would move from F to D.
summary: >-
  Your code calls Hot Aisle with a static user API key, and there is no OIDC path. Keys can be
  rotated and scoped through the API, but have no expiry or last-used view and no GitHub leak
  revocation. Hot Aisle never reaches into your infrastructure.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static user API key, used by the API, the hotaisle CLI and the dstack backend. No OIDC,
      workload identity or token exchange exists.
    issuers: []
    evidence:
      - url: https://admin.hotaisle.app/api/docs/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Please enter in the word 'Token', a space, and then paste in your token."
      - url: https://admin.hotaisle.app/api/docs/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The full token value. This is the only time the full token will be returned, as it is not stored plaintext on the server and cannot be recovered."
      - url: https://github.com/hotaisle/hotaisle-cli
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When you log in to the admin TUI via ssh admin.hotaisle.app, check the breadcrumbs at the top; you'll likely start in the team settings."
      - url: https://raw.githubusercontent.com/hotaisle/hotaisle-cli/main/internal/config/config.go
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "ApiToken string `json:\"api_token\"`"
      - url: https://hotaisle.xyz/quick-start/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The same platform is available through the API, CLI, and cloud-init templates."
      - url: https://dstack.ai/docs/concepts/backends/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API key requires the owner role for your user and the operator and user roles for the team specified in team_handle."
    notes: >-
      Every endpoint uses the same static token header. The CLI stores the key in its config, and
      dstack, the documented automation path, takes the same key pasted in. Nothing in the site, API
      schema or CLI source describes OIDC or token exchange. There is no separate storage, registry
      or Kubernetes service to grade. VMs are reached with SSH keys you upload. Two of five hygiene
      checks pass, so F.
  outbound:
    grade: N/A
    mechanism: >-
      Hot Aisle never needs access to your infrastructure. It provisions VMs and bare metal you then
      log in to.
    evidence:
      - url: https://hotaisle.xyz/quick-start/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Choose a GPU configuration and start your isolated compute."
      - url: https://hotaisle.xyz/policies/shared-responsibility-model
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Storage, compute power, and networking infrastructure are all the responsibilities of Hot Aisle."
    notes: >-
      Checked the API schema, the CLI, the quick start and the policies pages. Hot Aisle never pulls
      from your bucket, registry, Hugging Face or W&B. Anything your VM fetches uses credentials you
      place there. dstack calls into Hot Aisle, which is inbound.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://admin.hotaisle.app/api/docs/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "UserAPIKeyRequest represents the data needed to create or update an API key"
    notes: >-
      Keys have no expiry field in the API. The key screen in the SSH admin tool is login-walled,
      but nothing public suggests a lifetime setting.
  rotation_api:
    pass: true
    evidence:
      - url: https://admin.hotaisle.app/api/docs/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Creates a new API key with specified permissions."
      - url: https://admin.hotaisle.app/api/docs/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Permanently deletes an API key."
      - url: https://raw.githubusercontent.com/hotaisle/hotaisle-cli/main/cmd/cli/command_user.go
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Usage: \"Delete an API key.\","
    notes: >-
      The API and CLI can create and delete keys, so a key with the owner role can mint its
      replacement and revoke itself.
  scoping:
    pass: true
    evidence:
      - url: https://admin.hotaisle.app/api/docs/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "UserAPIKeyTeamRoles defines the permissions for an API key on a specific team"
      - url: https://admin.hotaisle.app/api/docs/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The list of effective roles that this authenticated request has, based on API Key restrictions"
      - url: https://admin.hotaisle.app/api/docs/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Keys with a user role of 'owner' can modify the user, including changing name, leaving or accepting invites to teams, and creating api keys"
    notes: >-
      Judgment call. There are no service accounts, but each key has its own teams and roles. A key
      limited to operator on one team meets the rubric. Self-rotation needs the owner role.
  last_used:
    pass: false
    evidence:
      - url: https://admin.hotaisle.app/api/docs/swagger.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "UserAPIKey represents a user's API key"
    notes: >-
      The key object has no created or last-used time. Whether the login-walled admin tool shows one
      is unknown.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Hot Aisle is not on GitHub's secret-scanning list. Its keys have no distinctive prefix, which
      makes a pattern harder to add.

notes: >-
  One card, since VMs and bare metal share one API. Key management is login-walled, hence low
  confidence. Like coreweave-api it gets F for a user-owned static token, but keys here can be
  rotated and scoped through the API. One more check, such as enforced expiry or a last-used time,
  makes D. B or A needs an OIDC token exchange.
