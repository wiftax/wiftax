id: baseten
vendor: Baseten
product: Platform
covers: "Inference, training and the Management API."
website: https://www.baseten.co
docs: https://docs.baseten.co/organization/api-keys
category: cloud
status: listed
summary: >-
  Every Baseten call, from CI to inference, uses a static API key. Keys can carry an expiry.
  Federation into the API is only a Private Preview, so it does not count. Baseten is an OIDC issuer
  and pulls from AWS, GCP and Hugging Face without keys. Azure, R2, CoreWeave and other registries
  take static secrets.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static API key, personal or team-owned. Short-lived sandbox and volume tokens exist, but
      they are minted from that key. Workload identity federation into the API is documented only as
      a Private Preview. Its setup page was not part of this review.
    issuers: []
    evidence:
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Use CLI sign-in or a scoped team API key for every workload."
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "A short-lived access token from workload identity federation, in Private Preview."
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Set BASETEN_API_KEY to an administrative credential that can create team keys."
      - url: https://docs.baseten.co/deployment/ci-cd.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The CLI reads your API key from the `BASETEN_API_KEY` environment variable"
      - url: https://docs.baseten.co/reference/ci/github-action.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Baseten API key. Store this as an"
      - url: https://raw.githubusercontent.com/basetenlabs/terraform-provider-baseten/main/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authenticate with `BASETEN_API_KEY` in the environment, or set `api_key` on the provider."
      - url: https://docs.baseten.co/sandboxes/authentication.md
        checked_on: 2026-11-15
        checked_by: sisyphus
        quote: "You can't renew a token."
      - url: https://docs.baseten.co/reference/management-api/volumes/create-a-volume-access-token.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Exchanges your API key for a short-lived token that authenticates against Baseten volume storage."
      - url: https://docs.baseten.co/reference/cli/truss/auth.md
        checked_on: 2026-11-15
        checked_by: sisyphus
        quote: "Best for laptops where you don't want a stored secret on disk."
    notes: >-
      Every generally available automation route takes a static API key, including CI, the CLIs,
      Terraform and inference. The CI guide stores it as a GitHub secret instead of using the job's
      OIDC token. The CLIs' browser login is for humans. Gateway "federated API keys" are keys
      Baseten mints for a lab's customers, not OIDC. The API keys page now offers short-lived tokens
      from workload identity federation for GitHub Actions, AWS, Google Cloud and Azure, in Private
      Preview. A Private Preview is not shown to be self-serve, and its issuer list was not read.
      The path is noted but does not lift the grade. 4 of 5 hygiene checks pass, so D.
  outbound:
    grade: B
    mechanism: >-
      You trust Baseten's OIDC issuer from an AWS role, a GCP pool or Hugging Face. Baseten then
      pulls from S3, ECR, GCS, Artifact Registry and Hugging Face with short-lived tokens. Other
      sources need static secrets.
    evidence:
      - url: https://docs.baseten.co/organization/oidc.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Use short-lived tokens to authenticate to external resources from Baseten workloads."
      - url: https://docs.baseten.co/organization/oidc.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Issuer: https://oidc.baseten.co."
      - url: https://docs.baseten.co/organization/oidc.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "AWS for container images in Amazon ECR and weights or data in Amazon S3."
      - url: https://docs.baseten.co/organization/oidc.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "GCP for container images in Artifact Registry or GCR and weights or data in Google Cloud Storage."
      - url: https://docs.baseten.co/organization/oidc.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Hugging Face for inference weights and volume sync from private or gated repositories."
      - url: https://docs.baseten.co/organization/oidc.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Use a provider that accepts the runtime token audience."
      - url: https://docs.baseten.co/organization/aws-assume-role.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Baseten enables AWS AssumeRole by default for Enterprise organizations."
      - url: https://docs.baseten.co/development/model/bdn.md
        checked_on: 2026-11-15
        checked_by: sisyphus
        quote: "Azure sources don't support OIDC, and the secret is required even for public containers."
      - url: https://docs.baseten.co/development/model/bdn.md
        checked_on: 2026-11-15
        checked_by: sisyphus
        quote: "OIDC is not supported for CoreWeave sources; use a secret."
      - url: https://docs.baseten.co/development/model/bdn.md
        checked_on: 2026-11-15
        checked_by: sisyphus
        quote: "GCP supports using either service accounts or OIDC for GCS authentication."
      - url: https://docs.baseten.co/engines/performance-concepts/cloud-storage-deployment.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For private or gated repositories, add your Hugging Face API token as a plain-text secret, then reference it in your config:"
      - url: https://docs.baseten.co/development/model/dependencies.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For AWS ECR and Google Cloud registries, configure `docker_auth` in `config.yaml` with OIDC (recommended), IAM, or a service account."
      - url: https://docs.baseten.co/development/model/dependencies.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The value of a `DOCKER_REGISTRY_*` secret must be the Base64 encoding of `username:password`; a raw token or personal access token won't work."
      - url: https://docs.baseten.co/development/volumes/sync.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Use short-lived credentials to read a private source."
      - url: https://docs.baseten.co/organization/audit-logs.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Baseten enables export and helps you configure the destination."
    notes: >-
      AWS, GCP and Hugging Face are keyless for weights through Baseten's OIDC issuer. The subject
      can be pinned to an org, team, model or environment. AWS AssumeRole with an External ID is a
      second keyless route. It is on by default for Enterprise and on request otherwise. Azure Blob
      takes only a storage account key. R2, CoreWeave and other registries take long-lived tokens or
      passwords, so B, not A. The engines guide still tells Hugging Face users to paste a token.
      Baseten can mount an OIDC token in your container, but its own pullers do not use it for
      Azure. Audit log export credentials are not public and were not graded.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Set an expiration when you create a key."
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Required, within 90 days or your organization's limit, whichever is shorter."
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Organization Admins can set expiration limits for new keys; changing a limit doesn't change existing keys."
      - url: https://docs.baseten.co/reference/management-api/api-keys/creates-an-api-key.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Creates an API key with the provided name and type."
    notes: >-
      Keys take an expiry when they are created. Personal keys must expire within 90 days. Org
      Admins can cap the lifetime of team and management keys. Keys made before expiry existed never
      expire, and team keys can still be set to never when no cap applies.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Use an API key management key to provision and rotate team keys without an individual's credentials."
      - url: https://docs.baseten.co/reference/management-api/api-keys/delete-an-api-key.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Deletes an API key by prefix and returns info about the API key."
    notes: >-
      Keys can be created and deleted through the API and CLI. Key-management keys can rotate team
      keys without a human. The first key must come from the dashboard or a browser login.
  scoping:
    pass: true
    evidence:
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Team API keys belong to a team, independent of any individual user."
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "The key can only call specific models within the selected environments."
    notes: >-
      Team keys are non-human and come in fixed levels, such as full access, inference only and
      metrics only, with optional model limits. The narrow types count. Personal keys get the user's
      full access.
  last_used:
    pass: true
    evidence:
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "The API keys page shows each visible key's creation date, expiration, and last-used timestamp."
      - url: https://docs.baseten.co/reference/management-api/api-keys/lists-the-users-api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Last recorded use in ISO 8601 format, or null if unavailable."
    notes: >-
      The API and dashboard show when each key was last used, sometimes with a delay.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-11-23
        checked_by: sisyphus
      - url: https://docs.baseten.co/organization/api-keys.md
        checked_on: 2026-11-23
        checked_by: sisyphus
        quote: "Baseten API keys use the stable `b10_` prefix so secret-scanning tools can identify exposed credentials."
    notes: >-
      Baseten is not in GitHub's secret scanning list. Its new b10_ key prefix would make a
      partnership possible.

notes: >-
  Covers inference, Model APIs, training, sandboxes and the Management API, which share the same
  keys. Inbound stays D until federation into the API is self-serve and documented for workloads.
  Outbound moves to A if Azure, R2 and CoreWeave gain a keyless path and registries stop needing
  pasted tokens.
