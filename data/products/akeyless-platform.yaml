id: akeyless-platform
vendor: Akeyless
product: Identity Security Platform
covers: The secrets management API.
aliases:
  - Secrets Management
website: https://www.akeyless.io
docs: https://docs.akeyless.io/docs/access-and-authentication-methods
category: identity
status: listed
summary: >-
  To call Akeyless, your code can present a JWT from any issuer whose JWKS URL you configure, so no
  static Access Key is needed. Outbound runs from a Gateway you host. Cloud targets can use the
  Gateway's own cloud identity, but Okta, GitHub, Salesforce and most databases need pasted secrets.
surfaces:
  inbound:
    grade: A
    mechanism: >-
      The OAuth2.0/JWT auth method checks tokens against any JWKS URL you set, with optional issuer
      and audience checks and enforceable subject matching. A static Access Key is the fallback.
    issuers:
      - any
    evidence:
      - url: https://docs.akeyless.io/docs/auth-with-oauth-jwt
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          jwks-uri: The URL to the JSON Web Key Set (JWKS) that contains the public keys that should
          be used to verify any JSON Web Token (JWT) issued by the authorization server.
      - url: https://docs.akeyless.io/docs/cli-ref-auth
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "--force-sub-claims: enforce role-association must include sub-claims"
      - url: https://docs.akeyless.io/docs/cli-ref-auth
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "--audience: The audience in the JWT"
      - url: https://docs.akeyless.io/docs/sub-claims
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          In other words, only clients whose tokens contain these sub-claims (in the case of
          JWT/OIDC) or attributes (in the case of SAML) will be allowed to access the rules defined
          in the role.
      - url: https://docs.akeyless.io/docs/github-action
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          The default usage relies on using the GitHub JWT (JSON Web Token) to authenticate to
          Akeyless.
      - url: https://docs.akeyless.io/docs/access-and-authentication-methods
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: Cloud identities (CSP IAM)
    notes: >-
      Any issuer that publishes a JWKS works, and GitHub Actions is one documented example. Issuer
      and audience checks are optional. Without subject rules, any token signed by that JWKS gets
      in. The Gateway you host can log in with its own cloud identity, so it needs no static
      credential either. Akeyless itself calls API Key login "not recommended for production use."
  outbound:
    grade: B
    mechanism: >-
      Your Gateway reaches AWS, GCP and Azure with its own cloud identity, optionally assuming an
      AWS role with an External ID. Other targets take a pasted token, private key, client secret or
      password.
    evidence:
      - url: https://docs.akeyless.io/docs/aws-targets
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          The best practice for using IAM roles in AWS is to leverage them for granting temporary,
          least-privilege access to resources, rather than relying on long-term access keys for
          users. Use your Gateway cloud ID to use IAM roles.
      - url: https://docs.akeyless.io/docs/aws-targets
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          External ID: Optional, A unique auto-generated value used in your AWS account when
          configuring your AWS IAM role to securely delegate access to Akeyless
      - url: https://docs.akeyless.io/docs/gcp-targets
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          Check the Use Gateway's Cloud Identity radio button to authenticate with the Gateway's
          Cloud IAM.
      - url: https://docs.akeyless.io/docs/azure-targets
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          Use Gateway's Cloud Identity is relevant for cases where your Gateway uses Azure service
          principal to authenticate against Akeyless.
      - url: https://docs.akeyless.io/docs/okta-target
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "api-token: The Okta API token."
      - url: https://docs.akeyless.io/docs/github-target
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "github-app-private-key: The GitHub application private key."
      - url: https://docs.akeyless.io/docs/salesforce-target
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "auth-flow: The type of the auth flow, either jwt or user-password."
      - url: https://docs.akeyless.io/docs/database-targets
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "DB Password: Password of the database privilege user name."
    notes: >-
      AWS, GCP and Azure are keyless only when the Gateway runs in that cloud. It uses the machine's
      own identity, not a cross-account trust to Akeyless. Static secrets are required for Okta API
      tokens and GitHub App private keys you create. Salesforce secrets and database passwords are
      also static, as are the explicit cloud modes. Akeyless can point a target at a secret it
      rotates for you. Kubernetes, SSH and other targets were not checked one by one.
hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.akeyless.io/docs/cli-ref-auth
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          --access-expires[=0]: Access expiration date in Unix timestamp (select 0 for access
          without expiry date)
      - url: https://docs.akeyless.io/docs/account-settings
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          Users can set the default length of time Authentication Methods in the account will last.
          At the maximum time set, the user will be logged out of Akeyless.
    notes: >-
      Any auth method, API Key included, can carry an expiry date, but it defaults to never. Account
      TTL settings limit the session token, not the Access Key, and no policy forces a key expiry.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.akeyless.io/docs/auth-with-api-key
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          The Access Key is displayed only once. Store it securely. However, you can reset the
          access key at any time.
      - url: https://docs.akeyless.io/docs/auth-with-api-key
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: To reset the Access Key with the CLI, run the Akeyless reset-access-key command
    notes: >-
      Creating, resetting and deleting an API Key all work from the CLI and API.
  scoping:
    pass: true
    evidence:
      - url: https://docs.akeyless.io/docs/auth-with-api-key
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          After creating the authentication method, associate it with one or more Access Roles so
          authenticated identities can perform actions in Akeyless.
      - url: https://docs.akeyless.io/docs/cli-ref-auth
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "--bound-ips: A comma-separated CIDR block list to allow client access"
    notes: >-
      Each API Key is its own auth method, bound to access roles and optional IP ranges.
  last_used:
    pass: true
    evidence:
      - url: https://docs.akeyless.io/docs/account-settings
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          Set a global event for Auth methods that have not been used or changed within the usage
          interval, the minimum is 90 days.
      - url: https://raw.githubusercontent.com/akeylesslabs/akeyless-go/master/docs/AuthMethod.md
        checked_on: 2026-10-19
        checked_by: sisyphus
        quote: GetAccessDate returns the AccessDate field if non-nil, zero value otherwise.
    notes: >-
      Judgment call. Akeyless can alert on auth methods unused for 90 days, which serves the
      purpose. No doc page shows a last-used timestamp for an Access Key.
  leak_revocation:
    pass: false
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          Partner alerts: Reported directly to secret providers that are part of secret scanning's
          partner program.
    notes: >-
      Akeyless is not in GitHub's secret scanning list.
notes: >-
  Graded the SaaS secrets API. Its other products share the same auth methods. Hygiene applies to
  the API Key, the only long-lived credential Akeyless issues for inbound login.
