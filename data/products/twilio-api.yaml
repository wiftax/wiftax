id: twilio-api
vendor: Twilio
product: API
covers: The Twilio REST API.
website: https://www.twilio.com
docs: https://www.twilio.com/docs/iam
category: comms
status: listed
summary: >-
  To call Twilio, your code needs a static API key that never expires, or an OAuth client secret
  (public beta) that it trades for short-lived tokens. There is no federation. To save recordings to
  your S3 bucket, you hand Twilio an IAM user's access key.
surfaces:
  inbound:
    grade: C
    mechanism: >-
      An OAuth client ID and secret (public beta) traded for short-lived tokens. Otherwise a static
      API key and secret, or the Account SID and Auth Token.
    issuers: []
    evidence:
      - url: https://www.twilio.com/en-us/changelog/oauth-public-beta
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          We support the Client Credentials grant type of OAuth 2.0 as defined in RFC 6749, section
          4.4.
      - url: https://www.twilio.com/docs/iam/oauth-apps/overview
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Twilio generates a Client ID and Client Secret
      - url: https://www.twilio.com/docs/iam/oauth-apps/overview
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          OAuth credentials generate tokens with a limited lifespan, reducing the risk of credential
          leaks.
      - url: https://www.twilio.com/docs/iam/api-keys
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: API keys are the preferred way to authenticate with Twilio's REST APIs.
    notes: >-
      The IAM docs describe no OIDC or cloud identity federation. Public Key Client Validation signs
      requests with a private key you hold, but that key is static with no federation, so it is also
      C. OAuth went to public beta on 2025-11-06. The docs do not state how long access tokens last.
  outbound:
    grade: D
    mechanism: >-
      To store Voice and Video recordings in S3, you give Twilio an IAM user's access key and
      secret.
    evidence:
      - url: https://www.twilio.com/docs/voice/recording-settings
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          An AWS IAM user with permission to write objects to that bucket. You'll need the IAM
          user's access key ID and secret access key.
      - url: https://www.twilio.com/docs/iam/credentialaws-resource
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Twilio can store video and voice recordings on AWS Simple Storage Service (S3). To access
          S3, Twilio uses AWS credentials.
      - url: https://www.twilio.com/docs/video/tutorials/storing-aws-s3
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          The AWS credentials: The access key ID and secret access key for an AWS Identity and
          Access Management (IAM) user with write access to the bucket.
    notes: >-
      This is the only reach into your cloud we found in the core REST API. Segment, SendGrid and
      Flex are separate products. Twilio's example IAM policy allows only s3:PutObject on one
      prefix. That is real least-privilege guidance, so this is D, not F. There is no IAM role
      option, and the docs give no rotation procedure.
hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://www.twilio.com/docs/usage/api/keys
        checked_on: 2026-09-16
        checked_by: tehreet
      - url: https://www.twilio.com/docs/iam/api-keys/keys-in-console
        checked_on: 2026-10-05
        checked_by: sisyphus
        quote: >-
          For Standard and Main API keys, you can update only the API key name. For Restricted keys,
          you can update the API key name and the permissions.
    notes: >-
      Keys have no expiry field and live until deleted. Neither Console offers an expiration when
      you create or edit a key.
  rotation_api:
    pass: true
    evidence:
      - url: https://www.twilio.com/docs/usage/api/keys
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: POST https://api.twilio.com/2010-04-01/Accounts/{AccountSid}/Keys.json
    notes: >-
      Both API versions can create and delete keys.
  scoping:
    pass: true
    evidence:
      - url: https://www.twilio.com/en-us/changelog/restricted-api-keys-ga
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Restricted API Keys is now Generally Available (GA).
      - url: https://www.twilio.com/docs/iam/api-keys/restricted-api-keys
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Restricted API keys have a limit of 100 permissions that can be associated with each key.
    notes: >-
      Restricted API keys went GA on 2025-12-10. Main and Standard keys have full or near-full
      access.
  last_used:
    pass: false
    evidence:
      - url: https://www.twilio.com/docs/usage/api/keys
        checked_on: 2026-09-16
        checked_by: tehreet
      - url: https://www.twilio.com/docs/iam/api-keys/keys-in-console
        checked_on: 2026-10-05
        checked_by: sisyphus
    notes: >-
      Neither the API nor the Console shows when a key was last used. If Twilio shows it somewhere
      undocumented, send a receipt.
  leak_revocation:
    pass: true
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Twilio API Key
    notes: >-
      GitHub reports leaked API keys and Account SIDs to Twilio and blocks them at push.
notes: >-
  The headline is D because of outbound. Inbound alone would be C. Twilio moves to B or A only if
  its token endpoint accepts OIDC tokens.
