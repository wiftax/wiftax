id: cloudflare-api
vendor: Cloudflare
product: API
covers: The Cloudflare API and API tokens.
website: https://www.cloudflare.com
docs: https://developers.cloudflare.com/fundamentals/api/get-started/
category: cloud
status: listed
summary: >-
  Your code calls the Cloudflare API with a static token that never expires by default, though it
  passes the other four hygiene checks. Logpush writes to your S3 or GCS bucket without a key, but
  the R2 migration tools want pasted keys.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static API token, owned by a user or the account, scoped by permission and resource. Expiry
      and IP limits are optional.
    evidence:
      - url: https://developers.cloudflare.com/fundamentals/api/get-started/create-token/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "The token secret is only shown once. Do not store the secret in plaintext where others can access it."
      - url: https://developers.cloudflare.com/fundamentals/api/get-started/account-owned-tokens/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Account API tokens allow you to set up durable integrations that can act as service principals with their own specific set of permissions."
      - url: https://developers.cloudflare.com/fundamentals/api/get-started/keys/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Global API key is not recommended for new customers. Current customers using Global API key are encouraged to migrate and use API tokens instead."
    notes: >-
      Cloudflare's OIDC support is for Zero Trust access and Workers. Nothing lets a workload trade
      an outside OIDC token for API access. The legacy Global API Key is an unscoped, non-expiring
      master key. Avoid it.
  outbound:
    grade: B
    mechanism: >-
      For Logpush, you grant a Cloudflare-owned AWS or GCP identity write access to your bucket. R2
      Super Slurper and Sippy want a static AWS access key or GCP JSON key.
    evidence:
      - url: https://developers.cloudflare.com/logs/get-started/enable-destinations/aws-s3/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Cloudflare uses Amazon Identity and Access Management (IAM) to gain access to your S3 bucket."
      - url: https://developers.cloudflare.com/logs/get-started/enable-destinations/google-cloud-storage/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Cloudflare uses Google Cloud Identity and Access Management (IAM) to gain access to your bucket. The Cloudflare IAM service account needs admin permission for the bucket."
      - url: https://developers.cloudflare.com/r2/data-migration/super-slurper/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Cloudflare recommends you create a user with a narrow set of permissions."
      - url: https://developers.cloudflare.com/r2/data-migration/sippy/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "\"Action\": [\"s3:ListBucket*\", \"s3:GetObject*\"]"
    notes: >-
      Logpush never needs a secret from you. Super Slurper and Sippy have no role or federation
      option, only static keys, so the surface is B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://developers.cloudflare.com/fundamentals/api/how-to/restrict-tokens/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "By default, tokens do not expire and are long lived."
      - url: https://developers.cloudflare.com/api/resources/accounts/subresources/tokens/methods/create/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "expires_on"
    notes: >-
      A token can be given an expiry, but the default is never and no account policy forces one.
  rotation_api:
    pass: true
    evidence:
      - url: https://developers.cloudflare.com/api/resources/user/subresources/tokens/methods/create/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "POST /user/tokens"
      - url: https://developers.cloudflare.com/api/resources/accounts/subresources/tokens/methods/create/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "POST /accounts/{account_id}/tokens"
      - url: https://developers.cloudflare.com/api/resources/user/subresources/tokens/methods/delete/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Destroy a token."
    notes: >-
      User and account tokens can be created and deleted through the API. Account tokens need Super
      Administrator.
  scoping:
    pass: true
    evidence:
      - url: https://developers.cloudflare.com/fundamentals/api/get-started/create-token/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "granting Zone DNS Read access to a zone example.com will allow the token to read DNS records only for that specific zone."
  last_used:
    pass: true
    evidence:
      - url: https://developers.cloudflare.com/api/resources/user/subresources/tokens/methods/list/
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "last_used_on"
  leak_revocation:
    pass: true
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Cloudflare Account API Token"
    notes: >-
      Cloudflare is a GitHub secret-scanning partner for its API tokens and the Global API Key.

notes: >-
  The one hygiene miss, expiry, matters most. A token made today with no expiry works indefinitely.
  The Roll action rotates a token in place, but only in the dashboard.
