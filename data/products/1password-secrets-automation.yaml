id: 1password-secrets-automation
vendor: 1Password
product: Secrets Automation
covers: "Service Accounts, Connect, the SDKs and the CLI."
aliases:
  - "1Password for machines"
  - "1Password Connect"
  - Service Accounts
website: https://1password.com
docs: https://www.1password.dev/secrets-automation
category: security
status: listed
summary: >-
  To read or manage vault items, your code needs a static service account token or Connect token. A
  Business preview called Credential Broker accepts OIDC from your own issuer, but only for
  Environments and with a static key. Sync into AWS Secrets Manager is keyless.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static service account token, or a static Connect token sent to a Connect server you host.
      Credential Broker can verify OIDC from any issuer, but also needs a static integration key.
    evidence:
      - url: https://www.1password.dev/secrets-automation.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can manage secrets with [1Password Service Accounts](#1password-service-accounts) or [1Password Connect servers](#1password-connect-servers)."
      - url: https://www.1password.dev/service-accounts/get-started.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Each service account has a [service account token](/service-accounts/security.md#service-accounts-and-token-generation) that you can provide as an environment variable for authentication."
      - url: https://www.1password.dev/service-accounts/security.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A service account token is an authentication string that represents an SRPx object that's serialized and Base64 URL encoded."
      - url: https://www.1password.dev/ci-cd/github-actions.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create a secret for your GitHub repository named `OP_SERVICE_ACCOUNT_TOKEN` and set it to the service account token value."
      - url: https://www.1password.dev/connect/concepts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A Connect server access token is an authentication string that allows the Connect server to authenticate with 1Password services, such as the [Connect REST API](/connect/api-reference.md)."
      - url: https://www.1password.dev/connect/security.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The `encCredentials` contains the encrypted credentials necessary for the associated service account."
      - url: https://www.1password.dev/brokered-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When a team member runs a workflow, 1Password validates the identity of the workload using an [OIDC token. ](https://openid.net/developers/how-connect-works/)."
      - url: https://www.1password.dev/brokered-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Define the identity requirements (claims) that must be met to verify a workload."
      - url: https://www.1password.dev/brokered-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The token value is your integration key, which is required to decrypt secrets in your team's workflows."
      - url: https://www.1password.dev/brokered-access/custom-workflow.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "1Password Credential Broker is only supported in the [1Password JavaScript SDK ](https://github.com/1Password/onepassword-sdk-js) at this time."
      - url: https://www.1password.dev/service-accounts/get-started.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service accounts can only be granted read access to Environments."
    notes: >-
      Graded on the path a workload must use to work with vault items, which only takes a service
      account or Connect token. Credential Broker is real bring-your-own-issuer OIDC, but it does
      not lift the grade. It is a Business-tier preview, reads only Environments, and works only
      through the JavaScript SDK and the GitHub action. Every workflow also stores a static org-wide
      integration key that decrypts the secrets, so that route would be C at best. No cloud workload
      identity login exists for service accounts or Connect.
  outbound:
    grade: A
    mechanism: >-
      Environments sync to AWS Secrets Manager (beta) assumes an IAM role you create. That role
      trusts a 1Password SAML provider, so no AWS key changes hands.
    evidence:
      - url: https://www.1password.dev/environments/aws-secrets-manager.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authentication to your AWS account happens through SAML. You'll need to register the 1Password Secrets Sync SAML provider within your AWS account."
      - url: https://www.1password.dev/environments/aws-secrets-manager.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Value**: Go back to the 1Password configuration page and select **Copy SAML subject**."
      - url: https://www.1password.dev/environments/aws-secrets-manager.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This allows you to set up the integration once per environment, only requiring AWS credentials to create the IAM resources."
      - url: https://www.1password.dev/environments.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Securely sync your environment variables to [AWS Secrets Manager](/environments/aws-secrets-manager.md)."
      - url: https://www.1password.dev/k8s/integrations.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can use Kubernetes integrations to deploy a [1Password Connect Server](/connect.md) or a [1Password Service Account](/service-accounts.md) to a Kubernetes cluster."
      - url: https://www.1password.dev/environments/nvidia-openshell.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When you connect a 1Password Environment to an OpenShell gateway, 1Password transfers custody of the Environment's secrets to OpenShell for a defined time-to-live (TTL)."
    notes: >-
      AWS Secrets Manager sync is the only push integration, and it is keyless. It uses SAML
      federation into your role with a subject condition instead of an External ID. The sample
      policy grants all resources, which you can narrow. No GCP, Azure or other sync target exists.
      Everything else, such as the Kubernetes Operator, Connect, CI plugins and Terraform, runs in
      your infrastructure and pulls with an inbound token. One keyless cloud earns A. A key-based
      destination would drop it to B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://www.1password.dev/cli/reference/management-commands/service-account.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can set an expiry to a service account using the `--expires-in` flag."
      - url: https://www.1password.dev/connect/manage-connect.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When you create a Connect server access token, you can set the token's expiration time to 30, 90, or 180 days."
      - url: https://www.1password.dev/events-api/authorization.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Expires After**: (Optional) Choose when the token will expire: 30 days, 90 days, or 180 days. The default setting is Never."
    notes: >-
      Tokens can carry an expiry, but it is optional and nothing forces one. Events API tokens
      default to Never. Same rule as the doppler-secrets card: a changeable default is not an
      enforced expiry.
  rotation_api:
    pass: true
    evidence:
      - url: https://www.1password.dev/cli/reference/management-commands/connect.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Issue a new token for a Connect server."
      - url: https://www.1password.dev/cli/reference/management-commands/connect.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Revoke a token for a Connect server."
      - url: https://www.1password.dev/cli/reference/management-commands/service-account.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create a service account to gain programmatic access to your secrets using 1Password CLI."
      - url: https://www.1password.dev/service-accounts/manage-service-accounts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Revoking a service account token immediately removes its access to 1Password vaults."
    notes: >-
      Passes on Connect tokens, which the CLI can create, list and delete. Service account tokens
      can be minted from the CLI but only revoked on 1Password.com. Failing that path would make the
      card 2/5 and F.
  scoping:
    pass: true
    evidence:
      - url: https://www.1password.dev/service-accounts/security.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A service account is a type of user account that's meant for programmatic access."
      - url: https://www.1password.dev/service-accounts/security.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A service account can only read items from vaults it has READ access to."
      - url: https://www.1password.dev/connect/concepts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For example, you can grant a Connect token access to a specific subset of the vaults the Connect server has access to."
    notes: >-
      Service accounts are machine identities with per-vault permissions. Connect tokens can be
      limited to some vaults and to read-only or write-only.
  last_used:
    pass: true
    evidence:
      - url: https://www.1password.dev/service-accounts/manage-service-accounts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The service account overview page shows information about the service account, such as the vaults and [1Password Environments](/environments.md) it can access, vault permissions, and recent activity."
      - url: https://www.1password.dev/service-accounts/manage-service-accounts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Usage reports for service accounts include information on the number of vaults and items a service account can access, an overview of vaults where a service account has accessed items, when those items were last accessed, and the action performed."
    notes: >-
      Borderline pass. Tokens show no last-used time, but each service account's usage report shows
      when it last accessed items. Connect tokens have no equivalent.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "| 1Password | 1Password Service Account Token | 1password_service_account_token | ✗ | ✓ | ✓ | ✗ | ✗ | ✗ |"
      - url: https://www.1password.dev/service-accounts/security.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "1Password uses a unique string format to help code analyzers find accidental credential exposure."
    notes: >-
      GitHub detects service account tokens for user alerts, but does not report public leaks to
      1Password. Connect and Events API tokens are not detected at all.

notes: >-
  Covers Service Accounts, Connect, the SDKs, the CLI and Credential Broker. The Events and Users
  APIs are side APIs and not graded. Inbound moves to A if Credential Broker reaches vault items,
  drops the static key and leaves preview.
