id: c1-identity-platform
vendor: C1
product: Identity Platform
covers: The API and Baton connectors.
aliases:
  - ConductorOne
  - Baton
website: https://www.c1.ai
docs: https://www.c1.ai/docs/product/admin/service-principals/workload-federation
category: identity
status: listed
summary: >-
  Service principals can swap an OIDC token from any issuer you register for a 30-minute C1 token,
  so no C1 secret has to exist. C1 reaches AWS, Entra ID and Salesforce without keys. GCP, Google
  Workspace, Okta, GitHub, Slack and Azure RBAC need a key or token you paste.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      Register any HTTPS OIDC issuer, bind it to a service principal with a rule on the token's
      claims, and exchange the token for a short-lived C1 access token.
    issuers: ["any"]
    evidence:
      - url: https://www.c1.ai/docs/product/admin/service-principals/workload-federation
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Workload federation eliminates stored secrets entirely."
      - url: https://www.c1.ai/docs/product/admin/service-principals/workload-federation
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Built-in presets are available for GitHub Actions, GitLab CI/CD, HCP Terraform, AWS IAM, and SPIFFE. Use \"Custom OIDC\" for any other provider."
      - url: https://www.c1.ai/docs/product/admin/service-principals/workload-federation
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "C1 validates the token: issuer, signature, audience, freshness, and your conditions"
      - url: https://www.c1.ai/docs/product/admin/service-principals/custom-oidc
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Any platform that issues OIDC tokens can be used with workload federation."
      - url: https://www.c1.ai/docs/api-reference/workload-federation/create-provider
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "CreateProvider registers a new external OIDC issuer for the tenant."
      - url: https://www.c1.ai/docs/product/admin/service-principals/overview
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Contact your C1 account team to enable the feature."
      - url: https://www.c1.ai/docs/developer/api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Your new API key is created and the client ID and client secret are shown."
      - url: https://www.c1.ai/docs/developer/c1-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Connectors authenticate using OAuth2 client credentials:"
    notes: >-
      Any issuer with OIDC discovery and a public JWKS works. Each trust can check any claim and add
      an IP allowlist and scoped roles. The audience must contain your C1 tenant domain. The C1
      account team must enable service principals, but no paid plan gate is documented. Static
      fallbacks remain, including personal API keys and service principal client credentials.
      Self-hosted Baton connectors log in with a static client secret, and no federation option is
      documented for them.
  outbound:
    grade: B
    mechanism: >-
      AWS uses a cross-account role with an External ID, and Entra ID and Salesforce use C1's own
      OAuth apps. The other major connectors need a key, token or private key you create.
    evidence:
      - url: https://www.c1.ai/docs/baton/aws
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "C1 uses an IAM Trust relationship between your AWS Account and C1's Service AWS Account."
      - url: https://www.c1.ai/docs/baton/aws
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "AWS requires the use of External IDs when granting third-party access to your AWS account."
      - url: https://www.c1.ai/docs/baton/microsoft-entra
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Follow these instructions to set up a built-in, no-code connector hosted by C1 using OAuth."
      - url: https://www.c1.ai/docs/baton/salesforce
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Log in and authorize C1 with your Salesforce instance."
      - url: https://www.c1.ai/docs/baton/google-workspace
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The connector requires a JSON key, so confirm you can create one before you start."
      - url: https://www.c1.ai/docs/baton/google-cloud-platform
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Download the service account's JSON key"
      - url: https://www.c1.ai/docs/baton/okta
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The OAuth 2.0 Private Key method is recommended for production environments because it provides scoped access with short-lived tokens rather than a long-lived API token."
      - url: https://www.c1.ai/docs/baton/github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "To set up the GitHub connector, you can choose to create a personal access token (classic), a fine-grained access token, or a GitHub app."
      - url: https://www.c1.ai/docs/baton/slack
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Your user OAuth token is created. Copy and save the token value."
      - url: https://www.c1.ai/docs/baton/azure
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Next, we'll generate a client secret for this app. Click Certificates & secrets."
    notes: >-
      AWS, Entra ID and Salesforce are keyless. AWS China is self-hosted only and uses static keys
      or IRSA. GCP and Google Workspace need a service account JSON key. Okta needs an API token or
      your own app's private key. GitHub needs a PAT or the private key of a GitHub App you create,
      since C1 has no app of its own. Slack needs an app token and Azure RBAC a client secret.
      Least-privilege guidance is good throughout, but these paths are not keyless. Over 400 other
      connectors were not checked.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://www.c1.ai/docs/product/admin/service-principals/overview
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Maximum 180 days; must be rotated before expiry"
      - url: https://www.c1.ai/docs/product/admin/service-principals/overview
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Credential expiration can't be extended after creation."
      - url: https://www.c1.ai/docs/developer/api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Give your new API key a name and select whether the key will expire."
    notes: >-
      Service principal credentials expire within 180 days at most. Personal API keys can be created
      with no expiry, so this passes on the machine credential only.
  rotation_api:
    pass: true
    evidence:
      - url: https://www.c1.ai/docs/api-reference/service-principal/create-credential
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "CreateCredential creates a new client credential for a service principal."
      - url: https://www.c1.ai/docs/api-reference/service-principal/revoke-credential
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "RevokeCredential revokes (deletes) a client credential for a service principal."
    notes: >-
      Personal API clients can also be created, updated and deleted through the API.
  scoping:
    pass: true
    evidence:
      - url: https://www.c1.ai/docs/product/admin/service-principals/security
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Every credential and federation trust can be limited to a subset of the service principal's roles."
    notes: >-
      Roles are coarse, such as full or read-only. Still, a service principal is a machine identity
      with its own role and per-credential IP allowlists.
  last_used:
    pass: true
    evidence:
      - url: https://www.c1.ai/docs/developer/api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The API key is added to list of your personal API clients, and its client ID and usage data for the key are shown."
      - url: https://www.c1.ai/docs/api-reference/service-principal/create-credential
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "lastUsedAt"
    notes: >-
      Both service principal credentials and personal clients show a last-used timestamp.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      C1 is not in GitHub's secret scanning list, so leaked client secrets are not revoked.

notes: >-
  ConductorOne renamed itself C1 in April 2026, and Workday announced it would acquire C1 in October
  2026. C1 also issues credentials for agents and MCP servers, which is not graded here. Outbound
  rises to A with keyless GCP, C1-owned GitHub and Okta apps, and federated Azure RBAC.
