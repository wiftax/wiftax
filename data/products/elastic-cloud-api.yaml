id: elastic-cloud-api
vendor: Elastic
product: Cloud API
covers: The Elastic Cloud control plane, for Hosted and Serverless deployments.
aliases:
  - Elastic Cloud
  - Elastic Cloud Serverless
website: https://www.elastic.co
docs: https://www.elastic.co/docs/deploy-manage/api-keys/elastic-cloud-api-keys
category: cloud
status: listed
summary: >-
  The Elastic Cloud API, Terraform provider and ecctl accept only a static organization API key.
  Elastic reaches your cloud keys for BYOK encryption without a secret on AWS, Azure and GCP. Custom
  snapshot repositories still want static cloud keys.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static Elastic Cloud API key owned by the organization, with roles and an expiry set at
      creation.
    evidence:
      - url: https://www.elastic.co/docs/deploy-manage/api-keys/elastic-cloud-api-keys
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "An Elastic Cloud API key belongs to the organization and is not tied to the user who created it. When a key is created, it is assigned specific roles that control its access to organizational resources."
      - url: https://www.elastic.co/docs/api/doc/elastic-cloud-serverless.json
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "API keys are used to authenticate requests to the Elastic Cloud Serverless REST API."
      - url: https://www.elastic.co/docs/api/doc/cloud.json
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: '"securityDefinitions":{"apiKey":{"type":"apiKey","name":"Authorization","in":"header"}}'
      - url: https://raw.githubusercontent.com/elastic/terraform-provider-ec/master/docs/index.md
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Elasticsearch Service (ESS) only supports `apikey`. Elastic Cloud Enterprise (ECE) supports `apikey` or a combination of `username` and `password`."
      - url: https://www.elastic.co/docs/reference/ecctl/ecctl-authentication
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Elastic Cloud uses API keys to authenticate users against its API. Additionally, it supports the usage of JWT to validate authenticated clients. The preferred authentication method is API keys."
    notes: >-
      Covers Elastic Cloud Hosted and Serverless, which share one API and key type. The API specs
      list only the API key header. Nothing offers OIDC, GitHub Actions, cloud workload identity or
      token exchange. ecctl's JWT login uses a username and password, not federation, and SAML SSO
      is for people only. Data access inside deployments uses Elasticsearch API keys, graded on the
      elasticsearch and kibana cards. ECE has its own card. API keys come with every subscription.
  outbound:
    grade: B
    mechanism: >-
      BYOK encryption is keyless on all three clouds, through grants to Elastic's AWS organization,
      Azure app or GCP service accounts. Custom snapshot repositories want a static AWS, GCS or
      Azure storage key.
    tier_gated: Enterprise (customer-managed encryption keys)
    evidence:
      - url: https://www.elastic.co/docs/deploy-manage/security/encrypt-deployment-with-customer-managed-encryption-key
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Encryption at rest using customer-managed keys is only available for the Enterprise subscription level."
      - url: https://www.elastic.co/docs/deploy-manage/security/encrypt-deployment-with-customer-managed-encryption-key
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "\"aws:PrincipalOrgPaths\": \"o-ygducmlz12/r-e5t3/ou-e5t3-fzpdq76p/ou-e5t3-ysfcmd95/ou-e5t3-hwt05su3/*\""
      - url: https://www.elastic.co/docs/deploy-manage/security/encrypt-deployment-with-customer-managed-encryption-key
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Using the ID that you copied, create a new service principal for Elastic Cloud in your Azure tenant. The service principal grants Elastic Cloud access to interact with your RSA key."
      - url: https://www.elastic.co/docs/deploy-manage/security/encrypt-deployment-with-customer-managed-encryption-key
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Elastic Cloud uses two service principals to encrypt and decrypt data using your key. You must grant these services access to your key before you create your deployment."
      - url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore/ec-aws-custom-repository
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Next, create an IAM user, copy the access key ID and secret, and configure the following user policy. This is important to make sure the access keys, which you will need to provide to your cluster, can only access the intended bucket."
      - url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore/ec-gcs-snapshotting
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Save the service account key in JSON file format. You are going to use it later to configure your Elasticsearch deployment for snapshotting."
      - url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore/ec-azure-snapshotting
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Follow the Microsoft documentation to set up an Azure storage account with an access key, and then create a container ."
      - url: https://www.elastic.co/docs/deploy-manage/security/private-connectivity-aws
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "AWS PrivateLink connects your Virtual Private Cloud (VPC) to the AWS-hosted services that you use, treating them as if they were in your VPC."
    notes: >-
      BYOK on AWS, Azure and GCP hands over no secret. On AWS, the key policy trusts Elastic's AWS
      organization rather than a role with an external ID, which is still keyless. Private
      connectivity, marketplace subscriptions and Azure Native logs need no customer secret. Custom
      snapshot repositories on Hosted take a static S3 key, GCS JSON key or Azure storage key, with
      a bucket-scoped IAM policy in the docs. Elasticsearch makes those connections, so they matter
      for the elasticsearch card too. Without the Enterprise tier, the static snapshot path is the
      only reach-in.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://www.elastic.co/docs/deploy-manage/api-keys/elastic-cloud-api-keys
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "By default, API keys expire after three months. You can set the expiration to a different preset value or to a specific date, up to one year. If you need the key to work indefinitely, you can set its expiration to Never ."
      - url: https://www.elastic.co/docs/api/doc/cloud.json
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "The optional expiration for the API key, provided as a duration (ex: '1d', '3h')"
    notes: >-
      The console defaults to three months, but "Never" is one click away and no org policy forbids
      it. A changeable default fails, as on cloudflare-api, doppler-secrets and elasticsearch. An
      org lifetime cap would lift inbound to D.
  rotation_api:
    pass: true
    evidence:
      - url: https://www.elastic.co/docs/deploy-manage/api-keys/elastic-cloud-api-keys
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "You can create an API key using the Create API key API."
      - url: https://www.elastic.co/docs/api/doc/cloud.json
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Delete or invalidate API keys."
    notes: >-
      The API can create, list and revoke keys.
  scoping:
    pass: true
    evidence:
      - url: https://www.elastic.co/docs/deploy-manage/api-keys/elastic-cloud-api-keys
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "You can grant a cloud API key the same types of roles that you assign to users : organization-level roles, cloud resource access roles, and connected cluster access roles."
      - url: https://www.elastic.co/docs/deploy-manage/users-roles/cloud-organization/user-roles
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Roles can be scoped to specific deployments or to all deployments."
    notes: >-
      Keys belong to the organization and take roles scoped to specific deployments or projects. A
      key created without roles takes its creator's role.
  last_used:
    pass: false
    evidence:
      - url: https://www.elastic.co/docs/api/doc/cloud.json
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "The response model for an API key."
    notes: >-
      Keys record creation and expiry dates but not last use.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "| Elastic | Elastic Cloud API Key | elastic_cloud_api_key | ✗ | ✓ | ✓ | ✗ | ✗ | ✗ |"
    notes: >-
      GitHub flags Elastic Cloud API keys to the repo owner and blocks pushes, but does not report
      them to Elastic for revocation.

notes: >-
  One of five Elastic cards. Deployment data, Kibana and Fleet use Elasticsearch API keys, graded
  separately. Inbound moves to B or A only if the Cloud API accepts a federated token. An org policy
  forbidding "Never" would lift it to D.
