id: qualys-cloud-platform
vendor: Qualys
product: Cloud Platform
covers: "The VMDR, TotalCloud, CSAM and other module APIs."
aliases:
  - VMDR
  - TotalCloud
  - CSAM
website: https://www.qualys.com
docs: https://docs.qualys.com/en/oauth/oauth-phase2/oauth/oauth_oidc.htm
category: security
status: listed
summary: >-
  Workloads call Qualys with a user's password or a Qualys client ID and secret, traded for a 4-hour
  token. Support-enabled trust of your own IdP does not count yet. Qualys reaches AWS without keys,
  but Azure, GCP and OCI take a secret or private key.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      A Qualys client ID and secret, or a user's password, traded for a 4-hour token.
      Support-enabled IdP tokens exist but do not count.
    evidence:
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth/oauth_oidc.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API Authentication using Identity provider (IdP) tokens adds an extra layer of protection to your APIs."
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth/oauth_oidc.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This authentication is supported by all Qualys APIs, /api/2.0/ and onward versions."
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth/oauth_oidc.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This feature is not available by default. Refer to the Onboarding Process to onboard with IdP-based API authentication."
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth/onboard_oauth.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Share the JWKS URL — Confirm if your organization plans to rotate certificates, public keys, or key IDs (KIDs) on a regular basis. If so, provide the JWKS (JSON Web Key Set) URL."
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth/onboard_oauth.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Audience and Issuer Values or JWT Token: The audience and issuer values are important to set up the IdP-based authentication."
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth/custom_claim.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For user authentication, Qualys maps each incoming token to a Qualys user by matching the value of the JWT sub claim against the External ID field of the corresponding Qualys user."
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth/use_oauth.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The following sample illustrates using token-based authentication to access Cloud Platform APIs."
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth/support_matrix.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Total AppSec/ Web Application Scanning | To be announced"
      - url: https://docs.qualys.com/en/vm/qweb-all-api/get_started/authentication.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Using this method, Qualys account credentials are transmitted using the “Basic Authentication Scheme” over HTTPS for each API call."
      - url: https://docs.qualys.com/en/csam/api/get_started/API_Authentication.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The token expires in 4 hours, and you must regenerate it to continue using the GAV/CSAM API."
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth_ui/generate_authentication_token.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Provide the Client ID and Client Secret Key for the user-level or subscription-level client in the API request."
    notes: >-
      Graded C on Qualys client credentials: short-lived tokens from a static root. Qualys can also
      accept JWTs from your own IdP, with issuer, audience and subject checks. That does not earn A
      or B, because federation must be self-serve and documented for workloads. Turning it on takes
      a Support ticket, and the docs frame it as user login. Whether CI or cloud tokens work is not
      public, and some modules such as WAS are not covered yet. It also leaves passwords on. Same
      call as the zscaler-oneapi card. Moves to A if IdP trust becomes self-serve and documented for
      workloads.
  outbound:
    grade: B
    mechanism: >-
      AWS connectors assume a role you create, with an External ID. Azure takes a client secret, GCP
      a service-account key, and OCI a private API key.
    tier_gated: GCP Workload Identity Federation is beta and enabled by TAM or Qualys Support
    evidence:
      - url: https://docs.qualys.com/en/conn/latest/aws/aws_connector.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This lets you grant Qualys access to your AWS resources without sharing your AWS security credentials. Qualys accesses your AWS resources by assuming the IAM role you create in your AWS account."
      - url: https://docs.qualys.com/en/conn/latest/aws/aws_connector.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "AWS requires that vendors provide a unique external ID value amongst all their customers when providing a vendor account for a trust relationship."
      - url: https://docs.qualys.com/en/cloudview/latest/onboarding/azure_onboarding.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Once the permissions are configured, you can obtain the Azure authentication values from the Azure Console by navigating to Home > App registrations and clicking the Role created for the connector configuration."
      - url: https://docs.qualys.com/en/conn/latest/azure/azure_auth_details.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Add a description and expiry duration for the secret key (recommended: Never) and click Add."
      - url: https://docs.qualys.com/en/conn/latest/azure/azure_auth_details.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Paste the key value as Authentication Key into the connector details."
      - url: https://docs.qualys.com/en/conn/latest/azure/azure_auth_details.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Pick a Reader role. A Reader can view everything, but cannot make any changes to the resources of a subscription."
      - url: https://docs.qualys.com/en/conn/latest/gcp/gcp_config_download.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Upload the configuration (JSON) file to complete GCP connector creation in Qualys Cloud Platform."
      - url: https://docs.qualys.com/en/etm/latest/mergedProjects/etm_connectors/authentication/wif_authentication.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A supported external IDP is configured. Currently supported IDPs are Microsoft Entra ID and Okta."
      - url: https://docs.qualys.com/en/etm/latest/mergedProjects/etm_connectors/authentication/wif_authentication.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "WIF is available for GCP connectors only. AWS and Azure connectors are not supported."
      - url: https://docs.qualys.com/en/conn/release-notes/connector/release_2_19.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This feature is currently available as a BETA release. Contact your Technical Account Manager (TAM) or Qualys Support to enable Workload Identity Federation for GCP connectors."
      - url: https://docs.qualys.com/en/conn/latest/oci/oci_connectors.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Go to Identity > Users > User Details > API Keys > Add API Key > Select Generate API Key Pair."
    notes: >-
      AWS is keyless through a Qualys CloudFormation template. Azure takes an app client secret, and
      the docs recommend setting it to never expire. GCP takes an uploaded JSON key. A beta GCP
      federation option drops the key, but it runs on an Entra ID or Okta client secret you hand
      Qualys. That is C, not keyless. OCI takes a user's API signing key. Keyless AWS plus keys
      elsewhere is B. Ticketing, SIEM and registry integrations were not graded. A needs admin
      consent or a federated credential on Azure, and impersonation by Qualys's own identity on GCP.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://docs.qualys.com/en/vmdr/latest/setup/win_security.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Select the password security settings you want to enforce for all users in the subscription."
      - url: https://docs.qualys.com/en/vmdr/latest/setup/win_security.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Here you can define how often users will need to change their password."
      - url: https://docs.qualys.com/en/vmdr/latest/setup/win_security.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Set the password of such API-only access accounts to never expire."
    notes: >-
      Workloads default to a user password, and a Manager can force password expiry for everyone.
      Unlike elastic-cloud-api, the never-expires exception needs Support and a signed risk
      agreement. Client secrets show no expiry.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.qualys.com/en/vm/qweb-all-api/mergedProjects/qapi-user/users_mgmt/change_password.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Change passwords for all or some users in the same subscription."
      - url: https://docs.qualys.com/en/vm/qweb-all-api/faqs/how_to_chnge_qualys_userpwd_api.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To change a Qualys user password using the API, send a POST request to /api/2.0/fo/user/change_password/index.php with the required headers, authenticate using your username and password, and include the new password in the JSON request body using the newPassword key."
      - url: https://docs.qualys.com/en/vm/qweb-all-api/mergedProjects/qapi-user/users/add_user.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Add a user account to the API user's subscription."
    notes: >-
      API users can be created and passwords changed by API, so rotation can be scripted. Client
      secrets are managed only in the UI.
  scoping:
    pass: true
    evidence:
      - url: https://docs.qualys.com/en/vm/qweb-all-api/mergedProjects/qapi-user/users/params_users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Specifies the asset groups assigned to the user, when the user role is Scanner, Reader or Contact."
      - url: https://docs.qualys.com/en/csam/api/get_started/API_Authentication.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Navigate to Roles and Scopes and enable the API Access checkbox."
      - url: https://docs.qualys.com/en/oauth/oauth-phase2/oauth_ui/ui_authentication_steps.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Assign required application permissions for the user-level client."
    notes: >-
      The usual setup is a dedicated API user with a narrow role and asset groups, which counts as a
      machine principal. Client secrets also take per-app permissions. Manager API users get
      everything.
  last_used:
    pass: false
    evidence:
      - url: https://docs.qualys.com/en/vm/qweb-all-api/mergedProjects/qapi-user/users/list_users.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When the API request is made by a Manager or Unit Manager, the last login date for each user is provided in the XML results."
      - url: https://docs.qualys.com/en/vmdr/latest/activity_log/activity_log.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The user logged-in event is generated only when the user logs in through the User Interface (UI), not for API logins."
      - url: https://docs.qualys.com/en/vmdr/latest/activity_log/activity_log.htm
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "By default, we show you API calls in the past week that were submitted (by users) and/or updated (by our service)."
    notes: >-
      Judgment call. The last login date seems to count only UI logins, and the recent API calls
      view covers only a week. Client secrets show no last use. Flips to pass if last login includes
      API calls.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Qualys is not in GitHub's secret-scanning patterns. Passwords and client secrets have no
      detectable format.

notes: >-
  Covers all Qualys Cloud Platform module APIs and the TotalCloud connectors, which share user
  accounts and auth. Three of five hygiene checks pass, which would put plain passwords at D.
  Outbound moves to A when Azure and GCP stop needing your secret.
