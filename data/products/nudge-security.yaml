id: nudge-security
vendor: Nudge Security
product: Platform
aliases:
  - Nudge
website: https://www.nudgesecurity.com
docs: https://help.nudgesecurity.com/en/articles/8890697-getting-started-with-the-nudge-security-api
category: security
status: listed
summary: >-
  To call the Nudge Security API, your code needs a static token made in the UI. It expires only
  after four weeks unused. Nudge connects to your SaaS through its own Google, Microsoft and Slack
  apps, but Okta wants a pasted API token.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static API token that an admin creates in the web UI, sent as a bearer token. No federation
      or short-lived token path is documented.
    evidence:
      - url: https://help.nudgesecurity.com/en/articles/8890697-getting-started-with-the-nudge-security-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Under Settings , navigate to API Tokens. Click Create API Token. Give the token a descriptive name and click Create ."
      - url: https://help.nudgesecurity.com/en/articles/8890697-getting-started-with-the-nudge-security-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Note: You will need to use the following syntax when using the API key in requests: Authorization: Bearer <token>"
      - url: https://nudgesecurity.readme.io/reference/post_api-1-0-apps-search.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: '"description": "Authorization header containing the Nudge API Token", "scheme": "bearer", "type": "http"'
    notes: >-
      The public API reference lists only a bearer token. The browser extension also rests on a
      long-lived secret. You push a tenant-wide deployment key through MDM, and anyone holding it
      can register devices to your tenant. Customers do not automate against that key, though.
  outbound:
    grade: B
    mechanism: >-
      Nudge uses its own Google Workspace, Microsoft Entra and Slack apps, and OAuth for Jira,
      ServiceNow and GitHub. The Okta connector wants a pasted Okta API token.
    evidence:
      - url: https://help.nudgesecurity.com/en/articles/7153593-configure-access-to-google-workspace
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "As instructed in the onboarding process, your Google Workspace super admin will need to install Nudge Security as a Google Workspace app."
      - url: https://help.nudgesecurity.com/en/articles/7135200-configure-access-to-microsoft-entra-id
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Step 3: Click on the big blue button \"Grant admin consent for\" This will grant the necessary permissions for Nudge Security to do the analysis."
      - url: https://help.nudgesecurity.com/en/articles/8312724-configuring-nudge-integration-for-slack
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Select Connect Slack > Connect to Slack and a window will pop up asking you to connect to your Slack workspace."
      - url: https://help.nudgesecurity.com/en/articles/10088118-configure-the-okta-connected-app
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "To enable the Okta connected app, you'll need to create an API token in Okta and configure it in Nudge Security."
      - url: https://help.nudgesecurity.com/en/articles/10088118-configure-the-okta-connected-app
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "In Okta, API tokens inherit the permissions of the user who creates them, rather than allowing fully customized permissions. To generate a token with restricted access, we must ensure the creating user has only the minimum necessary permissions."
      - url: https://help.nudgesecurity.com/en/articles/7257318-configure-okta-sso-analysis-in-nudge-security
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "By connecting your organization’s Okta account to Nudge Security with a read-only and application administrator API token"
      - url: https://help.nudgesecurity.com/en/articles/14710380-connect-your-apps-and-configure-settings
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Follow the setup instructions for each app. Most require generating an API key or authorizing an OAuth connection in the target app."
      - url: https://www.nudgesecurity.com/connected-app/github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Integration method OAuth"
      - url: https://help.nudgesecurity.com/en/articles/15519903-configure-the-jira-integration
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Select Connect Jira and authorize Nudge to access your Jira Cloud site."
    notes: >-
      Keyless: Google Workspace, Microsoft Entra and Slack by app install or consent, and Jira and
      ServiceNow by OAuth. GitHub lists OAuth, but no public setup page confirms it. Okta takes a
      static API token, with a least-privilege role recipe, so B. Nudge has no AWS, GCP or Azure
      connectors. Setup docs for its 100+ other apps are inside the product, and Nudge says most
      need an API key or OAuth.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://help.nudgesecurity.com/en/articles/8890697-getting-started-with-the-nudge-security-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "API tokens will not expire if used.  However, tokens will automatically expire after 4 weeks of no use."
    notes: >-
      Unused tokens expire after four weeks, but a token in active use never does. You cannot set an
      expiry date or org policy.
  rotation_api:
    pass: false
    evidence:
      - url: https://help.nudgesecurity.com/en/articles/8890697-getting-started-with-the-nudge-security-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Setting up an API key in Nudge Security is easy and is done from the UI ."
      - url: https://nudgesecurity.readme.io/llms.txt
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "# Nudge Security Public API Documentation"
    notes: >-
      Tokens are created and revoked only in the UI. The API has no token endpoints.
  scoping:
    pass: false
    evidence:
      - url: https://help.nudgesecurity.com/en/articles/8890697-getting-started-with-the-nudge-security-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Note: You will need to have the \"administrator\" role in order to create API keys in Nudge Security."
      - url: https://help.nudgesecurity.com/en/articles/15182243-manage-users-and-roles
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "manage users and roles (invite users, assign roles, configure Okta SSO for Nudge Security login), generate API keys"
    notes: >-
      Creating a token takes only a name, with no scopes or service account. Only admins can create
      tokens, and the API includes destructive actions, so a token appears to carry broad access.
  last_used:
    pass: false
    evidence:
      - url: https://help.nudgesecurity.com/en/articles/8890697-getting-started-with-the-nudge-security-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "To revoke a token, find the token name and click Revoke."
    notes: >-
      No public doc shows a last-used time. The inactivity expiry implies Nudge tracks use, but it
      is not shown. A documented last-used column would flip this.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      Nudge Security is not in GitHub's secret-scanning patterns.

notes: >-
  Graded on the platform API, the only public API. Setup docs for most connectors sit inside the
  product, so the outbound list is what is public. Inbound moves off F with any three of: settable
  expiry, a token API, scoped tokens, a last-used column or a GitHub partnership.
