id: anthropic-api
vendor: Anthropic
product: Claude API
website: https://www.anthropic.com
docs: https://platform.claude.com/docs/en/manage-claude/authentication
category: other
status: listed
summary: >-
  Your code can trade a JWT from any OIDC issuer you register for a short-lived token tied to a
  service account, so no API key has to exist. Anthropic-hosted agents reach your systems only with
  bearer tokens you hand over. wif.tax runs on this API, graded like everything else.
surfaces:
  inbound:
    grade: A
    mechanism: >-
      Workload Identity Federation exchanges your issuer's JWT for a short-lived access token. A
      federation rule matches subject, audience, claims or a CEL condition and binds it to a service
      account.
    issuers:
      - any
    evidence:
      - url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          The tokens come from an identity provider (IdP) you already operate: AWS IAM, Google
          Cloud, or any standards-compliant OIDC issuer such as GitHub Actions, Kubernetes, SPIFFE,
          Microsoft Entra ID, or Okta.
      - url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Use `discovery` (the default) for any provider that serves
          `/.well-known/openid-configuration` at its issuer URL. Use `explicit_url` to point at a
          JWKS endpoint directly, or `inline` to upload the key set for issuers that are not
          reachable from the public internet (for example, a private Kubernetes cluster).
      - url: https://platform.claude.com/docs/en/api/beta/organization/federation/issuers/create
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Register an OIDC issuer that Anthropic will trust for workload identity federation in your
          organization.
      - url: https://platform.claude.com/docs/en/api/beta/organization/federation/rules/create
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Conditions the verified JWT must satisfy for this rule to apply. At least one of
          `subject_prefix` (other than a wildcard-only value like `*`), `claims`, or `condition` is
          required; `audience` alone is not sufficient.
      - url: https://platform.claude.com/docs/en/api/beta/organization/federation/rules/create
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Exact match against the `aud` claim (any element if array). When omitted, the JWT's `aud`
          must still equal Anthropic's expected audience for the issuer; setting this field
          overrides that default.
      - url: https://platform.claude.com/docs/en/manage-claude/wif-reference
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Integer between `60` and `86400` (1 minute to 24 hours). Default `3600`. Values outside
          this range are rejected at request time.
      - url: https://platform.claude.com/docs/en/manage-claude/authentication
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: There is no `sk-ant-api...` string to mint, distribute, or rotate.
    notes: >-
      Generally available, with no documented plan gate. Setting it up needs an admin, and the first
      rule must be created in the Console by a human. Rules on shared issuers such as GitHub Actions
      or GitLab must pin your tenant. Private issuers work by supplying the JWKS directly, unlike
      Snowflake's public-only rule. Scopes are coarse, at the workspace or org level. Static API
      keys and Admin API keys still exist and are graded under hygiene below.
  outbound:
    grade: C
    mechanism: >-
      Every path back into your systems uses a bearer credential you give Anthropic. The best case
      is an OAuth credential Anthropic refreshes, or a short-lived token you pass per request.
    evidence:
      - url: https://platform.claude.com/docs/en/agents-and-tools/mcp-connector
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          API consumers are expected to handle the OAuth flow and obtain the access token prior to
          making the API call, and to refresh the token as needed.
      - url: https://platform.claude.com/docs/en/managed-agents/vaults
        checked_on: 2026-10-12
        checked_by: sisyphus
        quote: >-
          Use mcp_oauth when the MCP server uses OAuth 2.0. If you supply a refresh (java, php;
          csharp, go: Refresh) block, Anthropic refreshes the access token on your behalf when it
          expires.
      - url: https://platform.claude.com/docs/en/managed-agents/vaults
        checked_on: 2026-10-12
        checked_by: sisyphus
        quote: >-
          Use `static_bearer` when the MCP server accepts a fixed bearer token (API key, personal
          access token, or similar). No refresh flow is needed.
      - url: https://platform.claude.com/docs/en/managed-agents/vaults
        checked_on: 2026-10-12
        checked_by: sisyphus
        quote: >-
          Scope the API key to only the permissions the agent needs. The agent can do anything the
          key allows, so a key with broader permissions than necessary increases the blast radius if
          the agent behaves unexpectedly.
      - url: https://platform.claude.com/docs/en/managed-agents/vaults
        checked_on: 2026-10-12
        checked_by: sisyphus
        quote: >-
          clients that compute a request signature from the secret (for example, AWS SigV4) produce
          an invalid signature.
      - url: https://platform.claude.com/docs/en/managed-agents/github
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Use fine-grained personal access tokens with minimum required permissions. Avoid using
          tokens with broad access to your GitHub account.
      - url: https://platform.claude.com/docs/en/agents-and-tools/mcp-tunnels/overview
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Supply static credentials yourself: the tunnel token from the Console and a server
          certificate signed by a CA you register there.
      - url: https://platform.claude.com/docs/en/agents-and-tools/mcp-tunnels/security
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Rotate the server certificate and tunnel token on a regular schedule, and immediately if
          you suspect compromise.
    notes: >-
      The plain Messages API never touches your systems. This surface only exists if you opt into
      the MCP connector, Managed Agents or MCP tunnels. Opt-in integrations are graded, as on the
      Twilio and Cloudflare cards. It is C, not D, because the best path is short-lived. A stored
      refresh token and client secret is exactly the rubric's C example. The static paths, such as
      bearer tokens and GitHub PATs, come with scoping and rotation guidance, so alone they would be
      D. Nothing is keyless. Anthropic is not an OIDC issuer you can verify and has no cloud role
      option.
hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://platform.claude.com/docs/en/manage-claude/authentication
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          If your organization has a maximum expiration policy, the Console limits presets and
          custom durations to the policy maximum
      - url: https://platform.claude.com/docs/en/manage-claude/authentication
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Existing keys keep their current behavior; expiration is set at creation time and cannot
          be changed afterward.
      - url: https://platform.claude.com/docs/en/api/beta/organization/api_keys/list
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          RFC 3339 datetime string indicating when the API Key expires, or `null` if it never
          expires.
    notes: >-
      You can set an expiry at creation, and an org maximum-expiration policy removes the Never
      option. The default with no policy is undocumented.
  rotation_api:
    pass: false
    evidence:
      - url: https://platform.claude.com/docs/en/manage-claude/admin-api
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          No. You create API keys in the Claude Console. The Admin API can only read, rename, and
          change the status of existing keys.
      - url: https://platform.claude.com/docs/en/get-api-key
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: The Admin API can't recover a lost key or give you a key to call the Claude API with.
    notes: >-
      The Admin API can list keys and disable them, but nothing can mint one. Creating a key needs
      the browser.
  scoping:
    pass: true
    evidence:
      - url: https://platform.claude.com/docs/en/manage-claude/authentication
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          For shared or automated workloads (CI, production services), have an organization admin
          create a service account so the workload has its own identity.
      - url: https://platform.claude.com/docs/en/manage-claude/authentication
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          API keys that are created for a specific workspace only work in that workspace, and API
          requests using these keys can omit the workspace ID.
      - url: https://platform.claude.com/docs/en/manage-claude/admin-api-keys
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          Claude Console keys do not have selectable scopes; every key carries full access to all
          endpoints that accept Admin API keys
    notes: >-
      Service account keys act as a non-human identity with their own role and workspaces, which
      passes. Regular keys have no permission scopes, and Console Admin API keys have full admin
      access.
  last_used:
    pass: false
    evidence:
      - url: https://platform.claude.com/docs/en/api/beta/organization/api_keys/list
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: Partially redacted hint for the API key.
      - url: https://platform.claude.com/docs/en/manage-claude/usage-cost-api
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          API usage from playground in the Claude Console (and from the legacy Workbench before it)
          is not associated with an API key, so `api_key_id` will be `null` even when grouping by
          that dimension.
    notes: >-
      Keys have no last-used timestamp. The usage report can be grouped by key, but that is a usage
      log, as on the Vault card. Send a receipt if the Console shows last use.
  leak_revocation:
    pass: true
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: Anthropic API Key
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: Anthropic Admin API Key
    notes: >-
      Anthropic is a GitHub secret scanning partner for API keys and Admin API keys. The docs do not
      say whether a reported key is revoked or only flagged.
notes: >-
  Outbound sets the headline C. Inbound alone is A. wif.tax's crawler logs in through a federation
  rule. Outbound moves to B or A if hosted agents gain a cloud-native role or present a verifiable
  OIDC identity to your MCP servers.
