id: socket-dev
vendor: Socket
product: Platform
covers: The Socket API and CLI.
aliases: ["Socket.dev"]
website: https://socket.dev
docs: https://docs.socket.dev/docs/api-keys
category: devtools
status: listed
summary: >-
  CI jobs, the Socket CLI and the self-hosted Socket Firewall log in with a static organization API
  token. There is no OIDC login. Outbound, Socket uses its own apps, such as its GitHub App, so you
  hand over no secret.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static organization API token, used by the REST API, the CLI in every documented CI system,
      and Socket Firewall Enterprise. OAuth exists only for human browser logins.
    evidence:
      - url: https://docs.socket.dev/reference/authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Socket's API uses organization tokens for authenticating requests."
      - url: https://docs.socket.dev/reference/authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authenticating requests to the Socket API can be done by passing the API token as a Bearer token in the `Authorization` header, or as the username field of an HTTP Basic authentication header."
      - url: https://docs.socket.dev/docs/api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API tokens are required to use the [Socket CLI](https://docs.socket.dev/docs/socket-cli) or [Socket REST API](https://docs.socket.dev/reference/)."
      - url: https://docs.socket.dev/docs/create-socket-api-key-for-cicd.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "These work the same whether you run the CLI locally or in a **CI/CD integration** (GitHub Actions, GitLab, Bitbucket, Jenkins, Azure DevOps)."
      - url: https://docs.socket.dev/docs/socket-for-github-actions.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}"
      - url: https://docs.socket.dev/docs/socket-in-your-gitlab-pipeline.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For the \"**Value:**\" field, enter your <**Socket API Token**>"
      - url: https://docs.socket.dev/docs/socket-login.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In CI, set the `SOCKET_CLI_API_TOKEN` environment variable instead."
      - url: https://docs.socket.dev/docs/socket-firewall-enterprise-registry-mode-codeartifact-configuration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Socket API token comes from `SOCKET_SECURITY_API_TOKEN`, never the config file."
      - url: https://api.socket.dev/v1/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authentication: Organization API token, OAuth2, or NextAuth session."
      - url: https://docs.socket.dev/docs/remote-socket-mcp.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "your MCP client opens a browser to authenticate with Socket on first connect, so there's no API key to copy or manage"
    notes: >-
      The API's only OAuth grant is a device-code login that a person approves in a browser, used by
      the MCP server and interactive login. There is no machine grant and no way to trust a CI or
      cloud issuer. Every CI recipe stores the token as a secret, even on GitHub and GitLab, which
      already issue OIDC tokens to jobs. A blank `socket login` uses a shared public token for
      package lookups. Static tokens passing three of five hygiene checks grade D.
  outbound:
    grade: A
    mechanism: >-
      Apps you install or authorize, such as the Socket GitHub App, a Jira Forge app and OAuth
      clients for Linear and Vanta. You hand over no key or secret.
    evidence:
      - url: https://docs.socket.dev/docs/socket-for-github-installation.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Install the [Socket Security App](https://github.com/apps/socket-security) from the GitHub Marketplace by visiting: [github.com/apps/socket-security](https://github.com/apps/socket-security)."
      - url: https://docs.socket.dev/docs/permissions.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "We use read access only to retrieve the file tree listing (names and paths) and then download only the specific dependency manifest, lockfile, and related configuration file types listed below."
      - url: https://docs.socket.dev/docs/jira-integration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The integration is powered by the **Socket for Jira** Atlassian Forge app, which is installed in your Jira Cloud instance and connected to your Socket organization."
      - url: https://docs.socket.dev/docs/linear-integration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authorization happens entirely from the Socket dashboard — there is no separate app to install in a third-party admin console."
      - url: https://docs.socket.dev/docs/asana-integration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The integration connects to Asana using OAuth."
      - url: https://docs.socket.dev/docs/clickup-integration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "ClickUp OAuth does not use granular scopes."
      - url: https://docs.socket.dev/docs/vanta-integration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Upon completion, Socket will store a refresh token in your organization settings for ongoing communication with Vanta."
      - url: https://docs.socket.dev/docs/socket-for-origin.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In Origin, open the **App Marketplace**, select **Socket**, and install it on the repositories you want to scan."
      - url: https://docs.socket.dev/docs/slack-alerts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can configure a Slack Webhook URL in your organization dashboard which will receive any new or updated pull request notifications generated by the Socket Organization's associated GitHub app installation."
      - url: https://docs.socket.dev/docs/notifications.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "| **Microsoft Teams** | A display name and a Workflows webhook URL | That Teams channel |"
      - url: https://docs.socket.dev/docs/socket-firewall-enterprise-registry-mode-artifactory-configuration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use a scoped **Access Token** with read-only permissions."
      - url: https://docs.socket.dev/docs/integrations.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "| Data Exports | Enterprise | Export alert and dependency data to external data warehouses |"
    notes: >-
      GitHub is the only native repo integration. Other repos run the CLI in your own pipeline. For
      Vanta, Socket keeps a refresh token from its own client, not a secret you manage. Slack and
      Teams alerts can use pasted webhook URLs, which only receive pushes and do not lower the
      grade. The PAT for `socket scan github` and Firewall registry credentials stay on your
      machines. Data Exports to warehouses have no public setup doc, and a pasted key there would
      drop this to B. Socket reaches no cloud account, so A rests on app consent alone, as on
      proofpoint-tap.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.socket.dev/reference/postapitoken.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Maximum number of API calls allowed per month"
      - url: https://docs.socket.dev/docs/api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Ensure your API tokens are stored securely and rotate them if you have concerns about their usage."
    notes: >-
      Tokens have no expiry field, only a monthly call quota. A token lives until someone revokes
      it, and no policy can force a lifetime.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.socket.dev/reference/postapitokensrotate.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This endpoint requires the following org token scopes: - api-tokens:rotate"
      - url: https://docs.socket.dev/reference/postapitokensrevoke.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This endpoint requires the following org token scopes: - api-tokens:revoke"
      - url: https://docs.socket.dev/reference/postapitoken.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API Token created must use a subset of permissions the API token creating them."
    notes: >-
      The API can create, update, rotate, revoke and list tokens. Rotation keeps the token's name
      and scopes.
  scoping:
    pass: true
    evidence:
      - url: https://docs.socket.dev/docs/api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API Tokens can individually manage the capabilities they can use in our API."
      - url: https://docs.socket.dev/reference/creating-and-managing-api-tokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "**Least Privilege Principle**: Assign only the necessary scopes to each token to minimize potential security risks."
      - url: https://api.socket.dev/v0/openapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Tokens restricted to specific repositories may only delete resolutions anchored to a granted repository."
    notes: >-
      Tokens belong to the organization, not a person. They take from over 60 per-endpoint scopes
      and can be limited to specific repositories.
  last_used:
    pass: true
    evidence:
      - url: https://docs.socket.dev/docs/api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Audits of last usage and remaining quota are available on the dashboard."
      - url: https://docs.socket.dev/reference/getapitokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Timestamp when the API Token was last used"
    notes: >-
      The dashboard and the list API both show when each token was last used.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Socket is not in GitHub's secret-scanning table, and no other leak-revocation program is
      documented.

notes: >-
  The GitHub App, CI actions, Firewall and MCP all use the same organization tokens, so they share
  this grade. Inbound moves to B or A only if the API accepts a federated token. Adding expiry and
  GitHub scanning would still leave a D.
