id: github-api
vendor: GitHub
product: API and Actions
covers: The REST and GraphQL APIs and GitHub Actions.
aliases:
  - GitHub Actions
  - GraphQL API
website: https://github.com
docs: https://docs.github.com/en/rest/authentication
category: devtools
status: listed
summary: >-
  To call the GitHub API from outside GitHub, you hold a personal access token or a GitHub App
  private key. The App key at least yields one-hour tokens. GitHub Actions is an OIDC issuer, so
  workflows reach AWS, GCP, Azure and Vault without stored keys.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      A GitHub App signs a JWT with its long-lived private key and trades it for a one-hour
      installation token. Personal access tokens are static keys.
    evidence:
      - url: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-an-installation-access-token-for-a-github-app
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "The installation access token will expire after 1 hour."
      - url: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/managing-private-keys-for-github-apps
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Private keys do not expire and instead need to be manually revoked."
      - url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Infinite lifetimes are allowed but may be blocked by a maximum lifetime policy set by your organization or enterprise owner."
    notes: >-
      We found no documented way to trade an outside OIDC token, from a cloud, CI system or SPIFFE,
      for API access. GitHub's federation only runs outward from Actions. The GITHUB_TOKEN inside an
      Actions job is GitHub's own ambient identity and does not count.
  outbound:
    grade: A
    mechanism: >-
      GitHub Actions is an OIDC issuer that AWS, GCP, Azure and Vault can trust. They hand back
      short-lived credentials, so no cloud secret is stored in GitHub.
    evidence:
      - url: https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/about-security-hardening-with-openid-connect
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "No cloud secrets: You won't need to duplicate your cloud credentials as long-lived GitHub secrets."
      - url: https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/about-security-hardening-with-openid-connect
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "With OIDC, your cloud provider issues a short-lived access token that is only valid for a single job, and then automatically expires."
    notes: >-
      Outbound means Actions workflows deploying into your infrastructure. The cloud side trusts the
      token's sub claim, such as repo:org/repo:environment:prod.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://docs.github.com/en/organizations/managing-programmatic-access-to-your-organization/setting-a-personal-access-token-policy-for-your-organization
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Organization owners can set maximum lifetime allowances for both fine-grained personal access tokens and personal access tokens (classic)."
      - url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "If not provided, the default is 30 days, or less if the target has a token lifetime policy set."
    notes: >-
      Passes for personal tokens. Fine-grained ones default to 30 days, and org owners can cap both
      kinds. GitHub App private keys never expire and no policy can force them to.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.github.com/en/rest/orgs/personal-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Limited to revoking a token's existing access."
      - url: https://docs.github.com/en/rest/credentials/revoke
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Any authenticated requests will return a 403."
    notes: >-
      The API can revoke tokens, including any leaked token. Nothing in the API creates a personal
      token or an App private key, so rotation still needs a browser.
  scoping:
    pass: true
    evidence:
      - url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Each token can be further limited to only access specific repositories for that user or organization."
  last_used:
    pass: true
    evidence:
      - url: https://docs.github.com/en/rest/orgs/personal-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "token_last_used_at"
    notes: >-
      The org API returns last use for fine-grained tokens, and your settings page shows it per
      token. GitHub also revokes tokens unused for a year.
  leak_revocation:
    pass: true
    evidence:
      - url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/token-expiration-and-revocation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "If a valid OAuth token, GitHub App token, or personal access token is pushed to a public repository or public gist, the token will be automatically revoked."
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "GitHub Personal Access Token"

notes: >-
  The C comes from inbound. GitHub App tokens are short-lived, but their root is a private key file
  that never expires. Fine-grained personal tokens are well scoped and capped but still static.
