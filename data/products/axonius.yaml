id: axonius
vendor: Axonius
product: Platform
covers: Asset Cloud, both SaaS and self-hosted.
aliases:
  - Asset Cloud
website: https://www.axonius.com
docs: https://docs.axonius.com/docs/manage-service-accounts
category: security
status: listed
confidence:
  level: low
  reason: >-
    The API v2 reference needs a login, so it is not confirmed that every endpoint accepts the OAuth
    token that earns the C. With only the API key and secret, inbound would be D.
summary: >-
  To call the Axonius API, your code needs a static API key and secret, or an OAuth client secret
  swapped for a one-hour token. There is no OIDC login. Axonius reaches AWS through a keyless
  cross-account role, but Azure, GCP and most SaaS adapters take static secrets.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      A service account sends a static API key and secret on every request. It can instead swap an
      OAuth client ID and secret for a bearer token that lasts one hour.
    evidence:
      - url: https://docs.axonius.com/docs/axonius-rest-api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The REST API is only accessible using a service account dedicated for API access."
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API Key and Secret – The default method. You generate an API key and secret pair that are included in each API request."
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "OAuth 2.1 – Generates a Client ID and Client Secret that are exchanged for a short-lived access token."
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use the /api/oauth2/token endpoint to exchange your Client ID and Client Secret for an access token."
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The response body contains an access_token. This token expires after one hour."
      - url: https://docs.axonius.com/docs/managing-api-settings
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Rate limiting applies to requests made with an API key and secret or with an OAuth2/MCP bearer token; browser sessions are not counted."
      - url: https://raw.githubusercontent.com/Axonius/axonius_api_client/master/axonius_api_client/auth/api_key.py
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: 'self.http.session.headers["api-secret"] = self._creds["secret"]'
      - url: https://docs.axonius.com/docs/connect-an-mcp-client-with-your-axonius-login
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "With a service account. An administrator creates a service account with Allow Axonius MCP connection and gives the client its API key and secret."
    notes: >-
      Graded C on the OAuth option. The token is short-lived, but it is minted from a client secret
      you hold. That is C at best, as on the crowdstrike-falcon-api card. The API key path alone
      would be D. No OIDC, GitHub Actions or cloud workload identity login exists. The API v2
      reference needs a login, so OAuth coverage per endpoint cannot be confirmed. The MCP login
      gives a 24-hour token tied to a human, not a workload. From v6.1.74, only service accounts can
      reach the API.
  outbound:
    grade: B
    mechanism: >-
      On hosted Axonius, the AWS adapter assumes a cross-account role you deploy, with your Customer
      ID as External ID. Azure, GCP and SaaS adapters need client secrets, keys or tokens.
    evidence:
      - url: https://docs.axonius.com/docs/connecting-the-aws-adapter-using-cf-organizations
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Cross-account role - The best option for Axonius-hosted (SaaS) customers. Axonius will assume a role in the Launch Account directly and use that role for all other operations within your environment."
      - url: https://docs.axonius.com/docs/connecting-the-aws-adapter-using-cf-organizations
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "ExternalID - Copy your Customer ID from your Axonius Instance."
      - url: https://docs.axonius.com/docs/connecting-the-aws-adapter-using-cf-organizations
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Axonius strongly recommends avoiding the use of IAM Users/Keys in cases where using a cross-account role or instance profile are available."
      - url: https://docs.axonius.com/docs/connecting-the-aws-adapter-using-cf-organizations
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Customers with an Axonius Federal (FedRAMP) environment should NOT use the Cross Account Role method."
      - url: https://docs.axonius.com/docs/aws-parameters
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "AWS Access Key ID (optional) - Provide AWS Access Key ID or choose to use an EC2 instance attached IAM role."
      - url: https://docs.axonius.com/docs/azure-deploying-the-adapter
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Azure Client Secret – Specify a non-expired key generated from the new client secret."
      - url: https://docs.axonius.com/docs/azure-deploying-the-adapter
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use this method to run your Axonius instance on Azure virtual machines with managed identities to authenticate without storing client secrets or certificates."
      - url: https://docs.axonius.com/docs/connecting-gcp-in-axonius
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "JSON Key pair for the service account - A JSON-document containing service-account credentials to GCP."
      - url: https://docs.axonius.com/docs/gcp-initial-setup
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In the Service Account just created, go to Keys."
      - url: https://docs.axonius.com/docs/github
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authorization Token - Specify the personal access token that has read access."
      - url: https://docs.axonius.com/docs/okta
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API Key – Recommended for standard read-only connections."
    notes: >-
      AWS is keyless only for hosted customers, and FedRAMP customers are told not to use the
      cross-account role. The External ID is your fixed Customer ID, not a random value per
      connection. Azure needs an app client secret or certificate, and GCP needs a service account
      JSON key. Managed identity works only if you self-host on an Azure VM. GitHub, Okta, Slack and
      Google Workspace take tokens or private keys. B, not A, because hosted Axonius has no keyless
      path to Azure or GCP. GCP impersonation and an Azure federated credential would lift it to A.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Key Creation Time – The time that the key was created. This parameter is useful to renew the key according to your organization’s policy."
    notes: >-
      No expiry, default lifetime or maximum is documented for API keys or OAuth client secrets. The
      password expiry settings cover human passwords only.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use the following endpoint to reset credentials programmatically:"
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Resetting generates a new Client ID and Client Secret, and invalidates all existing access tokens for that service account."
    notes: >-
      One API call resets OAuth credentials and revokes the old ones, with no overlap. API key
      rotation is documented only in the UI.
  scoping:
    pass: true
    evidence:
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API requests sent using the service account can only apply to the assets and information within this data scope."
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Role – The role that defines what this API user can do. Only roles with API Access permission may be associated with a service account."
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This provides extra validation that service accounts are accessed via REST API calls only for known IP addresses."
    notes: >-
      Service accounts are machine identities with their own role, data scope and optional IP
      allowlist.
  last_used:
    pass: true
    evidence:
      - url: https://docs.axonius.com/docs/manage-service-accounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Last Used – The date and time that the account was last used."
    notes: >-
      Shown per service account. Each account holds one credential pair, so this is per key.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Axonius is not in GitHub's secret scanning list, so leaked keys are not reported to Axonius.

notes: >-
  Covers the Axonius platform, hosted and self-hosted, which shares one API and adapter framework.
  Three of five hygiene checks pass, so even the plain API key path would be D. Inbound moves to B
  or A only if the API accepts a federated token.
