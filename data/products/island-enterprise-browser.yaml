id: island-enterprise-browser
vendor: Island
product: Enterprise Browser
covers: The management API.
website: https://www.island.io
docs: https://documentation.island.io/apidocs/generate-and-manage-api-keys
category: security
status: listed
confidence:
  level: low
  reason: >-
    Island's docs and API reference redirect to its console login, so grades rest on third-party
    integration guides. Expiry, rotation API and last-used fail as not publicly verifiable. How
    exports authenticate is unknown.
summary: >-
  Your code calls Island's management API and SIEM feed with a static API key, with no federation.
  Island's docs are login-walled, and nothing public shows expiry, a key API or last use. Outbound,
  Microsoft Purview uses Entra admin consent, but Google SecOps and Claude Compliance want static
  keys.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static API key made in the Island console with a chosen role, sent in an api-key header.
      Nothing public documents OIDC, workload identity or token exchange.
    evidence:
      - url: https://www.applytosupply.digitalmarketplace.service.gov.uk/g-cloud/services/389257580612079
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Island API supports all the key features of the Island Management Console, including the ability to create, read, update and delete policy, policy elements (such as URL lists), users, browser configuration policies, etc."
      - url: https://raw.githubusercontent.com/elastic/integrations/main/packages/island_browser/docs/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authentication uses an API key as the required credential."
      - url: https://raw.githubusercontent.com/ConductorOne/docs/main/baton/island.mdx
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The connector sends it verbatim as the lowercase HTTP header `api-key: <key>` (no `Bearer` prefix)."
      - url: https://raw.githubusercontent.com/Azure/Azure-Sentinel/master/Solutions/Island/Data%20Connectors/IslandV2_CCP/IslandV2_connectorDefinition.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "An Island API key is required."
      - url: https://docs.hunters.ai/docs/island.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This key is used to authenticate and connect with API requests."
      - url: https://explained.tines.com/en/articles/8592481-island-authentication-guide
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Name the key, choose an appropriate role and click \"Generate API Key\""
      - url: https://docs.panther.com/data-onboarding/supported-logs/island-logs
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Detailed instructions for configuring the Island AWS S3 integration are available in the Island Documentation Portal (requires Management Console login)."
    notes: >-
      Island's own docs redirect to the console login and its Swagger endpoints return 401. So this
      card rests on public sources: Island's G-Cloud listing and integrator guides such as Elastic,
      Sentinel and Tines. Every one uses a console-made API key, and none mentions OIDC, client
      credentials or cloud workload identity. The SIEM and management APIs take the same kind of
      key. If the gated docs show federation, the grade moves.
  outbound:
    grade: B
    mechanism: >-
      Microsoft Purview connects through an Entra app your admin consents to, with no key. Google
      SecOps and Claude Compliance need static keys, and other export setups are login-walled.
    evidence:
      - url: https://www.island.io/blog/microsoft-purview-dlp-enterprise-browser
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The integration connects the Island Enterprise Browser and Island Extension with Microsoft Purview network data security through an Azure AD consented application via Microsoft Graph API."
      - url: https://www.island.io/blog/microsoft-purview-dlp-enterprise-browser
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Once an administrator grants consent and configures a Purview network collection or DLP policy, Island begins evaluating browser-level activity against those policies in real time."
      - url: https://docs.cloud.google.com/chronicle/docs/ingestion/default-parsers/island-browser
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Chronicle requires an API key for authentication."
      - url: https://docs.cloud.google.com/chronicle/docs/ingestion/default-parsers/island-browser
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In the Server URL field, paste the complete webhook URL constructed in the previous step (the Chronicle endpoint URL with the API key and secret key appended as query parameters)."
      - url: https://www.island.io/blog/island-integrates-with-the-claude-compliance-api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Island connects to Claude Enterprise via the Claude Compliance API and pulls the session content: chats, uploaded files, and attachments."
      - url: https://platform.claude.com/docs/en/manage-claude/compliance-api-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Compliance Access Keys do not expire on their own."
      - url: https://www.applytosupply.digitalmarketplace.service.gov.uk/g-cloud/services/389257580612079
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Customers can send their logs to Amazon S3, Snowflake, Azure Blob Storage or any SIEM of their choice during their contract with Island, meaning an export should not be required."
      - url: https://docs.panther.com/data-onboarding/supported-logs/island-logs
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Island exports logs to an S3 bucket in your AWS account."
    notes: >-
      Provisional, since Island's integration docs are login-walled. Purview uses Entra admin
      consent, which counts as keyless, as on the proofpoint-tap card. Google SecOps needs a Google
      Cloud API key and feed secret inside the webhook URL Island stores. The Claude Compliance API
      takes only Anthropic keys, which never expire. S3, Azure Blob, Snowflake and Splunk exports
      exist, but their auth is not public. Pull-based SIEMs use the inbound key. If the gated S3
      page uses a role with external ID, this stays B. If Purview needs an app secret you create, it
      drops to C or lower.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://www.elastic.co/docs/reference/integrations/island_browser
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Click + Create. The Create API Key drawer is displayed to assist in the key creation."
    notes: >-
      No public source mentions an expiry, default lifetime or policy. Integrators create keys with
      only a name and role. No receipt, so it fails.
  rotation_api:
    pass: false
    evidence:
      - url: https://www.elastic.co/docs/reference/integrations/island_browser
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If an API key already exists and you need to create a new one, you must first deactivate and delete the existing key by selecting Deactivate and Delete API Key."
    notes: >-
      Every public procedure creates and deletes keys in the console, and no key endpoint is public.
      Elastic's guide implies only one management key can exist at a time, so rotation means
      downtime.
  scoping:
    pass: true
    evidence:
      - url: https://www.elastic.co/docs/reference/integrations/island_browser
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Select Full Admin or System Admin as the role for this API key."
      - url: https://raw.githubusercontent.com/ConductorOne/docs/main/baton/island.mdx
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Island API key with the Read-Only role."
    notes: >-
      Each key gets its own role at creation, and a Read-Only role exists, which the rubric counts.
      The roles are coarse, and the SIEM guidance asks for an admin-level account.
  last_used:
    pass: false
    evidence:
      - url: https://explained.tines.com/en/articles/8592481-island-authentication-guide
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy your API key to a text editor and click \"Close\""
    notes: >-
      No public source shows a last-used time for keys. No receipt, so it fails.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Island is not on GitHub's secret-scanning list, so a leaked key is neither detected nor
      reported to Island.

notes: >-
  Island's docs and API Explorer need a console login. One public hygiene pass puts inbound at F.
  Documented expiry, last use and a key API would make D. Only a federated token path would go
  higher. The browser's end-user SSO is human login and out of scope.
