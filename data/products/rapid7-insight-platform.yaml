id: rapid7-insight-platform
vendor: Rapid7
product: Command Platform
covers: The Insight platform API for InsightIDR, InsightConnect and InsightCloudSec.
aliases:
  - Insight Platform
  - InsightIDR
  - InsightConnect
  - InsightCloudSec
website: https://www.rapid7.com
docs: https://docs.rapid7.com/insight/managing-platform-api-keys/
category: security
status: listed
summary: >-
  Workloads call Rapid7's platform APIs with a static API key. It either inherits a person's access
  or is an organization key with full access. Only the create and delete API passes hygiene. Rapid7
  reaches AWS with a role, but other clouds and most connectors want static secrets.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static API key in the X-Api-Key header. User keys inherit their owner's access, and
      organization keys can reach every product. Cloud Security has its own static key.
    evidence:
      - url: https://docs.rapid7.com/insight/api-overview/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authentication is performed by passing your API key via a single HTTP header: X-Api-Key. The key must be passed to all requests."
      - url: https://docs.rapid7.com/insight/managing-platform-api-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "User key - Represents a specific user in an organization. This type of key can be created by any user and inherits the permissions of the user."
      - url: https://docs.rapid7.com/insight/managing-platform-api-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Organization key - Represents an entire organization and is a super key. This type of key can do everything across all products."
      - url: https://docs.rapid7.com/insight/managing-multi-tenant-api-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Multi-Tenant admin key: Grants full administrative privileges to all current and future tenants managed by your primary account."
      - url: https://help.rapid7.com/insightAccount/en-us/api/v1/insightAccount-api-v1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"title" : "Must be USER, ORGANIZATION, USER_ENTERPRISE OR ADMIN_ENTERPRISE"'
      - url: https://docs.rapid7.com/insightcloudsec/api-documentation/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API keys generated in the Rapid7 Command Platform (Insight Platform), including User API Keys and Organization API Keys, are not compatible with the Cloud Security (InsightCloudSec) API."
      - url: https://docs.rapid7.com/insightcloudsec/api-documentation/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Once you have an API key, pass it in the Api-Key header with each request."
      - url: https://docs.rapid7.com/insightcloudsec/github-actions-integration/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "api_key: ${{ secrets.ics_api_key }}"
    notes: >-
      Every Insight API except Cloud Security accepts this key, and the docs describe nothing else.
      There is no OIDC, cloud workload identity or token exchange, and a year of release notes adds
      none. Cloud Security uses its own static key or a password session, and its GitHub Actions
      setup stores the key as a secret. That key is also static, so it does not change the grade.
      SAML and SCIM are for humans.
  outbound:
    grade: B
    mechanism: >-
      Cloud Security assumes an AWS role you create, with an External ID. Azure, GCP, OCI and
      Alibaba want static secrets, as do the SIEM and automation AWS connectors.
    evidence:
      - url: https://docs.rapid7.com/insightcloudsec/saas-aws-cloud-setup-single-cloud/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Step 1: Generate an External ID — Login to InsightCloudSec and generate a unique External ID that will be associated with the trusted entity used to harvest data in your AWS Cloud Account."
      - url: https://docs.rapid7.com/insightcloudsec/saas-aws-cloud-setup-single-cloud/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Note: This process supports AWS best practices and prevents the confused deputy problem from occurring."
      - url: https://docs.rapid7.com/insightcloudsec/aws-cloud-onboarding/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you chose IAM User via API Keys, copy/paste the Access Key and Secret Key."
      - url: https://docs.rapid7.com/insightcloudsec/manual-onboarding-azure-console/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Configure the API Key and Secret or Client Certificate plus Microsoft Graph API permissions granted to the App Registration."
      - url: https://docs.rapid7.com/insightcloudsec/gcp-onboarding/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy/paste the entire JSON key file into the API Credentials field."
      - url: https://docs.rapid7.com/insightcloudsec/oracle-cloud-onboarding/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In OCI, an API Key is an RSA key pair in PEM format used for signing API requests."
      - url: https://docs.rapid7.com/insightcloudsec/alibaba-cloud-onboarding/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy the Access Key ID and Access Key Secret for use in connecting the account in Cloud Security (InsightCloudSec)."
      - url: https://docs.rapid7.com/insightidr/aws-cloudtrail-sqs/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Securely record the User’s Access Key and Secret Key. You will need to provide these values when you configure the event source in SIEM (InsightIDR)."
      - url: https://docs.rapid7.com/insightidr/access-aws-resources-with-ec2-iam-roles/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When you use SIEM (InsightIDR) to add AWS event sources, the Collector can use its role permissions rather than the IAM Key to create a secure connection."
      - url: https://docs.rapid7.com/insightidr/microsoft-azure/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To configure the event source in SIEM (InsightIDR), you will need the primary key from the R7SIEM (InsightIDR) shared access policy (created in task 2), associated with the insights-operational-logs event source (created in task 1)."
      - url: https://docs.rapid7.com/insightidr/microsoft-office-365/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The application needs a client secret attached to it, in addition to the ActivityFeed.Read application permission applied to the Office 365 Management API."
      - url: https://docs.rapid7.com/insightidr/google-cloud-platform/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Click Begin to set up OAUTH and start the authorization process. A new window or tab will open for you to perform an authorization grant with Google. The grant must be performed by a GCP admin user."
      - url: https://docs.rapid7.com/insightidr/okta/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "It is recommended that you create an Okta service account, so that you can create API tokens and assign the tokens the required privilege levels."
      - url: https://docs.rapid7.com/insightconnect/aws-security-hub/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create or add a connection using the access key ID and secret access key you received when creating the IAM role."
      - url: https://docs.rapid7.com/insightconnect/connections/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Credentials can be passwords, API keys, or other sensitive information, while other connection parameters can include data like IP addresses or port numbers."
    notes: >-
      AWS onboarding is keyless, though IAM user keys are also accepted. Azure wants an app client
      secret or certificate, and GCP a JSON key, with no keyless option for either. OCI and Alibaba
      also take static keys. SIEM AWS sources take IAM user keys unless your own collector runs on
      EC2 with a role. Microsoft 365, Okta and automation plugins take secrets or tokens. GCP
      Pub/Sub uses an OAuth grant by an admin, which ties collection to that person. B because only
      AWS is keyless. Keyless Azure and GCP onboarding would lift it to A.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://help.rapid7.com/insightAccount/en-us/api/v1/insightAccount-api-v1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"description" : "Generate API Key Request"'
      - url: https://discuss.rapid7.com/t/56971.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "I'm not referring to Rapid7 Platform keys (User / Organization) that do not expire"
    notes: >-
      Keys have no expiry field and no policy sets one. A community post confirms they do not
      expire. Deleting a user removes their keys but not organization keys they made.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.rapid7.com/insight/managing-platform-api-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Generate new API keys to replace deleted ones"
      - url: https://help.rapid7.com/insightAccount/en-us/api/v1/insightAccount-api-v1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Generates a new API key for a user or organization."
    notes: >-
      The account API can list, create and delete keys, so rotation can be scripted. Rapid7
      recommends automating it.
  scoping:
    pass: false
    evidence:
      - url: https://docs.rapid7.com/insight/managing-platform-api-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A user key will inherit your account’s permissions, so anything you can do, your API key can do."
      - url: https://docs.rapid7.com/insight/managing-platform-api-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Organization key - Represents an entire organization and is a super key."
    notes: >-
      A key cannot have its own permissions. User keys get the owner's roles and organization keys
      get everything. The only workaround is an ordinary user with a custom role, which the rubric
      does not count.
  last_used:
    pass: false
    evidence:
      - url: https://help.rapid7.com/insightAccount/en-us/api/v1/insightAccount-api-v1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"description" : "Date the API Key was generated"'
    notes: >-
      Neither the API nor the key management page shows a last-used time. Audit logs exist, but give
      no per-key view.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Rapid7 is not in GitHub's secret-scanning patterns, so leaked keys are neither detected nor
      reported.

notes: >-
  Covers the Insight platform API and the cloud and SaaS connections of InsightIDR, InsightConnect
  and InsightCloudSec. One hygiene check passes, so F. Enforced expiry plus a service account with
  its own role would lift inbound to D. B or A needs federation. The InsightVM console API is not
  graded here.
