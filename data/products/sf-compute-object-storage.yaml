id: sf-compute-object-storage
vendor: SF Compute
product: Object Storage
aliases: ["San Francisco Compute Company", "SFC"]
website: https://sfcompute.com
docs: https://docs.sfcompute.com/preview/object-storage
category: cloud
status: listed
summary: >-
  Buckets take static S3-style key pairs that read and write every bucket in a workspace and region.
  Keys can be created and revoked from the CLI, but pass no other hygiene check. The control plane
  is graded on the sf-compute card.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static S3-style access key and secret, created with the sf CLI or console and used by tools
      like rclone. No temporary credentials or federation exist.
    issuers: []
    evidence:
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Buckets hold your files, and tools built for S3-compatible object stores, such as rclone and boto3, read and write to them."
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Save the returned access key ID and secret in your secrets manager."
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Set these variables on your laptop and on each instance that uses the bucket."
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Creating and deleting buckets and access keys in a workspace requires a [role](/preview/roles.md) that allows the `bucket` and `access_key` resources there."
    notes: >-
      A long-lived key pair is the only way into a bucket, even from SF Compute's own instances.
      Creating a key needs the sf CLI or console, so it also rests on the static token graded on the
      sf-compute card. One of five hygiene checks passes.
  outbound:
    grade: N/A
    mechanism: >-
      Object storage never pulls from your clouds. Imports run rclone on your own machine with your
      provider's credentials.
    evidence:
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use `rclone config` to add a remote named `source` with that provider's endpoint and its own credentials."
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Data passes through the machine running rclone."
    notes: >-
      No server-side import or sync is documented, so SF Compute never holds the source credential.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "SF Compute enforces these limits on buckets and access keys:"
    notes: >-
      No expiry, default lifetime or policy is documented. A key lives until revoked.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The SF Compute API doesn't manage buckets or access keys yet."
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use `sf storage` to script them, or [contact us](https://sfcompute.com/contact) if you need programmatic access."
    notes: >-
      Passes on the CLI, like sf-compute. Keys are created and deleted without a browser, but there
      is no REST endpoint and only two keys per workspace and region. A strict REST reading would
      fail this, with no grade change.
  scoping:
    pass: false
    evidence:
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "An access key can read and write every bucket in its workspace and region."
    notes: >-
      Every key can read and write every bucket in its workspace and region. Read-only or
      single-bucket keys are impossible, so unlike sf-compute's tokens this fails.
  last_used:
    pass: false
    evidence:
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "List buckets and keys with `sf storage buckets list` and `sf storage access-key list`, or open [Storage](https://console.sfcompute.com/dashboard/storage) in the console."
    notes: >-
      The key list documents no last-used field. The console tab is behind a login, so this is
      graded conservatively.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      SF Compute is not in GitHub's secret-scanning patterns.

notes: >-
  Split from sf-compute because storage auth differs, following coreweave-object-storage. The fix is
  short-lived storage credentials minted from an identity, such as instance identity or an OIDC
  exchange like CoreWeave's. Then key expiry, per-bucket and read-only scopes, last-used times and
  GitHub scanning.
