id: google-cloud-iam
vendor: Google Cloud
product: IAM
covers: Workload Identity Federation.
aliases:
  - Workload Identity Federation
  - GCP
website: https://cloud.google.com/iam
docs: https://docs.cloud.google.com/iam/docs/workload-identity-federation
category: cloud
status: listed
summary: >-
  Your code logs in to Google Cloud with a token from any OIDC or SAML issuer you configure,
  filtered by conditions you write. Every service account can also get a Google-signed ID token to
  reach other clouds. JSON keys never expire by default, but an org policy can force expiry.
surfaces:
  inbound:
    grade: A
    mechanism: >-
      A workload identity pool trusts any OIDC or SAML issuer. Your conditions check issuer,
      subject, audience or any claim before Google issues a short-lived token.
    issuers:
      - any
    evidence:
      - url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Using Workload Identity Federation, you can provide on-premises or multicloud workloads
          with access to Google Cloud resources by using federated identities instead of a service
          account key.
      - url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          any identity provider (IdP) that supports OpenID Connect (OIDC) or Security Assertion
          Markup Language (SAML) V2.0.
      - url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          If the attribute condition evaluates to true for a given credential, the credential is
          accepted. Otherwise, the credential is rejected.
      - url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-other-providers
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: You must map one of these claims to google.subject to uniquely identify the user.
      - url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-other-providers
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: In Issuer URL, enter the issuer URL of your IdP. The URL must start with https://
    notes: >-
      Any https issuer with OIDC discovery works. By default the token's audience must be the
      provider's full resource name, or you list allowed audiences. Conditions can test any claim,
      so issuer, subject and audience limits are all possible. AWS and Azure workloads get their own
      provider types. The federated token works directly on some resources, or can impersonate a
      service account. Ambient identity inside Google Cloud is table stakes and does not earn the A
      alone. We found no documented cap on pools or providers.
  outbound:
    grade: A
    mechanism: >-
      Any workload with a service account can request a Google-signed ID token for any audience from
      the metadata server or the IAM Credentials API. Tokens last at most an hour.
    evidence:
      - url: https://docs.cloud.google.com/docs/authentication/get-id-token
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          To retrieve an ID token from the metadata server, you query the identity endpoint for the
          service account
      - url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: OIDC ID tokens are valid for 1 hour (3,600 seconds).
      - url: https://docs.cloud.google.com/docs/authentication/token-types
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: short-lived and expire after at most one hour
      - url: >-
          https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: For Google Cloud, the issuer is https://accounts.google.com.
    notes: >-
      You pick the audience, so the token works with AWS, Entra, Vault or a SaaS. The issuer is
      accounts.google.com and the subject is the service account's unique ID, which Entra's docs
      tell you to use. A workload can also mint tokens as another service account without holding
      its key. No path uses a static credential. Cross-project access within Google Cloud needs only
      IAM grants.
hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://docs.cloud.google.com/iam/docs/keys-create-delete
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: By default, service account keys never expire.
      - url: >-
          https://docs.cloud.google.com/resource-manager/docs/organization-policy/restricting-service-accounts
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          specify the number of hours for which a newly created key is valid. After this amount of
          time, the service account key expires, and you can no longer use it.
      - url: https://docs.cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          By default, service account keys that you create and download from IAM don't have an
          expiry time and stay valid until you delete them.
    notes: >-
      Keys never expire by default. An org policy can force an expiry of 1 hour to 90 days on new
      keys, or ban new keys entirely, so it passes.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.cloud.google.com/iam/docs/keys-create-delete
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: A service account can have up to 10 keys.
    notes: >-
      gcloud and the REST API can create, disable and delete keys, so overlap-and-cut-over rotation
      is scriptable.
  scoping:
    pass: true
    evidence:
      - url: https://docs.cloud.google.com/iam/docs/overview
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          To give the principal permission to access the resource, you grant them a role on the
          resource.
      - url: https://docs.cloud.google.com/iam/docs/overview
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Principal types that represent workloads include service accounts and federated identities
          in a workload identity pool.
    notes: >-
      A key carries only its service account's roles, granted per resource with optional conditions.
      Same reasoning as the AWS card: the key belongs to a machine identity, not a person.
  last_used:
    pass: true
    evidence:
      - url: >-
          https://docs.cloud.google.com/policy-intelligence/docs/activity-analyzer-service-account-authentication
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          The results might not include very recent authentication events. Check the
          observationPeriod to see the exact date range used during the analysis.
      - url: https://docs.cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          By monitoring the Key Authentication Events metric, you can find out when a service
          account key was last used and how often it was used to authenticate.
    notes: >-
      Policy Analyzer reports when each key last authenticated, by day and with some lag. A Cloud
      Monitoring metric gives the time series.
  leak_revocation:
    pass: true
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-05
        checked_by: sisyphus
      - url: >-
          https://docs.cloud.google.com/resource-manager/docs/organization-policy/restricting-service-accounts
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          If Google Cloud detects an exposed key, it will automatically disable the key. It also
          creates a Cloud Audit Logs event and sends a notification about the exposed key to project
          owners
    notes: >-
      GitHub lists Google service account keys as a partner pattern. Set the org policy to disable
      exposed keys, since the other setting acts only after misuse. The GitHub capture on file needs
      a human to re-confirm.
notes: >-
  Grades machine access to Google Cloud APIs through IAM. Google API keys and OAuth client secrets
  for Workspace or consumer APIs are different credentials and are not graded here.
