id: vultr-cloud
vendor: Vultr
product: Cloud
covers: "Compute, GPU, VKE and Container Registry, via API v2, vultr-cli and Terraform."
aliases: ["VKE", "vultr-cli"]
website: https://www.vultr.com
docs: https://docs.vultr.com/platform/iam
category: cloud
status: listed
summary: >-
  To call Vultr, your code needs a static API key, ideally on an API-only service user. It can trade
  that key for short-lived sessions. Vultr can trust an external OIDC issuer, but documents this
  only for human logins, with no subject or audience checks.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      A static API key, traded for short-lived role sessions or registry logins. Vultr servers can
      use a metadata identity token instead.
    issuers: []
    evidence:
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Vultr API v2 uses API keys for authentication."
      - url: https://docs.vultr.com/platform/iam/service-user/how-to-create-a-service-user.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service users are API-only accounts designed for programmatic access to your organization's resources."
      - url: https://docs.vultr.com/platform/iam/roles/assumed-roles/how-to-assume-a-role.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Assuming a role creates a temporary session that grants the permissions defined by the role's policies."
      - url: https://docs.vultr.com/platform/iam/roles/assumed-roles/how-to-assume-a-role.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The session is time-bound and expires after the specified duration or when the role's"
      - url: https://docs.vultr.com/platform/iam/product-integrations/container-registry-auth/temporary-credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Vultr Container Registry avoids this by issuing short-lived Docker credentials on demand, with a scope that matches the caller's IAM policy."
      - url: https://docs.vultr.com/platform/iam/product-integrations/container-registry-auth/credential-lifecycle.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Every credential has an expiry, and the maximum is 30 days."
      - url: https://docs.vultr.com/platform/iam/product-integrations/container-registry-auth/vke-and-cicd.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Store the service user's API key in your pipeline's secret store"
      - url: https://docs.vultr.com/platform/iam/product-integrations/instance-and-bare-metal-auth/obtain-identity-token.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "it is used to assume an IAM role without a stored API key or user credentials."
      - url: https://docs.vultr.com/platform/iam/oidc/oidc-issuers/how-to-create-an-oidc-issuer.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "users authenticated by the external IdP (such as Okta, Google, or Azure AD) can assume roles in Vultr without separate Vultr credentials."
      - url: https://docs.vultr.com/platform/iam/oidc/oidc-issuers/how-to-create-an-oidc-issuer.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The issuer requires the JWK (JSON Web Key) public key components from the external identity provider's JWKS endpoint."
      - url: https://docs.vultr.com/platform/iam/roles/assumed-roles/how-to-assume-a-role-using-aws-sts-compatibility.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For federated role assumption using a JWT token from an external OIDC issuer (such as Okta, Google, or Azure AD)."
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The STS action. Must be AssumeRole."
      - url: https://docs.vultr.com/platform/iam/roles/role-trusts/how-to-create-a-role-trust.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "can include conditions such as IP restrictions, time-of-day limits, and an expiration date."
      - url: https://docs.vultr.com/platform/iam/roles/role-trusts/how-to-create-a-role-trust.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "trusts cannot be created via Terraform"
      - url: https://docs.vultr.com/products/compute/kubernetes/management/connection.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "including API endpoints, authentication credentials, and resource specifications."
    notes: >-
      Vultr lets you trust an external OIDC issuer from a role, self-serve. Three things keep it
      from counting. It is documented only for people signed in to Okta, Google or Azure AD. Its
      only conditions are IP, time and expiry, so any subject of a shared issuer like GitHub Actions
      could assume the role. The API reference also contradicts the guide. The issuer is one pasted
      key, so trust breaks when the IdP rotates. A human reviewer should check this reading. The
      server identity token is ambient identity inside Vultr and does not earn A.
  outbound:
    grade: N/A
    mechanism: >-
      Compute, GPU, VKE and Container Registry never take your cloud or SaaS credentials. Imports
      read only public URLs and images.
    evidence:
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The public URL containing a RAW image."
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Public URL location of the ISO image to download."
      - url: https://docs.vultr.com/products/orchestration/container-registry/dockerhub-proxy.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All public container images on Docker Hub can be accessed through VCR by prefixing the image URL with the appropriate VCR regional endpoint."
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The password of the source server."
    notes: >-
      Snapshot and ISO import read public URLs only, and the registry proxies only public Docker Hub
      images. The API has no AWS, GCS, Azure or private registry credential fields. Managed Database
      migration takes a source server's password, but that is a separate product. Graded, it would
      be D or F.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.vultr.com/platform/iam/organizations/manage-user-api-access/how-to-create-an-api-key-for-a-user.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Leave this unselected to create a key that does not expire."
      - url: https://docs.vultr.com/platform/release-notes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All API keys also now support an optional expiration date and name for convenient identification after they are generated."
    notes: >-
      Expiry is optional and never is a documented choice. No org policy can force or cap key
      lifetime.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.vultr.com/platform/other/api/other-user/rotate-api-key.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Regularly rotating API keys is a critical security practice that reduces the risk of unauthorized access."
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "These methods enable you to manage your API keys without having to access the customer portal."
    notes: >-
      The API can create and delete keys, and the rotation guide needs no browser.
  scoping:
    pass: true
    evidence:
      - url: https://docs.vultr.com/platform/iam/service-user/how-to-create-a-service-user.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service users are API-only accounts designed for programmatic access to your organization's resources."
      - url: https://docs.vultr.com/platform/iam/product-integrations/container-registry-auth/vke-and-cicd.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Give it a narrow policy, such as push and pull on a single build registry, and mint short-lived credentials at the start of each job."
      - url: https://docs.vultr.com/platform/iam/organizations/manage-user-api-access/how-to-manage-vultr-api-access-control-for-users.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Access control restricts which IP addresses and subnets can authenticate to the Vultr API on a user's behalf."
    notes: >-
      Service users are API-only and get their own IAM policies, down to a single registry. Scope
      belongs to the user, so all of one user's keys reach the same things.
  last_used:
    pass: false
    evidence:
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Gets all API keys for the currently authenticated user."
    notes: >-
      Keys show name and expiry but never when they were last used.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Vultr is not in GitHub's secret scanning patterns, so leaked keys are not revoked.

notes: >-
  Vultr shipped real organization IAM in 2026, but the long-lived API key is still the root. To
  reach A, Vultr would document workload federation with subject and audience conditions and a JWKS
  URL. VKE can trust an OIDC issuer, shown only for human login. Object Storage is graded on
  vultr-object-storage.
