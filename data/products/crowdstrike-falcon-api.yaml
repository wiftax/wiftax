id: crowdstrike-falcon-api
vendor: CrowdStrike
product: Falcon API
covers: The Falcon platform API via OAuth2 API clients.
aliases:
  - Falcon
website: https://www.crowdstrike.com
docs: https://developer.crowdstrike.com/api-reference/collections/oauth2.md
category: security
status: listed
summary: >-
  Every Falcon API call starts from a static client ID and secret, swapped for a 30-minute token.
  There is no OIDC or workload identity login. Falcon connects to your AWS, Azure and GCP accounts
  without keys, but OCI and most container registries use static keys.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      OAuth2 client credentials. A static API client ID and secret are swapped at /oauth2/token for
      a 30-minute bearer token.
    evidence:
      - url: https://developer.crowdstrike.com/llms.txt
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All API access requires OAuth2 credentials (client_id and client_secret) created in the Falcon console under Support and resources > API Clients & Keys."
      - url: https://developer.crowdstrike.com/llms.txt
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Tokens expire after 30 minutes."
      - url: https://developer.crowdstrike.com/api-reference/collections/oauth2.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All API requests require a valid bearer token generated through this collection."
      - url: https://developer.crowdstrike.com/api-reference/collections/oauth2.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API client secret to authenticate your API requests."
      - url: https://raw.githubusercontent.com/CrowdStrike/terraform-provider-crowdstrike/main/docs/index.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`client_secret` (String, Sensitive) Falcon Client Secret used for authenticating to the CrowdStrike APIs."
      - url: https://developer.crowdstrike.com/sdks/powershell/authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Obtain an access token using `Request-FalconToken` with your API Client ID and Secret."
    notes: >-
      The token endpoint takes only a client ID and secret. No JWT assertion or OIDC grant appears
      in the API reference, SDKs, Terraform provider or MCP server. A client secret that mints
      short-lived tokens is C. The Federated Connections API is SIEM search federation, not login
      federation. Foundry functions inside Falcon would use ambient platform identity, which cannot
      earn A anyway. CrowdStrike's own API client docs are behind a login.
  outbound:
    grade: B
    mechanism: >-
      Falcon registers AWS with an IAM role and External ID, Azure with its multi-tenant app, and
      GCP through Workload Identity Federation. OCI and most registries use static keys or
      passwords.
    evidence:
      - url: https://developer.crowdstrike.com/cac/terraform/provider/falcon-cloud-security/resources/cloud-aws-account.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`external_id` (String) The external ID used to assume the AWS IAM role"
      - url: https://developer.crowdstrike.com/cac/terraform/provider/falcon-cloud-security/resources/cloud-aws-account.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`intermediate_role_arn` (String) The ARN of the intermediate role used to assume the AWS IAM role"
      - url: https://developer.crowdstrike.com/cac/terraform/provider/falcon-cloud-security/resources/cloud-azure-tenant.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`cs_azure_client_id` (String) Client ID of CrowdStrike's multi-tenant application in Azure."
      - url: https://developer.crowdstrike.com/cac/terraform/modules/gcp-cloud-registration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The module enables keyless authentication through GCP's Workload Identity Federation and provides security monitoring capabilities including asset inventory and optional real-time log ingestion for threat detection."
      - url: https://developer.crowdstrike.com/cac/terraform/modules/gcp-cloud-registration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Numeric unique ID of CrowdStrike's shared service account. Required when CrowdStrike authenticates via GCP OIDC."
      - url: https://developer.crowdstrike.com/cac/terraform/modules/oci-cloud-registration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Associates an API key with the created user"
      - url: https://developer.crowdstrike.com/cac/terraform/modules/oci-cloud-registration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`api_public_key`: Public key for API access, generated by Falcon Cloud Security"
      - url: https://developer.crowdstrike.com/api-reference/collections/cloud-oci-registration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create, update, delete, and validate OCI tenancy accounts, rotate keys, and retrieve setup scripts."
      - url: https://developer.crowdstrike.com/cac/terraform/provider/falcon-container-image/resources/container-registry.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`aws_iam_role` (String) AWS IAM role ARN. Required for: `ecr`."
      - url: https://developer.crowdstrike.com/cac/terraform/provider/falcon-container-image/resources/container-registry.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`service_account_json` (Attributes) GCP service account JSON. Required for: `gar`, `gcr`."
      - url: https://developer.crowdstrike.com/cac/terraform/provider/falcon-container-image/resources/container-registry.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`password` (String, Sensitive) Password, API key, or access token. Required for: `dockerhub`, `docker`, `github`, `gitlab`, `icr`, `artifactory`, `acr` (password auth), `mirantis`, `oracle`, `openshift`, `quay.io`, `nexus`, `harbor`."
    notes: >-
      AWS, Azure and GCP registration are all keyless. OCI registration creates an IAM user with an
      API signing key that Falcon generates and holds long term. Container registries other than ECR
      take passwords, tokens, an Azure certificate or a GCP JSON key. B because the three big clouds
      are keyless but OCI and most registries are not. SaaS and SIEM connectors are not graded,
      since their setup is not publicly documented. Falcon Data Replicator is a bucket you pull
      from, not a reach-in.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://developer.crowdstrike.com/api-reference/collections/api-clients.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Reset existing API Client(s)'s secret based on API Client ID(s) provided as request parameter(s) 'ids'."
    notes: >-
      API clients have no expiry field, and no public doc describes a lifetime policy. A secret
      lives until reset or deleted. The console docs are behind a login, so a hidden setting cannot
      be verified.
  rotation_api:
    pass: true
    evidence:
      - url: https://developer.crowdstrike.com/api-reference/collections/api-clients.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Reset existing API Client(s)'s secret based on API Client ID(s) provided as request parameter(s) 'ids'."
      - url: https://developer.crowdstrike.com/api-reference/collections/api-clients.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Delete existing API Client(s) based on API Client ID(s) provided as request parameter(s) 'ids'."
    notes: >-
      The API can create, update and delete API clients and reset their secrets. A reset replaces
      the secret in place, so zero-downtime rotation needs a second client.
  scoping:
    pass: true
    evidence:
      - url: https://developer.crowdstrike.com/cac/terraform/modules/aws-cloud-registration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "It is highly recommended that you create a dedicated API client with only the required scopes."
      - url: https://developer.crowdstrike.com/api-reference/collections/api-clients.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Get all available scopes for customer."
    notes: >-
      An API client is its own identity with explicit read and write scopes per API. Scopes are not
      per resource, but that still counts as a least-privilege machine identity.
  last_used:
    pass: false
    evidence:
      - url: https://developer.crowdstrike.com/api-reference/collections/api-clients.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Possible values for sort by field includes id, name, created_by, updated_by, created_timestamp, last_modified."
    notes: >-
      The public API shows created and modified times but no last use. Whether the console shows it
      is behind a login. Audit logs are not a per-key view.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      CrowdStrike is not in GitHub's secret-scanning table, so a leaked secret is not reported to
      CrowdStrike.

notes: >-
  One card for the whole Falcon API. The SDKs and Terraform provider all authenticate the same way.
  Inbound moves to B or A only if /oauth2/token accepts a federated assertion. Outbound moves to A
  if OCI and the registry connectors move to federation. Sensor enrollment is not API access and is
  not graded.
