id: voltage-park-kubernetes
vendor: Voltage Park
product: Managed Kubernetes
parent: Lightning AI
covers: The cluster API server for the Managed Kubernetes add-on on bare-metal rentals.
website: https://www.voltagepark.com
docs: https://support.voltagepark.com/article/add-on-managed-kubernetes
category: cloud
status: listed
summary: >-
  This card grades the cluster API server, not the API that creates clusters. You can configure a
  cluster to trust any OIDC issuer you choose. Without that, access is a long-lived kubeconfig.
  Creating the cluster needs the static token graded F on the voltage-park card.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      You give the cluster a standard Kubernetes AuthenticationConfiguration naming the OIDC
      issuers, audiences and claim rules to trust. Without it, the kubeconfig carries long-lived
      certificates.
    issuers:
      - any
    evidence:
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Our control-plane exposes the standard Kubernetes OIDC authentication flow: every API request can be validated against an external OpenID Connect Identity Provider (IdP)."
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Internally, the control plane starts the API server with the standard --authentication-config flag, so the behavior matches upstream Kubernetes."
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This configuration can be supplied during cluster creation or updated later via the instance actions on the console."
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "An OIDC-compliant IdP with discovery enabled (/.well-known/openid-configuration must be resolvable from the control plane)"
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Once the control plane trusts your IdP, you map IdP claims to Kubernetes roles exactly like any other subject."
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Short-lived, signed JWTs replace long-lived kubeconfig certificates."
      - url: https://cloud-api.voltagepark.com/api/v1/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Base64 encoded AuthenticationConfig file."
      - url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The configuration file approach allows you to configure multiple JWT authenticators, each with a unique issuer.url and issuer.discoveryURL."
      - url: https://support.voltagepark.com/article/bare-metal
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "After deployment, retrieve your kubeconfig from the On-Demand > My Instances > Details page:"
    notes: >-
      The config goes straight to upstream Kubernetes, so you can restrict trust by issuer, audience
      and subject. It is self-serve in the console and API. Judgment call: Voltage Park's guide is
      written for human SSO and never mentions CI or cloud workload tokens. It is still A, as on the
      coreweave-cks card, because the feature validates any token from an issuer you list. On
      hyperbolic and lambda-cloud, Kubernetes OIDC is the vendor's own interactive sign-in. Read
      strictly as human-only, this would be F. OIDC is opt-in, and Managed Kubernetes comes only
      with bare-metal rentals.
  outbound:
    grade: N/A
    mechanism: >-
      The add-on never needs access into your infrastructure.
    evidence:
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Kubernetes manifest file should use a persistentVolumeClaim with a name of pvc-<storage name>"
      - url: https://support.voltagepark.com/article/attach-storage
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "once attached to storage your cluster will automatically mount the storage."
    notes: >-
      The only managed data path is Voltage Park's own storage mounted as a volume. Workloads in the
      cluster reach your cloud with whatever credentials you deploy. Unlike coreweave-cks, the
      cluster has no documented public OIDC issuer for your clouds to trust. Documenting one would
      make outbound A.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Short-lived, signed JWTs replace long-lived kubeconfig certificates."
    notes: >-
      Hygiene is graded on the kubeconfig issued at creation. Its lifetime is not documented, and
      Voltage Park's guide calls the certificates long-lived.
  rotation_api:
    pass: false
    evidence:
      - url: https://cloud-api.voltagepark.com/api/v1/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Get details for a specific addon for a Kubernetes cluster"
    notes: >-
      The API returns the kubeconfig, but nothing documented reissues or revokes it.
  scoping:
    pass: false
    evidence:
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This can be done using the kubeconfig supplied to you during cluster creation."
    notes: >-
      The kubeconfig is the cluster admin credential. It is limited to one cluster but not to a
      subset of permissions.
  last_used:
    pass: false
    evidence:
      - url: https://support.voltagepark.com/article/add-on-managed-kubernetes
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No last-used view for the kubeconfig is documented.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Voltage Park is not in GitHub's secret scanning patterns, and kubeconfig certificates have no
      vendor-specific pattern.

notes: >-
  Split from the voltage-park card the way coreweave-cks is split from coreweave-api. The A holds
  only once you configure OIDC. The default kubeconfig has no documented expiry, rotation or
  scoping. A Feb 2026 OIDC help article rendered no text and is not cited. A documented workload
  example would settle the judgment call.
