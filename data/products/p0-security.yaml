id: p0-security
vendor: P0 Security
product: Platform
covers: "The Management, JIT access and inventory APIs."
website: https://www.p0.dev
docs: https://docs.p0.dev/p0-api/authenticating-with-the-p0-api
category: identity
status: listed
summary: >-
  P0's API accepts a short-lived Google Cloud service account token, but no other issuer. The legacy
  API key never expires and always has the Owner role. P0 reaches your clouds and most SaaS without
  keys, but Kubernetes, Cloudflare, Tailscale and SIEM sinks want a pasted secret.

surfaces:
  inbound:
    grade: B
    mechanism: >-
      P0 accepts a Google service account identity token as the bearer, if its audience is your org
      URL and its email is a P0 member. The other option is a legacy Owner key.
    issuers: ["Google Cloud service-account identity tokens (accounts.google.com)"]
    evidence:
      - url: https://docs.p0.dev/p0-api/authenticating-with-the-p0-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A workload running on Google Cloud can authenticate as a service account with a short-lived identity token, so no long-lived secret needs to live in your CI system. P0 accepts a Google-issued service-account identity token as a bearer token."
      - url: https://docs.p0.dev/p0-api/authenticating-with-the-p0-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The service account's email must be a member of your P0 organization, or P0 rejects the token."
      - url: https://docs.p0.dev/p0-api/authenticating-with-the-p0-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Recommended. Short-lived, no stored secret. Requires Google Cloud."
      - url: https://docs.p0.dev/p0-api/authenticating-with-the-p0-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "API keys are legacy and are being phased out in favor of Google Cloud service-account tokens. They still work, but prefer a service-account token for new integrations."
      - url: https://docs.p0.dev/integrations/resource-integrations/ssh/self-hosted
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A Google Cloud service-account token is recommended for CI/CD or unattended registration: it's short-lived and needs no stored secret."
    notes: >-
      Google is the only federated issuer, so this is B. GitHub Actions, AWS, Azure and custom
      issuers are not documented. A workload outside GCP can use Google Workload Identity Federation
      to mint the token, but Google stays the only issuer. Trust checks audience and the service
      account email, which gets least-privilege roles. The CLI token is a human session, not for
      automation.
  outbound:
    grade: B
    mechanism: >-
      AWS trusts a Google-signed token, GCP and Azure use P0's identity or a federated credential,
      and SaaS uses consent or app installs. Kubernetes, Cloudflare, Tailscale, Datadog and Splunk
      take a token or secret.
    evidence:
      - url: https://docs.p0.dev/integrations/resource-integrations/aws/installation-methods
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "P0 assumes the P0RoleIamManager role by calling sts:AssumeRoleWithWebIdentity with a Google-signed token."
      - url: https://docs.p0.dev/integrations/resource-integrations/google-cloud
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The IAM management install grants resourcemanager.projects.getIamPolicy to P0's service account on the project."
      - url: https://docs.p0.dev/integrations/resource-integrations/microsoft-azure/azure-app-registration
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Stage the installation with p0_azure_app_staged to obtain the application name and federated credential details, create the Azure AD application and its federated credential from those outputs, then complete the installation with p0_azure_app, passing the new application's client ID."
      - url: https://docs.p0.dev/integrations/directory-integrations/okta
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Paste the public key you copied from P0 during the public key generation process, then click Done."
      - url: https://docs.p0.dev/integrations/directory-integrations/google-workspace
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Click \"Install integration\". This will take you to a Google consent screen:"
      - url: https://docs.p0.dev/integrations/directory-integrations/microsoft-entra-id-legacy
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Click \"Install integration\". This will take you to Microsoft's site and present you with a consent screen."
      - url: https://docs.p0.dev/integrations/resource-integrations/github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Review the permissions required by the P0 GitHub app and select Install."
      - url: https://docs.p0.dev/integrations/resource-integrations/kubernetes
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Copy the resulting token from the shell, return to the P0 IAM management screen, and paste it into the Cluster token input field."
      - url: https://docs.p0.dev/integrations/resource-integrations/cloudflare
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "SCIM API token: a Cloudflare API token that grants P0 access to the account's SCIM API."
      - url: https://docs.p0.dev/integrations/resource-integrations/tailscale
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The installation process involves generating an OAuth client in Tailscale and providing its Client ID and Client secret to P0."
      - url: https://docs.p0.dev/integrations/siem-integrations/datadog-setup
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "You must provide a Datadog API key to authenticate log submissions."
    notes: >-
      Every cloud is keyless. For Okta, P0 holds the private key and you paste only its public key.
      GitHub Repositories use your own GitHub App, whose key stays in your AWS account. Static:
      Kubernetes takes a long-lived service account token, Cloudflare an API token, Tailscale an
      all-scope OAuth secret, and Datadog and Splunk their keys. B, not A, because Kubernetes and
      several SaaS connectors take static credentials.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.p0.dev/p0-api/authenticating-with-the-p0-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A Google Cloud service-account token or a CLI token expires on its own; an API key does not."
      - url: https://docs.p0.dev/integrations/resource-integrations/ssh/self-hosted
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A legacy API key also works, but carries the full Owner role and doesn't expire on its own."
    notes: >-
      Creating a key takes only a name, with no expiry field or org policy.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.p0.dev/p0-management/management-api/api-key-management-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The API Key Management API lets you create, list, and delete your organization's API keys programmatically. Use these endpoints to automate key provisioning and rotation in your infrastructure-as-code and CI/CD workflows."
  scoping:
    pass: false
    evidence:
      - url: https://docs.p0.dev/p0-api/authenticating-with-the-p0-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A P0 API key carries the full Owner role and cannot be scoped to a lesser role."
      - url: https://docs.p0.dev/p0-management/management-api/api-key-management-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Every API key is granted the Owner role, so any key can create, list, and delete other API keys. Treat each key as a full administrative credential, and store it securely."
  last_used:
    pass: false
    evidence:
      - url: https://docs.p0.dev/p0-management/management-api/api-key-management-api
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Returns metadata for every API key in the organization, ordered by creation time. Never returns key material."
    notes: >-
      The API key object has no last-used field, and the docs do not show one. Creation and deletion
      are audit-logged.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Partner alerts: Reported directly to secret providers that are part of secret scanning's partner program."
    notes: >-
      P0 Security is not in GitHub's supported patterns list.

notes: >-
  Docs are public. Inbound would move to A if P0 accepted tokens from an OIDC issuer you configure.
  The legacy key fails four hygiene checks, but GCP-based or GCP-federated workloads never need it.
