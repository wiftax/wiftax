id: snowflake
vendor: Snowflake
product: Data Cloud
website: https://www.snowflake.com
docs: https://docs.snowflake.com/en/user-guide/workload-identity-federation
category: data
status: listed
summary: >-
  A service user can log in with a short-lived token from AWS, Azure, GCP or any OIDC issuer with a
  public discovery document. No secret is needed. Storage integrations reach into S3, GCS and Azure
  without keys.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      Workload identity federation on a service user. It trusts AWS, Azure, GCP or any OIDC issuer
      with a public discovery document, pinned by issuer, subject and optional audience.
    issuers: ["any"]
    evidence:
      - url: https://docs.snowflake.com/en/user-guide/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Workload identity federation (WIF) is a service-to-service authentication method that lets workloads, such as applications, services, or containers, authenticate with Snowflake using their cloud provider's native identity system."
      - url: https://docs.snowflake.com/en/user-guide/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Complete the steps in each section listed below to use WIF to authenticate to Snowflake from a custom OIDC Provider"
      - url: https://docs.snowflake.com/en/user-guide/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Ensure that your OIDC Provider supports the OpenID Configuration as specified within the Discovery specification. Both the configuration and the configuration's jwks_uri endpoint must be publicly accessible."
      - url: https://docs.snowflake.com/en/user-guide/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "If you omit this parameter, the audience defaults to snowflakecomputing.com, which is shared across all Snowflake accounts."
    notes: >-
      Only users of type SERVICE or SERVICE_AGENT can federate. The issuer's discovery document and
      JWKS must be public, so private-network issuers do not work. Tokens need an iat claim and an
      RS or ES signature. Each user trusts one issuer and subject, so a fleet needs one service user
      per identity or a shared subject. Key pairs and Snowflake OAuth with a client secret remain,
      and would grade C on their own.
  outbound:
    grade: A
    mechanism: >-
      On S3, Snowflake assumes an IAM role with an external ID. On GCS, you grant bucket roles to
      its service account. On Azure, you consent to its multi-tenant app.
    evidence:
      - url: https://docs.snowflake.com/en/user-guide/data-load-s3-config-storage-integration
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "An external ID is used to grant access to your AWS resources (such as S3 buckets) to a third party like Snowflake."
      - url: https://docs.snowflake.com/en/user-guide/data-load-gcs-config
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Snowflake automatically associates the storage integration with a Cloud Storage service account created for your account."
      - url: https://docs.snowflake.com/en/user-guide/data-load-gcs-config
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "avoid the need for passing explicit cloud provider credentials such as secret keys or access tokens; instead, integration objects reference a Cloud Storage service account."
      - url: https://docs.snowflake.com/en/user-guide/data-load-azure-config
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "A storage integration is a Snowflake object that stores a generated service principal for your Azure cloud storage, along with an optional set of allowed or blocked storage locations."
    notes: >-
      Graded on the core storage integrations for all three clouds. Marketplace connectors such as
      ServiceNow, and SECRET objects for external network access, are separate features not graded
      here.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://docs.snowflake.com/en/user-guide/programmatic-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "By default, a programmatic access token expires after 15 days."
      - url: https://docs.snowflake.com/en/user-guide/key-pair-auth
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "By default, the prior key remains valid for 24 hours. To change the grace period, set EXPIRE_ROTATED_KEY_PAIR_AFTER_HOURS."
    notes: >-
      PATs expire by default, and an authentication policy can force a maximum of 1 to 365 days. RSA
      key pairs never expire on their own.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.snowflake.com/en/sql-reference/sql/alter-user-rotate-key-pair
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Rotates a key pair by replacing the stored public key with a new public key supplied by the user."
      - url: https://docs.snowflake.com/en/user-guide/programmatic-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "ALTER USER IF EXISTS example_user ROTATE PROGRAMMATIC ACCESS TOKEN example_token;"
    notes: >-
      SQL commands add, rotate and remove PATs and rotate key pairs, and SQL runs over the REST API.
  scoping:
    pass: true
    evidence:
      - url: https://docs.snowflake.com/en/user-guide/programmatic-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "If you are generating a token for a service user (a user with TYPE=SERVICE, TYPE=SERVICE_AGENT, or TYPE=LEGACY_SERVICE), you must specify the ROLE_RESTRICTION parameter"
  last_used:
    pass: true
    evidence:
      - url: https://docs.snowflake.com/en/sql-reference/account-usage/login_history
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "ID of the credential used to authenticate the user (the first factor in multi-factor authentication, if used)."
    notes: >-
      LOGIN_HISTORY keeps 365 days of logins and the credential each used, so you can query for
      unused ones. The key itself has no last-used field.
  leak_revocation:
    pass: true
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Snowflake Programmatic Access Token"
    notes: >-
      GitHub reports leaked PATs and SFPG connection strings to Snowflake. Leaked RSA private keys
      are caught only by GitHub's generic private-key pattern.

notes: >-
  Grade A needs only a service user and an issuer with a public JWKS. There is no tier gate.
