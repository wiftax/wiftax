id: azure-entra-workload-identity
vendor: Microsoft Azure
product: Entra Workload ID
aliases:
  - Entra ID workload identities
  - Azure AD workload identity
  - Workload identity federation
website: https://learn.microsoft.com/en-us/entra/workload-id/
docs: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
category: cloud
status: listed
summary: >-
  Your code can log in with a token from any OIDC issuer instead of a client secret, through a
  federated identity credential. Managed identities can mint Entra-signed JWTs for other services.
  Client secrets cap at two years, and tenant policy can shorten or ban them.
surfaces:
  inbound:
    grade: A
    mechanism: >-
      A federated identity credential on an app or managed identity trusts an external OIDC issuer,
      matching issuer, subject and audience exactly. Your workload swaps that token for an Entra
      access token.
    issuers:
      - any
    evidence:
      - url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          You use workload identity federation to configure a user-assigned managed identity or app
          registration in Microsoft Entra ID to trust tokens from an external identity provider
          (IdP), such as GitHub or Google.
      - url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          The Federated Identity Credential issuer, subject, and audience values must
          case-sensitively match the corresponding issuer, subject and audience values contained in
          the token being sent to Microsoft Entra ID by the external IdP in order for the scenario
          to be authorized.
      - url: >-
          https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Issuer: must match the iss claim in the token issued by the external identity provider. A
          URL that complies with the OIDC Discovery spec. Microsoft Entra ID uses this issuer URL to
          fetch the keys that are necessary to validate the token.
      - url: >-
          https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          A maximum of 20 federated identity credentials can be added to an application or
          user-assigned managed identity.
      - url: >-
          https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-considerations
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Only issuers that provide tokens signed using the RS256 algorithm are supported for token
          exchange using workload identity federation.
    notes: >-
      Any OIDC-discoverable https issuer works. Each app or managed identity can hold 20 federated
      credentials. Each has one audience and no wildcards, so you need one per branch or
      environment. A version with claim-matching rules is in preview. Only RS256 signing is
      accepted. Mistakes are not caught on creation and only fail when the token is exchanged.
      Managed identity inside Azure does not earn the A on its own.
  outbound:
    grade: A
    mechanism: >-
      Managed identities get Entra-signed JWTs from the Azure metadata service for an audience you
      choose. Third parties verify them against your tenant's OIDC endpoint.
    evidence:
      - url: >-
          https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-use-vm-token
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Managed identities for Azure resources provide Azure services with an automatically
          managed identity in Microsoft Entra ID. You can use this identity to authenticate to any
          service that supports Microsoft Entra authentication, without having credentials in your
          code.
      - url: >-
          https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-use-vm-token
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          A query string parameter, indicating the App ID URI of the target resource. It also
          appears in the aud (audience) claim of the issued token.
      - url: >-
          https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-config-app-trust-managed-identity
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          You can then exchange the managed identity token for an access token that can access
          Microsoft Entra protected resources without needing to use or manage App secrets.
      - url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-other-clouds
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: can use managed identities to obtain Azure access tokens.
    notes: >-
      Google Cloud workload identity federation accepts these tokens, and AWS accepts them through
      an IAM OIDC provider. Two catches. The audience must be an app ID URI registered in your
      tenant, so you usually register an app for the third party. Exchanges across separate clouds,
      such as public to US Government, are not supported. Managed identities exist only on Azure
      compute that supports them.
hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Client secret lifetime is limited to two years (24 months) or less. You can't specify a
          custom lifetime longer than 24 months.
      - url: https://learn.microsoft.com/en-us/graph/api/application-addpassword
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Optional. The default value is "startDateTime + 2 years".
      - url: >-
          https://learn.microsoft.com/en-us/graph/api/resources/applicationauthenticationmethodpolicy
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          passwordLifetime | Enforce a max lifetime range for a password secret. | Restrict all new
          password secrets to a maximum of 30 days for applications created after 01/01/2015.
    notes: >-
      Every client secret has an end date, two years at most. Tenant policy can force a shorter
      lifetime or block secrets entirely, though it does not affect secrets that already exist.
  rotation_api:
    pass: true
    evidence:
      - url: https://learn.microsoft.com/en-us/graph/api/application-addpassword
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Adds a strong password or secret to an application.
      - url: https://learn.microsoft.com/en-us/graph/api/application-removepassword
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Remove a password from an application.
    notes: >-
      Microsoft Graph can add and remove secrets and certificates with start and end dates, so
      overlapping rotation is fully scriptable.
  scoping:
    pass: true
    evidence:
      - url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          A security principal is an object that represents a user, group, service principal, or
          managed identity that is requesting access to Azure resources. You can assign a role to
          any of these security principals.
      - url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          In Azure, you can specify a scope at four levels: management group, subscription, resource
          group, or resource.
    notes: >-
      A secret carries only its service principal's role assignments and app permissions. It belongs
      to a machine identity, not a person.
  last_used:
    pass: true
    evidence:
      - url: https://learn.microsoft.com/en-us/graph/api/resources/signin?view=graph-rest-beta
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          servicePrincipalCredentialKeyId | String | The unique identifier of the key credential
          used by the service principal to authenticate.
      - url: >-
          https://learn.microsoft.com/en-us/entra/identity/monitoring-health/recommendation-remove-unused-credential-from-apps
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Your tenant has applications with credentials which have not been used in more than 30
          days.
    notes: >-
      Sign-in logs record which credential was used, and a recommendation lists credentials idle for
      30 days. Some of this needs beta APIs or paid licenses, but it is shown.
  leak_revocation:
    pass: true
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: https://learn.microsoft.com/en-us/entra/id-protection/concept-workload-identity-risk
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          This risk detection indicates that the account's valid credentials leaked. This leak can
          occur when someone checks in the credentials in public code artifact on GitHub, or when
          the credentials are leaked through a data breach.
    notes: >-
      Microsoft is a GitHub secret scanning partner for app secrets. A leak raises a risk flag, but
      the secret is not revoked. Auto-blocking needs the Workload Identities Premium license.
notes: >-
  Graded on machine access to Azure Resource Manager and other Entra-protected APIs. Azure DevOps
  PATs, storage keys and SAS tokens are separate products. App certificates are long-lived too, and
  the same hygiene checks apply.
