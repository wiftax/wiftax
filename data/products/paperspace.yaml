id: paperspace
vendor: DigitalOcean
product: Paperspace
covers: "Machines, Notebooks, Deployments and Workflows, via api.paperspace.com."
website: https://www.paperspace.com
docs: https://docs.digitalocean.com/reference/paperspace/api-keys/
category: cloud
status: listed
summary: >-
  Paperspace, now part of DigitalOcean, still uses its own team API key, made by hand in the
  console. The key passes none of the five hygiene checks. Storage connections want pasted S3 keys.
  DigitalOcean's main API has its own card.
surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static team API key from the Paperspace console, sent as a bearer token. The CLIs and the
      Paperspace Deploy GitHub Action use it too.
    issuers: []
    evidence:
      - url: https://docs.digitalocean.com/reference/paperspace/api-keys/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          API keys let you interact with Paperspace through the Core RESTful API, the Core
          JavaScript SDK, and Gradient command-line utility (CLI).
      - url: https://docs.digitalocean.com/reference/paperspace/api-keys/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: On the API keys tab, enter a name and click the Add button.
      - url: https://docs.digitalocean.com/reference/paperspace/api-reference/authentication/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: An API key or access token
      - url: https://raw.githubusercontent.com/Paperspace/deploy-action/main/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          This may also be set using the `PAPERSPACE_API_KEY` environment variable.
    notes: >-
      Paperspace keys are separate from DigitalOcean tokens, with their own console and API host.
      The Deploy GitHub Action reads a static key from GitHub secrets instead of using the job's
      OIDC token. The old Core API was deprecated in July 2024, and its replacement authenticates
      the same way. None of the five hygiene checks pass, so F. Leaving F needs three of them.
      Reaching B or A needs federation.
  outbound:
    grade: B
    mechanism: >-
      Workflows connect to GitHub through a GitHub App you install. Storage, S3-compatible data
      sources and private registries take pasted keys or passwords.
    evidence:
      - url: https://docs.digitalocean.com/products/paperspace/workflows/how-to/connect-to-github-app/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Select **Connect to GitHub**, and then follow the prompts to authorize GitHub to install
          Gradient.
      - url: https://docs.digitalocean.com/products/paperspace/notebooks/how-to/add-storage-providers/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Create a bucket within your storage provider with read/write credentials, such as an
          access key and secret key, for accessing the data.
      - url: https://docs.digitalocean.com/products/paperspace/notebooks/how-to/connect-data-sources/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          If the bucket is private add an Access Key ID and Secret Access Key by choosing a
          Paperspace Secret in the drop-down.
      - url: https://docs.digitalocean.com/reference/paperspace/api-reference/storage/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: The storage provider configuration
      - url: https://docs.digitalocean.com/reference/paperspace/api-reference/container-registries/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: The password for the registry.
    notes: >-
      No AWS role, GCP impersonation or Azure federated option exists. Storage providers and private
      buckets on Spaces, S3 or GCS take a static read/write key, with no least-privilege or rotation
      guidance. Registries take a username and password. B rests only on the rubric rule that a
      GitHub App counts as keyless. Every cloud path is a pasted key, so a reviewer reading B as
      keyless on a cloud would put this at F.
hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.digitalocean.com/reference/paperspace/api-keys/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Make sure to copy your new API key now.
    notes: >-
      Creating a key asks only for a name. No expiry, default or policy is documented.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.digitalocean.com/reference/paperspace/api-keys/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: You can revoke your API keys by clicking revoke in the console.
      - url: https://docs.digitalocean.com/reference/paperspace/api-reference/teams/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Keys are created and revoked only in the console. The API has no key endpoints.
  scoping:
    pass: false
    evidence:
      - url: https://docs.digitalocean.com/reference/paperspace/api-keys/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: API Keys have team-scoped permissions and are associated with your user account.
      - url: https://docs.digitalocean.com/products/paperspace/accounts-and-teams/manage-teams/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Team admins can change the roles of other team members.
    notes: >-
      A key gets its owner's access to the whole team. There are no per-key scopes or machine
      accounts, and team roles are only member and admin.
  last_used:
    pass: false
    evidence:
      - url: https://docs.digitalocean.com/reference/paperspace/api-keys/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
      - url: https://docs.digitalocean.com/reference/paperspace/core/install/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          After the key is copied, the name of the key is available in the list of API Keys.
    notes: >-
      The key list shows names only, with no last-used time.
  leak_revocation:
    pass: false
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Paperspace is not in GitHub's secret-scanning patterns. The DigitalOcean entries cover
      DigitalOcean tokens, not Paperspace keys.
notes: >-
  Split from digitalocean-api because Paperspace keeps its own console, API host and key type. The
  DigitalOcean token's scopes, last-used view and GitHub partnership do not carry over. Retire this
  card if Paperspace moves onto DigitalOcean's API and tokens.
