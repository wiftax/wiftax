id: torq
vendor: Torq
product: Hyperautomation Platform
website: https://torq.io
docs: https://kb.torq.io/en/articles/9145827-create-a-torq-api-key-enable-programmatic-access
category: security
status: listed
summary: >-
  Your code calls the Torq API by trading a static client ID and secret for a one-hour token. There
  is no OIDC login. Outbound, AWS is keyless through an IAM role, but GCP wants a service-account
  key and Azure a client secret.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      OAuth client credentials: a static Torq client ID and secret, personal or service account,
      trade for a one-hour bearer token. There is no federation path.
    evidence:
      - url: https://learn.torq.io/apidocs/authentication
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In the request to the authentication server, provide your Torq API key, which consists of a client ID and client secret."
      - url: https://learn.torq.io/apidocs/authentication
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: 'curl POST https://auth.torq.io/v1/auth/token -H "Accept: application/json" -H "Accept-Language: en_US" -u "<CLIENT_ID>:<CLIENT_SECRET>" -d "grant_type=client_credentials"'
      - url: https://learn.torq.io/apidocs/authentication
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A bearer token is valid for one hour (3,600 seconds)."
      - url: https://learn.torq.io/apidocs/overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Torq REST API allows you to programmatically manage resources such as workflows, users, and secrets from outside the Torq platform."
      - url: https://kb.torq.io/en/articles/9145827-create-a-torq-api-key-enable-programmatic-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To incorporate Torq vendor steps in your workflows or use the Torq API, you must first create a Torq integration instance or generate a bearer token. This process requires API key credentials: a client ID and a client secret."
      - url: https://kb.torq.io/en/articles/14498016-torq-api-key-rotation-full-replacement-vs-expiration-update.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When a key is created, Torq generates a Client ID and Client Secret together, and neither value can be updated independently."
    notes: >-
      Short-lived tokens from a long-lived client secret grade C. The token endpoint documents only
      the client-credentials grant with a secret. There is no token exchange, signed-JWT or CI
      login. SSO and the Okta and Entra OIDC guides are for human login. Webhook triggers use a
      static shared-secret header. Inbound moves to B or A only if the token endpoint accepts a
      federated JWT.
  outbound:
    grade: B
    mechanism: >-
      AWS steps assume a role you create that trusts Torq with an External ID. Slack and Microsoft
      365 delegated access use Torq's apps. GCP, Azure and AWS SigV4 steps take static keys or
      secrets.
    evidence:
      - url: https://kb.torq.io/en/articles/9138309-amazon-web-services-aws.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "AWS integrations use an AWS IAM role that you define in your AWS IAM configuration."
      - url: https://kb.torq.io/en/articles/9138309-amazon-web-services-aws.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To create an IAM role in AWS, you need the Torq Workspace ID and the AWS External ID that are located in Torq."
      - url: https://kb.torq.io/en/articles/9024670-assume-different-roles-via-the-sts-assume-role-command-in-aws-cli-steps.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "STS allows a single AWS Step integration instance to be used for multiple AWS accounts, reducing the number of integration instances that need to be created."
      - url: https://kb.torq.io/en/articles/11079835-aws-sigv4-authorization-utilize-aws-calls-in-http-steps.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Via the AWS REST API integration with user access keys as SigV4 credentials"
      - url: https://kb.torq.io/en/articles/9297304-google-cloud-platform-gcp.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Save the private key for later—you will use it when creating the GCP integration in Torq."
      - url: https://kb.torq.io/en/articles/9138424-azure.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Paste the client secret you generated"
      - url: https://kb.torq.io/en/articles/10287213-microsoft-365.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Paste the Client Secret you retrieved earlier."
      - url: https://kb.torq.io/en/articles/9138305-microsoft-365-delegated-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Microsoft 365 Delegated Access integration is a Microsoft-sanctioned Enterprise app that allows users to grant Torq access to the resources that their own Microsoft 365 account can access."
      - url: https://kb.torq.io/en/articles/9138337-slack-bot.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Slack steps integration adds the Torq bot (Torq app) to your workspace, which enables you to perform common Slack actions as part of your workflows and trigger Torq workflows directly from the Slack CLI by mentioning (@) the Torq bot or sending a message directly in the Torq app channel."
      - url: https://kb.torq.io/en/articles/9138417-github.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy the key to save it for later. You will need it to set up custom secrets in Torq."
      - url: https://kb.torq.io/en/articles/9139783-okta.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API tokens inherit the same permissions as the user who creates them, and if the user permissions change, the API token permissions also change."
      - url: https://kb.torq.io/en/articles/9140088-hashicorp-vault-approle.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Ensure the secret ID you create for the role is long-lasting by setting the secret_id_num_uses and secret_id_ttl parameters to 0."
    notes: >-
      AWS steps and S3 exports use a cross-account role with a required External ID. AWS SigV4 steps
      take an IAM user key, though the same page offers a role. GCP takes an uploaded
      service-account key, with no impersonation. Azure, Microsoft 365 app-only, Defender and
      Sentinel take a client secret from an app you create. GitHub, Okta, Jira, Vault and
      CrowdStrike also take static secrets. B because AWS is keyless but GCP and Azure need static
      secrets. GCP impersonation and an Azure federated credential would lift it to A.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://kb.torq.io/en/articles/9145827-create-a-torq-api-key-enable-programmatic-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "New API keys require an expiration date at the time of creation."
      - url: https://kb.torq.io/en/articles/9145827-create-a-torq-api-key-enable-programmatic-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If any keys were previously generated without one, they will remain valid and their expiration date will be listed as"
      - url: https://learn.torq.io/apidocs/list-api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The timestamp when the API key expires."
    notes: >-
      Passes because every new key must have an expiry date, as on sentinelone-singularity. There is
      no maximum, the date can be extended, and legacy keys may still never expire.
  rotation_api:
    pass: false
    evidence:
      - url: https://learn.torq.io/apidocs/list-api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Returns a list of all API keys for the current workspace."
      - url: https://kb.torq.io/en/articles/14498016-torq-api-key-rotation-full-replacement-vs-expiration-update.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "After validation, delete the old key manually via the UI."
      - url: https://kb.torq.io/en/articles/14498016-torq-api-key-rotation-full-replacement-vs-expiration-update.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Create a Service API Key step requires the Owner role."
    notes: >-
      Judgment call. The public API can only list keys. Workflow steps can create a key and change
      an expiry, but deleting a key is manual in the UI. Shortening the old key's expiry
      approximates revocation.
  scoping:
    pass: true
    evidence:
      - url: https://kb.torq.io/en/articles/9145827-create-a-torq-api-key-enable-programmatic-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "However, they are more secure and efficient as they are not associated with any individual user."
      - url: https://kb.torq.io/en/articles/9145806-torq-roles-and-scopes-manage-access-and-permissions.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When you build a custom role or a least-privilege service API key, use this table to find the scope behind a specific action."
      - url: https://kb.torq.io/en/articles/9145827-create-a-torq-api-key-enable-programmatic-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Users own the private API keys they create."
    notes: >-
      Service API keys are machine identities with preset or custom roles, limited to chosen
      workspaces. Personal keys act as their owner.
  last_used:
    pass: true
    evidence:
      - url: https://learn.torq.io/apidocs/list-api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The timestamp when the API key was last used to generate an access token."
    notes: >-
      The list API returns the last authentication time per key, which is enough to find dead keys.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Torq is not in GitHub's secret-scanning table, and no other partner program is documented.

notes: >-
  All Torq programmatic access uses the same workspace API keys. Three of five hygiene checks pass,
  which does not change a C. Inbound moves up only with federation on the token endpoint. Outbound
  reaches A with GCP impersonation and keyless Azure.
