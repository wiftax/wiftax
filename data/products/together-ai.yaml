id: together-ai
vendor: Together AI
product: Platform
covers: Inference, fine-tuning and the GPU clusters API.
website: https://www.together.ai
docs: https://docs.together.ai/docs/api-keys-authentication
category: cloud
status: listed
summary: >-
  Every workload path into Together, from inference to the GPU cluster API and CI, runs on a static
  project API key. There is no federation for workloads. Outbound, S3 imports use presigned URLs you
  sign, but Hugging Face and W&B want pasted tokens.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static project API key created in the console, used by the API, SDKs, CLI in CI and registry
      pushes. The CLI's device login and cluster OIDC are for humans.
    issuers: []
    evidence:
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Together AI uses API keys to authenticate requests."
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Include your API key in the `Authorization` header of every API request"
      - url: https://docs.together.ai/reference/cli/getting-started.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For CI/CD, scripts, and other environments where you can't log in with a browser, authenticate with an API key instead."
      - url: https://docs.together.ai/reference/cli/auth.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Only the CLI reads your login credentials."
      - url: https://docs.together.ai/reference/whoami.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Accepts project API keys and user session JWTs."
      - url: https://docs.together.ai/docs/gpu-clusters-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The cURL and Python examples on this page authenticate with the `TOGETHER_API_KEY` environment variable."
      - url: https://docs.together.ai/docs/gpu-clusters-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}"
      - url: https://docs.together.ai/reference/cli/jig.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Push the built image to Together's registry at `registry.together.xyz`."
      - url: https://docs.together.ai/docs/cluster-oidc.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "External OpenID Connect (OIDC) lets each team member authenticate to a GPU cluster's Kubernetes API using their own identity from your organization's identity provider (IdP), such as Google, Okta, Auth0, or Microsoft Entra ID."
      - url: https://docs.together.ai/docs/cluster-oidc.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The plugin opens the user's default browser and redirects to the IdP's authorization endpoint with a PKCE challenge."
      - url: https://docs.together.ai/docs/gpu-clusters-management.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When OIDC is enabled, editors use the OIDC kubeconfig for day-to-day `kubectl` access, and project admins keep the admin kubeconfig for administrative tasks such as RBAC setup."
    notes: >-
      Graded on the weakest path a workload must use. Every control-plane and inference call takes a
      project key, and Together's GitHub Actions example stores one as a secret. The API spec
      defines only bearer auth. GPU clusters can trust your OIDC issuer for kubectl, but it is
      documented only as an interactive human login. Creating the cluster and fetching its
      kubeconfig still need the API key, so it does not lift the grade. Unlike CoreWeave CKS, the
      cluster control plane uses the same key, so there is no separate card.
  outbound:
    grade: B
    mechanism: >-
      S3 imports take a presigned URL you mint, so no credential changes hands. Hugging Face takes a
      pasted token, and W&B logging a pasted API key.
    evidence:
      - url: https://docs.together.ai/docs/dedicated-endpoints/custom-models.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For S3, pass the presigned archive URL as `--from` (no token needed):"
      - url: https://docs.together.ai/docs/dedicated-endpoints/custom-models.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The presigned URL must point to the archive file in S3 and have an expiration of at least 100 minutes."
      - url: https://docs.together.ai/docs/dedicated-endpoints/adapter.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Pass the source URL as `--from` (use `--token` for gated or private Hugging Face repos)."
      - url: https://docs.together.ai/reference/dmi/model-uploads-create.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Optional source credential used to access a private remote location."
      - url: https://docs.together.ai/docs/fine-tuning/byom.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Hugging Face repo is public, or you have an API token with read access."
      - url: https://docs.together.ai/reference/post-fine-tunes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API token for the Hugging Face Hub."
      - url: https://docs.together.ai/reference/post-fine-tunes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Integration key for tracking experiments and model metrics"
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Together creates the key in your organization's default project and sets it as the `TOGETHER_API_KEY` environment variable in the Vercel project."
    notes: >-
      Judgment call: S3 counts as keyless because Together never holds an AWS credential, only a URL
      you sign. There is no IAM role, GCS or Azure path. Hugging Face and W&B tokens come with only
      a read-access hint and no rotation guidance, which caps outbound at B. The Vercel integration
      pushes a Together key into Vercel, so Together holds no secret. Hugging Face OAuth and a W&B
      alternative would make it A. If presigned URLs do not count as keyless, this is D or F.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To make the key expire automatically, select **Set an expiration date** and choose a preset or custom date."
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To keep a key that's scheduled to expire, select **Cancel expiration** from the same menu."
    notes: >-
      Expiry is optional, can be removed later, and is advised only for temporary keys. No policy
      can force it. Compare temporal, which passes on a platform-enforced cap.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Select **Create API Key** and enter a name."
      - url: https://docs.together.ai/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Keys are created, given an expiry and revoked in the console only. Neither the API nor the CLI
      manages keys.
  scoping:
    pass: true
    evidence:
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A key created in project A can only access resources in project A."
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Keys persist even if the collaborator who created them is removed from the project."
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Anyone holding a key has full access to its project's resources and can spend your credit balance, which auto-recharge tops back up."
      - url: https://docs.together.ai/docs/roles-permissions.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Today, all project collaborators (both admins and editors) have full access to these services."
    notes: >-
      Passed narrowly. A project key belongs to the project, not a person, and reaches only that
      project. Keys have no per-key permissions, and the legacy org key cannot be scoped or revoked.
      Failing this would not change the F.
  last_used:
    pass: false
    evidence:
      - url: https://docs.together.ai/docs/billing-cost-analytics.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The cost analytics dashboard charts your daily spend or billable units, such as tokens, so you can see which products, projects, and API keys drive your usage over time."
      - url: https://docs.together.ai/docs/api-keys-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use API key IDs to segment usage and cost by key and workload."
    notes: >-
      No last-used time is documented. Cost analytics shows spend per key, not last use. Even a
      hidden last-used column would make two of five, and inbound stays F.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Together AI is not in GitHub's secret-scanning table. A leaked key works until someone revokes
      it in the console.

notes: >-
  Inference, fine-tuning, containers and the GPU clusters API all share the project key. One of five
  hygiene checks passes. Inbound moves to D with a key management API plus enforced expiry or last
  use. It reaches B or A only with a token exchange for workloads.
