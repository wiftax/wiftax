id: obsidian-security
vendor: Obsidian Security
product: Platform
website: https://www.obsidiansecurity.com
docs: https://docs.datadoghq.com/integrations/obsidian-security/
category: security
status: listed
summary: >-
  To call Obsidian's API, your code needs a static token an admin makes in the console, and partner
  docs say to set it to never expire. How Obsidian connects to your SaaS is behind a login. The one
  public setup, for Microsoft Sentinel, hands Obsidian an Entra client secret.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static API token that an admin creates in the console, sent as a bearer token to the
      regional API. No short-lived or federated path is public.
    evidence:
      - url: https://docs.datadoghq.com/integrations/obsidian-security/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Log into Obsidian Security using admin account and navigate to Settings > API access tokens."
      - url: https://docs.datadoghq.com/integrations/obsidian-security/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Expiry date: Choose Forever."
      - url: https://docs.axonius.com/docs/obsidian-security
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A Token associated with a user account that has permissions to fetch assets."
      - url: https://raw.githubusercontent.com/Obsidian-Security-Labs/obsec-codex-plugin/main/README.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "An Obsidian Security API server URL and API token for your organization."
      - url: https://raw.githubusercontent.com/Obsidian-Security-Labs/obsec-codex-plugin/main/runtime/server.mjs
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Authorization: `Bearer ${this.apiKey}`,"
    notes: >-
      Obsidian's own API docs are gated. Partner docs from Datadog and Axonius and Obsidian's public
      Codex plugin all describe the same static token and no alternative. Federation may exist
      behind the login, but with nothing public the grade stays F. A blog post mentions federation
      for Databricks Delta Sharing, but that is the Delta Sharing protocol, not an Obsidian API
      feature.
  outbound:
    grade: C
    mechanism: >-
      For the Microsoft Sentinel push, you create an Entra app and give Obsidian its client secret.
      Setup for the 200+ SaaS connectors is not public.
    evidence:
      - url: https://raw.githubusercontent.com/Azure/Azure-Sentinel/master/Solutions/Obsidian%20Datasharing/Data%20Connectors/ObsidianDatasharing_CCP/ObsidianDatasharing_ConnectorDefinition.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "It will then create an Entra application, link the DCR to it, and set the entered secret in the application. This setup enables data to be sent securely to the DCR using an Entra token."
      - url: https://raw.githubusercontent.com/Azure/Azure-Sentinel/master/Solutions/Obsidian%20Datasharing/Data%20Connectors/ObsidianDatasharing_CCP/ObsidianDatasharing_ConnectorDefinition.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "\"label\": \"Entra App Registration Secret\""
      - url: https://raw.githubusercontent.com/Azure/Azure-Sentinel/master/Solutions/Obsidian%20Datasharing/Data%20Connectors/ObsidianDatasharing_CCP/ObsidianDatasharing_ConnectorDefinition.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Permission to assign Monitoring Metrics Publisher role on data collection rule (DCR)."
      - url: https://www.obsidiansecurity.com/obsidian-integrations-hub
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Hundreds of connectors, one click away Deploy from a rich library of validated and ready-to-use integrations to secure your third-party app stack instantly."
      - url: https://www.obsidiansecurity.com/blog/obsidian-expands-connector-coverage
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Obsidian now provides visibility and security posture rules across 200+ SaaS connectors, helping teams spot drift and close gaps before a breach."
    notes: >-
      Low confidence. Sentinel is the only connector with a public setup page. There you hand
      Obsidian a client secret for an app scoped to one data collection rule. A customer-managed
      OAuth client secret is graded C under the cohort rule. Okta, Microsoft 365, Google Workspace,
      GitHub and others have only marketing pages. If gated docs show consent-based app installs for
      the core connectors, this would likely move to B. Public evidence cannot support A or B today.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.datadoghq.com/integrations/obsidian-security/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Expiry date: Choose Forever."
    notes: >-
      Tokens can take an expiry date, but "Forever" is allowed and partner guides recommend it. No
      public evidence shows an org policy that forces expiry.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.datadoghq.com/integrations/obsidian-security/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Click Create token and provide the following details:"
      - url: https://docs.axonius.com/docs/obsidian-security
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Admin permission is needed to create the API token."
    notes: >-
      Every public source creates tokens in the console, and no token API is documented. The API
      reference is gated, so one may exist unseen.
  scoping:
    pass: true
    evidence:
      - url: https://docs.datadoghq.com/integrations/obsidian-security/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Token access > Role: Choose API."
      - url: https://docs.datadoghq.com/integrations/obsidian-security/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Service access: Enable Full data access to all services and tenants."
    notes: >-
      Each token gets its own role, including a dedicated API role, and per-service and per-tenant
      access, independent of its creator. Weak pass: this comes from the Datadog guide, not
      Obsidian's own docs.
  last_used:
    pass: false
    evidence:
      - url: https://docs.datadoghq.com/integrations/obsidian-security/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Log into Obsidian Security using admin account and navigate to Settings > API access tokens."
    notes: >-
      No public source shows a last-used time. The docs are gated.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      Obsidian Security is not in GitHub's secret-scanning patterns.

notes: >-
  Graded on the Obsidian Platform API, which SIEM and SOAR tools automate against. Obsidian puts its
  docs behind a login, so every receipt comes from partner docs, its public GitHub plugin or
  marketing pages. Both grades are conservative. Published consent-based connector setup would move
  outbound to B.
