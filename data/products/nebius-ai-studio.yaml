id: nebius-ai-studio
vendor: Nebius
product: Token Factory
covers: "Inference, fine-tuning and Sandboxes APIs."
aliases:
  - AI Studio
  - Nebius AI Studio
website: https://tokenfactory.nebius.com
docs: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
category: cloud
status: listed
summary: >-
  To call Token Factory's inference or fine-tuning APIs, your code needs a static project API key
  made by hand in the web UI. Only the Sandboxes API also takes a Nebius IAM token. Fine-tuning
  pushes to Hugging Face and W&B with tokens you paste in.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static project API key from the Token Factory UI, sent as a bearer token. Only the Sandboxes
      API also accepts a Nebius IAM token.
    issuers: []
    evidence:
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In Nebius Token Factory, go to the [API keys](https://tokenfactory.nebius.com/project/api-keys) section."
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Keep your keys private; do not share or expose them in client-side code."
      - url: https://docs.tokenfactory.nebius.com/quickstart.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "api_key=os.environ.get(\"NEBIUS_API_KEY\")"
      - url: https://docs.tokenfactory.nebius.com/api-reference/fine-tuning/create-a-fine-tuning-job.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "scheme: bearer"
      - url: https://docs.tokenfactory.nebius.com/ai-models-inference/observability-api-integrations.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Issue a [static API key in Nebius Token Factory UI](https://tokenfactory.nebius.com/project/api-keys)."
      - url: https://docs.tokenfactory.nebius.com/api-reference/sandboxes/images/import-a-container-image-from-a-registry.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This is the recommended authentication scheme for new clients."
      - url: https://docs.tokenfactory.nebius.com/sandboxes/cli/commands/auth.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Supports two auth types: iam (default) — bearer token + project ID, default URL provided jwt (legacy) — bearer token only, URL must be specified"
    notes: >-
      Graded on the inference and fine-tuning API, which every workload must use. It documents only
      the API key, with no IAM token or federated path. The Sandboxes API takes a Nebius IAM token,
      which a workload could get keylessly through the federation graded A on nebius-ai-cloud. A
      side endpoint does not lift the product. Nebius IAM hints that these keys may be IAM static
      keys with a three-year cap, but no Token Factory doc says so, so it is not credited.
  outbound:
    grade: F
    mechanism: >-
      Fine-tuning exports to Hugging Face and Weights & Biases with tokens you paste. Sandboxes pull
      private images with a username and access token.
    evidence:
      - url: https://docs.tokenfactory.nebius.com/post-training/how-to-fine-tune.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Hugging Face access token (PAT) with write access to `output_repo_name`."
      - url: https://docs.tokenfactory.nebius.com/api-reference/fine-tuning/create-a-fine-tuning-job.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "title: Api Key"
      - url: https://docs.tokenfactory.nebius.com/sandboxes/mcp/tools/registry_auth.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authenticate with a container registry via Personal Access Token."
      - url: https://docs.tokenfactory.nebius.com/ai-models-inference/dedicated-endpoints/custom-weights.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "**Working with custom model weights** is currently in beta and available on request."
    notes: >-
      Every reach-in is a static token you paste. The Hugging Face guidance asks for write access to
      one repo only, which alone would be D. The W&B key and registry tokens come with no
      least-privilege guidance, so the surface is F. No cloud bucket integration is documented.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter the key name and then click **Create**."
    notes: >-
      Creating a key asks only for a name. No expiry or org policy is documented, and the API keys
      page is behind a login.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.tokenfactory.nebius.com/sandboxes/start/set-up-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The value cannot be opened again later."
    notes: >-
      Keys are created and deleted only in the UI. The API reference has no key endpoints.
  scoping:
    pass: false
    evidence:
      - url: https://docs.tokenfactory.nebius.com/team-access/groups.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "| **API Keys** | Create, Delete | Create, Delete own API keys |"
      - url: https://docs.tokenfactory.nebius.com/team-access/org-projects.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A **project** is a logical container for your Nebius Token Factory resources."
    notes: >-
      A key lives in one project, but project members get full access to every project API. No
      narrower service account is documented.
  last_used:
    pass: false
    evidence:
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No last-used time is documented. The API keys page is behind a login.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If a key is compromised, Nebius Token Factory can automatically revoke it"
    notes: >-
      Nebius is not in GitHub's secret-scanning table. The docs mention automatic revocation but
      name no scanning program, so it fails under the Partner-column rule.

notes: >-
  Split from nebius-ai-cloud because Token Factory has its own UI, projects and API keys. The API
  keys page is login-walled, but outbound is F either way, so the headline would not move. Accepting
  Nebius IAM tokens on inference and fine-tuning would lift inbound to the AI Cloud grade.
