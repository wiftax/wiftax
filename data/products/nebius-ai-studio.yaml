id: nebius-ai-studio
vendor: Nebius
product: Nebius Token Factory (formerly AI Studio) inference, fine-tuning and Sandboxes API
website: https://tokenfactory.nebius.com
docs: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
category: cloud
status: listed
summary: >-
  Token Factory's OpenAI-compatible inference, fine-tuning, batch and dedicated-endpoint APIs take
  a static project API key created by hand in the web UI; no expiry, rotation API, last-used view
  or GitHub partner revocation is documented. Only the Sandboxes API also takes a Nebius IAM token.
  Fine-tuning pushes to Hugging Face and W&B with tokens you paste in.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      Static API key created on the project's API keys page in the Token Factory UI and sent as
      Authorization: Bearer (NEBIUS_API_KEY) to the inference, fine-tuning, files, batch,
      datasets and dedicated-endpoint APIs and to Prometheus metrics scraping. The Sandboxes API
      alone documents a Nebius IAM bearer token plus Project header as its recommended scheme.
    issuers: []
    evidence:
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In Nebius Token Factory, go to the [API keys](https://tokenfactory.nebius.com/project/api-keys) section."
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Keep your keys private; do not share or expose them in client-side code."
      - url: https://docs.tokenfactory.nebius.com/quickstart.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "api_key=os.environ.get(\"NEBIUS_API_KEY\")"
      - url: https://docs.tokenfactory.nebius.com/api-reference/fine-tuning/create-a-fine-tuning-job.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "scheme: bearer"
      - url: https://docs.tokenfactory.nebius.com/ai-models-inference/observability-api-integrations.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Issue a [static API key in Nebius Token Factory UI](https://tokenfactory.nebius.com/project/api-keys)."
      - url: https://docs.tokenfactory.nebius.com/api-reference/sandboxes/images/import-a-container-image-from-a-registry.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This is the recommended authentication scheme for new clients."
      - url: https://docs.tokenfactory.nebius.com/sandboxes/cli/commands/auth.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Supports two auth types: iam (default) — bearer token + project ID, default URL provided jwt (legacy) — bearer token only, URL must be specified"
    notes: >-
      Graded on the inference and fine-tuning API, the path every workload must use. Its OpenAPI
      security scheme is a plain HTTP bearer and every guide uses NEBIUS_API_KEY; no Nebius IAM
      token, service-account or federated path is documented for it. The Sandboxes API is the
      exception: it takes a Nebius IAM token, which a workload could obtain keylessly through the
      federated credentials graded A on nebius-ai-cloud, but a side endpoint does not lift the
      product. The Nebius IAM StaticKey enum has an AI_STUDIO service, which hints that Token
      Factory keys are IAM static keys (six-month default, three-year cap); that is not stated in
      any Token Factory doc and is not credited. If Token Factory documented IAM-token auth for
      inference, this card would inherit the AI Cloud grade.
  outbound:
    grade: F
    mechanism: >-
      Fine-tuning jobs export to Hugging Face with a pasted HF access token and to Weights & Biases
      with a pasted W&B API key; Sandboxes import images from private registries with a username
      and personal access token.
    evidence:
      - url: https://docs.tokenfactory.nebius.com/post-training/how-to-fine-tune.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Hugging Face access token (PAT) with write access to `output_repo_name`."
      - url: https://docs.tokenfactory.nebius.com/api-reference/fine-tuning/create-a-fine-tuning-job.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "title: Api Key"
      - url: https://docs.tokenfactory.nebius.com/sandboxes/mcp/tools/registry_auth.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authenticate with a container registry via Personal Access Token."
      - url: https://docs.tokenfactory.nebius.com/ai-models-inference/dedicated-endpoints/custom-weights.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "**Working with custom model weights** is currently in beta and available on request."
    notes: >-
      Checked: fine-tuning integrations (wandb, mlflow, hf), Sandboxes image import from Docker
      Hub, GHCR and other registries, custom model weights (beta, support-enabled, no public auth
      details) and dataset upload (pushed in by you, inbound). Every reach-in is a static token
      you paste. The Hugging Face guidance asks for write access to the one output repo, which on
      its own would be D; the W&B API key and registry PATs come with no least-privilege
      guidance, so the surface is F. No cloud bucket integration is documented.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter the key name and then click **Create**."
    notes: >-
      The documented create flow asks only for a name. No expiry, default lifetime or org policy
      is documented for Token Factory API keys; the API keys page itself is behind a login.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.tokenfactory.nebius.com/sandboxes/start/set-up-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The value cannot be opened again later."
    notes: >-
      Keys are created and deleted in the Token Factory UI; the API reference (models,
      completions, files, fine-tuning, batch, datasets, endpoints, Sandboxes) has no key
      endpoints.
  scoping:
    pass: false
    evidence:
      - url: https://docs.tokenfactory.nebius.com/team-access/groups.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "| **API Keys** | Create, Delete | Create, Delete own API keys |"
      - url: https://docs.tokenfactory.nebius.com/team-access/org-projects.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A **project** is a logical container for your Nebius Token Factory resources."
    notes: >-
      A key lives in one project, but project Members have full access to every project API, so
      a key is the creating user's project access. The groups page mentions service accounts in
      passing; no way to create one or give it a narrower role is documented in Token Factory.
  last_used:
    pass: false
    evidence:
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: No last-used timestamp is documented; the API keys page is behind a login.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
      - url: https://docs.tokenfactory.nebius.com/api-reference/introduction.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If a key is compromised, Nebius Token Factory can automatically revoke it"
    notes: >-
      Nebius does not appear in GitHub's secret-scanning patterns table. The docs say compromised
      keys can be revoked automatically but name no scanning programme, so it fails per the
      Partner-column precedent.

notes: >-
  Split from nebius-ai-cloud because Token Factory runs its own UI, projects and API keys rather
  than Nebius AI Cloud IAM; only its Sandboxes API shares the IAM token. Zero of five hygiene
  checks pass on public docs. The API keys page is login-walled, but outbound is F regardless, so
  the headline would not move. Accepting Nebius IAM tokens (and so federated credentials) on the
  inference and fine-tuning API would lift inbound to the AI Cloud grade.
