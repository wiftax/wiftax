id: sola-security
vendor: Sola Security
product: Platform
covers: SaaS and cloud security posture.
website: https://sola.security
docs: https://docs.sola.security/getting-started/sola-ai/sola-mcp.md
category: security
status: listed
summary: >-
  Sola has no API keys or public REST API. The only programmatic access is an MCP server behind an
  interactive OAuth login, so headless workloads have nothing to federate with. Outbound is keyless
  for AWS, GitHub and Slack, but GCP, Azure and Okta need long-lived secrets.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      An MCP server that a person logs into with OAuth. There is no API key, service account or
      federation, so unattended use would hold that login's long-lived grant.
    evidence:
      - url: https://docs.sola.security/getting-started/sola-ai/sola-mcp.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "To connect your client, follow the steps below for your tool. When you connect, you'll be prompted to log in to Sola, or create a new account if you don't have one yet."
      - url: https://docs.sola.security/getting-started/sola-ai/sola-mcp.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Start a Claude session using the `claude` command and run `/mcp` to authenticate."
      - url: https://docs.sola.security/getting-started/sola-ai/sola-mcp.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Sola MCP server provides read-only access to your Sola workspace, including your connected data sources, projects, queries, and vendor tables. Your data can never be modified through the MCP. Access is scoped to the workspace the token was generated in."
      - url: https://api.sola.security/.well-known/oauth-authorization-server
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: '"issuer":"https://auth.sola.security","authorization_endpoint":"https://auth.sola.security/oauth/authorize","token_endpoint":"https://auth.sola.security/oauth/token","response_types_supported":["code"],"grant_types_supported":["authorization_code","client_credentials"],"code_challenge_methods_supported":["S256"]'
      - url: https://docs.sola.security/llms.txt
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "[Sola MCP](https://docs.sola.security/getting-started/sola-ai/sola-mcp.md): Bring your full security environment into any AI assistant"
    notes: >-
      Sola's public docs list no REST API, API keys or service accounts, and its docs assistant
      confirmed this. The OAuth metadata advertises a client-credentials grant, but nothing says how
      to get a client, so it is not graded. Graded C because unattended use would rest on a stored
      long-lived grant tied to a person. No outside OIDC, cloud or CI identity is accepted. A strict
      reader could argue F. Someone with a customer login should check for API keys behind it.
  outbound:
    grade: B
    mechanism: >-
      Keyless for AWS through an IAM role, and for GitHub and Slack through Sola's apps. GCP, Google
      Workspace, Azure, Entra ID, Okta and Salesforce want long-lived keys or secrets.
    evidence:
      - url: https://docs.sola.security/integrations/data-sources/aws.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Recommended for secure, production environments. These methods use an IAM role delegation within your account to securely grant Sola read-only access to your AWS services and resources."
      - url: https://docs.sola.security/integrations/data-sources/aws.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Create an access key pair from within your AWS Management Console. Your IAM user must have at least SecurityAudit permissions on all AWS services."
      - url: https://docs.sola.security/integrations/data-sources/gcp.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "**Creating service account key** - Temporarily disables the `iam.disableServiceAccountKeyCreation` org policy, waits for propagation, creates the key, then re-enables the policy"
      - url: https://docs.sola.security/integrations/data-sources/azure.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The service principal client secret was created but returned an empty value."
      - url: https://docs.sola.security/integrations/data-sources/entra-id.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "To connect Entra ID, you’ll need a Microsoft Entra ID account with the necessary permissions to create and configure an App Registration."
      - url: https://docs.sola.security/integrations/data-sources/google-workspace.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "**Creating service account key** - Creates a service account key"
      - url: https://docs.sola.security/integrations/data-sources/okta.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "This method uses an [API token](https://help.okta.com/en-us/content/topics/security/api.htm?cshid=ext-create-api-token#create-okta-api-token) to securely grant Sola read-only access to your Okta services and resources."
      - url: https://docs.sola.security/integrations/data-sources/github.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "This method leverages a GitHub App to grant Sola temporary, permissioned access to your GitHub resources, at either the repository or organization level, based on your choice. It minimizes risks associated with personal tokens and long-term credentials by enforcing strict, scoped access."
      - url: https://docs.sola.security/integrations/data-sources/slack.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Install Sola's Slack App to securely and easily grant access to your organization's Slack workspace."
      - url: https://docs.sola.security/integrations/data-sources/salesforce.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Paste the **Consumer Key**, the **Consumer Secret**, and your **Salesforce URL** in the Sola wizard."
    notes: >-
      AWS uses an IAM role, though the public page does not mention an External ID. GitHub and Slack
      use Sola's own apps. Static keys are also offered for all three. GCP and Google Workspace need
      a service account key, and the GCP script briefly disables the org policy that blocks key
      creation. Azure and Entra ID use a client secret on an app in your tenant, not consent to a
      Sola app. Okta wants an API token and Salesforce a client secret. Two of three clouds want
      keys, so this is a weak B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.sola.security/getting-started/sola-ai/sola-mcp.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Access is scoped to the workspace the token was generated in."
    notes: >-
      Sola documents no customer-managed credential and no token lifetime, so no expiry policy can
      be shown.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.sola.security/getting-started/sola-ai/sola-mcp.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Run read-only SQL queries directly against your project data source tables."
    notes: >-
      The read-only MCP is the only documented surface. No API creates or revokes credentials.
  scoping:
    pass: false
    evidence:
      - url: https://docs.sola.security/getting-started/sola-ai/sola-mcp.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "MCP actions on a project are limited by your role on that project. For example, if you have Viewer access on an project, Execute SQL Query will fail for that project."
    notes: >-
      The MCP is read-only and tied to one workspace, but the token carries the logged-in person's
      role. There is no machine identity.
  last_used:
    pass: false
    evidence:
      - url: https://docs.sola.security/system-management/settings.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "View and manage the settings for your Sola user, workspaces and projects"
    notes: >-
      The settings docs show no list of tokens or clients with last-used times.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Supported secret scanning patterns"
    notes: >-
      Sola is not in GitHub's secret-scanning pattern list.

notes: >-
  Sola's docs are public but cover only the UI, data sources and MCP. Anything behind the app login,
  such as an API-key screen, could not be checked. Outbound reaches A if GCP, Workspace, Azure and
  Entra ID move to Sola-owned identities or consent, and Okta to an OIN service app.
