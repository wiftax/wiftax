id: cyberark-conjur-cloud
vendor: CyberArk
product: Secrets Manager SaaS
parent: Palo Alto Networks
aliases:
  - Conjur Cloud
  - Conjur
website: https://www.cyberark.com/products/secrets-manager-saas/
docs: https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/authn/authn-config.htm
category: security
status: listed
summary: >-
  Workloads log in to Secrets Manager SaaS (Conjur Cloud) with a JWT from any issuer you configure,
  or with an AWS, Azure or GCP identity. No API key is needed. Dynamic secrets into AWS and GCP need
  a stored IAM user key or service account key.
surfaces:
  inbound:
    grade: A
    mechanism: >-
      A JWT authenticator checks tokens against a JWKS URL or pinned keys you set, with optional
      issuer, audience and claim checks, and returns an 8-minute token. Cloud identities also work.
    issuers:
      - any
    evidence:
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/services/cjr-authn-jwt-cloud.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/services/cjr-authn-jwt-appid.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/services/cjr-authn-jwt-github-uc.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/services/cjr-authn-jwt-uc.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/authn/authn-config.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/conjurcloud/ccl-delegate-privileges-host-ex.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/authn/authenticate-awsiam-overview.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/authn/authenticate-azure-overview.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/conjurcloud/ccl-authentication.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/integrations/terraform_provider.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
    notes: >-
      The JWT authenticator takes any issuer. GitHub Actions and GitLab are presets of the same
      form, and pinned keys cover issuers it cannot reach. Every workload must bind at least one
      claim, so trust can be pinned to issuer, audience and subject. The weakest required path is
      not a static key. Policy, secret and authenticator APIs all take the short-lived token, and a
      workload can create authenticators. API keys are an opt-in fallback. The platform's own APIs
      are graded on cyberark-identity-platform. Every cited page returned 404 on 2026-11-09. The
      grade is held pending a human search for the relocated documentation.
  outbound:
    grade: D
    mechanism: >-
      Dynamic-secret issuers use a stored AWS IAM user key, a GCP service account key, or a
      Certificate Manager username and password, kept as Secrets Manager secrets.
    evidence:
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/dynamic-secrets-aws.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/dynamic-secrets-gcp.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/developer/conjur_api_issuer-ephemerals.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/conjur-cloud/venafi-cert-issuer.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
    notes: >-
      Every reach-in wants a long-lived key, with no role trust or impersonation option for issuers.
      It earns D, not F, because CyberArk documents the exact permission needed, a policy can narrow
      each secret, and PAM can rotate the key. Secrets Hub syncs into clouds keylessly, but only
      from PAM, so it is graded on cyberark-identity-platform. Secure Workload Access lets your
      workloads federate out, but Secrets Manager does not use it to reach in. Keyless issuers would
      make this A. Every cited page returned 404 on 2026-11-09. The grade is held pending a human
      search for the relocated documentation.
hygiene:
  expiry:
    pass: false
    evidence:
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/authn/authn-default.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/policy/statement-ref-host.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
    notes: >-
      Host API keys have no expiry and no tenant policy caps them. Host Factory tokens expire, but
      they enroll hosts and are not a host's own credential. Both cited pages returned 404 on
      2026-11-09. The receipts are missing and a replacement page has not been located.
  rotation_api:
    pass: true
    evidence:
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/developer/conjur_api_rotate_other_api_key.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/policy/statement-ref-host.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/privilege-cloud-shared-services/latest/en/content/pasimp/plugin-conjur-cloud-keys.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
    notes: >-
      The API rotates a host's key, and policy creates or removes it. Privilege Cloud can also
      rotate host keys on a schedule. All three cited pages returned 404 on 2026-11-09. The check is
      held pending a human search for the relocated documentation.
  scoping:
    pass: true
    evidence:
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/conjurcloud/ccl-authentication.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/operations/authn/authn-default.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
    notes: >-
      Each key belongs to a host, a workload identity that holds only the privileges policy grants
      it. Both cited pages returned 404 on 2026-11-09. The check is held pending a human search for
      the relocated documentation.
  last_used:
    pass: false
    evidence:
      - url: >-
          https://docs.cyberark.com/conjur-cloud/latest/en/content/developer/conjur_api_show_role.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: https://docs.cyberark.com/conjur-cloud/latest/en/content/conjurcloud/ccl-audit-lp.htm
        checked_on: 2026-11-09
        checked_by: sisyphus
    notes: >-
      Hosts and their keys show no last-used time. Finding dead keys means mining the audit service.
      Both cited pages returned 404 on 2026-11-09. The receipts are missing.
  leak_revocation:
    pass: false
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      CyberArk and Conjur are not in GitHub's secret-scanning table. Conjur keys have no prefix,
      which makes them hard to detect.
notes: >-
  Renamed from Conjur Cloud to Secrets Manager SaaS. Doc URLs still say conjur-cloud. Self-hosted
  Conjur is not graded here. Hygiene applies to host API keys, which exist only if a workload opts
  in. Outbound sets the headline. Keyless AWS and GCP issuers would make this an A card. On
  2026-11-09 every cited docs.cyberark.com page returned 404, which suggests the documentation site
  was restructured rather than that any mechanism changed. No grade was moved on the strength of a
  404.
