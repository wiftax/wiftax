id: orca-security
vendor: Orca Security
product: Cloud Security Platform
aliases: ["Orca"]
website: https://orca.security
docs: https://docs.orcasecurity.io/docs/managing-api-tokens
category: security
status: listed
confidence:
  level: low
  reason: >-
    Orca's docs are behind a login. Token hygiene comes from third-party guides, the rotation and
    last-used checks fail as unverifiable, and Azure, GCP and OCI onboarding are unverified.
summary: >-
  To call the Orca API, MCP server, Terraform or CI actions, your code needs a static API token.
  Orca reaches AWS and Alibaba by cross-account role, but Snyk, Cloudflare and other integrations
  want static secrets.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static API token with a role and scope, sent directly to the API, MCP server, Terraform and
      GitHub Actions. OAuth exists only as a browser login for MCP.
    evidence:
      - url: https://orca.security/mcp-server/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API token: For automated pipelines and services that can't use browser-based authentication."
      - url: https://orca.security/mcp-server/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "OAuth 2.0: Recommended for interactive use. Your client handles the browser flow automatically"
      - url: https://raw.githubusercontent.com/orcasecurity/orca-skills/main/.mcp.json.template
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"Authorization": "Token YOUR_ORCA_API_TOKEN_HERE"'
      - url: https://raw.githubusercontent.com/orcasecurity/terraform-provider-orcasecurity/master/docs/index.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "It is required to configure at least two configuration options: api_endpoint and api_token."
      - url: https://raw.githubusercontent.com/orcasecurity/shiftleft-iac-action/main/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}"
      - url: https://raw.githubusercontent.com/orcasecurity/orca-skills/main/plugins/security-engineer/skills/lib/orca_client.py
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Token: ORCA_API_TOKEN env var (base64 token string from Orca config)"
      - url: https://truto.one/integrations/detail/orcasecurity/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use this endpoint to create a new user session by providing a valid security_token."
    notes: >-
      Orca's docs are behind a login, so this card relies on Orca's public repos and third-party
      guides. Every automation path sends the long-lived token itself. A session endpoint can trade
      it for a session, but Terraform, MCP and the CI actions take the raw token. So this is graded
      as a static key, not C. No OIDC or workload identity is documented, and Orca's own actions
      store the token in GitHub Secrets.
  outbound:
    grade: B
    mechanism: >-
      AWS onboarding creates a role trusting Orca's account with an External ID, and Alibaba uses a
      RAM role. Snyk, Cloudflare, Akamai, Zscaler and Terraform Cloud want static tokens or secrets.
    evidence:
      - url: https://orca.security/lp/aws-activate/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Simply log into your AWS account and provision Orca with cross-account read-only access."
      - url: https://orca.security/lp/aws-activate/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Add the role ARN, and you’re done!"
      - url: https://raw.githubusercontent.com/hisashiyamaguchi/note-orca-security-aws-onboarding/main/globalDefaultPolicy.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"AWS": "arn:aws:iam::976280145156:root"'
      - url: https://raw.githubusercontent.com/hisashiyamaguchi/note-orca-security-aws-onboarding/main/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "contact Orca representative - he/she can give your external_id"
      - url: https://orca.security/partners/technology/alibaba-cloud/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Simply log into your Alibaba Cloud account and provision Orca with cross-account read-only access."
      - url: https://orca.security/partners/technology/alibaba-cloud/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "An embedded RAM Role and Policy template provisions everything required."
      - url: https://orca.security/partners/technology/oracle-cloud-infrastructure/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Simply log into your Oracle Cloud account and provision Orca with cross-account read-only access."
      - url: https://orca.security/resources/video/azure-onboarding/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Walkthrough of how to onboard an Azure account for Orca to SideScan."
      - url: https://orca.security/resources/video/gcp-onboarding/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Walkthrough of how to onboard a GCP account for Orca to SideScan."
      - url: https://raw.githubusercontent.com/orcasecurity/terraform-provider-orcasecurity/master/docs/data-sources/integration_s3_bucket_policy.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Renders the bucket policy that Orca's S3 uploader role needs in order to write"
      - url: https://raw.githubusercontent.com/orcasecurity/terraform-provider-orcasecurity/master/docs/resources/integration_snyk.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`api_token` — (Required, String, Sensitive) Snyk service account API token."
      - url: https://raw.githubusercontent.com/orcasecurity/terraform-provider-orcasecurity/master/docs/resources/integration_cloudflare.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`api_token` — (Required, String, Sensitive) Cloudflare API token."
      - url: https://raw.githubusercontent.com/orcasecurity/terraform-provider-orcasecurity/master/docs/resources/integration_akamai.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Orca uses Akamai EdgeGrid credentials"
      - url: https://raw.githubusercontent.com/orcasecurity/terraform-provider-orcasecurity/master/docs/resources/integration_zscaler_zpa.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The OAuth `client_id` and `client_secret` are"
      - url: https://raw.githubusercontent.com/orcasecurity/terraform-provider-orcasecurity/master/docs/resources/integration_terraform_cloud.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`api_token` — (Required, String, Sensitive) Terraform Cloud service-account"
    notes: >-
      AWS is keyless, per a public copy of Orca's CloudFormation template. Alibaba is keyless per
      Orca's page. Azure, GCP and OCI onboarding are not publicly documented. B rests on AWS and
      Alibaba being keyless while Snyk, Cloudflare, Akamai and Terraform Cloud want static tokens
      and Zscaler ZPA a client secret. If Azure or GCP take keys, it stays B. A needs every
      integration keyless. Ticketing and alert targets were not counted.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://support.expel.io/hc/en-us/articles/19321075551763
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Never Expire - select this checkbox."
      - url: https://help.vanta.com/en/articles/11345793-connecting-vanta-orca-security
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "We want to set the expiration date as not setting any is a security concern."
      - url: https://docs.observeinc.com/docs/install-the-orca-security-app
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Name the new API token, for example, Observe-Lambda-Token, and select a desired expiration date."
    notes: >-
      Tokens can expire, but a "Never Expire" checkbox exists and no public policy forbids it. Same
      call as elastic-cloud-api.
  rotation_api:
    pass: false
    evidence:
      - url: https://truto.one/integrations/detail/orcasecurity/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use this endpoint to retrieve a list of active authentication tokens associated with your Orca Security account."
      - url: https://raw.githubusercontent.com/orcasecurity/terraform-provider-orcasecurity/master/docs/resources/custom_role.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"auth.tokens.write"'
    notes: >-
      No public source documents creating or revoking tokens by API, and every guide uses the
      console. A citable endpoint would pass this.
  scoping:
    pass: true
    evidence:
      - url: https://support.expel.io/hc/en-us/articles/19321075551763
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service Token - select this checkbox (to prevent the token expiring with a user account)."
      - url: https://help.vanta.com/en/articles/11345793-connecting-vanta-orca-security
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Leave the Scope access to specific resources checkbox unchecked."
      - url: https://explained.tines.com/en/articles/8227139-orca-security-authentication-guide
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Determine the expiration date, role, and scope you wish to apply"
    notes: >-
      Each token takes its own role and can be limited to specific resources. Service Tokens are not
      tied to a user, which counts as a machine identity.
  last_used:
    pass: false
    evidence:
      - url: https://truto.one/integrations/detail/orcasecurity/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use this endpoint to retrieve a list of active authentication tokens associated with your Orca Security account."
    notes: >-
      No public source shows a last-used time. The gated docs may, and a public citation would flip
      this.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Orca is not in GitHub's secret-scanning table, so leaked tokens are not reported to Orca.

notes: >-
  One card for the Orca platform, whose products share one token model. Only scoping passes, so
  inbound is F. A token API, a last-used field and a lifetime cap would lift it to D. B or A needs a
  federated login. Reviewer check: the AWS template evidence is a third-party copy.
