id: beyondtrust-password-safe
vendor: BeyondTrust
product: Password Safe
covers: Password Safe Cloud and Pathfinder, via the public API.
aliases:
  - Password Safe Cloud
  - Pathfinder
website: https://www.beyondtrust.com
docs: https://docs.beyondtrust.com/bips/docs/ps-cloud-configure-api-registration
category: security
status: listed
summary: >-
  To call the Password Safe API, your code needs an OAuth client secret swapped for short-lived
  tokens, or a static API key. Password Safe has no federated login. To manage your clouds, it needs
  a static AWS key, Azure client secret or GCP key file.
surfaces:
  inbound:
    grade: C
    mechanism: >-
      An application user's OAuth client ID and secret buy a short-lived bearer token. The older
      path is a static API key plus a RunAs user name, restricted by required source-IP rules.
    evidence:
      - url: https://docs.beyondtrust.com/bips/docs/ps-cloud-configure-api-registration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          These Application Users are limited to interacting with the public API and authenticate
          using the OAuth client credential flow.
      - url: https://docs.beyondtrust.com/bips/docs/ps-cloud-configure-api-registration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          They can only authenticate and interact with the public API, using Client ID and Client
          Secret for credentials within the OAuth client credential flow.
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-auth-connect-token
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Request format:
          grant_type=client_credentials&client_id=[user-client-id]&client_secret=[user-client-secret]
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-apiregistrations
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Token duration in minutes. Only applicable when RegistrationType is "apiaccesspolicy"
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-auth-signappin
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: key - the API key configured in BeyondInsight for your application
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-auth-signappin
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          No directory password is verified on this path; the API key and RunAs user identify the
          caller
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-auth-signappin
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Supported user types: Application, Local, Active Directory, Microsoft Entra ID, and LDAP"
      - url: https://docs.beyondtrust.com/bips/docs/pathfinder-general
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Client Certificate Required: When enabled, a client certificate is required with the web
          request, and if not enabled, client certificates are ignored and do not need to be
          present.
      - url: https://docs.beyondtrust.com/bips/docs/ps-cloud-configure-api-registration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          At least one IP rule or PSRUN rule is required, providing a valid source IP address (IPv4
          or IPv6), an IP range, or CIDR from which requests can be sent for this API key
      - url: https://docs.beyondtrust.com/bt-docs/docs/workload-identities
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          A workload identity lets an automated workload, such as a CI/CD pipeline, cloud service,
          or script, authenticate to BeyondTrust without a stored secret or API key.
      - url: https://docs.beyondtrust.com/bt-docs/docs/wlc-api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: The API uses JWT Bearer Token or Personal Access Tokens (PATs) authentication.
      - url: https://www.beyondtrust.com/products/workload-credentials
        checked_on: 2026-11-09
        checked_by: sisyphus
      - url: https://docs.beyondtrust.com/bt-docs/reference
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Authenticate each request with a personal access token (PAT) that belongs to an
          organization administrator.
    notes: >-
      The public API is the only way to automate Password Safe Cloud and Password Safe on
      Pathfinder. Neither of its login paths accepts an external OIDC token, so the best path is a
      client secret swapped for a short-lived token, which is C. IP rules and an optional client
      certificate add checks but not federation. Pathfinder has real bring-your-own-issuer OIDC, but
      only for Workload Credentials, a separate product. No doc says the Password Safe API accepts
      that token. If it did, inbound would move to A on Pathfinder only.
  outbound:
    grade: D
    mechanism: >-
      Cloud discovery and account management take a static AWS access key, an Azure client secret or
      a Google service account key file. Least-privilege permissions are documented for each.
    evidence:
      - url: https://docs.beyondtrust.com/bips/docs/bi-cloud-config
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          For AWS cloud connections, required fields are: Region, Access Key ID, and Secret Access
          Key ID.
      - url: https://docs.beyondtrust.com/bips/docs/bi-cloud-config
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          For Azure, required fields are: Region, Client ID, Client Server, Tenant ID, and
          Subscription ID.
      - url: https://docs.beyondtrust.com/bips/docs/bi-cloud-config
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          For Google Cloud, required fields are Server (the region), Project Name (the project ID),
          and the Key File.
      - url: https://docs.beyondtrust.com/bips/docs/bi-cloud-config
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: The ARN and External Name fields are for granting access to a third party.
      - url: https://docs.beyondtrust.com/bips/docs/discovery-configure-bi-cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: User accounts must have minimal permissions assigned (for example, describe instances).
      - url: https://docs.beyondtrust.com/bips/docs/discovery-configure-bi-cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          The key file is not required if your BeyondInsight server is hosted on your Google cloud
          instance.
      - url: https://docs.beyondtrust.com/bips/docs/bi-cloud-configure-entra-id
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Enter the previously saved values for the Application (Client) ID, Tenant ID, and Client
          Secret.
      - url: https://docs.beyondtrust.com/bips/docs/ps-google
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Create and download a key file for your service account. The key file must be in JSON
          format.
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-users
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: The client credential (EntraID user type only)
      - url: https://docs.beyondtrust.com/bt-docs/docs/wlc-on-pathfinder
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: A window displays showing the external ID associated with this connector.
    notes: >-
      Every cloud connection needs a long-lived secret. AWS still requires an access key and secret.
      GCP needs a key file except for self-hosted installs on GCP, which does not apply to the SaaS.
      The Entra client secret would be C alone, but AWS and GCP pull the surface down to static
      keys. Each comes with a minimal permission list, so D, not F. No rotation guidance was found.
      The sibling Workload Credentials product reaches AWS through a role with an External ID, which
      shows the gap.
hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.beyondtrust.com/bips/docs/ps-cloud-configure-api-registration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Once the key has been changed, any script using the old key receives a "401 Unauthorized"
          error until the new key is used in its place.
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-apiregistrations
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Can be either "apikeypolicy" or "apiaccesspolicy"
      - url: https://docs.beyondtrust.com/bips/docs/ps-cloud-configure-api-registration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: The default duration of a client secret is 365 days.
    notes: >-
      Graded on the weaker credential. API keys have no expiry and fail. OAuth client secrets expire
      after 365 days by default. Same handling as the twilio-api card.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-apiregistrations-id-rotate
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Rotates the key for an API Key Policy registration.
      - url: >-
          https://docs.beyondtrust.com/bips/reference/post-api-public-v3-users-id-recycleclientsecret
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: New OAuth secret generated successfully
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-apiregistrations
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Creates a new API registration for client application integration.
    notes: >-
      API calls rotate both API keys and client secrets. Registrations and users can also be created
      and deleted through the API.
  scoping:
    pass: true
    evidence:
      - url: https://docs.beyondtrust.com/bips/docs/ps-cloud-configure-api-registration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Application Users are service accounts that represent any non-human identity that needs
          access to secrets and credentials.
      - url: https://docs.beyondtrust.com/bips/docs/ps-cloud-configure-api-registration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Assign the user to a group that has the required permissions to access BeyondInsight and
          Password Safe features.
      - url: https://docs.beyondtrust.com/bips/reference/post-api-public-v3-auth-signappin
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          A user group to which the user belongs must be granted access to the API key given in
          authorization header
    notes: >-
      Application users are machine identities that cannot sign in to the console and get only their
      groups' permissions. An API key acts as its RunAs user, possibly a person, but is limited to
      certain groups and source IPs.
  last_used:
    pass: false
    evidence:
      - url: https://docs.beyondtrust.com/bips/reference/get-api-public-v3-users-id
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Get a specific user by their unique identifier with last login information.
      - url: https://docs.beyondtrust.com/bips/docs/ps-cloud-configure-api-registration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Read access and rotation of the key is audited.
    notes: >-
      No last-used time is shown for API keys or client secrets. User sign-in records do not help,
      because an API key acts as whichever user it names.
  leak_revocation:
    pass: false
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      BeyondTrust is not in GitHub's secret scanning list, so leaked keys or secrets are not
      reported for revocation.
notes: >-
  Covers Password Safe Cloud, Pathfinder and self-hosted, which share one public API. Workload
  Credentials and other sibling products are not graded here. Inbound moves to A if Pathfinder's
  OIDC exchange works for the Password Safe API. Outbound moves up with role-based AWS and federated
  Azure and GCP connectors.
