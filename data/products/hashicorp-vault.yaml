id: hashicorp-vault
vendor: HashiCorp
product: Vault
covers: Self-managed Vault and HCP Vault Dedicated.
aliases:
  - HCP Vault Dedicated
  - HCP Vault
website: https://www.hashicorp.com/products/vault
docs: https://developer.hashicorp.com/vault/docs/auth
category: security
status: listed
summary: >-
  Vault's JWT/OIDC login trusts any issuer you configure, so your code needs no static Vault
  credential. Outbound, the AWS, GCP and Azure engines can run keyless, but only on Vault Enterprise
  or HCP. Other engines still want a static root credential that Vault can rotate.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      The JWT/OIDC auth method accepts tokens from any issuer and checks audience, subject and
      claims per role. Native AWS, GCP, Azure and Kubernetes logins also exist.
    issuers: ["any"]
    evidence:
      - url: https://developer.hashicorp.com/vault/docs/auth/jwt
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "An OIDC Discovery URL and optional certificate chain is configured. Keys will be fetched from this URL during authentication."
      - url: https://developer.hashicorp.com/vault/docs/auth/jwt
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "If the JWT in the authentication request contains an aud claim, the associated bound_audiences for the role must exactly match at least one of the aud claims declared for the JWT."
      - url: https://developer.hashicorp.com/vault/docs/auth/aws
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "The aws auth method provides an automated mechanism to retrieve a Vault token for IAM principals and AWS EC2 instances."
    notes: >-
      Available in Community Edition, Enterprise and HCP Vault Dedicated. AppRole is an optional
      static fallback for platforms with no identity of their own.
  outbound:
    grade: B
    tier_gated: Vault Enterprise 1.16+ (premium license) or HCP Vault Dedicated, for plugin WIF
    mechanism: >-
      Vault acts as an OIDC issuer, and its AWS, GCP and Azure engines trade that token for cloud
      credentials. Other engines, and everything on Community Edition, need a static root
      credential.
    evidence:
      - url: https://developer.hashicorp.com/vault/docs/secrets/aws
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "The AWS secrets engine supports the Plugin WIF workflow, and has a source of identity called a plugin identity token."
      - url: https://developer.hashicorp.com/vault/docs/secrets/gcp
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Exchanging identity tokens for access tokens lets the GCP secrets engine operate without configuring explicit access to sensitive IAM security credentials."
      - url: https://developer.hashicorp.com/vault/docs/secrets/azure
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Configure the audience claim value and the Client, Tenant and Subscription IDs for plugin workload identity federation"
      - url: https://developer.hashicorp.com/vault/tutorials/enterprise/plugin-workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Vault Enterprise version 1.16 or later with premium license."
      - url: https://developer.hashicorp.com/hcp/docs/vault
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "HCP Vault Dedicated is a hosted version of Vault Enterprise operated by HashiCorp"
      - url: https://developer.hashicorp.com/vault/docs/secrets/alicloud
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Configure that access key as the credentials that Vault will use to communicate with AliCloud to generate credentials"
      - url: https://developer.hashicorp.com/vault/docs/secrets/databases
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "All plugins except MongoDB Atlas support rotating the root user's credentials."
    notes: >-
      Graded at the gated top tier, per the rubric. On Community Edition every cloud engine takes a
      static root key that Vault can rotate on a schedule, so the ungated grade would be C. The
      cloud must reach Vault's OIDC discovery URL, so an air-gapped Vault cannot use this. AliCloud
      has no keyless option, which keeps the grade at B rather than A.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://developer.hashicorp.com/vault/docs/concepts/tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "The system max TTL, which is 32 days but can be changed in Vault's configuration file."
    notes: >-
      Every token is capped by the system max TTL, except root tokens and periodic tokens that keep
      renewing. AppRole SecretIDs take a TTL and a use limit.
  rotation_api:
    pass: true
    evidence:
      - url: https://developer.hashicorp.com/vault/api-docs/auth/token
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "/auth/token/create"
      - url: https://developer.hashicorp.com/vault/api-docs/auth/token
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "/auth/token/revoke"
  scoping:
    pass: true
    evidence:
      - url: https://developer.hashicorp.com/vault/docs/concepts/policies
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "Policies are deny by default, so an empty policy grants no permission in the system."
  last_used:
    pass: false
    evidence:
      - url: https://developer.hashicorp.com/vault/api-docs/auth/token
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "creation_time"
    notes: >-
      Token lookup shows creation and expiry times but not last use. Finding dead tokens means
      searching the audit log.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: "HashiCorp Vault Service Token"
    notes: >-
      GitHub alerts on leaked Vault tokens, but not as a partner pattern. HashiCorp cannot revoke a
      token on a Vault it does not run. You get an alert, not a revocation.

notes: >-
  Hygiene covers credentials Vault itself issues, such as tokens and AppRole SecretIDs. The static
  root credentials for secrets engines belong to the target cloud, not to Vault.
