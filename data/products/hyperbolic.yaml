id: hyperbolic
vendor: Hyperbolic
product: GPU Cloud and Inference API
covers: "api.hyperbolic.ai, the CLI, the MCP server and Managed Kubernetes."
website: https://hyperbolic.ai
docs: https://hyperbolic.ai/docs/general/account-management.md
category: cloud
status: listed
summary: >-
  Your code rents GPUs and calls the Inference API with one static sk_live_ key made in the
  dashboard. There is no OIDC path, and the key fails every hygiene check. Managed Kubernetes uses
  browser SSO for humans only. Hyperbolic never reaches into your cloud.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static sk_live_ Bearer key, personal or Organization-owned, used by the REST API, Inference
      API, CLI and MCP server. No OIDC or token exchange exists.
    issuers: []
    evidence:
      - url: https://hyperbolic.ai/docs/api-reference/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authenticate with a Bearer API key (`Authorization: Bearer <api-key>`)."
      - url: https://hyperbolic.ai/docs/general/account-management.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "After creation, API keys cannot be viewed or recovered - make sure you copy and save your key immediately after creating it!"
      - url: https://hyperbolic.ai/docs/general/account-management.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "curl -X POST https://api.hyperbolic.ai/v2/on-demand/rentals/ssh-keys/attach"
      - url: https://hyperbolic.ai/docs/inference/overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "An `sk_live_` API key, sent as a Bearer token"
      - url: https://hyperbolic.ai/docs/inference/quickstart.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy the key, which starts with `sk_live_`."
      - url: https://hyperbolic.ai/docs/general/security-compliance.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All API requests require valid API keys"
      - url: https://hyperbolic.ai/docs/managed-kubernetes/kubectl-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The first command opens your browser to sign in with Hyperbolic."
      - url: https://hyperbolic.ai/docs/managed-kubernetes/kubectl-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Access tokens are short-lived — when one expires, `kubectl` reopens the browser"
      - url: https://hyperbolic.ai/docs/on-demand/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "RBAC bindings for your own teams and service accounts"
      - url: https://raw.githubusercontent.com/HyperbolicLabs/hyperbolic-mcp/main/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You will use this key in your MCP server configuration environment variables"
    notes: >-
      Every control-plane and inference call takes the same static key. The docs, the OpenAPI spec
      and Hyperbolic's GitHub repos describe no OIDC, cloud workload identity or token exchange.
      Managed Kubernetes, in beta, uses short-lived OIDC tokens, but sign-in is a browser flow for
      humans. There is no documented machine path, so CI would need another static secret. That SSO
      does not lift the grade, since federation for human logins only does not count.
  outbound:
    grade: N/A
    mechanism: >-
      Hyperbolic does not reach into your clouds, buckets, registries or SaaS. Data leaves instances
      through tools and credentials you run inside them.
    evidence:
      - url: https://hyperbolic.ai/docs/on-demand/storage-and-ports.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For regions without persistent storage, implement regular backups to S3/GCS/Azure"
      - url: https://hyperbolic.ai/docs/on-demand/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Shared network storage for clusters is in development; until it ships, use your own object storage for checkpoints."
      - url: https://hyperbolic.ai/docs/on-demand/overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Ubuntu with NVIDIA drivers and Docker preinstalled — bring your own frameworks or containers"
    notes: >-
      Checked the docs index, the OpenAPI spec, storage, Managed Kubernetes, Private Cloud,
      Inference and the changelog. There is no bucket import, registry pull or Hugging Face
      integration. The storage guide's aws s3 sync examples run inside your instance with your own
      credentials. If Hyperbolic adds bucket import or registry pulls, this surface needs grading.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://hyperbolic.ai/docs/api-reference/api-keys/list-all-api-keys-for-the-current-user-or-organization.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "An issued API key. The secret itself is only ever returned at creation."
      - url: https://hyperbolic.ai/docs/general/account-management.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API keys may be revoked at any time."
    notes: >-
      The key object has no expiry field, and the docs cover only creation and revocation. A key
      lives until someone revokes it.
  rotation_api:
    pass: false
    evidence:
      - url: https://hyperbolic.ai/docs/api-reference/api-keys/list-all-api-keys-for-the-current-user-or-organization.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "List all API keys for the current user or organization"
      - url: https://hyperbolic.ai/docs/inference/quickstart.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Revocation takes effect within about a minute."
    notes: >-
      The public API can only list keys. Creating and revoking happens in the dashboard, so rotation
      needs a person in a browser.
  scoping:
    pass: false
    evidence:
      - url: https://hyperbolic.ai/docs/general/organizations.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Every API key created while working in an Organization belongs to that Organization and is attributed to the member who created it."
      - url: https://hyperbolic.ai/docs/general/organizations.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Organizations have two roles."
      - url: https://hyperbolic.ai/docs/general/security-compliance.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Anyone with your key can make requests on your behalf and incur charges."
    notes: >-
      A key acts as its personal account or as the whole Organization. No scopes, read-only keys or
      service accounts are documented. A shared Organization key is still not a least-privilege
      machine identity.
  last_used:
    pass: false
    evidence:
      - url: https://hyperbolic.ai/docs/api-reference/api-keys/list-all-api-keys-for-the-current-user-or-organization.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "An issued API key. The secret itself is only ever returned at creation."
    notes: >-
      The key object has no last-used time, and the docs only suggest checking billing for surprise
      charges.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Hyperbolic is not on GitHub's secret-scanning list, though keys carry a greppable sk_live_
      prefix. A leaked key works until someone revokes it in the dashboard.

notes: >-
  One card, since rentals, storage, inference, the CLI and MCP server share one key type. No
  confidence flag: the dashboard is login-walled, but public evidence fails four checks, so it
  cannot reach D. Inbound rises above F only with federated login to the API, or a machine path into
  Managed Kubernetes.
