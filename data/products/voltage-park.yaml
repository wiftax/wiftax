id: voltage-park
vendor: Voltage Park
product: GPU Cloud
parent: Lightning AI
covers: "On-Demand VMs, bare metal and storage, via the control-plane API."
aliases:
  - Voltage Park On-Demand
website: https://www.voltagepark.com
docs: https://support.voltagepark.com/article/api
category: cloud
status: listed
confidence:
  level: low
  reason: >-
    Tokens are managed on a dashboard page behind a login. Scoping and last-used fail on public docs
    only. Two more passes would make inbound D.
summary: >-
  To call the Voltage Park API, your code needs a static token from support or the dashboard. Tokens
  expire after one year, but cannot be managed by API, scoped or checked for last use. Voltage Park
  never reaches into your cloud.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static API token sent as a Bearer token. You get it from support or the dashboard. There is
      no OIDC or workload identity login.
    issuers: []
    evidence:
      - url: https://support.voltagepark.com/article/api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This API uses Bearer Token Authentication to authorize requests."
      - url: https://support.voltagepark.com/article/api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Every request must include a valid API token in the Authorization header."
      - url: https://support.voltagepark.com/article/api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Since self-service API key generation is currently not available, API keys must be requested from our support team."
      - url: https://support.voltagepark.com/article/api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Our Voltage Park On Demand API allows developers to deploy, manage, and monitor virtual machines (VMs) and bare metal instances."
      - url: https://cloud-api.voltagepark.com/api/v1/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API authorization generated from TensorDock storefront"
      - url: https://cloud-api.voltagepark.com/api/v1/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "\"description\":\"UI Authorization Header\",\"in\":\"header\",\"name\":\"UI-Authorization\""
    notes: >-
      Graded on the On-Demand API, the only documented way for a workload to deploy or change VMs,
      bare metal, storage and clusters. Every operation takes the token or the console's own header,
      nothing else. There is no Terraform provider, CLI or OIDC login. The cluster API server, which
      can trust your own OIDC issuer, is graded on the voltage-park-kubernetes card. Creating or
      changing a cluster still needs this token.
  outbound:
    grade: N/A
    mechanism: >-
      Voltage Park never needs access into your infrastructure. It has no bucket import, registry
      pull or data sync.
    evidence:
      - url: https://cloud-api.voltagepark.com/api/v1/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The all-purpose management API for Voltage Park On-Demand."
      - url: https://support.voltagepark.com/article/deploy-storage
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Backed by VAST Data’s Universal Storage architecture, our storage offering delivers all-flash performance and exabyte-scale capacity to meet the demands of modern AI, ML, HPC, and data-intensive applications."
      - url: https://support.voltagepark.com/article/example-deploying-gpt-oss-on-voltage-park
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Now, we download the model from Huggingface through the Ollama command-line interface:"
    notes: >-
      No API operation or help article stores a cloud, registry or model hub credential for you.
      Storage is Voltage Park's own NFS, opened by IP allowlist. Downloads in the tutorials run in
      your own code on the rented machine, which is not the product reaching in.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://support.voltagepark.com/article/api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Tokens are valid for one year, after which they expire, so be sure to rotate them regularly to maintain access."
    notes: >-
      Tokens have a fixed one-year lifetime with no never option. That is an enforced cap, which
      passes as on the temporal card.
  rotation_api:
    pass: false
    evidence:
      - url: https://support.voltagepark.com/article/api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "On the Developers page of the Voltage Park dashboard, you can view and manage your API tokens."
      - url: https://cloud-api.voltagepark.com/api/v1/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Add new SSH public key to your organization"
    notes: >-
      Tokens are created and deleted only on the dashboard or by support. The API has no token
      endpoints, so rotation needs a browser.
  scoping:
    pass: false
    evidence:
      - url: https://support.voltagepark.com/article/api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Keep your API key secure! Treat it like a password and NEVER expose it in public repositories."
      - url: https://support.voltagepark.com/article/account
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Send Invite: Click this button to invite teammates to join the platform."
    notes: >-
      No scopes, roles or service accounts are documented. One token reaches everything, including
      billing and org settings.
  last_used:
    pass: false
    evidence:
      - url: https://support.voltagepark.com/article/api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "From this page, you can create new tokens or delete existing ones."
    notes: >-
      No last-used time is documented. The dashboard page is described only as creating and deleting
      tokens.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Neither Voltage Park, Lightning AI nor TensorDock is in GitHub's secret scanning patterns, so
      leaked tokens are not reported.

notes: >-
  Voltage Park merged into Lightning AI in January 2026. Lightning AI's Studio is a separate
  product, not graded here. One of five hygiene checks passes, so inbound is F. A token API plus
  scoped tokens or service accounts would lift it to D. B or A needs the API to accept a federated
  token.
