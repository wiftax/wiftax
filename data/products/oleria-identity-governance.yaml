id: oleria-identity-governance
vendor: Oleria
product: Adaptive Identity Governance
covers: The Oleria API.
website: https://www.oleria.com
docs: https://docs.oleria.com/developer-docs/api-reference/generate-token
category: identity
status: listed
summary: >-
  To call the Oleria API, your code trades a static client ID and secret for a one-hour token.
  Oleria reaches AWS, Microsoft, Google Workspace, GitHub and Salesforce without keys, but GCP,
  Azure, Okta and Slack want a pasted secret.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      OAuth client credentials. A static client ID and secret from the web app buy a JWT that
      usually lasts one hour.
    evidence:
      - url: https://docs.oleria.com/developer-docs/api-reference/generate-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Oleria API uses the OAuth 2.0 Client Credentials grant: you exchange a client_id and client_secret for a short-lived JWT access token, then pass that token as a Bearer credential on every API call."
      - url: https://docs.oleria.com/developer-docs/api-reference/generate-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Lifetime of the token in seconds (typically 3600, i.e. one hour)."
      - url: https://docs.oleria.com/developer-docs/api-reference/generate-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Generate OAuth client credentials from the Oleria web app. The client secret is shown once, on the create (or rotate) success screen."
      - url: https://docs.oleria.com/developer-docs/api-reference/overview
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Programmatic access to your Oleria workspace, secured with OAuth 2.0 Client Credentials."
    notes: >-
      No federation, signed-JWT or mTLS option is documented, and every token request carries the
      secret. The API went GA in August 2026, so this may change. The MCP server uses interactive
      sign-in. On-prem agents install from a script Oleria generates, and the docs do not say what
      credential they use to call back.
  outbound:
    grade: B
    mechanism: >-
      Oleria uses a cross-account role for AWS and its own apps for Entra, Google Workspace, GitHub
      and Salesforce. GCP, Azure, Okta and Slack want a key, secret or token.
    evidence:
      - url: https://docs.oleria.com/integrations/aws-iam-and-s3
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Return to your Oleria workspace and paste the Role ARN you copied. Select Confirm that the role is created using CloudFormation successfully, then select Authenticate."
      - url: https://docs.oleria.com/integrations/microsoft-entra-id
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Connect with Microsoft OAuth - automated configuration. Oleria creates the app and requests consent for you."
      - url: https://docs.oleria.com/integrations/google-workspace
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Grant domain-wide delegation so Oleria can discover Google Admin users and groups and Google Drive sharing."
      - url: https://docs.oleria.com/integrations/github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "You install the Oleria Connector GitHub App in your organization, then connect it from your Oleria workspace."
      - url: https://docs.oleria.com/integrations/salesforce
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Oleria connects through an Oleria connected app that you install and assign to a dedicated permission set."
      - url: https://docs.oleria.com/integrations/gcp
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Service Account Credentials - paste the full contents of the JSON key file downloaded above"
      - url: https://docs.oleria.com/integrations/azure
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Azure authentication uses a Microsoft Entra ID service principal, either a client secret or a client certificate."
      - url: https://docs.oleria.com/integrations/okta
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Save the key in PEM format and select Copy to clipboard. You will need this private key when connecting in Oleria."
      - url: https://docs.oleria.com/integrations/slack
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Oleria connects using tokens issued from a Slack app that you create and install in your workspace or organization."
    notes: >-
      Static: a GCP service account JSON key, an Azure client secret or certificate, an Okta private
      key you generate, Slack tokens from your own app, and an AD service account password. The AWS
      docs never mention an External ID, but the role still counts as keyless. The 150+ other
      connectors were not assessed.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.oleria.com/developer-docs/api-reference/generate-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Select Create API Key. Enter a descriptive name for your integration (for example, BI nightly export or internal access-graph viewer) and select Create."
    notes: >-
      Creating a key asks only for a name. No expiry, default lifetime or org policy is documented.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.oleria.com/developer-docs/api-reference/generate-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Go to Settings -> Manage API Keys and open the key you want to rotate."
    notes: >-
      Keys are managed only in the web app. The API has no key endpoints.
  scoping:
    pass: false
    evidence:
      - url: https://docs.oleria.com/developer-docs/api-reference/generate-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Contact Customer Success to confirm the credential has the right permissions."
      - url: https://docs.oleria.com/api-reference/accounts/disable
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Requires the https://devx.{environment}.oleria.io/write scope."
    notes: >-
      The API has read and write scopes, but you cannot choose them when creating a key. Changing a
      key's permissions goes through Customer Success, so it fails.
  last_used:
    pass: false
    evidence:
      - url: https://docs.oleria.com/developer-docs/api-reference/generate-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Open the new key from the list. The details panel shows the values you need besides the secret:"
    notes: >-
      No last-used time is documented.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Partner alerts: Reported directly to secret providers that are part of secret scanning's partner program."
    notes: >-
      Oleria is not on GitHub's secret-scanning list.

notes: >-
  Graded on the public REST API, GA in August 2026. Docs are public. Inbound would move to A or B
  only with federated workload tokens. Outbound would reach A if GCP, Azure, Okta and Slack all
  moved to keyless setups.
