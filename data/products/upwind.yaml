id: upwind
vendor: Upwind
product: Cloud Security Platform
website: https://www.upwind.io
docs: https://docs.upwind.io/settings/credentials
category: security
status: listed
summary: >-
  To call Upwind, your code needs a long-lived OAuth client secret, which it trades for a 24-hour
  token. There is no OIDC login. Upwind reaches into AWS, Azure and GCP without keys, but OCI,
  classic Azure and several SaaS integrations still take static secrets.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      A client ID and secret traded for a 24-hour token. The API, Terraform provider, CI actions,
      sensors and Cloud Scanners all use this same secret type.
    evidence:
      - url: https://docs.upwind.io/assets/js/37ee0c64.a788e4be.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To access the endpoints of the API, you need to authenticate your requests. We use OAuth 2.0, a widely adopted industry standard for authorization, to secure and control access to the API."
      - url: https://docs.upwind.io/assets/js/37ee0c64.a788e4be.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "--data-urlencode 'client_secret=YOUR_CLIENT_SECRET'"
      - url: https://docs.upwind.io/assets/js/e5ce9b41.877767b4.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "--data-urlencode 'grant_type=client_credentials'"
      - url: https://docs.upwind.io/assets/js/e16b00bb.667f8f79.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This documentation provides a comprehensive guide to creating secure Upwind credentials using OAuth2 and outlines best practices to safeguard the authentication and authorization processes."
      - url: https://docs.upwind.io/assets/js/e16b00bb.667f8f79.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All tokens automatically expire after 24 hours."
      - url: https://docs.upwind.io/assets/js/250c1d76.fc51debe.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy the client ID and client secret. The secret is shown once."
      - url: https://docs.upwind.io/assets/js/3e73ea36.6344a959.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "upwind_client_secret: ${{ secrets.UPWIND_CLIENT_SECRET }}"
      - url: https://docs.upwind.io/assets/js/cd2363d5.c8727893.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "--set credentials.clientSecret=$UPWIND_CLIENT_SECRET"
      - url: https://docs.upwind.io/assets/js/df0d6700.bb802ac8.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Provide the Upwind Auth credentials using an AWS secrets manager secret."
    notes: >-
      Graded C on the static-root rule, same as the paloalto-prisma-cloud and cyera-data-security
      cards. The token lasts 24 hours, but minting it needs a long-lived secret. The docs describe
      no OIDC or cloud workload identity login. Upwind's own GitHub Actions keep the secret in
      GitHub Secrets instead of using the runner's OIDC token. Cloud Scanners in your account keep
      it in AWS Secrets Manager or Azure Key Vault. No tier gate is documented.
  outbound:
    grade: B
    mechanism: >-
      Upwind assumes AWS roles with an External ID, uses Azure multi-tenant apps with federated
      credentials, and federates into GCP and OCI.
    evidence:
      - url: https://docs.upwind.io/assets/js/1b8afc99.4d33b48b.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All cross-account access uses AWS IAM assume-role with a scoped trust policy."
      - url: https://docs.upwind.io/assets/js/f32e6693.63becf14.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A value, generated by Upwind and unique to each AWS Organization, added to the trust policy of the IAM roles Upwind assumes."
      - url: https://docs.upwind.io/assets/js/bcab3396.fcfddf6e.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Cross-tenant access is built on standard Microsoft Entra ID mechanisms: the customer tenant holds Upwind service principals with scoped role assignments, and Upwind's scanning workloads obtain short-lived tokens for those service principals through federated authentication."
      - url: https://docs.upwind.io/assets/js/bcab3396.fcfddf6e.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authentication is federated and short-lived; no standing customer-side credentials exist."
      - url: https://docs.upwind.io/assets/js/8ab8e5d5.4270457d.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Upwind's SaaS onboarding uses two multi-tenant applications registered in Upwind's own Microsoft Entra tenant, so this step does not create an application or a client secret in your tenant."
      - url: https://docs.upwind.io/assets/js/783173e9.b123cb47.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Classic onboarding authenticates Upwind through an application registration and client secret in your own Microsoft Entra tenant."
      - url: https://docs.upwind.io/assets/js/3e5bd4bb.a2cb7cca.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This will grant access to your Google Cloud environment specifically from Upwind's AWS environment."
      - url: https://docs.upwind.io/assets/js/3e5bd4bb.a2cb7cca.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This configuration is essential for enabling Upwind to authenticate and interact with your Google Cloud resources without needing to manage long-lived credentials."
      - url: https://docs.upwind.io/assets/js/5f8f7541.7943c55e.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "confidential_app_client_secret"
      - url: https://docs.upwind.io/assets/js/8894b7aa.f1f88d05.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Unique external ID generated by Upwind to establish secure cross-account access."
      - url: https://docs.upwind.io/assets/js/0b2d58f6.50ab50e4.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Upwind will retrieve the new service principal credential from the key vault and test connectivity to the Event Hub."
      - url: https://docs.upwind.io/assets/js/ebaae3f7.5f7ce24c.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Step 2. Install the Upwind GitHub App"
      - url: https://docs.upwind.io/assets/js/2661427a.d0cf560e.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "GitLab has no API for creating an OAuth application, so you create one on your"
      - url: https://docs.upwind.io/assets/js/e9a20b32.728db14d.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "An OpenAI Admin API key carries organization management permissions; OpenAI does not offer a"
    notes: >-
      Upwind reaches into AWS, Azure and GCP without keys, so this is B, not C. OCI federation still
      asks you for a client secret. The optional classic Azure flow and the Azure activity log
      integration use an app client secret. GitHub is a GitHub App, but GitLab, ServiceNow,
      Snowflake, Databricks, Datadog and others take static secrets or tokens. The client secrets
      that scanners carry are Upwind's inbound credential, not a key into your cloud.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.upwind.io/assets/js/e16b00bb.667f8f79.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When API credentials are removed, any existing active tokens will remain functional until they expire."
      - url: https://docs.upwind.io/assets/js/e16b00bb.667f8f79.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Using multiple credentials lets you rotate them as part of your security practice, or revoke a specific key if it's inadvertently exposed."
    notes: >-
      Only the 24-hour token expires. Client secrets have no expiry and no org policy can cap them,
      so they live until revoked.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.upwind.io/assets/js/e16b00bb.667f8f79.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "From the top of the side pane, by clicking on the three dots icon and"
      - url: https://docs.upwind.io/assets/js/250c1d76.fc51debe.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Settings > Access management> Credentials"
    notes: >-
      You create and revoke credentials only in the console. Neither the API nor the Terraform
      provider can manage them.
  scoping:
    pass: true
    evidence:
      - url: https://docs.upwind.io/assets/js/e16b00bb.667f8f79.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When creating Upwind API credentials, you must assign specific permissions; any token generated from these credentials will inherit those access levels. You can mirror the permissions of an existing member group or define a custom scope and roles."
      - url: https://docs.upwind.io/assets/js/e16b00bb.667f8f79.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "No, you can only set scope and roles on credentials of API type."
    notes: >-
      API credentials are machine identities with their own roles, never exceeding the creator's
      access. Sensor and integration credentials cannot be scoped but each serves one job.
  last_used:
    pass: true
    evidence:
      - url: https://docs.upwind.io/assets/js/e16b00bb.667f8f79.js
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Timestamp indicating the most recent usage of these credentials."
    notes: >-
      The Credentials table shows when each credential was last used.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Upwind is not in GitHub's secret scanning partner program, so leaked secrets are not reported
      to Upwind.

notes: >-
  One card for the whole Upwind platform, which shares one credential system and one API. Inbound
  moves to B or A only if Upwind accepts a federated token. Hygiene fixes would not change a C.
  Outbound reaches A for clouds if OCI drops the client secret and the classic Azure flow is
  retired.
