id: aws-iam
vendor: AWS
product: IAM and STS
aliases:
  - STS
  - Security Token Service
  - Amazon Web Services
website: https://aws.amazon.com/iam/
docs: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html
category: cloud
status: listed
summary: >-
  Your code can trade a token from any OIDC issuer you register for up to an hour of AWS
  credentials, with no key on disk. AWS roles can also mint JWTs that other services trust. IAM user
  access keys still never expire, so avoid creating them.
surfaces:
  inbound:
    grade: A
    mechanism: >-
      Register any OIDC issuer as an IAM identity provider, then call AssumeRoleWithWebIdentity. The
      role's trust policy pins issuer, audience and subject.
    issuers:
      - any
    evidence:
      - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          IAM OIDC identity providers are entities in IAM that describe an external identity
          provider (IdP) service that supports the OpenID Connect (OIDC) standard, such as Google or
          Salesforce. You use an IAM OIDC identity provider when you want to establish trust between
          an OIDC-compatible IdP and your AWS account.
      - url: >-
          https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_iam-condition-keys.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          You can use AWS OIDC condition context keys to write policies that limit the access of
          federated principals to resources that are associated with a specific provider, app, or
          user. These keys are typically used in the trust policy for a role.
      - url: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRoleWithWebIdentity.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Calling AssumeRoleWithWebIdentity does not require the use of AWS security credentials.
          Therefore, you can distribute an application (for example, on mobile devices) that
          requests temporary security credentials without including long-term AWS credentials in the
          application.
      - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_iam-quotas.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: OpenId connect providers per account | 100 | 700
      - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          An IAM OIDC identity provider must have at least one and can have a maximum of 100
          audiences.
    notes: >-
      Any https issuer with an OIDC discovery document and JWKS works. Each role's trust policy
      limits which audience and subject it accepts. An account can hold 100 providers by default,
      raisable to 700, and the provider must be in the same account as the role. Ambient identity
      inside AWS, such as EC2 or Lambda roles, does not earn the A on its own. The A is for
      workloads running anywhere. IAM Roles Anywhere covers workloads that have certificates from
      your own CA but no OIDC issuer.
  outbound:
    grade: A
    mechanism: >-
      With outbound identity federation, an IAM role can get a short-lived JWT signed by AWS STS.
      Third parties verify it against an issuer URL specific to your account.
    evidence:
      - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_outbound.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          IAM outbound identity federation enables your AWS workloads to securely access external
          services without storing long-term credentials. Your AWS workloads can request short-lived
          JSON Web Tokens (JWTs) from AWS Security Token Service (AWS STS) by calling the
          GetWebIdentityToken API.
      - url: https://docs.aws.amazon.com/STS/latest/APIReference/API_GetWebIdentityToken.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Returns a signed JSON Web Token (JWT) that represents the calling AWS identity. The
          returned JWT can be used to authenticate with external services that support OIDC
          discovery. The token is signed by AWS STS and can be publicly verified using the
          verification keys published at the issuer's JWKS endpoint.
      - url: >-
          https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_outbound_getting_started.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          You must enable outbound identity federation before you can request tokens. You can enable
          the feature using the AWS Management Console or programmatically using the
          EnableOutboundWebIdentityFederation API.
      - url: >-
          https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_outbound_token_claims.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: The ARN of the IAM principal that requested the token.
      - url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Workloads running in Amazon Web Services (AWS). First, configure a trust relationship
          between your user-assigned managed identity or app in Microsoft Entra ID and your AWS
          account using IAM Outbound Identity Federation.
      - url: >-
          https://docs.aws.amazon.com/eks/latest/userguide/enable-iam-roles-for-service-accounts.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Your cluster has an OpenID Connect (OIDC) issuer URL associated with it.
      - url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-other-clouds
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Create a JSON document that contains the information that you would normally include in a
          request to the AWS GetCallerIdentity() endpoint, including a valid request signature.
    notes: >-
      Until recently only EKS pods could prove their identity to a third party with an OIDC token.
      Others relied on a signed GetCallerIdentity request. Outbound identity federation fixes that.
      It is off by default, must be enabled per account, and works only on regional STS endpoints.
      Tokens last up to an hour. Because the issuer is per account, a relying party trusts accounts
      one at a time. IAM conditions can limit what a role may mint. Entra lists it as a supported
      federation source. Cross-account roles with an External ID remain the keyless path between AWS
      accounts.
hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/securing_access-keys.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Long-term access keys, such as those associated with IAM users and the root user, remain
          valid until you manually revoke them.
      - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-keys_inline-policy.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          In this situation you can either create a time-bound policy that expires the credentials
          after the specified time or, if you are running a workload from a secure network, you can
          use an IP restriction policy.
    notes: >-
      Access keys have no expiry. The workaround is a hand-written Deny policy with a date
      condition, which nothing at the org level forces. Reports flag old keys but do not disable
      them.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateAccessKey.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Creates a new AWS secret access key and corresponding AWS access key ID for the specified
          user. The default status for new keys is Active.
      - url: https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeleteAccessKey.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Deletes the access key pair associated with the specified IAM user.
    notes: >-
      Each user can hold two keys, so you can create the new one before deleting the old. Keys can
      also be deactivated without deleting.
  scoping:
    pass: true
    evidence:
      - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/securing_access-keys.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          If you must create access keys for programmatic access to AWS, create them for IAM users,
          granting the users only the permissions they require.
      - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-keys_inline-policy.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          IAM users with access keys should be assigned least privilege access and have multi-factor
          authentication (MFA) enabled.
    notes: >-
      A key has its IAM user's permissions. That user is a machine identity whose policies can be
      narrowed to specific actions, resources and source IPs, which counts.
  last_used:
    pass: true
    evidence:
      - url: https://docs.aws.amazon.com/IAM/latest/APIReference/API_GetAccessKeyLastUsed.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Retrieves information about when the specified access key was last used. The information
          includes the date and time of last use, along with the AWS service and Region that were
          specified in the last request made with that key.
      - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_getting-report.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          When an access key is used more than once in a 15-minute span, only the first use is
          recorded in this field. Applies to both account root user and IAM users.
    notes: >-
      Each key's last-used date, service and region are available in the API, console and credential
      report.
  leak_revocation:
    pass: true
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-05
        checked_by: sisyphus
      - url: >-
          https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSCompromisedKeyQuarantineV3.html
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Denies access to certain actions, applied by AWS in the event that an IAM user's
          credentials have been compromised or exposed publicly. The policy aims to limit the
          potential damage that may be caused by fraud-related activity leading to unauthorized
          charges, while not impacting the existing resources.
    notes: >-
      AWS is a GitHub secret scanning partner. It quarantines rather than revokes: it attaches a
      deny policy and opens a support case, and the key works for anything that policy misses.
notes: >-
  Graded on machine access to the AWS API through IAM and STS. Cognito, IAM Identity Center and
  service-specific keys are separate products. Outbound federation is new, so re-check its regional
  and enablement limits if the docs change.
