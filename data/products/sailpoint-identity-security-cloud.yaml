id: sailpoint-identity-security-cloud
vendor: SailPoint
product: Identity Security Cloud
aliases:
  - IdentityNow
website: https://www.sailpoint.com
docs: https://developer.sailpoint.com/docs/api/authentication
category: identity
status: listed
summary: >-
  Scripts call the Identity Security Cloud API by trading a client ID and secret for a token that
  lasts 12 hours by default. No OIDC path exists. SailPoint reaches AWS with a role, but Entra, GCP,
  GitHub and Okta need a secret you paste.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      OAuth client credentials from a personal access token, which acts as its creator, or from an
      API client. The secret buys a JWT that lasts 12 hours by default.
    evidence:
      - url: https://developer.sailpoint.com/docs/api/authentication
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A fast, simple way to authenticate to the APIs is to generate a personal access token and pass that token."
      - url: https://developer.sailpoint.com/docs/api/authentication
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This JWT access_token grants access matching that of the user who generated the PAT."
      - url: https://developer.sailpoint.com/docs/api/authentication
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Clients use the 'Client Credentials' grant type to obtain access tokens without user involvement."
      - url: https://developer.sailpoint.com/docs/api/authentication
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API endpoints that require user level permissions require the use of Personal access tokens (PATs)."
      - url: https://developer.sailpoint.com/docs/api/authentication
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Note: If an API Key is used then SailPoint Identity Security API calls are made outside of the context of a user and some API calls will not work."
      - url: https://documentation.sailpoint.com/saas/help/common/api_keys.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To access APIs, you'll need to generate a client ID and secret that you can use to authenticate with the platform."
      - url: https://developer.sailpoint.com/docs/tools/sdk/python/personal-access-tokens/models/create-personal-access-token-request.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Number of seconds an access token is valid when generated using this Personal Access Token. If no value is specified, the token will be created with the default value of 43200."
    notes: >-
      C, not D, because the long-lived secret only mints a short-lived token. It is no better than C
      because the root is still a stored client secret. The docs list no token exchange, private-key
      JWT, GitHub Actions OIDC or cloud workload path. Unattended jobs must use client credentials,
      since the other grants need a browser. Many endpoints need a personal token, so automation
      often runs as a user. Virtual Appliances use static keys too. IdentityIQ, Entro and NERM are
      separate products.
  outbound:
    grade: B
    mechanism: >-
      The AWS source assumes an IAM role you create that trusts SailPoint, with an External ID.
      Entra ID, GCP, GitHub, Okta and Salesforce want a secret, key or token you create.
    evidence:
      - url: https://documentation.sailpoint.com/connectors/saas/aws/help/saas_connectivity/aws/manual_configuration.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Then, it uses a role with the same name and external ID in each member account to collect the resources."
      - url: https://documentation.sailpoint.com/connectors/saas/aws/help/saas_connectivity/aws/manual_configuration.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All roles must use the same external ID provided by SailPoint in the connection settings of the AWS SaaS source."
      - url: https://documentation.sailpoint.com/connectors/aws/help/integrating_aws/connection_settings.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This method uses the Access Key ID and Secret Access Key associated with the user."
      - url: https://documentation.sailpoint.com/connectors/saas/msentraid/help/saas_connectivity/microsoft_entra_id/prerequisites.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Ensure that a client application has been registered on your Azure Management portal as a web application or web API, and you have access to the Client ID and Client Secret for this application."
      - url: https://documentation.sailpoint.com/connectors/microsoft/entra_id/help/integrating_entra_id/connection_settings.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter the Private Key text used for encrypting the JWT assertion."
      - url: https://documentation.sailpoint.com/connectors/saas/googleworkspace/help/saas_connectivity/google_workspace/prerequisites.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "SailPoint's Cloud Infrastructure Entitlement Management (CIEM) only supports Service Account as a grant type."
      - url: https://documentation.sailpoint.com/connectors/saas/googleworkspace/help/saas_connectivity/google_workspace/connection_settings.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter the Private Key and Private Key Password used for signing the JWT assertion."
      - url: https://documentation.sailpoint.com/connectors/saas/github/help/saas_connectivity/github/connection_settings.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The GitHub source uses a GitHub Personal Access Token (PAT) for authentication."
      - url: https://documentation.sailpoint.com/connectors/saas/okta/help/saas_connectivity/okta/authenticate_with_an_api_token.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In API Token, enter the Single Sign-On Web System (SSWS) API token required for Okta authentication."
      - url: https://documentation.sailpoint.com/connectors/saas/salesforce/help/saas_connectivity/salesforce/connection_settings.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Effective July 1, 2026, the External Client Application (ECA) is the recommended authentication method for the Salesforce connector."
    notes: >-
      AWS is keyless. The older appliance-based AWS connector uses either an EC2 role or a pasted
      access key. Entra ID needs a client secret, certificate key, password or refresh token on an
      app you create, with no SailPoint app or federated credential. GCP takes a pasted JSON key,
      the only option. GitHub takes a personal token or the key of an app you create. Okta takes an
      API token. Keyless on one cloud with keys elsewhere is B. Most other connectors were not
      assessed. A needs a SailPoint Entra app or federated credential, and keyless GCP.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://documentation.sailpoint.com/saas/help/common/api_keys.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "By default, the expiration date is set for 6 months. If this field is left blank, the token is created with no expiration date."
      - url: https://documentation.sailpoint.com/saas/help/common/api_keys.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you clear the expiration date, the token does not expire."
      - url: https://developer.sailpoint.com/docs/tools/sdk/python/personal-access-tokens/models/get-personal-access-token-response.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "There is no upper limit on how far in the future the expiration date can be set."
    notes: >-
      Personal tokens default to six months, but the creator can make one never expire, with no
      maximum or policy against it. API client secrets have no expiry. A changeable default is not
      enforced, same as elastic-cloud-api.
  rotation_api:
    pass: true
    evidence:
      - url: https://developer.sailpoint.com/docs/api/authentication
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To generate a personal access token from the API, use the create personal access token endpoint."
      - url: https://developer.sailpoint.com/docs/tools/sdk/python/oauth-clients/methods/o-auth-clients.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Delete oauth client"
    notes: >-
      The API can create and revoke both personal tokens and API clients.
  scoping:
    pass: true
    evidence:
      - url: https://developer.sailpoint.com/docs/api/authorization
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Scopes are granular permissions you can add to personal access tokens (PATs) to create tokens with the least privilege necessary to fulfill their functions."
      - url: https://documentation.sailpoint.com/saas/help/common/api_keys.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To follow the principle of least privilege, only select scopes that are needed by the application."
    notes: >-
      Both credential types take a scope list narrower than the owner. Without one, the API grants
      full rights, so least privilege is opt-in.
  last_used:
    pass: true
    evidence:
      - url: https://documentation.sailpoint.com/saas/help/common/api_keys.html
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can check the date an API key was last used to determine whether it is no longer needed and can be deleted."
      - url: https://developer.sailpoint.com/docs/tools/sdk/python/personal-access-tokens/models/get-personal-access-token-response.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This property can be useful for identifying which PATs are no longer actively used and can be removed."
    notes: >-
      Both credential types show a last-used time in the UI and API, updated daily.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      SailPoint is not in GitHub's secret-scanning patterns, so a leaked secret is not reported.

notes: >-
  Graded on the Identity Security Cloud API, formerly IdentityNow. The headline is C, from inbound C
  and outbound B. Inbound moves to B or A only if the token endpoint accepts a federated token.
  Expiry would pass with an enforced maximum or a ban on non-expiring tokens.
