id: zenity-ai-agent-security
vendor: Zenity
product: AI Agent Security
website: https://zenity.io
docs: https://docs.zenity.io/integration
category: security
status: listed
summary: >-
  To call Zenity, your code needs a long-lived client secret, which it trades for a short-lived
  token. There is no federation. Zenity connects to AWS Bedrock with an IAM role, but ChatGPT and
  Claude Enterprise need an API key you generate.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      An account client ID and secret, traded for a short-lived token. The client secret is the
      long-lived root.
    evidence:
      - url: https://raw.githubusercontent.com/zenitysec/boundaries-as-code-template/HEAD/README.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Repository **secrets**: `ZENITY_CLIENT_ID`, `ZENITY_CLIENT_SECRET` — an account API key."
      - url: https://raw.githubusercontent.com/zenitysec/boundaries-as-code-template/HEAD/README.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "There is no login command and nothing is cached on disk; both are read from the environment on every invocation."
      - url: https://raw.githubusercontent.com/zenitysec/boundaries-as-code-template/HEAD/.github/workflows/boundaries-deploy.yml
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "ZENITY_CLIENT_SECRET: ${{ secrets.ZENITY_CLIENT_SECRET }}"
      - url: https://get.zenity.io/releases/v0.1.0/zenityctl_0.1.0_darwin_arm64.tar.gz
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "**Account API key (`client_credentials`) — the only mode.**"
      - url: https://get.zenity.io/releases/v0.1.0/zenityctl_0.1.0_darwin_arm64.tar.gz
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The CLI performs the Auth0 `client_credentials` grant against the selected environment's tenant, scoped to that organization and the environment's API audience, then calls the API with the resulting bearer token (cached until it nears expiry)."
    notes: >-
      Zenity's docs are behind a customer login, so this is graded from its public GitHub template
      repo and the zenityctl release archive. Zenity's own GitHub Actions workflow keeps the client
      secret as a repo secret and does not request an OIDC token. The zenityctl README calls client
      credentials the only mode. The Cursor plugin trades a pasted enrollment key for a short-lived
      device token, so endpoint agents also rest on a static root. Revisit if gated docs show a
      federated path.
  outbound:
    grade: B
    mechanism: >-
      AWS Bedrock connects with IAM roles. ChatGPT Enterprise and Claude Enterprise take an API key
      you generate and paste in.
    evidence:
      - url: https://zenity.io/use-cases/platform/aws-bedrock
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Zenity can be deployed using IAM roles leveraging the bedrock APIs with consistent security policy enforcement across your Bedrock infrastructure."
      - url: https://zenity.io/use-cases/platform/chatgpt-enterprise
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Here’s what the setup looks like: Generate a secure API key from the OpenAI platform Request Compliance API access from OpenAI Create a new integration within the Zenity Platform"
      - url: https://zenity.io/use-cases/platform/claude-enterprise
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Here’s what the setup looks like: Generate a secure API key from the Anthropic platform Request Compliance API access from Anthropic Create a new integration within the Zenity Platform"
      - url: https://zenity.io/use-cases/platform/claude-tag
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Setup looks like: Connect your Slack workspace within the Zenity platform."
      - url: https://zenity.io/press-release/zenity-announces-ai-trust-layer-the-first-agent-less-security-solution-for-microsoft-365-copilot
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "today announced the first agent-less security solution for Microsoft 365 Copilot with the Zenity AI Trust Layer."
    notes: >-
      Graded from marketing pages only, because setup guides are in the gated portal. The AWS
      Bedrock page says IAM roles but not whether it uses an External ID. ChatGPT and Claude
      Enterprise take static API keys. Slack and the Microsoft, Salesforce, ServiceNow, Google and
      Cursor integrations could not be classified. B rests on that single AWS statement. If the AWS
      role turns out to need access keys, this drops to D or F.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://raw.githubusercontent.com/zenitysec/boundaries-as-code-template/HEAD/README.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Repository **secrets**: `ZENITY_CLIENT_ID`, `ZENITY_CLIENT_SECRET` — an account API key."
    notes: >-
      No public source says client secrets can expire or that a policy can enforce it. Docs are
      gated, so this is unverified, not confirmed absent.
  rotation_api:
    pass: false
    evidence:
      - url: https://get.zenity.io/releases/v0.1.0/zenityctl_0.1.0_darwin_arm64.tar.gz
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "There is no `login`, no `logout`, and no credential storage"
    notes: >-
      No public API or CLI command creates or revokes keys. The zenityctl help says keys are made in
      the console.
  scoping:
    pass: true
    evidence:
      - url: https://get.zenity.io/releases/v0.1.0/zenityctl_0.1.0_darwin_arm64.tar.gz
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "**`push` requires `operator`; every other `boundaries` command needs `viewer`.**"
      - url: https://raw.githubusercontent.com/zenitysec/boundaries-as-code-template/HEAD/README.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Both commands need the same credentials as `diff`, and only the `viewer` role."
    notes: >-
      Account API keys are machine identities with a role, viewer or operator, so a CI key can be
      read-only. Finer limits are in gated docs.
  last_used:
    pass: false
    evidence:
      - url: https://raw.githubusercontent.com/zenitysec/boundaries-as-code-template/HEAD/README.md
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      No public evidence that Zenity shows when a key was last used. Unverified against the gated
      docs.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      Zenity is not in GitHub's secret scanning patterns.

notes: >-
  Zenity's docs are all behind a login, so this card relies on public repos, the zenityctl archive
  and marketing pages. The failed hygiene checks lack public evidence rather than being confirmed
  gaps, and they matter less at C. Inbound moves to B or A only with federated tokens.
