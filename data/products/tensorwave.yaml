id: tensorwave
vendor: TensorWave
product: GPU Cloud
covers: "AMD GPU bare metal, Managed Kubernetes, Managed Slurm and storage."
website: https://tensorwave.com
docs: https://docs.tensorwave.com/kubernetes/health-overview.md
category: cloud
status: listed
confidence:
  level: low
  reason: >-
    TensorWave publishes no API, CLI, token or S3 key docs, and the dashboard and user-management
    pages are login-only or empty. If those showed expiring, API-rotatable, scoped credentials,
    inbound could move from F to D.
summary: >-
  TensorWave documents no public API, CLI, Terraform provider or federation. Workloads get in with
  SSH keys and a kubeconfig downloaded from the dashboard. S3 storage keys are undocumented.
  Outbound is not graded, since the only integration's Slack connection is undocumented.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      Static credentials only: SSH keys and a kubeconfig downloaded by hand from the dashboard. No
      API, token, service account or federation is documented, nor how S3 keys are issued.
    issuers: []
    evidence:
      - url: https://docs.tensorwave.com/kubernetes/health-overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Clicking this button downloads a kubeconfig file for your cluster, which you can use to
          authenticate and interact with it via `kubectl` from your local machine.
      - url: https://docs.tensorwave.com/kubernetes/health-overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Keep your kubeconfig file secure. It contains credentials that grant access to your cluster."
      - url: https://docs.tensorwave.com/observability/kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Download your cluster's kubeconfig directly from the cluster header by clicking
          **Kubeconfig**.
      - url: https://docs.tensorwave.com/slurm/access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Authentication is by SSH key. Password authentication is disabled. Your public key must be
          present in your LDAP user record before first login
      - url: https://docs.tensorwave.com/welcome-to-tensorwave/bare-metal-quickstart.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: All SSH keys you've initially provided will have root user access.
      - url: https://docs.tensorwave.com/slurm/access.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          IDP setup requires coordination during or after initial cluster deployment. To discuss
          options or initiate configuration, contact your TensorWave account manager.
      - url: https://tensorwave.com/products/storage/high-speed-network-storage
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: S3 compatible object storage
      - url: https://docs.tensorwave.com/llms.txt
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Graded on the weakest path a workload must use, as on the CoreWeave cards. The docs have no
      API reference, token page, CLI or Terraform provider. Clusters appear to be provisioned
      through sales, not an API. So a workload uses a kubeconfig of undocumented type and lifetime,
      or an SSH key, both static. The optional Slurm IdP integration is human SSO set up by your
      account manager, so it does not lift the grade. S3-style access keys are static by nature. A
      federated API, or credential docs passing three hygiene checks for D, would move it.
  outbound:
    grade: N/A
    mechanism: >-
      Not graded. TensorWave's only integration posts alerts to your Slack, and how it connects is
      undocumented. Registry and data pulls run in your jobs with your credentials.
    evidence:
      - url: https://docs.tensorwave.com/observability/notifications-and-alerts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          When enabled, qualifying events are sent to your organization's connected Slack
          workspace.
      - url: https://docs.tensorwave.com/observability/notifications-and-alerts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Use the workspace dropdown to select which Slack workspace should receive alerts.
      - url: https://docs.tensorwave.com/slurm/containers.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Credentials are stored under your home directory and apply to subsequent `apptainer
          pull`, `apptainer exec`, and `apptainer shell` calls that reference the registry.
      - url: https://docs.tensorwave.com/welcome-to-tensorwave/faq.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          We provide multiple data storage and transfer options, including high-speed SSDs and
          cloud storage integrations.
    notes: >-
      No receipt, no grade. Registry and Hugging Face credentials are typed into your own login pod
      and used by your jobs. TensorWave does not hold them. The FAQ's cloud storage integrations are
      not described anywhere public. Documenting the Slack connection would grade this. An app
      install would be keyless, and a pasted webhook or bot token would be D or F. The headline is F
      either way.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.tensorwave.com/kubernetes/health-overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Keep your kubeconfig file secure. It contains credentials that grant access to your cluster."
      - url: https://docs.tensorwave.com/welcome-to-tensorwave/bare-metal-quickstart.md
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No expiry or enforcement policy is documented for the kubeconfig, SSH keys or S3 keys. It
      fails under the login-wall rule.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.tensorwave.com/observability/kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Download your cluster's kubeconfig directly from the cluster header by clicking
          **Kubeconfig**.
      - url: https://docs.tensorwave.com/llms.txt
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      You fetch the kubeconfig by clicking a dashboard button, and no API mints or revokes
      credentials. SSH keys are rotated by hand on the node or in LDAP.
  scoping:
    pass: false
    evidence:
      - url: https://docs.tensorwave.com/welcome-to-tensorwave/bare-metal-quickstart.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: All SSH keys you've initially provided will have root user access.
      - url: https://docs.tensorwave.com/user-and-team-management/managing-team-member-access.md
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No machine identity is documented. The kubeconfig's scope is unstated, bare-metal keys are
      root, and Slurm keys belong to LDAP users. RBAC you set up yourself does not count.
  last_used:
    pass: false
    evidence:
      - url: https://docs.tensorwave.com/observability/kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No last-used view is documented for any credential.
  leak_revocation:
    pass: false
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      TensorWave is not in GitHub's secret-scanning table.

notes: >-
  One card, because no TensorWave product documents its own machine auth. If it publishes API or
  storage key docs, those may get their own cards, as CoreWeave's do. The credential pages that
  exist are empty. The fix: publish credential docs, add expiry and a revocation API, offer scoped
  service accounts, and accept CI OIDC tokens.
