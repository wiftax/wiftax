id: flagsmith
vendor: Flagsmith
product: Platform
covers: >-
  Flagsmith Cloud (SaaS): the Management API, Flags/SDK API, CLI and Terraform provider, and its
  integrations. Notes cover self-hosted and Enterprise Flagsmith, which run the same open-source API.
aliases:
  - Flagsmith Cloud
  - Bullet Train
website: https://www.flagsmith.com
docs: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
category: devtools
status: listed
summary: >-
  The Management API exchanges a token from any OIDC issuer you configure (issuer, audience and
  claim rules) for a one-hour access token, on every plan; RBAC roles on it need Scale-Up or
  Enterprise. Server-side SDK keys and the Terraform provider stay static, with no enforced expiry,
  no last-used and no GitHub partner revocation. GitHub and Slack connect by app consent; the
  observability, analytics, GitLab and warehouse integrations take pasted keys.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      OIDC trust relationship: POST a token from GitHub Actions or any issuer that serves HTTPS
      discovery to /api/v1/auth/oidc/token/, matched on issuer, a required audience and optional
      claim rules, and get a one-hour Bearer token acting as org admin or a set of RBAC roles.
      Organisation (Master) API keys remain available.
    issuers: ["any"]
    evidence:
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "To interact with the Management API, you need to authenticate your requests using an API Token associated with your Organisation, or a short-lived access token obtained through an OIDC trust relationship."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Trust relationships let a workload that already has an OIDC identity — for example, a GitHub Actions job — call the Management API without any stored secrets."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "The freeform option supports any OIDC identity provider, such as GitLab CI or Kubernetes:"
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Expected audience: the aud claim the token must carry."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Claim matching rules: additional claims the token must match."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Access tokens expire after one hour by default."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Granular permissions for your API tokens and OIDC trust relationships require an Enterprise or Scale-Up subscription."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/CLI
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Configure an OIDC trust relationship for your repository, then use the Flagsmith/setup-cli action:"
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Exchange an OIDC token issued by a trusted identity provider for a short-lived Flagsmith access token."
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "OIDC issuer URL expected in exchanged tokens' `iss` claim."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/sdks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Client-side SDK Keys give both client-side SDKs and server-side SDKs access to Remote Evaluation mode."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/sdks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Server-side SDK Keys give server-side SDKs access to Local Evaluation mode."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/flags-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "The Flags API uses a non-secret Environment Key for authentication."
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Manage server-side SDK keys for an environment."
      - url: https://docs.flagsmith.com/third-party-integrations/ci-cd/terraform
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "In order to configure the Flagsmith Terraform provider we need an API key."
      - url: https://github.com/Flagsmith/terraform-provider-flagsmith/blob/main/docs/index.md
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Master API key used by flagsmith api client."
      - url: https://docs.flagsmith.com/deployment-self-hosting/core-configuration/environment-variables
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "TRUST_RELATIONSHIP_ACCESS_TOKEN_LIFETIME_SECONDS: Lifetime of access tokens minted by the OIDC trust relationship token exchange."
    notes: >-
      Bring-your-own-issuer federation, self-serve and documented for workloads (GitHub Actions
      form with repository, environment and workflow-file pins; freeform issuer for GitLab CI,
      Kubernetes and others; CLI and setup-cli action docs). The audience is required and unique
      per issuer, and claim rules (with * wildcards) can pin sub or any other claim. Shipped in
      v2.265.0 (August 2026); the live SaaS OpenAPI spec lists /api/v1/auth/oidc/token/ and the
      trust-relationships endpoints. No tier_gated: a trust relationship with full org-admin
      rights works on any plan, and only RBAC roles on it need Scale-Up or Enterprise (so on
      lower plans the federated token is all-powerful within the org). Exchanged tokens cannot
      manage Master API keys or trust relationships, and the trust-relationship CRUD API takes a
      user token only, so setup is a human step. Why A despite static keys elsewhere: flag
      evaluation in remote mode needs only the client-side Environment Key, which Flagsmith
      documents as public, not a secret. Local evaluation mode and the Edge Proxy need a
      server-side SDK key (ser.), which is a static secret with no federated alternative; a
      federated job can mint and delete one through the Management API with an expires_at,
      following the `nebius-ai-cloud` reasoning, but nothing short-lives it for you. The
      Terraform provider accepts only a Master API key (sent as Api-Key), so Terraform still
      needs a static key; the Flagsmith CLI supports the OIDC path. Human SAML, OIDC, LDAP and
      Okta login are not graded. The dashboard's trust-relationship panel sits behind a
      Flagsmith feature flag in the open-source frontend; we could not confirm from outside a
      login that it is on for every Cloud organisation, but the API endpoints are live and
      documented. Self-hosted and Enterprise run the same open-source exchange (lifetime set by
      TRUST_RELATIONSHIP_ACCESS_TOKEN_LIFETIME_SECONDS); non-admin trust relationships need the
      RBAC module.
  outbound:
    grade: B
    mechanism: >-
      GitHub through the Flagsmith GitHub App you install and Slack through OAuth consent;
      Datadog, New Relic, Dynatrace, Grafana, GitLab, Amplitude, Segment, RudderStack, Mixpanel
      and Heap take pasted keys or tokens, and bring-your-own ClickHouse and Databricks
      warehouses take a database password or a service-principal client secret.
    evidence:
      - url: https://docs.flagsmith.com/third-party-integrations/project-management/github
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "In GitHub, add the app from the GitHub Marketplace."
      - url: https://docs.flagsmith.com/third-party-integrations/project-management/slack
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "You will be sent to Slack to authenticate your account."
      - url: https://docs.flagsmith.com/third-party-integrations/observability-and-monitoring/datadog
        checked_on: 2026-11-04
