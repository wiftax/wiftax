        quote: "Add the Datadog API key into Flagsmith (Integrations > Add Datadog Integration)"
      - url: https://docs.flagsmith.com/third-party-integrations/observability-and-monitoring/new-relic
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "The Key type is User."
      - url: https://docs.flagsmith.com/third-party-integrations/observability-and-monitoring/dynatrace
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Log into Dynatrace create a new Access Token with the following permissions:"
      - url: https://docs.flagsmith.com/third-party-integrations/observability-and-monitoring/grafana
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Paste the service account token from Grafana into the Service account token field."
      - url: https://docs.flagsmith.com/third-party-integrations/project-management/gitlab
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "All require the api scope."
      - url: https://docs.flagsmith.com/third-party-integrations/project-management/gitlab
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Remember to rotate your GitLab access token before it expires."
      - url: https://docs.flagsmith.com/third-party-integrations/analytics/segment
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Paste the Write Key from step 1 into the API Key field in Flagsmith."
      - url: https://docs.flagsmith.com/third-party-integrations/analytics/amplitude
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Add the Amplitude API key into Flagsmith (Integrations > Add Amplitude Integration)"
      - url: https://docs.flagsmith.com/experimentation/connect-a-warehouse
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "the username and password of the user you created in step 1."
      - url: https://docs.flagsmith.com/experimentation/connect-a-warehouse
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "On Flagsmith Cloud, connecting your own ClickHouse or Databricks requires a Scale-Up or Enterprise subscription."
      - url: https://docs.flagsmith.com/experimentation/connect-databricks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Enter the Client ID and Client secret from step 2."
      - url: https://docs.flagsmith.com/experimentation/connect-databricks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Secrets expire after the lifetime you choose; see Rotate the secret."
      - url: https://docs.flagsmith.com/third-party-integrations/webhook
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "You can also provide a Secret which will be hashed and included in the HTTP header."
    notes: >-
      Flagsmith reaches into no AWS, GCP or Azure account, so the keyless side is the rubric's
      consent rule: the GitHub App (issues and pull requests) and the Slack app. Everything else
      wants a customer-made static credential. Some come with least-privilege guidance (Dynatrace
      "Ingest events" scope, ClickHouse grants limited to the events table, a Databricks service
      principal with only the sql scope and rotation steps), but the New Relic integration asks
      for a User key and GitLab for a token with the full api scope, and Datadog, Grafana and the
      analytics keys come with no scoping or rotation guidance. Databricks is OAuth M2M from a
      client secret you hand over (short-lived from a static root). Segment, RudderStack and
      Mixpanel keys are ingest write keys and Heap takes a non-secret environment ID. Outgoing
      webhooks are HMAC-signed with a secret you choose; that authenticates Flagsmith to you and
      grants it nothing. Jira works the other way round (you give Jira a Flagsmith key, an inbound
      credential); ServiceNow and Adobe Analytics are listed but not built; AppDynamics is APM
      for a self-hosted install. Self-hosted: GitHub needs a GitHub App you create and run
      yourself, and the S3 organisation import/export is a local management command.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Once API key expires, clients cannot use it anymore."
    notes: >-
      Master API keys have an optional expiry_date and server-side SDK keys an optional
      expires_at, both nullable. No default expiry and no org policy forcing one are documented.
  rotation_api:
    pass: true
    evidence:
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Manage server-side SDK keys for an environment."
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "If the API key is revoked, clients cannot use it anymore. (This cannot be undone.)"
      - url: https://docs.flagsmith.com/getting-started/run-locally-with-a-coding-agent
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Authenticate the CLI with an organisation API key, not `flagsmith login`: create one with `POST /api/v1/organisations/<id>/master-api-keys/`"
    notes: >-
      Server-side SDK keys have list, create, update and delete endpoints that accept a Master API
      key (or a federated token), so they rotate unattended. Master API keys can be created and
      revoked through /master-api-keys/, but only with a user's token: Flagsmith deliberately
      blocks machine credentials from managing machine credentials.
  scoping:
    pass: true
    evidence:
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "An API token acts with the permissions selected when it was created: either full organisation admin — able to manage all projects within that organisation — or a set of RBAC roles."
      - url: https://docs.flagsmith.com/administration-and-security/access-control/rbac
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Roles can be assigned to Management API keys, but Management API keys cannot belong to groups."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/sdks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "These keys are secret and should not be shared."
    notes: >-
      Master API keys belong to the organisation, not a user, and can carry RBAC roles instead of
      admin, but only on Scale-Up or Enterprise; on lower plans every Master API key is full org
      admin. Server-side SDK keys are bound to one environment and only read flags and write
      identities.
  last_used:
    pass: false
    evidence:
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
    notes: >-
      The MasterAPIKey schema has created, revoked, expiry_date and has_expired, and the
      EnvironmentAPIKey schema has created_at, active and expires_at; neither has a last-used
      field, and the docs describe none.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-11-04
        checked_by: tehreet
    notes: >-
      Flagsmith does not appear in GitHub's supported secret scanning patterns table (it would sit
      between Firebase and Flickr), so a leaked ser. key or Master API key pushed to a public repo
      is not reported to Flagsmith.

notes: >-
  One card for Flagsmith Cloud and self-hosted/Enterprise Flagsmith, which run the same
  open-source API, so the OIDC exchange is in both. Graded on Cloud. Headline B is set by
  outbound: it reaches A if the observability, GitLab and warehouse integrations move to app
  consent or federation. On inbound,
  the static keys still left are server-side SDK keys and Terraform's Master API key; enforced
  expiry, last-used and GitHub secret-scanning partnership would take hygiene from two of five.
