id: flagsmith
vendor: Flagsmith
product: Platform
covers: >-
  Flagsmith Cloud: the Management API, SDK API, CLI, Terraform provider and integrations. Notes also
  cover self-hosted and Enterprise, which run the same open-source API.
aliases:
  - Flagsmith Cloud
  - Bullet Train
website: https://www.flagsmith.com
docs: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
category: devtools
status: listed
summary: >-
  Your code can trade a token from any OIDC issuer you configure for a one-hour Flagsmith token, on
  every plan. Server-side SDK keys and Terraform still use static keys. GitHub and Slack connect by
  app consent, but most other integrations take pasted keys.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      Your workload posts a token from any OIDC issuer, matched on issuer, a required audience and
      optional claim rules. It gets back a one-hour token with org admin or chosen roles.
    issuers: ["any"]
    evidence:
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "To interact with the Management API, you need to authenticate your requests using an API Token associated with your Organisation, or a short-lived access token obtained through an OIDC trust relationship."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Trust relationships let a workload that already has an OIDC identity — for example, a GitHub Actions job — call the Management API without any stored secrets."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "The freeform option supports any OIDC identity provider, such as GitLab CI or Kubernetes:"
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Expected audience: the aud claim the token must carry."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Claim matching rules: additional claims the token must match."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Access tokens expire after one hour by default."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Granular permissions for your API tokens and OIDC trust relationships require an Enterprise or Scale-Up subscription."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/CLI
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Configure an OIDC trust relationship for your repository, then use the Flagsmith/setup-cli action:"
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Exchange an OIDC token issued by a trusted identity provider for a short-lived Flagsmith access token."
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "OIDC issuer URL expected in exchanged tokens' `iss` claim."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/sdks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Client-side SDK Keys give both client-side SDKs and server-side SDKs access to Remote Evaluation mode."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/sdks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Server-side SDK Keys give server-side SDKs access to Local Evaluation mode."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/flags-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "The Flags API uses a non-secret Environment Key for authentication."
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Manage server-side SDK keys for an environment."
      - url: https://docs.flagsmith.com/third-party-integrations/ci-cd/terraform
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "In order to configure the Flagsmith Terraform provider we need an API key."
      - url: https://github.com/Flagsmith/terraform-provider-flagsmith/blob/main/docs/index.md
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Master API key used by flagsmith api client."
      - url: https://docs.flagsmith.com/deployment-self-hosting/core-configuration/environment-variables
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "TRUST_RELATIONSHIP_ACCESS_TOKEN_LIFETIME_SECONDS: Lifetime of access tokens minted by the OIDC trust relationship token exchange."
    notes: >-
      Self-serve and documented for workloads. It works on every plan, so there is no tier gate.
      RBAC roles on it need Scale-Up or Enterprise, so on lower plans the token is org admin. Why A
      despite static keys: remote flag evaluation needs only the public Environment Key. Local
      evaluation and the Edge Proxy need a static server-side SDK key. A federated job can mint one
      with an expiry, as on the nebius-ai-cloud card. Terraform accepts only a Master API key. The
      dashboard panel may sit behind a feature flag, but the API is live and documented.
  outbound:
    grade: B
    mechanism: >-
      GitHub connects through the Flagsmith GitHub App and Slack through OAuth consent.
      Observability, analytics, GitLab and warehouse integrations take pasted keys, tokens or
      secrets.
    evidence:
      - url: https://docs.flagsmith.com/third-party-integrations/project-management/github
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "In GitHub, add the app from the GitHub Marketplace."
      - url: https://docs.flagsmith.com/third-party-integrations/project-management/slack
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "You will be sent to Slack to authenticate your account."
      - url: https://docs.flagsmith.com/third-party-integrations/observability-and-monitoring/datadog
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Add the Datadog API key into Flagsmith (Integrations > Add Datadog Integration)"
      - url: https://docs.flagsmith.com/third-party-integrations/observability-and-monitoring/new-relic
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "The Key type is User."
      - url: https://docs.flagsmith.com/third-party-integrations/observability-and-monitoring/dynatrace
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Log into Dynatrace create a new Access Token with the following permissions:"
      - url: https://docs.flagsmith.com/third-party-integrations/observability-and-monitoring/grafana
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Paste the service account token from Grafana into the Service account token field."
      - url: https://docs.flagsmith.com/third-party-integrations/project-management/gitlab
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "All require the api scope."
      - url: https://docs.flagsmith.com/third-party-integrations/project-management/gitlab
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Remember to rotate your GitLab access token before it expires."
      - url: https://docs.flagsmith.com/third-party-integrations/analytics/segment
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Paste the Write Key from step 1 into the API Key field in Flagsmith."
      - url: https://docs.flagsmith.com/third-party-integrations/analytics/amplitude
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Add the Amplitude API key into Flagsmith (Integrations > Add Amplitude Integration)"
      - url: https://docs.flagsmith.com/experimentation/connect-a-warehouse
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "the username and password of the user you created in step 1."
      - url: https://docs.flagsmith.com/experimentation/connect-a-warehouse
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "On Flagsmith Cloud, connecting your own ClickHouse or Databricks requires a Scale-Up or Enterprise subscription."
      - url: https://docs.flagsmith.com/experimentation/connect-databricks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Enter the Client ID and Client secret from step 2."
      - url: https://docs.flagsmith.com/experimentation/connect-databricks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Secrets expire after the lifetime you choose; see Rotate the secret."
      - url: https://docs.flagsmith.com/third-party-integrations/webhook
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "You can also provide a Secret which will be hashed and included in the HTTP header."
    notes: >-
      Flagsmith reaches into no AWS, GCP or Azure account, so the keyless side is the consent rule:
      the GitHub App and the Slack app. Everything else wants a static credential you create.
      Dynatrace, ClickHouse and Databricks come with least-privilege guidance. New Relic asks for a
      User key, GitLab for a full api-scope token, and Datadog and Grafana come with no guidance.
      Databricks issues short-lived tokens from a client secret you hand over. Webhooks are signed
      with a secret you choose, which grants Flagsmith nothing. Self-hosted GitHub needs a GitHub
      App you create yourself.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Once API key expires, clients cannot use it anymore."
    notes: >-
      Master API keys and server-side SDK keys have an optional expiry. There is no default and no
      org policy to force one.
  rotation_api:
    pass: true
    evidence:
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Manage server-side SDK keys for an environment."
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "If the API key is revoked, clients cannot use it anymore. (This cannot be undone.)"
      - url: https://docs.flagsmith.com/getting-started/run-locally-with-a-coding-agent
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Authenticate the CLI with an organisation API key, not `flagsmith login`: create one with `POST /api/v1/organisations/<id>/master-api-keys/`"
    notes: >-
      Server-side SDK keys can be managed with a Master API key or federated token, so they rotate
      unattended. Master API keys need a user's token, by design.
  scoping:
    pass: true
    evidence:
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api/authentication
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "An API token acts with the permissions selected when it was created: either full organisation admin — able to manage all projects within that organisation — or a set of RBAC roles."
      - url: https://docs.flagsmith.com/administration-and-security/access-control/rbac
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "Roles can be assigned to Management API keys, but Management API keys cannot belong to groups."
      - url: https://docs.flagsmith.com/integrating-with-flagsmith/sdks
        checked_on: 2026-11-04
        checked_by: tehreet
        quote: "These keys are secret and should not be shared."
    notes: >-
      Master API keys belong to the organisation and can carry RBAC roles, but only on Scale-Up or
      Enterprise. Otherwise each is full org admin. Server-side SDK keys are bound to one
      environment.
  last_used:
    pass: false
    evidence:
      - url: https://api.flagsmith.com/api/v1/swagger.json
        checked_on: 2026-11-04
        checked_by: tehreet
    notes: >-
      Neither key type records last use.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-11-04
        checked_by: tehreet
    notes: >-
      Flagsmith is not in GitHub's secret scanning partner list, so leaked keys are not reported to
      Flagsmith.

notes: >-
  Covers Flagsmith Cloud and self-hosted or Enterprise, which run the same open-source API and OIDC
  exchange. Graded on Cloud. Outbound sets the headline B. It reaches A if observability, GitLab and
  warehouse integrations move to consent or federation. Enforced expiry, last use and GitHub partner
  scanning would lift hygiene from two of five.
