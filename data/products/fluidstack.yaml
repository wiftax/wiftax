id: fluidstack
vendor: Fluidstack
product: Atlas
covers: "The Infrastructure and Management APIs, fluidctl, and managed Kubernetes and Slurm."
aliases:
  - fluidctl
website: https://www.fluidstack.io
docs: https://docs.fluidstack.io/kubernetes/access-clusters
category: cloud
status: listed
confidence:
  level: low
  reason: >-
    docs.fluidstack.io no longer resolves, so every receipt is a Wayback copy from February to July
    2026. How OAuth client credentials are issued, scoped and expired is not public. Neither gap
    could lift the F unless Kubernetes CI stops needing a long-lived token.
summary: >-
  To deploy from CI to Fluidstack's managed Kubernetes, your code holds a long-lived ServiceAccount
  token that works until someone deletes it. The Atlas API takes a token from SSO login or an OAuth
  client secret that Fluidstack issues. There is no workload federation.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      The Atlas APIs take a bearer token minted from an OAuth client ID and secret. Kubernetes CI
      uses a long-lived ServiceAccount token, since kubeconfigs need a browser SSO login.
    issuers: []
    evidence:
      - url: https://web.archive.org/web/20260711055141/https://docs.fluidstack.io/kubernetes/access-clusters
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For automation scenarios like CI/CD pipelines, GitHub Actions, or other headless runners where interactive browser authentication isn't possible, you can create a Kubernetes ServiceAccount with a long-lived token."
      - url: https://web.archive.org/web/20260711055141/https://docs.fluidstack.io/kubernetes/access-clusters
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The generated kubeconfig uses an exec-based credential plugin that automatically opens a browser for SSO authentication when you run kubectl commands."
      - url: https://web.archive.org/web/20260711055141/https://docs.fluidstack.io/kubernetes/access-clusters
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "ServiceAccount tokens are long-lived. If leaked, access persists until the token is manually revoked."
      - url: https://web.archive.org/web/20260214010414/https://docs.fluidstack.io/cli-reference/fluidctl
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "--client-secret string OAuth Client Secret"
      - url: https://web.archive.org/web/20260711060054/https://docs.fluidstack.io/cli-reference/auth/fluidctl_auth
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "-T, --token string Auth token"
      - url: https://web.archive.org/web/20260711043734id_/https://docs.fluidstack.io/redocusaurus/management-api.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "bearerFormat: JWT"
      - url: https://web.archive.org/web/20260711055850/https://docs.fluidstack.io/projects/manage-projects
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authorization: Bearer <token>"
      - url: https://web.archive.org/web/20260608212616/https://docs.fluidstack.io/lighthouse/authorization
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Fluidstack can provision static API keys that can be used to facilitate access to Fluidstack metrics from your internal Grafana instances."
      - url: https://web.archive.org/web/20260608212616/https://docs.fluidstack.io/lighthouse/authorization
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Contact Fluidstack to receive your OAuth credentials"
      - url: https://web.archive.org/web/20260711045002/https://docs.fluidstack.io/getting-started/sso
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Fluidstack supports SSO for the Fluidstack Console, allowing your organization to authenticate users through your existing identity provider."
    notes: >-
      Graded on the weakest path a workload must use, as on the coreweave-api and coreweave-cks
      cards. The control plane alone would be C, a short-lived token from a static client secret.
      But CI deploys to Fluidstack Kubernetes only through a long-lived ServiceAccount token. That
      is a static key, and 2 of 5 hygiene checks pass, so F. SSO is for human console logins only.
      Unlike CoreWeave, you cannot make a cluster's API server trust your own OIDC issuer. OIDC
      trust on clusters or token exchange into Atlas would move the grade.
  outbound:
    grade: N/A
    mechanism: >-
      The current docs describe no integration that reaches into your clouds, registries or SaaS.
      You push into Fluidstack, not the other way round.
    evidence:
      - url: https://web.archive.org/web/20260711060333/https://docs.fluidstack.io/api-reference/infrastructure-api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The regional API for Fluidstack"
      - url: https://web.archive.org/web/20260214005219/https://docs.fluidstack.io/api-reference/management-api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The global API for Fluidstack"
      - url: https://web.archive.org/web/20250325074300/https://docs.fluidstack.io/atlas/surge
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Seamless Integration - Works with existing ML pipelines through AWS SQS, RabbitMQ, and Redis triggers"
    notes: >-
      The Infrastructure and Management APIs, Kubernetes and Slurm guides, and Lighthouse pull
      nothing from your storage, registries or Hugging Face. The March 2025 docs described Surge, an
      inference service with AWS SQS and Redis triggers that would reach in. Its auth was never
      documented and it is gone from the 2026 docs. If Surge or data import is still sold, a
      reviewer should grade outbound.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://web.archive.org/web/20260711055141/https://docs.fluidstack.io/kubernetes/access-clusters
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "ServiceAccount tokens are long-lived. If leaked, access persists until the token is manually revoked."
      - url: https://web.archive.org/web/20260608212616/https://docs.fluidstack.io/lighthouse/authorization
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The token is valid for 24 hours (86400 seconds)."
    notes: >-
      The documented CI token never expires. OAuth access tokens last 24 hours, but no expiry is
      documented for the client secret or the metrics API key.
  rotation_api:
    pass: true
    evidence:
      - url: https://web.archive.org/web/20260711055141/https://docs.fluidstack.io/kubernetes/access-clusters
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Consider rotating tokens periodically by deleting and recreating the Secret."
      - url: https://web.archive.org/web/20260608212616/https://docs.fluidstack.io/lighthouse/authorization
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Both methods are opt-in, please reach out via standard support channels if you are interested in any of the options outlined in this page."
    notes: >-
      Passed on the credential that sets the grade, since kubectl can create and delete the
      ServiceAccount token. Fluidstack's own credentials come from support and would fail. Flipping
      this does not change the F.
  scoping:
    pass: true
    evidence:
      - url: https://web.archive.org/web/20260711055141/https://docs.fluidstack.io/kubernetes/access-clusters
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Grant the ServiceAccount the necessary permissions. You can restrict the token's capabilities by choosing a different role:"
      - url: https://web.archive.org/web/20260711055141/https://docs.fluidstack.io/kubernetes/access-clusters
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use namespace-scoped permissions when possible to limit blast radius."
      - url: https://web.archive.org/web/20260711051636/https://docs.fluidstack.io/kubernetes/manage-users
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Fine-grained RBAC is not supported at this time."
    notes: >-
      A ServiceAccount is a machine identity with its own namespace role, which counts. The "no
      fine-grained RBAC" line is about org members, whose admins get cluster-admin. OAuth client
      scoping is not documented.
  last_used:
    pass: false
    evidence:
      - url: https://web.archive.org/web/20260711055141/https://docs.fluidstack.io/kubernetes/access-clusters
        checked_on: 2026-10-22
        checked_by: tehreet
      - url: https://web.archive.org/web/20260711043734id_/https://docs.fluidstack.io/redocusaurus/management-api.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No last-used time is documented for ServiceAccount tokens, OAuth clients or metrics API keys.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Fluidstack is not in GitHub's secret scanning partner list, and ServiceAccount tokens have no
      vendor prefix.

notes: >-
  Covers Fluidstack's Atlas platform: the Infrastructure and Management APIs, fluidctl, managed
  Kubernetes and Slurm, and Lighthouse metrics. Support provisions clusters, not the API. Slurm LDAP
  is for humans. To leave F: let clusters trust your OIDC issuer for CI, offer token exchange into
  Atlas, make OAuth clients self-serve with good hygiene, and join GitHub partner scanning.
