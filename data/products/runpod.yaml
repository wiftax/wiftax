id: runpod
vendor: Runpod
product: GPU Cloud
covers: "Pods, Serverless, network volumes and the S3-compatible API."
aliases: ["RunPod", "Pods", "Runpod Serverless"]
website: https://www.runpod.io
docs: https://docs.runpod.io/get-started/credentials
category: cloud
status: listed
summary: >-
  Every way you drive Runpod, including the API, CLIs and GitHub Actions, uses a static API key.
  Network volumes over S3 need a second static key. Runpod pulls private ECR images without keys,
  but Cloud Sync and other registries take pasted keys.
surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static API key sent as a bearer token to the REST and GraphQL APIs and the CLIs. The S3 API
      for network volumes uses a separate static key pair.
    issuers: []
    evidence:
      - url: https://docs.runpod.io/api-reference-v2/overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All requests require a [Runpod API key](/get-started/credentials.md) in the request headers."
      - url: https://api.runpod.io/v2/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Runpod API key authentication. Generate an API key in the Runpod console and send it in the `Authorization` header as `Bearer <api_key>`."
      - url: https://docs.runpod.io/get-started/credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authenticate requests to the Runpod API, CLI, and SDKs."
      - url: https://docs.runpod.io/runpodctl/reference/runpodctl-config.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Your Runpod API key, which authenticates the CLI to access your account."
      - url: https://docs.runpod.io/flash/cli/login.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "After successful login, your API key is saved to `~/.runpod/config.toml`."
      - url: https://docs.runpod.io/serverless/workers/github-integration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "runpod-api-key: ${{ secrets.RUNPOD_API_KEY }} # Add your API key to a GitHub secret"
      - url: https://docs.runpod.io/storage/s3-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Next, you'll need to generate a new key called an \"S3 API key\" (this is separate from your Runpod API key)."
      - url: https://docs.runpod.io/llms-full.txt
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No OIDC, workload identity or token exchange exists anywhere in the docs or API specs.
      Runpod's own GitHub Actions example stores the key as a secret. The CLI browser logins just
      mint and save an API key. The S3 key is weaker, with no expiry, scoping or last use. It is
      optional, since Pods can mount volumes directly, so the card is graded on the API key. One
      card covers the vendor, since Runpod has no managed Kubernetes or registry.
  outbound:
    grade: B
    mechanism: >-
      Private ECR pulls are keyless through a repository policy that trusts Runpod's AWS roles.
      Cloud Sync, other registries and Hugging Face take pasted credentials. GitHub deploys use an
      installed GitHub App.
    evidence:
      - url: https://docs.runpod.io/tutorials/pods/use-private-ecr-images.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You configure cross-account IAM delegation so Runpod can pull images on your behalf, with no credential sharing required and no expiring tokens to manage."
      - url: https://docs.runpod.io/tutorials/pods/use-private-ecr-images.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The `aws:PrincipalArn` values are Runpod's fixed AWS deployment roles."
      - url: https://docs.runpod.io/api-reference-v2/registries/register-an-ecr-delegation.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Register an Amazon ECR delegation that lets Runpod pull private container images from your AWS registry for Pods and Serverless endpoints."
      - url: https://docs.runpod.io/pods/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter your **AWS Access Key ID** and **Secret Access Key** in the provided fields."
      - url: https://docs.runpod.io/pods/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Paste the entire contents of your Service Account JSON key into the provided field."
      - url: https://docs.runpod.io/pods/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter your **Azure Account Name** and **Account Key** in the provided fields."
      - url: https://docs.runpod.io/runpodctl/reference/runpodctl-registry.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For Google Artifact Registry or gcr.io, set `--username` to the literal `_json_key` and feed the multi-line service-account JSON key file through `--password-stdin`."
      - url: https://docs.runpod.io/get-started/credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter a name, the registry URL, your username, and your password or access token."
      - url: https://docs.runpod.io/serverless/endpoints/model-caching.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you're using a gated model, you'll need to enter a [Hugging Face access token](https://huggingface.co/docs/hub/en/security-tokens)."
      - url: https://docs.runpod.io/serverless/workers/github-integration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Uninstall \"Runpod Inc.\""
    notes: >-
      ECR is the one keyless cloud path, which makes this B rather than D or F. Cloud Sync is the
      worst. It asks you to paste an AWS access key, a GCP service-account JSON or an Azure storage
      key. GCP and Azure have no keyless option anywhere. A reviewer should check the ECR design.
      The policy trusts Runpod's shared roles with no External ID, so another Runpod account that
      knows the repository could register it. That is a confused-deputy gap, but still keyless, so
      not graded down. The GitHub App counts as keyless.
hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.runpod.io/get-started/credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Give your key a name and set its permissions (**All**, **Restricted**, or **Read Only**)."
      - url: https://graphql-spec.runpod.io/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "isLegacy - Boolean"
      - url: https://docs.runpod.io/release-notes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Least-privilege tokens with fine-grained scopes and expirations for safer automation."
    notes: >-
      A 2024 release note promised expirations, but key creation asks only for a name and
      permissions. No lifetime or policy is enforced, unlike temporal's cap. Disabling a key is not
      expiry.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.runpod.io/get-started/credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Click **Revoke Key** to confirm."
      - url: https://graphql-spec.runpod.io/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "RunPod API spec includes most common GraphQL types, queries, and mutations to manage your pods."
      - url: https://docs.runpod.io/api-reference-v2/overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use it to create and manage Pods, query Serverless endpoints, provision storage, and retrieve billing data"
    notes: >-
      Keys are created and revoked only in the console. Neither API can mint or revoke keys. Account
      secrets rotate by API, but those are values Runpod stores, not credentials it issues.
  scoping:
    pass: true
    evidence:
      - url: https://api.runpod.io/v2/openapi.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Keys are scoped to the permissions granted when created; requests may return `403` when a valid key lacks access to the requested resource or action."
      - url: https://docs.runpod.io/get-started/credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To improve security, generate a new key with **Restricted** permission and select the minimum permission needed for your use case."
      - url: https://docs.runpod.io/get-started/credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Read/Write**: Full access to your endpoints."
    notes: >-
      There is no machine account, but each key can be narrower than its owner: read-only, or
      restricted per API and per Serverless endpoint. Keys made before November 2024 have full
      access. S3 keys have no scoping.
  last_used:
    pass: true
    evidence:
      - url: https://graphql-spec.runpod.io/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "lastUsed - DateTime"
    notes: >-
      The GraphQL API shows a last-used time for each key, so dead keys can be found. S3 keys have
      nothing similar.
  leak_revocation:
    pass: true
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "| RunPod | RunPod API Key | runpod_api_key | ✓ | ✓ | ✓ | ✓ | ✓ | ✗ |"
    notes: >-
      GitHub reports Runpod API keys pushed to public repos to Runpod. S3 keys are not covered.
notes: >-
  Covers the whole vendor, since every product uses the same API key. Inbound moves to B or A only
  with federation. Outbound moves to A with keyless Cloud Sync and registry pulls, and ECR should
  add an External ID. REST API v1 retires on 2026-11-15, and this card grades v2.
