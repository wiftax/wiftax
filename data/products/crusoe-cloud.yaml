id: crusoe-cloud
vendor: Crusoe
product: Cloud
covers: "VMs, Managed Kubernetes, Object Storage and Container Registry, via the API, CLI and Terraform."
aliases: ["Crusoe Cloud"]
website: https://crusoe.ai
docs: https://docs.crusoecloud.com/reference/api/
category: cloud
status: listed
summary: >-
  Every way a workload drives Crusoe Cloud starts from a static key. The API, CLI and Terraform use
  an HMAC-signed key pair with its creator's full permissions. There is no OIDC login. Crusoe
  reaches your AWS and GCP KMS keys without a secret, but its registry cache wants pasted keys.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static per-user API key pair that HMAC-signs every request, shared by the API, CLI and
      Terraform. Object Storage and the registry use separate static keys or tokens.
    issuers: []
    evidence:
      - url: https://docs.crusoecloud.com/reference/api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In order to authenticate to Crusoe Cloud's API, you must sign all requests using the following algorithm."
      - url: https://docs.crusoecloud.com/reference/api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API access key ID and secret key"
      - url: https://docs.crusoecloud.com/identity-and-security/managing-api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You need to create an API access key to access the Crusoe Cloud API."
      - url: https://docs.crusoecloud.com/installing-the-cli.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To authenticate with the Crusoe CLI, you will need an API access key ID and a secret key."
      - url: https://docs.crusoecloud.com/infrastructure-cloud/terraform.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "At a minimum, the following options are required to authenticate to the Crusoe API:"
      - url: https://raw.githubusercontent.com/crusoecloud/terraform-provider-crusoe/main/docs/index.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When specified, credentials and default_project are loaded from this profile."
      - url: https://docs.crusoecloud.com/storage/object-storage/overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Object Storage uses dedicated AWS S3 style API keys (an access key and secret key pair) for authentication."
      - url: https://docs.crusoecloud.com/container-registry/using-with-k8s.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "First, generate a new, long-lived token for your cluster to use."
      - url: https://docs.crusoecloud.com/container-registry/token-rotator.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Uses your CMK cluster's Crusoe API credentials to generate a new short-lived registry token."
      - url: https://docs.crusoecloud.com/orchestration/cmk/cluster-details.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "CMK cluster identity is currently decoupled from Crusoe identity and roles."
      - url: https://docs.crusoecloud.com/api/v1alpha5/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This configures how users authenticate to the Kubernetes API server."
    notes: >-
      Graded on the weakest required path, as on the CoreWeave cards. Creating VMs, clusters,
      buckets or registry tokens all needs the static API key, so nothing downstream lifts the
      grade. Registry tokens can be short-lived, but they are minted from that key, so C at best. An
      alpha OIDC setting on managed Kubernetes is for human kubectl logins, not workloads, so it
      does not count. Console SSO is human-only. Hygiene is graded on the API key.
  outbound:
    grade: B
    mechanism: >-
      For customer-managed encryption keys, Crusoe assumes an AWS role with an External ID or uses
      GCP federation. Registry pull-through caches store a pasted long-lived credential for each
      private upstream.
    evidence:
      - url: https://docs.crusoecloud.com/container-registry/managing-repositories.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When you create a repository in pull-through cache mode, you must specify an upstream registry `provider` and `url`, and if applicable, a `username` and `password`."
      - url: https://docs.crusoecloud.com/container-registry/managing-repositories.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Entire service account JSON key file"
      - url: https://docs.crusoecloud.com/container-registry/managing-repositories.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "IAM user's access key ID | IAM user's secret key"
      - url: https://docs.crusoecloud.com/identity-and-security/customer-managed-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Crusoe uses it at runtime through role assumptions (AWS) or workload identity federation (GCP) that you control."
      - url: https://docs.crusoecloud.com/identity-and-security/customer-managed-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Trusts Crusoe's `CrusoeCMEK` role to assume it, with your Crusoe project ID as the `ExternalId`, for tenant isolation."
      - url: https://docs.crusoecloud.com/identity-and-security/customer-managed-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Crusoe exchanges a short-lived Google ID token (bearing the audience `crusoe-cmek/<crusoe-project-id>`) at the OIDC provider, uses the service account, and calls Encrypt and Decrypt on your key."
      - url: https://docs.crusoecloud.com/command-center/telemetry-conduit.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Your external platform scrapes the endpoint to retrieve metrics."
    notes: >-
      Customer-managed keys serve only Serverless Fine-Tuning today, but every documented
      integration counts. On AWS and GCP they are keyless. The registry pull-through cache is the
      other reach-in. Every private upstream wants a static secret, such as an IAM user key for ECR
      or a JSON key for GAR, with no least-privilege or rotation guidance. Keyless on one cloud plus
      static keys elsewhere is B. Keyless upstream auth for ECR, GAR and ACR would make it A.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.crusoecloud.com/identity-and-security/managing-api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "(Optional) Enter an expiration date for your key."
      - url: https://docs.crusoecloud.com/storage/object-storage/managing-storage-api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`expire_at` is an optional argument that specifies an expiration date for the key in RFC 3339 format"
    notes: >-
      Expiry is optional in the Console. The API requires a date but sets no maximum or policy, so
      any far-future date works. A settable expiry that cannot be enforced fails, as on
      coreweave-object-storage.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.crusoecloud.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create a new token owned by the logged in user."
      - url: https://docs.crusoecloud.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Delete an API token owned by the logged in user."
      - url: https://docs.crusoecloud.com/storage/object-storage/overview.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Object Storage API keys cannot be rotated in place. Customers must create a new key and delete the old one."
    notes: >-
      The API can create and delete keys, and the CLI and Terraform do the same for Object Storage
      keys. Each user manages only their own.
  scoping:
    pass: false
    evidence:
      - url: https://docs.crusoecloud.com/identity-and-security/managing-organization-users.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All tokens inherit the permissions of the user who created them."
      - url: https://docs.crusoecloud.com/storage/object-storage/managing-storage-api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can use object storage API keys in all buckets in all projects within your organization."
    notes: >-
      Roles attach to users, and a key cannot carry less than its creator. No service account type
      exists. Registry tokens are limited but rooted in the full-permission key.
  last_used:
    pass: true
    evidence:
      - url: https://docs.crusoecloud.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Retrieve all active/expired API tokens for the logged in user."
      - url: https://docs.crusoecloud.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "\"last_used\": \"2021-11-03T22:22:55Z\""
    notes: >-
      The API returns a last-used time for each Cloud API key, per user only. Object Storage keys
      show none.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Crusoe is not in GitHub's secret-scanning table, partner or otherwise.

notes: >-
  One card for the platform, since every service starts from the same API key. Managed AI uses
  separate keys and is not graded inbound, but its key integration counts outbound. The cheapest
  fixes are service accounts with their own roles, an enforced key lifetime and a GitHub
  secret-scanning partnership.
