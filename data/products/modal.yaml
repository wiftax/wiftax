id: modal
vendor: Modal
product: Platform
covers: "Serverless GPU compute: Functions, Sandboxes, the SDK and CLI."
aliases:
  - Modal Functions
  - Modal Sandboxes
website: https://modal.com
docs: https://modal.com/docs/guide/service-users
category: cloud
status: listed
summary: >-
  Your CI jobs drive Modal with a static token id and secret, with no OIDC login. Team-plan service
  users are scoped, rotatable and show last use, but never expire by default. Outbound, S3 and ECR
  are keyless, but GCS, Artifact Registry, Azure and R2 need pasted keys.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static token id and secret, owned by a member or a service user, used by the SDKs and CLI
      for every call. No OIDC or token exchange exists.
    issuers: []
    tier_gated: Team (service users and RBAC)
    evidence:
      - url: https://modal.com/docs/reference/modal.config
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Modal API tokens use MODAL_TOKEN_ID and MODAL_TOKEN_SECRET."
      - url: https://modal.com/docs/reference/modal.config
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Third-party OAuth integrations typically inject MODAL_OAUTH_REFRESH_TOKEN,"
      - url: https://modal.com/docs/sdk/py/latest/Client.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Constructor based on OAuth credentials; useful for managing Modal on behalf of third-party users."
      - url: https://modal.com/docs/guide/service-users
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service users are programmatic accounts that allow automated systems to interact with Modal."
      - url: https://modal.com/docs/guide/service-users
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Because service user tokens are long-lived and used in automated environments, it's important to limit their access to only what's necessary"
      - url: https://modal.com/docs/guide/service-users
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service users are available on the Team and Enterprise plans."
      - url: https://modal.com/docs/guide/continuous-deployment
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This requires you to create a Modal token and add it as a secret for your Github Actions workflow."
      - url: https://modal.com/docs/guide/workspaces
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To interact with a Workspace's resources programmatically, you need to add an API token for that Workspace."
      - url: https://modal.com/docs/cli/latest/workspace.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Proxy tokens provide authentication to Modal Endpoints, Servers, and Web Functions."
    notes: >-
      One API covers the control and data planes, so there is no weaker side path. The GitHub
      Actions guide stores the token as repository secrets, and no doc describes trading an OIDC
      token for a Modal credential. Modal's OAuth client path is for platforms acting for users. It
      rests on a static client secret and does not apply to your own workloads. Code inside Modal
      reaching Modal is ambient identity and does not earn an A. Graded on Team-plan service users.
      Without them a workload holds a member token with that person's full access, which fails
      scoping and makes F.
  outbound:
    grade: B
    mechanism: >-
      Modal is an OIDC issuer, and S3 mounts and ECR pulls use its tokens to assume an AWS role.
      GCS, R2, Artifact Registry, Azure, Docker Hub and OpenTelemetry take static keys.
    evidence:
      - url: https://modal.com/docs/guide/oidc-integration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "With the Modal OIDC integration, you can instead use automatically-generated identity tokens to authenticate to external services."
      - url: https://modal.com/docs/guide/oidc-integration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Generated tokens are automatically injected into your Function's containers via the MODAL_IDENTITY_TOKEN environment variable."
      - url: https://modal.com/docs/guide/oidc-integration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Note how we use workspace_id to limit the scope of the role."
      - url: https://modal.com/docs/guide/oidc-integration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "At this time, OIDC-authenticated container image pulling is only support with AWS ECR."
      - url: https://modal.com/docs/guide/cloud-bucket-mounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Modal provides OIDC integration and will automatically generate identity tokens to authenticate to AWS."
      - url: https://modal.com/docs/guide/cloud-bucket-mounts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "It supports AWS S3, Cloudflare R2, and Google Cloud Storage buckets."
      - url: https://modal.com/docs/sdk/py/latest/CloudBucketMount.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "GCS Buckets also require a secret with Google-specific key names (see below) populated with"
      - url: https://modal.com/docs/guide/private-registries
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Alternatively, you can use OIDC token authentication."
      - url: https://modal.com/docs/guide/private-registries
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Modal doesn't have native Azure support, but you can pull images from a private ACR using"
      - url: https://modal.com/docs/sdk/py/latest/Image.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret containing ``SERVICE_ACCOUNT_JSON`` for registry authentication."
      - url: https://modal.com/docs/guide/datadog-integration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Connecting this integration creates an API key in your Datadog account, which requires Datadog org owner permissions."
      - url: https://modal.com/docs/guide/otel-integration
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This is the key that the Modal integration will use to authenticate with your provider."
    notes: >-
      On AWS you register Modal's issuer and trust a role on the token's sub claim, such as a
      workspace or App. GCP has no platform path: GCS mounts take an HMAC key and Artifact Registry
      a JSON key. Your own Function code could federate into GCP or Azure by hand, but no
      walkthrough exists. Azure registries, R2 and Docker Hub take long-lived tokens. Datadog uses a
      browser consent flow, counted as keyless. Keyless on AWS with static keys elsewhere is B. A
      GCP federation path would make it A.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://modal.com/docs/cli/latest/workspace.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "the newly created Service User will never expire."
      - url: https://modal.com/docs/cli/latest/token.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Lifetime of the new token, e.g. 12h, 7d, or 90d. Defaults to the workspace's maximum allowed lifetime."
      - url: https://modal.com/docs/guide/audit-logs
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A workspace's maximum member API token lifetime was updated. Before/after values in seconds are recorded in the event metadata; an unset value means no cap."
    notes: >-
      Service user tokens take an optional expiry and default to never, and no policy forces one. A
      workspace cap covers member tokens, unset by default. Whether it binds service users is
      unverifiable. Inbound stays D either way.
  rotation_api:
    pass: true
    evidence:
      - url: https://modal.com/docs/guide/service-users
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Finally, you can also create a new Service User directly from Python:"
      - url: https://modal.com/docs/guide/service-users
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Deleting a Service User will immediately revoke the credentials associated with that Service User."
    notes: >-
      The SDK and CLI create and delete service users without a browser. Each holds one token, so
      rotation means replacing the service user and re-granting its roles.
  scoping:
    pass: true
    evidence:
      - url: https://modal.com/docs/guide/service-users
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For enhanced security, by default a Service User has no access to any of the Environments in the Workspace."
      - url: https://modal.com/docs/guide/rbac
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Unlike human users, service users do not have a Workspace-level role; their access is controlled entirely through Environment Roles."
    notes: >-
      Service users are machine identities that start with no access and get Viewer or Contributor
      per Environment, which counts. Member tokens inherit the person's role. Requires the Team
      plan.
  last_used:
    pass: true
    evidence:
      - url: https://modal.com/docs/sdk/py/latest/types.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A lightweight dataclass containing metadata about a Modal Service User."
      - url: https://modal.com/docs/sdk/py/latest/types.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "name=\"last_used_at\""
      - url: https://modal.com/docs/sdk/py/latest/Workspace.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A list of `ServiceUserInfo` dataclasses."
    notes: >-
      The SDK returns a last-used time for each service user, so idle ones can be found by script.
      No guide text describes it.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Modal is not on GitHub's secret-scanning list, though its tokens carry greppable prefixes.

notes: >-
  One card, since everything sits behind one API and token type. Three of five checks pass, all on
  Team-plan service users. The top fix is letting service users accept an OIDC token, since Modal
  already runs an issuer.
