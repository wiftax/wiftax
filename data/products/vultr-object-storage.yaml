id: vultr-object-storage
vendor: Vultr
product: Object Storage
covers: The S3-compatible object storage API.
website: https://www.vultr.com
docs: https://docs.vultr.com/products/storage/object-storage/management/manage-credentials
category: cloud
status: listed
summary: >-
  This card covers object storage only. Apps use the subscription's static S3 access key and secret,
  with no documented expiry, scoping or last-used time. The control plane is graded on the
  vultr-cloud card.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      One static S3 access key and secret per subscription, which the API can regenerate. No
      federated or temporary credentials are documented.
    issuers: []
    evidence:
      - url: https://docs.vultr.com/products/storage/object-storage/management/manage-credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "These credentials include the hostname, secret key, and access key."
      - url: https://docs.vultr.com/products/storage/object-storage/management/manage-credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Your apps use these credentials to authenticate to the Vultr Object Storage subscription programmatically."
      - url: https://docs.vultr.com/products/storage/object-storage/faq.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You need your Vultr Object Storage subscription credentials to access the files."
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Object Storage is S3 API compatible."
      - url: https://docs.vultr.com/platform/iam/policies/iam-policy-actions-map/storage-actions.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Get user S3 keys"
    notes: >-
      Nothing in the Object Storage docs swaps an OIDC token or role session for S3 keys. Some hints
      point that way. IAM lists object-level actions and per-user S3 keys, and role sessions return
      an empty S3 credentials field. Neither is explained in public docs, so neither is graded. If
      role sessions are documented to return short-lived, scoped S3 keys, this would move to C or
      better. Only 1 of 5 hygiene checks passes, so F.
  outbound:
    grade: N/A
    mechanism: >-
      Object Storage never needs access into your infrastructure.
    evidence:
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Objects uploaded to object storage can be accessed privately or publicly on the web."
      - url: https://docs.vultr.com/how-to-migrate-amazon-s3-storage-to-vultr-object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Rclone is an open-source application used to manage and migrate cloud storage solutions."
    notes: >-
      In the migration guides you run rclone yourself, so Vultr never holds your source credentials.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.vultr.com/products/storage/object-storage/management/manage-credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Regenerate the keys for an Object Storage."
    notes: >-
      S3 keys have no documented expiry. They last until regenerated.
  rotation_api:
    pass: true
    evidence:
      - url: https://www.vultr.com/api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Regenerate the keys for an Object Storage."
      - url: https://docs.vultr.com/products/storage/object-storage/management/manage-credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Regenerate the keys by specifying a Vultr object storage subscription ID if you need a fresh copy of the credentials."
    notes: >-
      One API call replaces the key pair. There is only one pair, so the old key dies at once and
      rotation cannot overlap.
  scoping:
    pass: false
    evidence:
      - url: https://docs.vultr.com/products/storage/object-storage/management/manage-credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Managing S3 Credentials for Vultr Object Storage subscription allows viewing and regenerating access credentials for S3-compatible storage buckets."
    notes: >-
      The documented key pair reaches every bucket in the subscription. Per-user scoped keys may
      exist, but no public doc says how to create them.
  last_used:
    pass: false
    evidence:
      - url: https://docs.vultr.com/products/storage/object-storage/management/manage-credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No last-used time is documented for S3 keys.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Vultr is not in GitHub's secret scanning patterns.

notes: >-
  Split from vultr-cloud because the credential differs. The fix is to document short-lived S3 keys
  from IAM role sessions, with per-key scoping, expiry and a last-used time.
