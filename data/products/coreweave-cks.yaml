id: coreweave-cks
vendor: CoreWeave
product: Kubernetes Service
aliases:
  - CKS
website: https://www.coreweave.com
docs: https://docs.coreweave.com/products/cks/auth-access/workload-identity/introduction
category: cloud
status: listed
summary: >-
  This card covers the cluster API server, not the control plane. In unmanaged auth mode, a cluster
  trusts any OIDC issuer you configure. Each cluster is also an OIDC issuer your clouds can trust.
  The default managed mode uses the static token graded F on the coreweave-api card.
surfaces:
  inbound:
    grade: A
    mechanism: >-
      In unmanaged auth, the API server trusts an OIDC issuer you configure or Kubernetes
      service-account tokens. The default managed auth puts a Console API token in a kubeconfig.
    issuers:
      - any
    evidence:
      - url: https://docs.coreweave.com/docs/products/cks/reference/cks-api
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: OpenID Connect (OIDC) configuration for authentication to the cluster's api-server.
      - url: https://docs.coreweave.com/docs/products/cks/reference/cks-api
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          The whole object is optional on the cluster, but when supplied, issuerUrl and clientId are
          required within it.
      - url: https://docs.coreweave.com/docs/products/cks/reference/cks-api
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: A claim that must be present on every token for authentication to succeed.
      - url: https://docs.coreweave.com/docs/products/cks/clusters/create
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          To enable OIDC, the Issuer URL and Client ID fields are required. All other fields are
          optional.
      - url: https://docs.coreweave.com/docs/changelog/release-notes/unmanaged-auth
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Unmanaged authentication API for CKS clusters, enabling OIDC, Service Account, and Webhook
          authentication
      - url: >-
          https://docs.coreweave.com/support/cks/articles/what-is-the-difference-between-managed-auth-and-unmanaged-auth.md
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Managed auth is the default.
    notes: >-
      Any issuer with a discovery document works. The client ID pins the audience, and required
      claims constrain the subject. It can be turned on for existing clusters. Two caveats. The A
      requires opting in to unmanaged auth, since managed auth is the default. Turning it on is a
      control-plane call that needs the static token. Private clusters need CoreWeave Support.
  outbound:
    grade: A
    mechanism: >-
      Every CKS cluster is a public OIDC issuer. Workloads present their service-account tokens to
      AWS, GCP or any OIDC-trusting service, so CoreWeave holds no cloud credential.
    evidence:
      - url: https://docs.coreweave.com/products/cks/auth-access/workload-identity/introduction
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Each CKS cluster acts as an OIDC identity provider (IdP) that issues secure tokens to
          workloads running under specific Kubernetes Service Accounts.
      - url: https://docs.coreweave.com/products/cks/auth-access/workload-identity/introduction
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          CKS publishes a public OIDC Document Discovery URL even for clusters whose API endpoints
          aren't exposed to the internet.
      - url: https://docs.coreweave.com/products/cks/auth-access/workload-identity/introduction
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          OIDC Workload Identity is generally available and enabled by default on every CKS cluster,
          including sandbox clusters. No action is required to turn it on, and it can't be disabled.
      - url: https://docs.coreweave.com/docs/changelog/release-notes/oidc-workload-identity-federation
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Multi-cloud authentication: Authenticate CKS workloads to AWS, GCP, and other
          OIDC-compatible services.
    notes: >-
      CKS has no integrations that pull from your cloud. It is itself an OIDC issuer you can trust,
      which the rubric scores A. AWS and GCP have guides. Azure accepts any public issuer, but
      CoreWeave has no Azure guide.
hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/managed-auth/kubeconfig
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Tokens have an expiration date, so a token that worked previously can expire between
          sessions.
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/manage-api-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Expiration How long the token remains valid.
    notes: >-
      Hygiene is graded on the managed-auth kubeconfig, which embeds a static API token. The
      expiry's default, maximum and enforcement are undocumented.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/manage-api-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: You can view or delete Access Tokens on the Access Tokens dashboard
    notes: Tokens and kubeconfigs are minted and revoked only in the Cloud Console.
  scoping:
    pass: false
    evidence:
      - url: >-
          https://docs.coreweave.com/support/cks/articles/where-do-i-find-my-api-access-tokens-in-the-cloud-console.md
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          user-scoped and grant permissions to deploy CKS clusters and VPCs, access cluster metrics,
          and authenticate against the managed-auth endpoint.
    notes: >-
      The kubeconfig targets one cluster, but its token is the user's full control-plane token. A
      leaked kubeconfig leaks more than cluster access.
  last_used:
    pass: false
    evidence:
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/manage-api-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
    notes: No last-used time is documented for tokens or kubeconfigs. Graded conservatively.
  leak_revocation:
    pass: false
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-11-09
        checked_by: sisyphus
    notes: CoreWeave is not on GitHub's secret-scanning list.
notes: >-
  Home team, graded on the same rubric. The A holds only if you switch the cluster to unmanaged
  auth. The default is the control-plane token in a kubeconfig, with the hygiene shown above.
