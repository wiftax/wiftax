id: gitguardian-platform
vendor: GitGuardian
product: GitGuardian Platform (API, ggshield)
website: https://www.gitguardian.com
docs: https://docs.gitguardian.com/api-docs/authentication
category: security
status: listed
summary: >-
  The secrets-detection company authenticates your CI jobs with a static API key you store as a CI
  secret; service accounts can be set to never expire, and GitGuardian is not a GitHub secret-scanning
  partner for its own keys. Outbound it is ahead of its inbound: it is an OIDC issuer for AWS, GCP and
  Entra, but GitLab, Bitbucket, Azure Repos and most registries still want a pasted token.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      Static API keys only: a service account token (Business plan) or a personal access token, sent
      as "Authorization: Token <key>"; no workload federation is accepted.
    evidence:
      - url: https://docs.gitguardian.com/api-docs/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The GitGuardian API uses API keys to authenticate requests."
      - url: https://docs.gitguardian.com/api-docs/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Your API key must be kept private and should neither be embedded directly in the code nor versioned in Git."
      - url: https://docs.gitguardian.com/ggshield-docs/integrations/cicd-integrations/github-actions
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Add this API key to the GITGUARDIAN_API_KEY environment variable in your project settings."
      - url: https://docs.gitguardian.com/api-docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Please note that service accounts are only available for workspaces under our Business plan."
      - url: https://api.gitguardian.com/v1/openapi.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Usage:** `Token <api-key>` in `Authorization` header."
      - url: https://api.gitguardian.com/v1/openapi.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Optional lifetime of the resulting personal access token, in days. `0` means it never expires."
    notes: >-
      The public OpenAPI spec defines a single security scheme (the static "Token" key). The OAuth2
      endpoints it documents (/v1/oauth/token, dynamic client registration) are an authorization-code
      + PKCE flow for interactive MCP clients that mints a personal access token, which can itself be
      non-expiring; there is no client-credentials or token-exchange grant. /v1/auth/jwt mints a
      short-lived JWT only for HasMySecretLeaked and requires an API key to call. ggshield in CI
      (GitHub Actions, GitLab, Jenkins, etc.) is documented only with GITGUARDIAN_API_KEY stored as a
      CI secret, despite GitHub and GitLab both issuing OIDC tokens to the same jobs. The deployable
      ggscout collector (NHI inventory, secrets-manager sync) also authenticates back with a static
      GitGuardian API token ("GitGuardian API token with NHI permissions"). Free-plan users get
      personal access tokens only; service accounts are Business-plan.
  outbound:
    grade: B
    mechanism: >-
      GitGuardian acts as its own OIDC issuer for AWS (IAM role via AssumeRoleWithWebIdentity), GCP
      (Workload Identity Federation) and Entra (federated credential), plus External ID roles for ECR
      and vendor-app installs for GitHub, Slack, Teams, Jira and Confluence Cloud; GitLab, Bitbucket,
      Azure Repos, Docker Hub, ACR, JFrog and ServiceNow still want a customer-created token or password.
    evidence:
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/file-storage-integrations/aws-s3
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Rather than using long-lived credentials, GitGuardian's SaaS platform assumes a read-only IAM role in your own AWS account."
      - url: https://docs.gitguardian.com/nhi-governance/aws-iam-integration
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Create an AWS role that trusts the GitGuardian OIDC provider."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/container-registries-integrations/amazon-ecr
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "To set up the Amazon ECR integration, you shall create an IAM role in your AWS account, and configure it with an AWS External ID generated by GitGuardian for your workspace."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/container-registries-integrations/google-artifact-registry
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Option 2 is the recommended one: no long-lived secret leaves your Google Cloud organization, and a folder or organization scope covers projects that you create later."
      - url: https://docs.gitguardian.com/nhi-governance/azure-entra-integration
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "No Long-Lived Secrets: The integration uses Workload Identity Federation, eliminating the need for client secrets"
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The GitGuardian GitHub app has only read access to your code."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/messaging-integrations/microsoft-teams
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "GitGuardian integrates with Microsoft Teams via an Entra ID Enterprise application with read-only access to your channels."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/messaging-integrations/slack
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "GitGuardian natively integrates with Slack via the GitGuardian or GitGuardian EU application on Slack Marketplace."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/gitlab
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "only personal access tokens are currently supported. Other types of tokens (like group access tokens) are not supported."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/bitbucket-cloud
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The API token must be generated by the Workspace Owner of the workspace(s) you intend to monitor."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/azure-repos
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Azure DevOps Repos integration requires a personal access token for GitGuardian to be able to access your Azure Repos organizations/collections for analysis."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/container-registries-integrations/docker-hub
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "GitGuardian integrates with Docker Hub via a Personal Access Token with read-only access to your repositories."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/github-enterprise
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Instead, you will need to create a separate GitHub App on your own GitHub Enterprise Server instance."
    notes: >-
      Checked: GitHub (vendor GitHub App, keyless); GitHub Enterprise Server (customer-created GitHub
      App, so the customer holds the app's private key); GitLab (personal access token with api scope,
      bot user recommended); Bitbucket Cloud (Atlassian API token with listed scopes); Bitbucket Server
      and Azure Repos (personal access tokens); Slack, Microsoft Teams, SharePoint/OneDrive, Jira Cloud
      and Confluence Cloud (vendor app install / admin consent, keyless); ServiceNow (a generated
      password for a GitGuardian user); AWS S3 and AWS IAM NHI (GitGuardian OIDC issuer +
      AssumeRoleWithWebIdentity, keyless); Amazon ECR (IAM role with External ID, keyless); Google
      Artifact Registry (WIF keyless, recommended, or an optional service-account JSON key); Entra NHI
      (federated credential, keyless); Azure Container Registry (ACR repository token), Docker Hub
      (PAT), JFrog (access token) - static. Grade is B: keyless into every cloud it reaches, static
      tokens for several SaaS/VCS sources. No Okta or Google Workspace source connector is documented.
      Secrets-manager integrations (Vault, AWS Secrets Manager, Azure Key Vault, Google Secret
      Manager, CyberArk, Delinea, Akeyless) run through ggscout, a collector the customer deploys in
      their own environment with its own local credentials (Vault token or Kubernetes auth; AWS
      default credential chain), so they are not GitGuardian holding a secret. Notably, GitGuardian
      publishes an OIDC issuer and JWKS (/v1/auth/jwks) for others to trust, but does not accept OIDC
      tokens on its own API.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.gitguardian.com/api-docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Set an expiry date for your token (in 1 week, 1 month, 3 months, 6 months, 1 year, or never)."
      - url: https://docs.gitguardian.com/platform/enterprise-administration/workspace-settings
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Managers can enforce a maximum lifetime for API personal access tokens created within their workspace."
      - url: https://docs.gitguardian.com/platform/enterprise-administration/workspace-settings
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "By default, there is no enforced maximum lifetime for API personal access tokens."
    notes: >-
      Expiry is optional and "never" is offered for both token types. A Business-plan workspace
      policy can cap personal access token lifetime, but the documented policy covers PATs only;
      nothing documents a way to force expiry on service account tokens, which GitGuardian recommends
      for CI. Failed on the machine credential. (The public API's create endpoint does require a
      lifetime of at least one day, but the dashboard still offers "never".) A reader who credits the
      PAT policy would pass this; it does not change the grade.
  rotation_api:
    pass: true
    evidence:
      - url: https://api.gitguardian.com/v1/openapi.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Create a new personal access token or service account token in the workspace."
      - url: https://docs.gitguardian.com/api-docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A service account token can be revoked from the Service accounts page by a workspace Manager, or through the Public API by another token holding the api_tokens:write scope."
    notes: >-
      POST /v1/api_tokens creates tokens (same type as the caller, scopes a subset of the caller's)
      and DELETE /v1/api_tokens/{token_id} revokes them. A service account token cannot revoke itself.
  scoping:
    pass: true
    evidence:
      - url: https://docs.gitguardian.com/api-docs/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Scopes are tied to an API key and control the access to resources and scan capability."
      - url: https://docs.gitguardian.com/api-docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Choose one or several scopes for your service account."
    notes: >-
      Service accounts are a non-human principal with per-token scopes (e.g. scan only). PATs are
      further limited to what the owning user can see in the UI.
  last_used:
    pass: true
    evidence:
      - url: https://api.gitguardian.com/v1/openapi.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Last usage of the API token"
    notes: The API token list exposes last_used_at and can be ordered by it.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Partner alerts: Reported directly to secret providers that are part of secret scanning's partner program."
    notes: >-
      GitGuardian does not appear anywhere in GitHub's supported patterns list (partner or user
      pattern), so a GitGuardian API key pushed to a public GitHub repo is not reported to GitGuardian
      for revocation by GitHub. The vendor's own docs carry a plea instead: "(Please do not push
      GitGuardian's API keys to public GitHub repositories ^^)". GitGuardian runs its own public GitHub
      monitoring, but no public doc says it auto-revokes its own leaked keys.

notes: >-
  Grades the GitGuardian SaaS platform API and ggshield (the CLI that wraps it). Docs and the
  OpenAPI spec are fully public; nothing was gated. Self-hosted GitGuardian follows the same token
  model. The HasMySecretLeaked service uses short-lived JWTs minted from an API key, which does not
  change the grade. The grade moves to B or A the day ggshield can exchange a GitHub Actions or GitLab
  CI OIDC token for a GitGuardian session, which the company already has the issuer plumbing to
  understand.
