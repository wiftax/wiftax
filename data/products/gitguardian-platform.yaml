id: gitguardian-platform
vendor: GitGuardian
product: Platform
covers: The API and the ggshield CLI.
aliases: ["ggshield"]
website: https://www.gitguardian.com
docs: https://docs.gitguardian.com/api-docs/authentication
category: security
status: listed
summary: >-
  Your CI jobs call GitGuardian with a static API key. Service account keys can be set never to
  expire, and GitHub does not report leaked ones. GitGuardian reaches into AWS, GCP and Entra
  without keys, but most code hosts and registries still want a pasted token.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static API key only: a service account token on the Business plan, or a personal access
      token. No workload federation is accepted.
    evidence:
      - url: https://docs.gitguardian.com/api-docs/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The GitGuardian API uses API keys to authenticate requests."
      - url: https://docs.gitguardian.com/api-docs/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Your API key must be kept private and should neither be embedded directly in the code nor versioned in Git."
      - url: https://docs.gitguardian.com/ggshield-docs/integrations/cicd-integrations/github-actions
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Add this API key to the GITGUARDIAN_API_KEY environment variable in your project settings."
      - url: https://docs.gitguardian.com/api-docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Please note that service accounts are only available for workspaces under our Business plan."
      - url: https://api.gitguardian.com/v1/openapi.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Usage:** `Token <api-key>` in `Authorization` header."
      - url: https://api.gitguardian.com/v1/openapi.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Optional lifetime of the resulting personal access token, in days. `0` means it never expires."
    notes: >-
      The API's only security scheme is the static token. Its OAuth2 endpoints serve interactive MCP
      clients and mint a personal access token, which can be non-expiring. There is no
      client-credentials or token-exchange grant. A short-lived JWT exists only for
      HasMySecretLeaked and needs an API key to get. ggshield in CI is documented only with
      GITGUARDIAN_API_KEY as a CI secret. That holds even though GitHub and GitLab issue OIDC tokens
      to those jobs.
      The ggscout collector also calls back with a static token. Free plans get personal access
      tokens only.
  outbound:
    grade: B
    mechanism: >-
      GitGuardian is its own OIDC issuer for AWS, GCP and Entra, and uses app installs for GitHub,
      Slack and Jira. GitLab, Bitbucket, Azure Repos and several registries want a token you create.
    evidence:
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/file-storage-integrations/aws-s3
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Rather than using long-lived credentials, GitGuardian's SaaS platform assumes a read-only IAM role in your own AWS account."
      - url: https://docs.gitguardian.com/nhi-governance/aws-iam-integration
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Create an AWS role that trusts the GitGuardian OIDC provider."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/container-registries-integrations/amazon-ecr
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "To set up the Amazon ECR integration, you shall create an IAM role in your AWS account, and configure it with an AWS External ID generated by GitGuardian for your workspace."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/container-registries-integrations/google-artifact-registry
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Option 2 is the recommended one: no long-lived secret leaves your Google Cloud organization, and a folder or organization scope covers projects that you create later."
      - url: https://docs.gitguardian.com/nhi-governance/azure-entra-integration
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "No Long-Lived Secrets: The integration uses Workload Identity Federation, eliminating the need for client secrets"
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The GitGuardian GitHub app has only read access to your code."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/messaging-integrations/microsoft-teams
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "GitGuardian integrates with Microsoft Teams via an Entra ID Enterprise application with read-only access to your channels."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/messaging-integrations/slack
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "GitGuardian natively integrates with Slack via the GitGuardian or GitGuardian EU application on Slack Marketplace."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/gitlab
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "only personal access tokens are currently supported. Other types of tokens (like group access tokens) are not supported."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/bitbucket-cloud
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The API token must be generated by the Workspace Owner of the workspace(s) you intend to monitor."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/azure-repos
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Azure DevOps Repos integration requires a personal access token for GitGuardian to be able to access your Azure Repos organizations/collections for analysis."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/container-registries-integrations/docker-hub
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "GitGuardian integrates with Docker Hub via a Personal Access Token with read-only access to your repositories."
      - url: https://docs.gitguardian.com/internal-monitoring/integrate-sources/vcs-integrations/github-enterprise
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Instead, you will need to create a separate GitHub App on your own GitHub Enterprise Server instance."
    notes: >-
      It reaches AWS, ECR, Entra and Google Artifact Registry without keys, using its own OIDC
      issuer or a role with External ID. GitHub, Slack, Teams, Jira and Confluence use app installs
      or admin consent. GitLab, Bitbucket, Azure Repos, Docker Hub, ACR and JFrog want static
      tokens, and ServiceNow a password. GitHub Enterprise Server needs an App you create, so you
      hold its private key. That makes B: keyless into every cloud, static tokens for several other
      sources. Secrets-manager integrations run through ggscout, which you deploy with your own
      local credentials, so GitGuardian holds no secret there.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.gitguardian.com/api-docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Set an expiry date for your token (in 1 week, 1 month, 3 months, 6 months, 1 year, or never)."
      - url: https://docs.gitguardian.com/platform/enterprise-administration/workspace-settings
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Managers can enforce a maximum lifetime for API personal access tokens created within their workspace."
      - url: https://docs.gitguardian.com/platform/enterprise-administration/workspace-settings
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "By default, there is no enforced maximum lifetime for API personal access tokens."
    notes: >-
      Both token types offer "never". A Business-plan policy can cap personal token lifetime, but
      nothing forces expiry on service account tokens, the ones recommended for CI. Crediting the
      PAT policy would not change the grade.
  rotation_api:
    pass: true
    evidence:
      - url: https://api.gitguardian.com/v1/openapi.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Create a new personal access token or service account token in the workspace."
      - url: https://docs.gitguardian.com/api-docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A service account token can be revoked from the Service accounts page by a workspace Manager, or through the Public API by another token holding the api_tokens:write scope."
    notes: >-
      The API creates and revokes tokens. A service account token cannot revoke itself.
  scoping:
    pass: true
    evidence:
      - url: https://docs.gitguardian.com/api-docs/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Scopes are tied to an API key and control the access to resources and scan capability."
      - url: https://docs.gitguardian.com/api-docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Choose one or several scopes for your service account."
    notes: >-
      Service accounts are non-human identities with per-token scopes, such as scan only. Personal
      tokens are also limited to what their owner can see.
  last_used:
    pass: true
    evidence:
      - url: https://api.gitguardian.com/v1/openapi.json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Last usage of the API token"
    notes: >-
      The token list shows when each token was last used.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Partner alerts: Reported directly to secret providers that are part of secret scanning's partner program."
    notes: >-
      GitGuardian is not on GitHub's secret-scanning list, so GitHub does not report its leaked
      keys. Its docs just ask you not to push them. No public doc says GitGuardian auto-revokes its
      own leaked keys.

notes: >-
  Self-hosted GitGuardian uses the same token model. GitGuardian publishes an OIDC issuer for others
  but accepts no OIDC tokens on its own API. Inbound moves to B or A when ggshield can trade a
  GitHub Actions or GitLab CI OIDC token for a session.
