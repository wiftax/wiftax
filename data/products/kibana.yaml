id: kibana
vendor: Elastic
product: Kibana
covers: "The Kibana API, alerting and AI connectors."
website: https://www.elastic.co
docs: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/kibana-authentication
category: observability
status: listed
summary: >-
  Kibana relays your Authorization header to Elasticsearch. On Platinum or Enterprise stateful
  deployments, a JWT realm lets your code call it with a token from any issuer. Otherwise, and on
  Serverless, you use API keys that never expire by default. Its GA connectors want pasted secrets.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      Kibana relays a Bearer header to Elasticsearch, whose JWT realm checks issuer, audience and
      subject. The fallback is an Elasticsearch API key or basic auth.
    issuers: ["any"]
    tier_gated: >-
      Platinum or Enterprise (self-managed) or Elastic Cloud Hosted Platinum / Enterprise, because
      the JWT realm lives in Elasticsearch. Not available on Serverless.
    evidence:
      - url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/kibana-authentication
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "By default Kibana supports ApiKey authentication scheme and any scheme supported by the currently enabled authentication provider."
      - url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/kibana-authentication
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Under the hood, Kibana relays this header to Elasticsearch, then Elasticsearch authenticates the request using the credentials in the header."
      - url: https://www.elastic.co/docs/reference/kibana/configuration-reference/security-settings
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "By default, this setting is set to ['apikey', 'bearer'] to support HTTP authentication with the ApiKey and Bearer schemes."
      - url: https://www.elastic.co/docs/reference/kibana/configuration-reference/general-settings
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "List of Kibana client-side headers to send to Elasticsearch."
      - url: https://github.com/elastic/kibana/blob/main/x-pack/platform/test/security_api_integration/tests/http_bearer/jwt.ts
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "it('accepts valid JWT (without secret) via authorization Bearer header', async () => {"
      - url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/jwt
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Elasticsearch can be configured to trust JSON Web Tokens (JWTs) issued from an external service as bearer tokens for authentication."
      - url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/jwt
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "At least one of the allowed_subjects or allowed_subject_patterns settings must be specified (and be non-empty) when token_type is access_token ."
      - url: https://github.com/elastic/terraform-provider-elasticstack/blob/main/docs/index.md
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "bearer_token (String, Sensitive) Bearer Token to use for authentication to Kibana"
      - url: https://github.com/elastic/kibana/blob/main/x-pack/platform/plugins/shared/security/server/routes/tags.ts
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "If `xpack.security.authc.http.jwt.taggedRoutesOnly` flag is set, then only routes marked with this tag will accept"
      - url: https://www.elastic.co/subscriptions
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Single sign-on (SAML, OpenID Connect, Kerberos, JWT)"
      - url: https://www.elastic.co/docs/deploy-manage/deploy/elastic-cloud/differences-from-other-elasticsearch-offerings
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Serverless does not support Elasticsearch authentication realms. User authentication is managed at the organization level ."
      - url: https://www.elastic.co/docs/deploy-manage/api-keys/elastic-cloud-api-keys
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "For Elastic Cloud Serverless projects, you can optionally grant access to Elasticsearch and Kibana APIs when you assign roles to the API key ."
      - url: https://www.elastic.co/docs/api/doc/kibana/authentication
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Basic auth tokens are constructed with the Basic keyword, followed by a space, followed by a base64-encoded string of your username:password (separated by a : colon)."
    notes: >-
      Elasticsearch authenticates every Kibana API call, so this follows the elasticsearch card: A
      via the JWT realm, on Platinum or Enterprise. No Elastic page says "JWT for the Kibana API".
      The A rests on the documented header relay, the default schemes and header allowlist, and
      Kibana's own test showing realm JWTs work on an API route. The Terraform provider accepts a
      bearer token too. Serverless has no realms and limits JWTs to a few internal routes, so it
      uses API keys (see elastic-cloud-api). Without Platinum you get static API keys, which grade F
      as on the elasticsearch card.
  outbound:
    grade: C
    mechanism: >-
      GA connectors use secrets you create and paste. The best run OAuth client credentials from
      your secret or private key. Bedrock wants AWS access keys and Gemini a service-account JSON
      key.
    evidence:
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/bedrock-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "The AWS access key for authentication."
      - url: https://www.elastic.co/docs/explore-analyze/ai-features/llm-guides/connect-to-amazon-bedrock
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "These are the minimum required permissions. IAM policies with additional permissions are also supported."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/gemini-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "The GCP service account JSON file for authentication."
      - url: https://www.elastic.co/docs/explore-analyze/ai-features/llm-guides/connect-to-google-vertex
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Select JSON, then click CREATE to download the key. Keep it somewhere secure."
      - url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-inference-put-amazonbedrock
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "A valid AWS access key that has permissions to use Amazon Bedrock and access to models for inference requests."
      - url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-inference-put-googlevertexai
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "A valid service account in JSON format for the Google Vertex AI API."
      - url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-inference-put-azureopenai
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "IMPORTANT: You must specify either api_key , entra_id , or client_secret ."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/openai-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "For OpenAI and Azure OpenAI, only apiKey is supported for authentication."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/servicenow-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "The RSA private key that you created for use in ServiceNow."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/email-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "If service is MS Exchange Server, the host, port, and secure properties are ignored and tenantId, clientId, clientSecret are required instead."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/defender-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "The client secret for your app in the Azure portal."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/crowdstrike-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "The CrowdStrike API client secret to authenticate the client ID."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/sentinelone-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "A SentinelOne API token created by the user."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/webhook-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "If you choose OAuth 2.0 authentication, you must provide an access token URL, client ID, and client secret."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/jira-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Jira API authentication token for HTTP Basic authentication. For Jira Data Center, this value should be the password associated with the email owner."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/slack-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Copy the Bot User OAuth Token so you can paste it into your Slack connector form."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/pagerduty-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "A 32 character PagerDuty Integration Key for an integration on a service, also referred to as the routing key."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/slack-v2-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Elastic's managed OAuth flow. Select this option and authorize access to your Slack workspace through Elastic. No app setup is required."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/okta-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Prefer an OAuth 2.0 API Services app with private-key JWT client authentication (RS256 + kid). A classic SSWS API token is supported as a fallback for orgs that have not migrated to OAuth for Okta."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/aws-cloudwatch-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "The AWS IAM access key ID used to sign every request with Signature Version 4 (SigV4)."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/gcp-iam-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "You upload a service account JSON key when creating the connector, and every action then runs as that service account, using a short-lived access token the connector mints for each request."
      - url: https://www.elastic.co/docs/reference/kibana/connectors-kibana/github-action-type
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "It supports two authentication methods: Bearer token (personal access token) and OAuth Authorization Code."
    notes: >-
      No GA connector uses an AWS role, GCP impersonation or an Azure federated credential. Bedrock
      takes access keys, Gemini a JSON key, OpenAI an API key, and Slack, Jira and PagerDuty tokens
      or webhook URLs. ServiceNow, Exchange, Defender, CrowdStrike and Webhook offer OAuth client
      credentials from your own secret or key. That best option makes C, and the cloud LLM
      connectors alone would be D. Preview "Quick Connect" installs Elastic's own app for Slack,
      Teams and Gmail with no secret. Once GA on stateful Stack, it would make this B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-security-create-api-key
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "NOTE: By default, API keys never expire. You can specify expiration information when you create the API keys."
      - url: https://www.elastic.co/docs/deploy-manage/api-keys/elasticsearch-api-keys
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Optionally, set an expiry date. By default the API key will not expire, but it's a good security practice to give the key a limited lifespan."
    notes: >-
      Same Elasticsearch API keys as the elasticsearch card. Expiry is optional and no setting
      forces it. Kibana's quick-create gives personal keys 90 days, but the API and main pane
      default to never.
  rotation_api:
    pass: true
    evidence:
      - url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-security-create-api-key
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Create an API key for access without requiring basic authentication."
      - url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-security-invalidate-api-key
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "This API invalidates API keys created by the create API key or grant API key APIs."
    notes: >-
      The Elasticsearch API creates and invalidates keys.
  scoping:
    pass: true
    evidence:
      - url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-security-create-api-key
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "If you supply role descriptors, the resultant permissions are an intersection of API keys permissions and the authenticated user's permissions thereby limiting the access scope for API keys."
      - url: https://www.elastic.co/docs/deploy-manage/api-keys/elasticsearch-api-keys
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "For a user API key, you can opt to configure access to specific Elasticsearch APIs and resources by assigning the key with predefined roles or custom privileges."
    notes: >-
      A key's role descriptors can limit it to, say, connectors in one space. Without them the key
      copies its creator's full permissions, which is the default.
  last_used:
    pass: false
    evidence:
      - url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-security-get-api-key
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Creation time for the API key in milliseconds."
      - url: https://www.elastic.co/docs/deploy-manage/api-keys/elasticsearch-api-keys
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "The API Keys management page in Kibana lists your API keys, including the name, date created, and status."
    notes: >-
      Keys show creation, expiry and invalidation times but no last use. Usage can only be rebuilt
      from audit logs.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "Elastic Stack API Key"
      - url: https://github.com/github/docs/blob/main/src/secret-scanning/data/pattern-docs/fpt/public-docs.yml
        checked_on: 2026-10-14
        checked_by: tehreet
        quote: "supportedSecret: Elastic Stack API Key"
    notes: >-
      GitHub treats Elastic keys as user patterns for private repos and push protection, not partner
      patterns. So a key leaked to a public repo is not reported to Elastic.

notes: >-
  Covers the Kibana HTTP API on every deployment type, and the connectors behind alerting, cases,
  security and AI features. Related cards: elasticsearch, elastic-cloud-api, elastic-agent-fleet and
  elastic-cloud-enterprise. The headline is C because of outbound. Basic-tier or Serverless callers
  use non-expiring API keys, which is F inbound.
