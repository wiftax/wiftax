id: lambda-cloud
vendor: Lambda
product: Cloud
covers: The Cloud API, On-Demand instances, 1-Click Clusters and filesystems.
aliases:
  - Lambda Cloud
  - Lambda Labs
  - 1-Click Clusters
website: https://lambda.ai
docs: https://docs.lambda.ai/api/cloud
category: cloud
status: listed
summary: >-
  Your code calls the Lambda Cloud API with a static API key, with no OIDC path. Keys can belong to
  a narrowly scoped service identity, rotate through the API, and show last use. Expiry is off by
  default and GitHub does not report leaks. Lambda never reaches into your cloud.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static API key owned by a user or service identity. The filesystem S3 adapter and
      non-interactive Managed Kubernetes access also use static keys and tokens.
    issuers: []
    evidence:
      - url: https://docs.lambda.ai/api/cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Lambda Cloud API uses API keys to authenticate incoming requests."
      - url: https://docs.lambda.ai/api/cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In general, Lambda recommends passing an HTTP Bearer header that contains your API key:"
      - url: https://docs.lambda.ai/public-cloud/iam/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service identity: An identity that represents a non-human user of the account."
      - url: https://docs.lambda.ai/public-cloud/s3-adapter-filesystems/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You won't be able to view your secret key again after you close the dialog."
      - url: https://docs.lambda.ai/public-cloud/s3-adapter-filesystems/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "export AWS_ACCESS_KEY_ID='<ACCESS-KEY>'"
      - url: https://docs.lambda.ai/managed-kubernetes/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "to enable non-interactive authentication to MK8s. This can be useful for CI/CD pipelines and automation scripts."
      - url: https://docs.lambda.ai/managed-kubernetes/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To create a Service Account, along with the necessary Secret (token) and ClusterRoleBinding objects:"
      - url: https://docs.lambda.ai/managed-kubernetes/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You're prompted to authorize Lambda Managed Kubernetes to access your Lambda account."
      - url: https://docs.lambda.ai/public-cloud/enabling-sso/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This guide describes how to enable single sign-on (SSO), which allows users to authenticate to Lambda Cloud through your organization's existing identity provider (IdP)."
    notes: >-
      The API spec defines only schemes that carry the API key. OIDC appears only for human SSO.
      Graded on the Cloud API key, the weakest path a workload must use. The data planes do not lift
      it. S3 adapter keys are static pairs made in the console, with no documented expiry. Managed
      Kubernetes CI uses a service account token copied into a kubeconfig, which is long-lived. No
      first-party Terraform provider was found. Moves to B or A only if the Cloud API accepts a
      federated token.
  outbound:
    grade: N/A
    mechanism: >-
      Lambda has no managed integration that reaches into your infrastructure. You import and export
      data with your own tools and credentials on your instance.
    evidence:
      - url: https://docs.lambda.ai/public-cloud/importing-exporting-data/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you need to import data from AWS S3 or an S3-compatible object storage service like Cloudflare R2, Google Cloud Storage, or Minio, you can use s5cmd or rclone."
      - url: https://docs.lambda.ai/public-cloud/importing-exporting-data/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "export AWS_SECRET_ACCESS_KEY='<SECRET-ACCESS-KEY>'"
      - url: https://docs.lambda.ai/api/cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Lambda can send webhook notifications to your URL when support ticket events occur, enabling near real-time integration with your systems."
    notes: >-
      Checked data import and export, filesystems, clusters, Managed Kubernetes and Slurm, the guest
      agent, VPN access and webhooks. None has Lambda reach into your cloud, registry or SaaS. The
      S3 import guide has you put AWS keys on the instance, but that is your workload's credential,
      not Lambda's. Webhooks only push notifications to a URL you own.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.lambda.ai/api/cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API key lifetime in seconds. If omitted, the API key does not expire."
      - url: https://docs.lambda.ai/api/cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Returns null if no expiration period was set during key creation."
    notes: >-
      Expiry is optional and omitted means never. The console asks only for a name. No policy forces
      a lifetime, so it fails, as on the coreweave-object-storage card.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.lambda.ai/api/cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Creates an API key for the specified identity."
      - url: https://docs.lambda.ai/api/cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Deletes the specified API key. To delete an API key that belongs to an identity other than your own, you must have a role that contains the relevant permissions."
    notes: >-
      The API can create, list and delete service-identity keys. S3 adapter keys are rotated in the
      console.
  scoping:
    pass: true
    evidence:
      - url: https://docs.lambda.ai/public-cloud/iam/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Used for automating Lambda Cloud operations."
      - url: https://docs.lambda.ai/public-cloud/iam/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A workspace role includes workspace-scoped permissions only, and applies exclusively to the workspace you specify when assigning the role."
      - url: https://docs.lambda.ai/public-cloud/predefined-roles/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Can list all instances in the specified workspace and view their metadata."
      - url: https://docs.lambda.ai/public-cloud/access-security/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API keys have full access to all Lambda API operations."
    notes: >-
      Service identities are machine identities that can hold one narrow predefined role, which
      counts. Keys on user identities inherit that person's roles. One overview page still says keys
      have full API access, which looks like a leftover.
  last_used:
    pass: true
    evidence:
      - url: https://docs.lambda.ai/api/cloud
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The date and time at which the API key was last used. Formatted as an ISO 8601 timestamp. Returns null if the key hasn't been used."
    notes: >-
      Every key in the API list shows when it was last used. The audit log also records key creation
      and deletion.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Lambda is not on GitHub's secret-scanning list, so a leaked key is not reported or revoked.

notes: >-
  One card, because every machine path is a static secret and none federates. CoreWeave was split
  only because its storage and CKS accept federated identities. Three of five checks pass, which
  holds it at D rather than F. Only federation into the Cloud API would move the grade.
