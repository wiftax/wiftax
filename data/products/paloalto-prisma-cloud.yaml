id: paloalto-prisma-cloud
vendor: Palo Alto Networks
product: Prisma Cloud
covers: Prisma Cloud Enterprise Edition.
website: https://www.paloaltonetworks.com/prisma/cloud
docs: https://pan.dev/prisma-cloud/api/cspm/app-login/
category: security
status: listed
summary: >-
  To call the Prisma Cloud API, your code trades a static access key for a 10-minute token. No OIDC
  path exists. Prisma reaches AWS and Alibaba by role, but Azure wants an app client secret and GCP
  a service account JSON key.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      An access key ID and secret, posted to /login for a 10-minute JWT. The Compute API, twistcli,
      Terraform and CI plugins use the same key.
    evidence:
      - url: https://pan.dev/prisma-cloud/api/cspm/app-login/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To generate a token, you must have an access key and include the following values in the request body parameter — access key ID as the username and your secret key as the password."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/get-started/access-keys.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Prisma Cloud requires an API access key to enable programmatic access to the REST API."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/get-started/access-keys.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The JWT is valid for 10 minutes, so you must refresh the token for continued access to the Prisma Cloud API."
      - url: https://pan.dev/prisma-cloud/api/cwpp/access-api-saas/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Internally the token contains a Prisma Cloud platform token, which is only valid for 10 minutes."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/runtime-security/authentication/access-keys.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Prisma Cloud keys are required to access twistcli and the Compute API."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/runtime-security/authentication/access-keys.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can authenticate to the API using basic auth."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/terraform-provider-prismacloud/master/docs/index.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`password` - (Env: `PRISMACLOUD_PASSWORD`) Secret key."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/application-security/get-started/connect-code-and-build-providers/ci-cd-runs/add-github-actions.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Add the Prisma Cloud access key as an environment variable to *GitHub Secrets*."
    notes: >-
      Same pattern as cyera-data-security: the token is short-lived, but a long-lived key mints it.
      No workload federation is documented, and the OIDC settings are for human SSO. Prisma's own
      GitHub Actions integration stores the key in GitHub Secrets. Reviewer check: the Compute API
      also accepts the key directly as Basic auth. That could read as a plain static key, which
      would be D. It stays C because the documented API paths all exchange the key, and Basic auth
      is optional.
  outbound:
    grade: B
    mechanism: >-
      AWS and Alibaba trust a role with no key. Azure takes an app client secret, GCP a service
      account JSON key, and OCI a long-lived API signing key.
    evidence:
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-aws/manually-set-up-prisma-cloud-role-for-aws.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Select *Require external ID* and paste the *ExternalID* value that you copied in Step 1 above."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-aws/manually-set-up-prisma-cloud-role-for-aws.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Type of trusted entity: *Another AWS Account* and enter the *Account ID*: *188619942792*"
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-aws/onboard-aws-account.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A unique account ID is used to enable the trust relationship in the roles trust policy, which you will require later in the onboarding process."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-your-alibaba-account/set-up-your-alibaba-account.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "After you create the role and the permissions are enabled, you can add the Alibaba Cloud Resource Name (ARN) on Prisma Cloud to assume the role to monitor your Alibaba Cloud account."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-your-azure-account/authorize-prisma-cloud.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Application Client Secret: c_application_key"
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-your-azure-account/authorize-prisma-cloud.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The client secret is a secret string that the application uses to prove its identity when requesting a token."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-your-azure-account/connect-azure-subscription.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Provide xref:authorize-prisma-cloud.adoc#terraform[details] for *Application (Client) ID*, *Application Client Secret*, *Enterprise Application Object ID* from the script output."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-gcp/onboard-gcp-project.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "*Download Terraform Script* and follow the *Steps* to upload your *Service Account Key (JSON) file*."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-gcp/prerequisites-to-onboard-gcp.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A combination of custom, predefined, and primitive roles grant the service account the permissions it needs to complete specific actions on the assets in your GCP organization or project."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-your-oci-account/add-oci-tenant-to-prisma-cloud.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To onboard the Oracle Cloud account, a public key is needed to access the OCI API. This public key is embedded in the Terraform template, and it changes each time you download the template."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/connect/connect-cloud-accounts/onboard-your-oci-account/rotate-access-keys.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Depending on your password policy, you can choose to rotate your user’s keys."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/application-security/get-started/connect-code-and-build-providers/code-repositories/add-bitbucket-server.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create and copy a Personal Access Token (PAT) on Bitbucket Server."
    notes: >-
      AWS uses a role with External ID and Alibaba a RAM role, both keyless. Azure takes a client
      secret on your app, with a least-privilege role documented. GCP takes an uploaded JSON key.
      For OCI, Prisma generates the key pair and you hold only the public key, but it is a
      long-lived vendor-held key. GitHub uses an App install, while GitLab and Bitbucket servers
      want secrets or tokens. Azure federated credentials or GCP workload federation would lift this
      to A.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/administration/define-prisma-cloud-enterprise-settings.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use the *Access Key Maximum Validity* settings to establish the platform limit for the maximum number of days for access key validity."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/administration/create-access-keys.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you do not select key expiry, the key is set to never expire; if you select it, but do not specify a date, the key expires in a month."
    notes: >-
      Passes on the org policy, not the default. A key with no expiry never expires, but an admin
      can set a tenant-wide maximum validity. That counts, as on temporal. The docs do not say
      whether "no limit" is the default setting.
  rotation_api:
    pass: true
    evidence:
      - url: https://pan.dev/prisma-cloud/api/cspm/add-access-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you want to create an access key for an existing Prisma Cloud service account instead of for the current user, then specify the name of the existing service account as the value for the request body parameter serviceAccountName."
      - url: https://pan.dev/prisma-cloud/api/cspm/delete-access-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Deletes the access key that has the specified ID."
    notes: >-
      The API can create, deactivate and delete keys. Each identity can hold two keys, enough for
      overlap.
  scoping:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/administration/add-service-account-prisma-cloud.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service Accounts can be created for automation use cases to enable a nonhuman entity to interact programmatically with the Prisma Cloud APIs."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/administration/create-access-keys.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When you create an access key, the key is tied to the role with which you logged in and if you delete the role, the access key is automatically deleted."
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/runtime-security/authentication/access-keys.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The CI User role is purpose-built for this use case."
    notes: >-
      Service accounts are machine identities with their own role, and each key binds to one role. A
      human's key carries that user's role.
  last_used:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/PaloAltoNetworks/prisma-cloud-docs/master/docs/en/enterprise-edition/content-collections/administration/create-access-keys.adoc
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can verify the expiry date for the key and can update it here, review when it was last used and the status —Active or Expired."
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Neither Palo Alto Networks nor Prisma Cloud is in GitHub's secret-scanning table, so leaked
      keys are not reported.

notes: >-
  Graded on Prisma Cloud Enterprise Edition SaaS, including the Compute API and cloud onboarding.
  Self-hosted Compute Edition is not graded here. Inbound moves to B or A only if /login accepts a
  federated token. Outbound moves to A with keyless Azure and GCP onboarding.
