id: keycard-agent-identity
vendor: Keycard
product: Agent Identity
website: https://www.keycard.ai
docs: https://docs.keycard.ai/guides/authenticate-deployed-workloads/
category: identity
status: listed
summary: >-
  A deployed agent logs in to a Keycard zone with a token from any OIDC issuer, pinned by issuer and
  subject. The zone is itself an issuer Snowflake and Anthropic trust. The management API used by
  Terraform needs an Admin client secret, and many SaaS connectors need your own secrets.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      You register any OIDC issuer as a Provider and pin the credential to its issuer and subject.
      The SDK then trades the platform's token for a zone token.
    issuers: ["any"]
    evidence:
      - url: https://docs.keycard.ai/guides/authenticate-deployed-workloads/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Register the platform as a Provider, pin a Workload Identity credential on your Application to the token's issuer and subject, and the SDK presents the platform's token instead. The steps are the same on every platform that publishes an OpenID Connect discovery document for its tokens."
      - url: https://docs.keycard.ai/guides/authenticate-deployed-workloads/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Leave Client ID and Client Secret empty. Keycard discovers the issuer's signing keys from its OpenID Connect discovery document."
      - url: https://docs.keycard.ai/guides/authenticate-deployed-workloads/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A trailing * matches every subject that starts with the text before it, so workspace:<workspace-id>:* trusts every service in a Render workspace at the cost of looser pinning."
      - url: https://docs.keycard.ai/use-cases/agent-with-its-own-identity/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Because the trust is expressed as an issuer and a subject rather than as a platform integration, anything that publishes an OpenID Connect discovery document and a key set can be an identity source."
      - url: https://docs.keycard.ai/reference/standards/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Every protocol listed here is available on every plan. Nothing is gated by tier."
      - url: https://docs.keycard.ai/admin/service-accounts/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A service account authenticates with a client ID and client secret. An account can hold several credentials, so you can rotate one without touching the others."
    notes: >-
      Graded on the zone token endpoint, where agents and MCP servers log in at runtime. The SDKs
      read tokens from AWS, Azure, GCP, Render, Fly.io and GitHub Actions. Trust is pinned by issuer
      and subject only. No audience or extra-claim check is documented, and Render's guide reuses
      the token Render mints for AWS. That is the weak part of this A. The management API used by
      Terraform is a separate plane. It takes only service-account client ID and secret pairs with
      full Admin rights, which alone would be a C.
  outbound:
    grade: B
    mechanism: >-
      The zone is an OIDC issuer that Snowflake and Anthropic trust, and AWS audit export uses a
      role with External ID. Most SaaS connectors need your own OAuth app secret or a stored key.
    evidence:
      - url: https://docs.keycard.ai/admin/configure-provider-apis/overview/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Keycard issues short-lived, scoped credentials that external providers accept via Workload Identity Federation (WIF). Your application authenticates to Keycard, requests a token for a specific provider, and uses that token directly with the provider's API. No API keys stored anywhere."
      - url: https://docs.keycard.ai/guides/access-snowflake/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Snowflake needs to trust Keycard as an OAuth authorization server."
      - url: https://docs.keycard.ai/admin/audit-log-export/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "You'll need to generate an External ID - a secret credential for the IAM trust policy."
      - url: https://docs.keycard.ai/admin/catalog/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Most API entries, and some MCP servers, need an OAuth app you register with the vendor the first time. Console shows the vendor's setup steps, including the callback URL to paste into their form. Enter the app's Client ID and Client Secret"
      - url: https://docs.keycard.ai/admin/catalog/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Some MCP servers take a vendor API key instead of OAuth, and GitHub API accepts a personal access token instead of an OAuth app."
      - url: https://docs.keycard.ai/guides/delegated-access/github/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "In GitHub Developer Settings, create a new OAuth App and set the Redirect URI (older forms call it Authorization callback URL) to the redirect URL you copied from Keycard. Once created, note the Client ID and generate a Client Secret."
      - url: https://docs.keycard.ai/guides/delegated-access/google/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Enter the Client ID and Client Secret from step 2. This creates the Google OAuth provider and API resources."
      - url: https://docs.keycard.ai/guides/add-custom-resource/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The service only takes a static API key or a username and password"
    notes: >-
      Keyless: Anthropic, Snowflake, AWS audit-log export, and one-click catalog entries like Linear
      MCP. GitHub needs your own OAuth App secret or a PAT. Google Workspace needs your own OAuth
      client secret. API-key MCP servers use a static key in Keycard Vault. Agents acting as
      themselves can reach only vaulted static-key upstreams. Okta, Entra and similar appear only as
      human sign-in, which is out of scope. No GCP or Azure connectors are documented. B: keyless
      for some, static or customer-managed secrets for many.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.keycard.ai/admin/service-accounts/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Console shows the Client ID and Client Secret once. Copy both into your automation's secret store now. The secret cannot be retrieved later; if you lose it, delete the credential and create a new one."
    notes: >-
      No expiry or org policy is documented for client secrets. They live until deleted.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.keycard.ai/admin/service-accounts/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "With an Admin token you can automate the steps above."
      - url: https://docs.keycard.ai/admin/service-accounts/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The client_secret is returned only by the POST that creates the credential; later reads return metadata only."
    notes: >-
      The API creates and deletes service-account credentials.
  scoping:
    pass: true
    evidence:
      - url: https://docs.keycard.ai/concepts/applications/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Dependencies only permit access when an application is acting on its own behalf."
      - url: https://docs.keycard.ai/admin/service-accounts/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Tokens issued to a service account carry the organization Admin Role. There is no per-account Admin, Manager, or Viewer selector."
    notes: >-
      Split result. An Application's secret belongs to a machine identity limited by its
      dependencies and Cedar policies, which passes. Management API secrets are always full Admin
      and cannot be scoped.
  last_used:
    pass: true
    evidence:
      - url: https://docs.keycard.ai/admin/service-accounts/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The credentials table shows each credential's Client ID, when it was Created, and Last Active At: the last time the credential authenticated at the token endpoint."
    notes: >-
      Shown for service-account credentials. Application credential activity appears in its Activity
      feed and the Audit Log.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      Keycard is not on GitHub's secret-scanning partner list.

notes: >-
  Docs are public. Tokens Keycard issues live 24 hours by default. The A would be firmer if workload
  credentials could pin an audience. The management API would stop being the weak spot if service
  accounts took workload identity or a role narrower than Admin.
