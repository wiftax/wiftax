id: coreweave-api
vendor: CoreWeave
product: Cloud API
covers: The control-plane API at api.coreweave.com, the Terraform provider and kubeconfigs.
website: https://www.coreweave.com
docs: https://docs.coreweave.com/docs/products/cks/auth-access/managed-auth/api-access
category: cloud
status: listed
summary: >-
  This card covers the control plane: the API that creates CKS clusters and VPCs, the Terraform
  provider and kubeconfigs. Your code needs a static token made by hand in the Console, with almost
  no hygiene. The CKS and Object Storage cards grade differently.
surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static, user-scoped API Access Token created in the Cloud Console. Nothing federates into
      api.coreweave.com.
    issuers: []
    evidence:
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/managed-auth/api-access
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          API Access Tokens are user-scoped tokens that grant users permission to access API
          endpoints. They gate the ability to deploy CKS Clusters, VPCs, and to manage and access
          cluster metrics.
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/manage-api-access-tokens
        checked_on: 2026-09-17
        checked_by: tehreet
        quote: >-
          This page explains how to create, use, and manage API Access Tokens and the kubeconfig
          files generated alongside them, so you can authenticate kubectl to CKS clusters and keep
          credentials secure.
      - url: >-
          https://docs.coreweave.com/support/cks/articles/what-is-the-difference-between-managed-auth-and-unmanaged-auth.md
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Managed auth uses CoreWeave-issued API access tokens against the managed-auth endpoint
      - url: https://docs.coreweave.com/docs/products/cks/reference/cks-api
        checked_on: 2026-10-05
        checked_by: sisyphus
        quote: >-
          Replace {API_ACCESS_TOKEN} in the examples on each operation page with your CoreWeave API
          access token.
    notes: >-
      No doc describes trading an outside OIDC or SAML token for a control-plane token. Object
      Storage federation only issues Object Storage credentials. So Terraform and every cluster or
      VPC call run on a long-lived Console token, and 1 of 5 hygiene checks passes. CKS clusters and
      AI Object Storage accept federated identities and have their own cards.
  outbound:
    grade: N/A
    mechanism: The control plane never needs access to customer infrastructure.
    evidence:
      - url: https://docs.coreweave.com/docs/products/cks/reference/cks-api
        checked_on: 2026-10-05
        checked_by: sisyphus
        quote: REST and gRPC API for creating, listing, updating, and deleting CoreWeave CKS clusters.
    notes: >-
      The CKS API only manages clusters, and nothing pulls from a customer cloud. Per-cluster OIDC
      issuance is graded on the CKS card.
hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/manage-api-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: Expiration How long the token remains valid.
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/managed-auth/kubeconfig
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          Tokens have an expiration date, so a token that worked previously can expire between
          sessions.
    notes: >-
      Every token has an expiry set at creation. The default, the maximum and whether an org can cap
      it are undocumented. Passed on the statement that tokens expire.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/manage-api-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: You can view or delete Access Tokens on the Access Tokens dashboard
      - url: https://docs.coreweave.com/docs/products/cks/reference/cks-api
        checked_on: 2026-10-05
        checked_by: sisyphus
        quote: >-
          The API lets you create, list, update, and delete managed Kubernetes clusters on CoreWeave
          infrastructure.
    notes: >-
      Tokens are created and deleted only in the Console. The API has no token endpoints, so
      rotation needs a person in a browser.
  scoping:
    pass: false
    evidence:
      - url: >-
          https://docs.coreweave.com/support/cks/articles/where-do-i-find-my-api-access-tokens-in-the-cloud-console.md
        checked_on: 2026-09-16
        checked_by: tehreet
        quote: >-
          user-scoped and grant permissions to deploy CKS clusters and VPCs, access cluster metrics,
          and authenticate against the managed-auth endpoint.
    notes: >-
      A token carries the user's full permissions and cannot be limited to a cluster or namespace.
      An unread IAM Access Policies page may describe a scoped machine identity. The check stays
      failed until it is read.
  last_used:
    pass: false
    evidence:
      - url: https://docs.coreweave.com/docs/products/cks/auth-access/manage-api-access-tokens
        checked_on: 2026-09-16
        checked_by: tehreet
      - url: >-
          https://docs.coreweave.com/support/cks/articles/where-do-i-find-my-api-access-tokens-in-the-cloud-console.md
        checked_on: 2026-09-16
        checked_by: tehreet
    notes: No last-used time is documented for tokens. Graded conservatively.
  leak_revocation:
    pass: false
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-11-09
        checked_by: sisyphus
    notes: >-
      No evidence places CoreWeave in GitHub's secret-scanning program, despite the greppable
      CW-SECRET- prefix. The page was refetched on 2026-11-09 and returned only site navigation. The
      partner pattern table did not render again, so the receipt is missing. A human should re-read
      the page. The check fails for want of a receipt, not on a finding.
notes: >-
  Home team, graded on the same rubric. The fix is a federated path into api.coreweave.com, the way
  Object Storage already works. Then a token API, token scoping, a last-used column and a GitHub
  secret-scanning partnership.
