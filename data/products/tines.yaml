id: tines
vendor: Tines
product: Platform
covers: "Tines Stories, cloud and self-hosted."
aliases:
  - Tines Stories
website: https://www.tines.com
docs: https://www.tines.com/api/authentication/
category: security
status: listed
confidence:
  level: low
  reason: >-
    Tines' API key settings page is behind a login. Expiry and last-used fail on the public docs
    only. Two more passes would make inbound D.
summary: >-
  The Tines API, Terraform provider, webhooks and MCP servers take only a static API key. Outbound,
  Tines is its own OIDC issuer and reaches AWS, Google Cloud, Entra and Oracle Cloud without keys,
  but most SaaS connections take a pasted key or secret.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static Tines API key, personal or owned by a team or service account user. The same keys
      protect restricted webhooks and MCP servers, which also take per-webhook secrets.
    evidence:
      - url: https://www.tines.com/api/authentication/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Each request sent to the REST API must be authenticated using an API key, included in the X-User-Token header."
      - url: https://www.tines.com/api/authentication/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To authenticate using this method, simply include your API token in the Authorization header of your requests, prefixed with \"Bearer\" and a single space."
      - url: https://www.tines.com/api/authentication/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Tines has four types of API keys:"
      - url: https://raw.githubusercontent.com/tines/terraform-provider-tines/main/docs/index.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`api_key` (String, Sensitive) If this value is not set in the configuration, you must set the TINES_API_KEY environment variable instead."
      - url: https://www.tines.com/llm/stories/docs/actions/types/webhook.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "There are a few methods for authenticating a webhook. The primary one is using webhook secrets: a random string assigned to each webhook."
      - url: https://www.tines.com/llm/stories/docs/actions/types/webhook.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When configuring Team or Tenant access control, the only way to authenticate is to provide a valid Tines API Key with each request."
    notes: >-
      Graded on the REST API, which CI, Terraform and other workloads must use. The API reference
      and Terraform provider document only the API key. Webhook and MCP OAuth is a human consent
      screen, not federation a workload can use. No OIDC, CI or cloud workload login is documented.
      Tines is an OIDC issuer, but only outbound. Cloud and self-hosted work the same.
  outbound:
    grade: B
    mechanism: >-
      Tines issues its own OIDC tokens, which AWS, Google Cloud, Entra and Oracle Cloud trust, plus
      AWS roles with External ID. Static cloud keys and most SaaS connections still take pasted
      secrets.
    evidence:
      - url: https://www.tines.com/llm/stories/docs/credentials/workload-identity-federation.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Workload identity federation lets a credential authenticate to your cloud provider without storing a long-lived key or secret in Tines."
      - url: https://www.tines.com/llm/stories/docs/credentials/workload-identity-federation.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Your tenant acts as an OpenID Connect (OIDC) identity provider."
      - url: https://www.tines.com/llm/stories/docs/credentials/aws.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "No Tines AWS account and no external ID are involved: the role trusts your tenant's issuer URL and this credential's subject, and nothing else can assume it."
      - url: https://www.tines.com/llm/stories/docs/credentials/aws.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "We require an External ID to be set on the IAM role permissions you set up so that only the AWS credential you create in your tenant can be used to access your AWS data."
      - url: https://www.tines.com/llm/stories/docs/credentials/aws.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Role-based access is not available on self-hosted environments."
      - url: https://www.tines.com/llm/stories/docs/credentials/aws.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Access secret: The `access secret` from your [AWS Security Credentials]"
      - url: https://www.tines.com/llm/stories/docs/credentials/workload-identity-federation/google-cloud.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Tines signs a short-lived token for the credential and Google exchanges it for a short-lived access token, so no service account key is stored in Tines."
      - url: https://www.tines.com/llm/stories/docs/credentials/workload-identity-federation/microsoft-entra.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Tines signs a short-lived token for the credential and Microsoft Entra exchanges it for an access token for your app registration, so no client secret or certificate is stored in Tines."
      - url: https://www.tines.com/llm/stories/docs/credentials/workload-identity-federation/oracle-cloud.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "OCI requires the token exchange itself to be authenticated, so you also create a confidential application in the domain and give Tines its client ID and secret."
      - url: https://www.tines.com/llm/stories/docs/credentials/connect-flows/google-service-account.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Credential type | HTTP Request that includes a JWT token request."
      - url: https://www.tines.com/llm/stories/docs/credentials/connect-flows/crowdstrike.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Defined by the user generating the API client."
      - url: https://www.tines.com/llm/stories/docs/credentials/connect-flows/jira-software.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Customers often create an account for Tines to associate the API key with, scoping the permissions for that user as desired."
      - url: https://www.tines.com/llm/stories/docs/credentials/connect-flows/github.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Credential type | OAuth 2.0"
      - url: https://www.tines.com/llm/stories/docs/credentials/connect-flows.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Managed OAuth credentials allow users to easily authenticate to a platform by signing in with their account."
      - url: https://www.tines.com/llm/stories/docs/credentials/oauth.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "After registering your app with the 3rd-party service, you will receive a client ID and a client secret."
    notes: >-
      All four clouds can be keyless. Oracle's path also stores a client secret, but it cannot mint
      anything without a Tines-signed token. Graded B, not A, because static AWS and Google keys are
      still offered and most SaaS flows need a pasted key or client secret. Examples are GitHub,
      CrowdStrike and Microsoft Graph. Same call as doppler-secrets. Slack, GitLab and Salesforce
      use Tines-managed OAuth apps, but not on self-hosted. Self-hosted also loses the External ID
      path, and the docs do not say whether federation works there.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://www.tines.com/api/authentication/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "On the API Keys page you can view all of the API keys you have access to or create a new key."
      - url: https://www.tines.com/llm/stories/docs/credentials/credential-configuration/expiry.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Emails will be sent thirty days, seven days and one day before the credential expires to alert the selected recipients that the credential needs to be updated."
    notes: >-
      The docs show no expiry setting, default lifetime or policy for API keys. The credential
      Expiry field is only a reminder date on stored credentials.
  rotation_api:
    pass: false
    evidence:
      - url: https://www.tines.com/api/authentication/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To generate an API key in Tines, use the Tines connect flow."
      - url: https://www.tines.com/stories/docs/api/llms.txt
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Keys are created in the UI. The API reference has no endpoint to create, list or revoke API
      keys.
  scoping:
    pass: true
    evidence:
      - url: https://www.tines.com/api/authentication/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Team API keys are also linked to separate service account users, but they have role-based access to a specific team on the tenant."
      - url: https://www.tines.com/api/authentication/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service API keys are linked to separate service account users, and can be granted access to any tenant permissions such as AUDIT_LOG_READ and TUNNEL_MANAGE by a tenant owner."
      - url: https://www.tines.com/llm/explained/10522850-what-happens-to-a-tines-api-key-when-the-user-account-that-created-it-leaves-the-tenant.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In summary, when a user is deactivated or removed entirely from the tenant, the only API key that stops working is their Personal API key."
    notes: >-
      Team and service keys belong to service-account users with their own role or permissions,
      which counts. Personal keys inherit the person's full access, and tenant-owner keys have full
      Owner access.
  last_used:
    pass: false
    evidence:
      - url: https://www.tines.com/llm/stories/docs/admin/tenant-wide-credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "the number of actions and stories the credential is used in, the credential type, when it was last used, created, and updated, the team name, the folder name, and the author name."
    notes: >-
      The last-used column covers credentials Tines stores for outbound actions, not API keys.
      Whether the login-walled settings page shows it is unverifiable.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Tines is not in GitHub's secret-scanning table, so a leaked API key is not reported to Tines.

notes: >-
  Covers Tines Stories on cloud and self-hosted, not Tines 3B. One of five hygiene checks passes, so
  inbound is F. An enforced key lifetime and a key management API would lift it to D. Inbound moves
  to B or A only if the API accepts a federated token. Outbound reaches A if SaaS flows move off
  pasted secrets.
