id: digitalocean-api
vendor: DigitalOcean
product: API
covers: >-
  Droplets, GPU Droplets, DOKS, Spaces, Container Registry, App Platform and Gradient AI, via the API, doctl and Terraform.
aliases:
  - Droplets
  - DOKS
  - Spaces
  - App Platform
  - Gradient AI
  - doctl
website: https://www.digitalocean.com
docs: https://docs.digitalocean.com/reference/api/create-personal-access-token/
category: cloud
status: listed
summary: >-
  Every automated path into DigitalOcean starts from a personal access token made by hand in the
  Control Panel, with no federation from GitHub Actions or other issuers. Repo access is by consent,
  but S3 indexing takes a pasted key. Paperspace has its own card.
surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static personal access token made in the Control Panel, used by the API, doctl, Terraform,
      registry logins and DOKS kubeconfigs. Spaces uses separate static S3-style keys.
    issuers: []
    evidence:
      - url: https://docs.digitalocean.com/reference/api/create-personal-access-token/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          To use the DigitalOcean API, you need to generate a personal access token.
      - url: https://docs.digitalocean.com/reference/api/create-personal-access-token/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          To generate a personal access token, log in to the DigitalOcean Control Panel.
      - url: https://docs.digitalocean.com/products/app-platform/how-to/create-apps/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Use the token to grant `doctl` access to your DigitalOcean account.
      - url: https://docs.digitalocean.com/products/container-registry/how-to/use-registry-docker-kubernetes/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          you can simulate what `doctl registries login` does with `docker login` by using your
          registered email as the username (`-u`) and API token string as password (`-p`)
      - url: https://docs.digitalocean.com/products/spaces/how-to/manage-access/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Access keys allow people or applications to connect to buckets using the S3-compatible
          API, CLI tools, or third-party clients.
      - url: https://docs.digitalocean.com/products/kubernetes/how-to/configure-single-sign-on-for-clusters/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          The kubeconfig for an SSO-enabled cluster includes a command that opens your IdP in a
          browser for you to sign in.
      - url: https://docs.digitalocean.com/reference/api/oauth/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Registering a confidential application assigns it a client ID and client secret which you
          then use in API calls to the DigitalOcean authorization server.
      - url: https://digitalocean.com/blog/oauth-app-workload-identity-droplets
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          we’ll deploy an open source Proof of Concept (PoC), configure roles and policies for
          workload identity access control
    notes: >-
      Graded on the personal access token, since Spaces keys, registry logins and DOKS tokens all
      come from it or sit beside it. DOKS cluster SSO accepts an OIDC issuer, but only for people
      logging in with kubectl, so it does not count. The OAuth API needs a person to authorize it
      and a client secret, so C at best. DigitalOcean's security team blogged an open-source
      federation proof of concept, but you run it yourself, so it is not credited. Hygiene passes 3
      of 5, so D.
  outbound:
    grade: B
    mechanism: >-
      App Platform pulls from GitHub, GitLab and Bitbucket after you grant access, and Knowledge
      Bases connect Dropbox by OAuth. S3 indexing and private Docker Hub or GHCR pulls take pasted
      keys.
    evidence:
      - url: https://docs.digitalocean.com/products/app-platform/how-to/create-apps/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          If you have not previously created an app on App Platform, the repository service may
          prompt you to provide DigitalOcean with read permissions to your account.
      - url: https://docs.digitalocean.com/products/knowledge-bases/how-to/manage-data-sources/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          click **Connect account** to first log in to your Dropbox account and authorize the
          connection.
      - url: https://docs.digitalocean.com/products/knowledge-bases/how-to/manage-data-sources/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          In the [**Access Key ID**](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html)
          field, enter the IAM access key ID for your S3 bucket or folder.
      - url: https://docs.digitalocean.com/products/knowledge-bases/how-to/manage-data-sources/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: In the **Secret Key** field, enter the secret key associated with your access key ID.
      - url: https://docs.digitalocean.com/products/app-platform/how-to/deploy-from-container-images/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          If you choose Docker Hub or GitHub Container Registry, you can enter credentials to
          access private images using the syntax `username:token` or `username:password`.
      - url: https://docs.digitalocean.com/products/app-platform/how-to/deploy-from-container-images/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: We recommend using a non-expiring token with read-only scope.
      - url: https://docs.digitalocean.com/products/custom-images/how-to/upload/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Git sources and Dropbox use consent, which the rubric counts as keyless. Amazon S3 takes a
      pasted IAM access key with no least-privilege or rotation guidance. Docker Hub and GHCR take a
      pasted token, and DigitalOcean suggests a non-expiring one. No integration uses an AWS role,
      GCP impersonation or Azure federation. B rests on the consent-app rule. A reviewer reading B
      as "keyless on a cloud" would put this at F, since S3 is the only cloud integration.
hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.digitalocean.com/reference/api/create-personal-access-token/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: Expiration. Choose when the token expires.
      - url: https://docs.digitalocean.com/reference/doctl/reference/registry/login/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Sets the DigitalOcean API token generated by the login command to never expire.
      - url: https://docs.digitalocean.com/products/spaces/how-to/manage-access/
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Tokens take an expiry chosen by the creator, but no team setting caps it. doctl documents
      never-expiring tokens, and Spaces keys have no expiry. A changeable default fails, as on
      temporal and coreweave-object-storage.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.digitalocean.com/reference/api/create-personal-access-token/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: In the … menu for a token, you can rename, regenerate, or delete the token.
      - url: https://docs.digitalocean.com/reference/api/reference/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
      - url: https://docs.digitalocean.com/reference/api/reference/spaces-keys/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: To create a new Spaces Access Key, send a POST request to `/v2/spaces/keys`.
    notes: >-
      No published endpoint creates or revokes personal access tokens. Spaces keys and registry
      tokens can be made by API, but only with an existing token. Rotating the root token needs a
      browser.
  scoping:
    pass: true
    evidence:
      - url: https://docs.digitalocean.com/reference/api/create-personal-access-token/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Custom scopes grant more specific permissions, like only creating Droplets or updating
          cloud firewalls, which lets you secure your workflows by granting only the permissions
          the token needs and restricting access to other resources and actions.
      - url: https://docs.digitalocean.com/reference/api/scopes/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: View and download Kubernetes cluster credentials
      - url: https://docs.digitalocean.com/products/spaces/how-to/manage-access/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Limited access allows you to grant permissions for specific buckets.
    notes: >-
      A token can be limited to per-resource-type scopes, which passes. It still belongs to a
      person, since DigitalOcean has no service account. Spaces keys can be limited per bucket.
  last_used:
    pass: true
    evidence:
      - url: https://docs.digitalocean.com/reference/api/create-personal-access-token/index.html.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          Personal access tokens table showing token name, number of scopes, creation time, last
          used status, and expiration date.
      - url: https://docs.digitalocean.com/reference/api/create-personal-access-token/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: >-
          You can click the entry in the Scopes column to view details about the token’s usage and
          scopes.
    notes: >-
      The token list shows last use. Spaces keys do not.
  leak_revocation:
    pass: true
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "| DigitalOcean | DigitalOcean Personal Access Token | digitalocean_personal_access_token | ✓ | ✓ | ✓ | ✓ | ✓ | ✗ |"
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "| DigitalOcean | DigitalOcean OAuth Token | digitalocean_oauth_token | ✓ | ✓ | ✓ | ✓ | ✓ | ✗ |"
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "| DigitalOcean | DigitalOcean Refresh Token | digitalocean_refresh_token | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ |"
    notes: >-
      GitHub reports leaked DigitalOcean personal access, OAuth and refresh tokens to DigitalOcean.
      Spaces keys are not covered.
notes: >-
  One card for the control plane and the services reached with its tokens, since all start from the
  same personal access token. Splitting out Spaces would not change its grade. Paperspace is graded
  on its own card. Fixes: a federated token exchange, an API for tokens, a team lifetime cap, and a
  non-human token owner.
