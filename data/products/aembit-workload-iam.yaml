        quote: "Lifetime - The duration for which the generated access token remains valid. The minimum lifetime is 300 seconds (5 minutes)."
    notes: >-
      Aembit issues no long-lived machine credential for its own API: access tokens carry a
      configured lifetime and are minted from attested identity.
