notes: >-
  Graded the management (Cloud) API that customers automate against, including through the Aembit
  Terraform provider. The Edge API (/edge/v1/auth), used by the Edge SDKs and CLI to fetch target
  credentials, accepts the same attestation methods: AWS metadata, IAM role, Lambda and ECS, Azure
  metadata, GCP identity token, Kubernetes service account, GitHub, GitLab, Terraform Cloud and
  generic OIDC. Docs are public and complete enough to grade; no gated material was needed. Aembit
  also ships an MCP Identity Gateway and MCP Authorization Server; their per-user OAuth flows to
  SaaS MCP servers also depend on client secrets of customer-registered apps and are counted in the
  outbound notes.
