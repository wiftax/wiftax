id: infisical-secrets
vendor: Infisical
product: Cloud
covers: The hosted secrets management platform.
aliases:
  - Infisical Cloud
website: https://infisical.com
docs: https://infisical.com/docs/api-reference/overview/authentication
category: security
status: listed
summary: >-
  Your code logs in with a JWT from any OIDC issuer you configure, checked by subject, audience and
  claims. Outbound it is keyless into AWS, GCP, Azure and GitHub, but Okta, Entra ID, Salesforce and
  most SaaS connectors want a pasted token or secret.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      A machine identity presents a JWT from any OIDC issuer you configure. Infisical checks
      subject, audience and claims, then returns a short-lived access token.
    issuers: ["any"]
    evidence:
      - url: https://infisical.com/docs/documentation/platform/identities/oidc-auth/general
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "OIDC Auth is a platform-agnostic JWT-based authentication method that can be used to authenticate from any platform or environment using an identity provider with OpenID Connect."
      - url: https://infisical.com/docs/documentation/platform/identities/oidc-auth/general
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical validates the JWT using the public key provided by the identity provider and checks that the subject, audience, and claims of the token matches with the set criteria."
      - url: https://infisical.com/docs/documentation/platform/identities/oidc-auth/general
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The unique identifier of the identity provider issuing the JWT. This value is used to verify the iss (issuer) claim in the JWT to ensure the token is issued by a trusted provider."
      - url: https://infisical.com/docs/api-reference/overview/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "These methods accept a credential from a trusted external system, such as an OIDC identity token, a JWT signed by a trusted issuer, an LDAP bind, a client certificate, or a SPIFFE SVID."
      - url: https://infisical.com/docs/documentation/platform/identities/universal-auth
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Universal Auth is a platform-agnostic authentication method that can be configured for a machine identity to authenticate from any platform/environment using a Client ID and Client Secret."
    notes: >-
      Machine identities also support SPIFFE, TLS certificates, LDAP and cloud-native logins.
      Universal Auth, a client ID and secret, is the default, and Token Auth issues manual tokens.
      Both are static and scored by hygiene. Match fields accept globs, and "*" also matches ":" and
      "/", so loose patterns can over-trust a shared issuer like GitHub Actions. OIDC access tokens
      default to 30 days, which is long, so lower it. No tier gate on OIDC Auth was found.
  outbound:
    grade: B
    mechanism: >-
      Keyless for AWS role assumption with external ID, GCP impersonation, Azure consent and a
      GitHub App. Okta, Entra ID, Salesforce and most SaaS connectors take a static credential you
      create.
    evidence:
      - url: https://infisical.com/docs/integrations/app-connections/aws
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical can either assume an IAM role in your account or sign in as an IAM user with an access key. We recommend using an IAM role, since Infisical never holds a long-lived credential for it."
      - url: https://infisical.com/docs/integrations/app-connections/aws
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Enable Require external ID and enter your Organization ID."
      - url: https://infisical.com/docs/integrations/app-connections/gcp
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical supports service account impersonation to connect with your GCP projects."
      - url: https://infisical.com/docs/integrations/app-connections/gcp
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical Cloud US: infisical-us@infisical-us.iam.gserviceaccount.com"
      - url: https://infisical.com/docs/integrations/app-connections/azure-key-vault
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "If you use Infisical Cloud, the OAuth flow requests every permission on Infisical's shared Azure app registration (the .default scope), including the permissions for Azure App Configuration."
      - url: https://infisical.com/docs/integrations/app-connections/github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical will use a GitHub App with finely grained permissions to connect to GitHub."
      - url: https://infisical.com/docs/integrations/app-connections/okta
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical supports the use of API Tokens to connect with Okta."
      - url: https://infisical.com/docs/integrations/app-connections/azure-entra-id
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical's Azure Entra ID Connection lets you authenticate with Microsoft Entra ID (formerly Azure Active Directory) using Client Secrets."
      - url: https://infisical.com/docs/integrations/app-connections/salesforce
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical supports the OAuth 2.0 Client Credentials flow to connect with your Salesforce org."
      - url: https://infisical.com/docs/integrations/app-connections/vercel
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical supports connecting to Vercel using API Tokens."
    notes: >-
      AWS, GCP, Azure Key Vault and GitHub each have a keyless option, with static keys also
      offered. Okta takes only an API token, Entra ID only a client secret, and Salesforce a
      consumer key and secret. GitLab needs an access token on Cloud. OCI, Cloudflare and Vercel
      take static keys. Many SaaS targets offer only static tokens themselves, and several
      connectors can rotate what they were given. Keyless on all three clouds and GitHub but static
      on Okta, Entra and Salesforce, so B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://infisical.com/docs/documentation/platform/identities/universal-auth
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "By default, the TTL will be set to 0 which implies that the Client Secret will never expire; a value of 0 implies an infinite lifetime."
      - url: https://infisical.com/docs/documentation/platform/identities/machine-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "If the TTL is 0 (the default), the secret never expires, and the alert ignores it."
    notes: >-
      Client secrets can take a TTL, but they never expire by default and no org policy forces a
      maximum. Token Auth tokens default to 30 days but accept up to ten years.
  rotation_api:
    pass: true
    evidence:
      - url: https://infisical.com/docs/api-reference/endpoints/universal-auth/create-client-secret
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Create Universal Auth Client Secret for machine identity"
      - url: https://infisical.com/docs/api-reference/endpoints/universal-auth/revoke-client-secret
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Revoke Universal Auth Client Secrets for machine identity"
  scoping:
    pass: true
    evidence:
      - url: https://infisical.com/docs/documentation/platform/identities/machine-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Each machine identity has a role that controls what the identity can access, and one or more auth methods."
    notes: >-
      Client secrets belong to a machine identity with its own org and project roles. Paid plans can
      also restrict them to trusted IPs.
  last_used:
    pass: true
    evidence:
      - url: https://app.infisical.com/api/docs/json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: '"accessTokenLastUsedAt": {"type": "string", "format": "date-time", "nullable": true}'
      - url: https://app.infisical.com/api/docs/json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: '"lastLoginTime": {"type": "string", "format": "date-time", "nullable": true}'
    notes: >-
      Token Auth tokens and identities show last use. Client secrets show only a use count, so
      finding a dead one is indirect. Generous pass.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      Infisical is not on GitHub's secret-scanning list, while competitor Doppler is. Infisical's
      own scanning product does not revoke its leaked client secrets.

notes: >-
  Graded on Infisical Cloud. Legacy service tokens remain in the API, but machine identities are the
  documented path. Self-hosted instances need their own cloud credentials, such as an AWS key or a
  GCP JSON key, for the outbound connectors.
