id: infisical-secrets
vendor: Infisical
product: Infisical Cloud (secrets management platform)
website: https://infisical.com
docs: https://infisical.com/docs/api-reference/overview/authentication
category: security
status: listed
summary: >-
  Machine identities can log in with a JWT from any OIDC issuer you configure, constrained by
  subject, audience and claims, so no Infisical secret is needed. Into your clouds it assumes an
  AWS role with external ID, impersonates a GCP service account, and installs as a GitHub or Azure
  app, but Okta, Entra ID, Salesforce and most SaaS connectors still want a pasted token or secret.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      OIDC Auth on a machine identity: the workload presents a JWT from any OIDC issuer (discovery
      URL + issuer configured by the customer), Infisical checks subject, audiences and claims and
      returns a short-lived access token.
    issuers: ["any"]
    evidence:
      - url: https://infisical.com/docs/documentation/platform/identities/oidc-auth/general
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "OIDC Auth is a platform-agnostic JWT-based authentication method that can be used to authenticate from any platform or environment using an identity provider with OpenID Connect."
      - url: https://infisical.com/docs/documentation/platform/identities/oidc-auth/general
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical validates the JWT using the public key provided by the identity provider and checks that the subject, audience, and claims of the token matches with the set criteria."
      - url: https://infisical.com/docs/documentation/platform/identities/oidc-auth/general
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The unique identifier of the identity provider issuing the JWT. This value is used to verify the iss (issuer) claim in the JWT to ensure the token is issued by a trusted provider."
      - url: https://infisical.com/docs/api-reference/overview/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "These methods accept a credential from a trusted external system, such as an OIDC identity token, a JWT signed by a trusted issuer, an LDAP bind, a client certificate, or a SPIFFE SVID."
      - url: https://infisical.com/docs/documentation/platform/identities/universal-auth
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Universal Auth is a platform-agnostic authentication method that can be configured for a machine identity to authenticate from any platform/environment using a Client ID and Client Secret."
    notes: >-
      Besides OIDC Auth, machine identities support JWT Auth (static keys or JWKS), SPIFFE, TLS
      certificate, LDAP, and cloud-native AWS/GCP/Azure/Kubernetes/OCI/AliCloud auth. Universal Auth
      (client ID + client secret) is the default method on a new identity and Token Auth issues
      manually created access tokens; both are the static credentials scored by the hygiene checks.
      Subject/audience/claims fields accept globs, and Infisical warns that "*" also matches ":" and
      "/", so loose patterns can over-trust a shared issuer such as GitHub Actions. Access tokens
      returned by OIDC Auth default to a 30-day TTL, which is long for a "short-lived" token; tune it
      down. The self-hosted Gateway enrolls with a one-time 1-hour token by default, or keylessly via
      AWS STS, GCP metadata or Kubernetes service account tokens. No tier gate on OIDC Auth was found
      on the public pricing page; trusted-IP restrictions on tokens are a paid (Pro) feature.
  outbound:
    grade: B
    mechanism: >-
      App Connections: AWS cross-account Assume Role with required external ID, GCP service account
      impersonation by Infisical's own service account, Azure OAuth consent to Infisical's shared app
      registration, and a GitHub App install are keyless; Okta (API token), Entra ID (client secret),
      Salesforce (client credentials), Cloudflare, Vercel and most other SaaS connectors take a
      customer-created static credential.
    evidence:
      - url: https://infisical.com/docs/integrations/app-connections/aws
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical can either assume an IAM role in your account or sign in as an IAM user with an access key. We recommend using an IAM role, since Infisical never holds a long-lived credential for it."
      - url: https://infisical.com/docs/integrations/app-connections/aws
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Enable Require external ID and enter your Organization ID."
      - url: https://infisical.com/docs/integrations/app-connections/gcp
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical supports service account impersonation to connect with your GCP projects."
      - url: https://infisical.com/docs/integrations/app-connections/gcp
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical Cloud US: infisical-us@infisical-us.iam.gserviceaccount.com"
      - url: https://infisical.com/docs/integrations/app-connections/azure-key-vault
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "If you use Infisical Cloud, the OAuth flow requests every permission on Infisical's shared Azure app registration (the .default scope), including the permissions for Azure App Configuration."
      - url: https://infisical.com/docs/integrations/app-connections/github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical will use a GitHub App with finely grained permissions to connect to GitHub."
      - url: https://infisical.com/docs/integrations/app-connections/okta
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical supports the use of API Tokens to connect with Okta."
      - url: https://infisical.com/docs/integrations/app-connections/azure-entra-id
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical's Azure Entra ID Connection lets you authenticate with Microsoft Entra ID (formerly Azure Active Directory) using Client Secrets."
      - url: https://infisical.com/docs/integrations/app-connections/salesforce
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical supports the OAuth 2.0 Client Credentials flow to connect with your Salesforce org."
      - url: https://infisical.com/docs/integrations/app-connections/vercel
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Infisical supports connecting to Vercel using API Tokens."
    notes: >-
      Connectors checked: AWS (Assume Role recommended; access-key option also offered), GCP
      (impersonation; Infisical Cloud uses its own service account, self-hosters upload a JSON key or
      use WIF for the instance), Azure Key Vault / App Configuration (OAuth to Infisical's app is
      keyless; client secret and certificate options also offered), GitHub (GitHub App recommended;
      OAuth and PAT options exist), GitLab (access token on Cloud; OAuth is self-hosted only), Okta
      (API token only), Azure Entra ID (client secret only, with optional automatic rotation),
      Azure Client Secrets (OAuth or client secret), Salesforce (customer-created External Client
      App with consumer key/secret), OCI (access key), Cloudflare and Vercel (API tokens). No Google
      Workspace or M365 connector was found. Many SaaS targets (Vercel, Netlify, Cloudflare, etc.)
      only offer static tokens themselves, and several connectors can rotate the credential they were
      given. Keyless on all three clouds and GitHub but static on Okta/Entra/Salesforce, so B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://infisical.com/docs/documentation/platform/identities/universal-auth
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "By default, the TTL will be set to 0 which implies that the Client Secret will never expire; a value of 0 implies an infinite lifetime."
      - url: https://infisical.com/docs/documentation/platform/identities/machine-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "If the TTL is 0 (the default), the secret never expires, and the alert ignores it."
    notes: >-
      Client secrets can be given a TTL and a max number of uses, and credential-expiry alerts exist,
      but the default is never-expire and no org policy forcing a maximum client secret TTL is
      documented. Token Auth tokens default to a 30-day TTL but accept up to 315360000 seconds (ten
      years).
  rotation_api:
    pass: true
    evidence:
      - url: https://infisical.com/docs/api-reference/endpoints/universal-auth/create-client-secret
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Create Universal Auth Client Secret for machine identity"
      - url: https://infisical.com/docs/api-reference/endpoints/universal-auth/revoke-client-secret
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Revoke Universal Auth Client Secrets for machine identity"
  scoping:
    pass: true
    evidence:
      - url: https://infisical.com/docs/documentation/platform/identities/machine-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Each machine identity has a role that controls what the identity can access, and one or more auth methods."
    notes: >-
      Client secrets belong to a purpose-built machine identity with its own org and project roles
      (built-in or custom); client secrets and tokens can also be restricted to trusted IPs on paid
      plans.
  last_used:
    pass: true
    evidence:
      - url: https://app.infisical.com/api/docs/json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: '"accessTokenLastUsedAt": {"type": "string", "format": "date-time", "nullable": true}'
      - url: https://app.infisical.com/api/docs/json
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: '"lastLoginTime": {"type": "string", "format": "date-time", "nullable": true}'
    notes: >-
      Token Auth tokens expose accessTokenLastUsedAt and identities expose lastLoginTime and
      lastLoginAuthMethod in the OpenAPI spec. Universal Auth client secrets themselves have no
      last-used timestamp, only a use counter (clientSecretNumUses), so finding a dead client secret
      on an identity with several secrets is indirect. Generous pass.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      Infisical does not appear in GitHub's supported secret-scanning patterns, partner or user,
      while competitor Doppler does. Infisical sells its own secret-scanning product, but that does
      not revoke a leaked Infisical client secret pushed to a public GitHub repo.

notes: >-
  Graded Infisical Cloud. The same platform also covers PKI, KMS, PAM and Agent Vault under the
  same machine-identity auth. Legacy service tokens still appear in the API (/api/v2/service-token)
  but machine identities are the documented path. Self-hosted instances need their own cloud
  credentials (an AWS access key or instance role, a GCP JSON key or WIF) to make the outbound
  connectors work.
