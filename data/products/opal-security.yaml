id: opal-security
vendor: Opal Security
product: Platform
covers: The access management platform API.
aliases:
  - Opal
website: https://www.opal.dev
docs: https://docs.opal.dev/reference/authentication
category: identity
status: listed
summary: >-
  To call the Opal API, Terraform provider or MCP servers, your code needs a static bearer token.
  Opal reaches AWS with a role, but GCP, Google Workspace, Azure, Okta and most SaaS connectors want
  a pasted key or secret.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static bearer token, either a personal token with the user's permissions or a service user
      token scoped by Opal roles. The REST API has no federation.
    evidence:
      - url: https://docs.opal.dev/reference/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "When making requests to the Opal API, you must pass an authentication bearer token in the header to identify yourself as an authorized user."
      - url: https://docs.opal.dev/reference/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "API keys for service users can be created under the API Keys tab and can be set to expire. A maximum of 2 API Keys can be created for a service user."
      - url: https://raw.githubusercontent.com/opalsecurity/terraform-provider-opal/main/docs/index.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "`bearer_auth` (String, Sensitive) HTTP Bearer. Configurable via environment variable `OPAL_AUTH_TOKEN`."
      - url: https://docs.opal.dev/docs/mcp/overview
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Opal's OAuth broker only supports the interactive authorization-code-with-PKCE flow — there's no machine-to-machine/client-credentials support."
      - url: https://docs.opal.dev/docs/mcp/okta-cross-app-access
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Users are matched by primary email address. Opal system users and service users can't be used."
      - url: https://docs.opal.dev/docs/mcp/okta-cross-app-access
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Opal authenticates the agent with its own client credentials when the agent redeems an ID-JAG."
    notes: >-
      The public OpenAPI spec lists only bearer auth, and Terraform uses the same token. Two newer
      MCP paths do not change the grade. MCP OAuth is an interactive login for humans. Okta Cross
      App Access still needs a static client secret, accepts only Okta and excludes service users.
  outbound:
    grade: B
    mechanism: >-
      AWS uses a cross-account role with External ID and GitHub uses a GitHub App. GCP, Google
      Workspace, Azure and Okta want a service account key, client secret, private key or API token.
    evidence:
      - url: https://docs.opal.dev/integrations/setting-up-your-aws-organization-in-opal
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "In the AWS console, create a new IAM role called OpalIngester. Give your role the following trust policy, replacing ${EXTERNAL_ID} with the External ID from the Create App page in Opal"
      - url: https://docs.opal.dev/integrations/setting-up-your-aws-organization-in-opal
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Register Opal with your OIDC provider to receive a Client ID and Client Secret that will be used to establish a trust relationship between Opal and your OIDC provider."
      - url: https://docs.opal.dev/integrations/aws-integration-on-prem-setup
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "We recommend using the IAM Role for Service Account as this is the most secure option, with permissions granted at the scope of the Opal pods only."
      - url: https://docs.opal.dev/integrations/google-cloud-platform
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Select JSON as the Key type and click Create."
      - url: https://docs.opal.dev/integrations/google
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "To connect to Google Groups or Google Workspace, you'll need to create a Google service account with proper permission scopes."
      - url: https://docs.opal.dev/integrations/azure
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Note that you need to create a new client secret at the expiration interval for your Azure AD connection to continue working. The maximum allowed by Microsoft is 2 years."
      - url: https://docs.opal.dev/integrations/okta
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "OAuth App (recommended): Opal authenticates as a dedicated Okta API Services app using a private key. No shared user account needed."
      - url: https://docs.opal.dev/integrations/okta
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "API token: Opal authenticates as a real Okta user account using a static SSWS token. This method is still fully supported but requires a dedicated Okta user and manual token rotation."
      - url: https://docs.opal.dev/integrations/github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "You'll be sent to GitHub to create and install a new Opal GitHub App for your organization."
      - url: https://docs.opal.dev/integrations/github-enterprise
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Back in Opal, fill in the Client ID, Client secret and Private key from your GitHub App."
      - url: https://docs.opal.dev/integrations/slack
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Next, you will be redirected to the Slack authorization page asking you to grant the Opal Slack app permissions to access your workspace or organization."
      - url: https://docs.opal.dev/integrations/salesforce
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Open the account activation email and set a long, 32+ random character password—think of this as an API key."
    notes: >-
      Keyless: AWS, GitHub organizations and Slack notifications. Static: GCP and Google Workspace
      take a JSON key, and Azure a client secret on your own app. Okta takes a private key or an
      SSWS token. GitHub Enterprise, GitLab, Salesforce, Snowflake, Datadog and Active Directory
      also take secrets. AWS sessions also need an OIDC client secret from your IdP. Keyless on AWS,
      so B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.opal.dev/api-reference/tokens/create-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Optional expiration time for the token."
      - url: https://docs.opal.dev/reference/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "API keys for service users can be created under the API Keys tab and can be set to expire."
    notes: >-
      Expiry is optional, and no org setting forces a maximum token lifetime.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.opal.dev/api-reference/tokens/create-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Set `user_id` to a service user's ID to mint a token that authenticates as that service user."
      - url: https://docs.opal.dev/api-reference/tokens/delete-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Deletes a first-party API token. Admins can delete any token."
    notes: >-
      The API can create, list and delete tokens. Each service user can hold two active tokens,
      which allows overlap during rotation.
  scoping:
    pass: true
    evidence:
      - url: https://docs.opal.dev/reference/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Service users have their own identity in Opal and can be assigned Opal roles to scope their permissions."
      - url: https://docs.opal.dev/reference/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Read-only tokens can only perform GET requests, limited to resources you have permission to view."
    notes: >-
      Service users are machine identities with their own roles. Personal tokens inherit their
      creator's permissions.
  last_used:
    pass: true
    evidence:
      - url: https://docs.opal.dev/api-reference/tokens/create-token
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The date and time the token was last used."
    notes: >-
      Tokens from the API include a last-used timestamp.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      Opal is not a GitHub secret-scanning partner, even though its tokens carry a recognizable
      prefix.

notes: >-
  Covers Opal Cloud. Self-hosted Opal uses the same tokens. Docs are public. Inbound moves to C or
  better only with a federated or client-credentials token for service users. Outbound moves toward
  A with keyless GCP, Azure, Okta and Google Workspace.
