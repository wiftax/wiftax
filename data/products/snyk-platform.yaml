id: snyk-platform
vendor: Snyk
product: Platform
covers: The Snyk API and CLI.
website: https://snyk.io
docs: https://docs.snyk.io/platform-administration/service-accounts/service-accounts-using-oauth-2.0
category: devtools
status: listed
summary: >-
  Snyk's API and CLI take Enterprise OAuth service accounts, which mint one-hour tokens from a
  client secret or signing key you hold. CI cannot log in with OIDC. Snyk reaches AWS, Azure and GCP
  without keys, but several repos and registries want pasted tokens.

surfaces:
  inbound:
    grade: C
    mechanism: >-
      Enterprise OAuth service accounts trade a static client secret, or a JWT signed by a key you
      hold, for short-lived tokens. PATs and legacy API keys also work.
    tier_gated: Enterprise (service accounts and API access)
    evidence:
      - url: https://docs.snyk.io/platform-administration/service-accounts/service-accounts-using-oauth-2.0.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "OAuth 2.0 access tokens are used the same way another Snyk token is used, but they have added security of a short time-to-live (TTL) and can be automatically refreshed."
      - url: https://docs.snyk.io/platform-administration/service-accounts/service-accounts-using-oauth-2.0.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service accounts using OAuth 2.0 are available only with Enterprise plans through the Snyk API."
      - url: https://docs.snyk.io/platform-administration/service-accounts/service-accounts-using-oauth-2.0.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This is an advanced feature for customers who have the infrastructure to host a publicly accessible"
      - url: https://558411700-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FIEEjSXQQu36y0vmFV8zf%2Fuploads%2Fgit-blob-688a641e25b6bd8b33a94ac151f6adba5ecd370f%2Foauth-api-spec.yaml?alt=media
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "sub: client_id of your Service Account."
      - url: https://docs.snyk.io/platform-administration/service-accounts/manage-service-accounts-using-the-snyk-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The time, in seconds, that a generated access token will be valid for. Defaults to one hour if unset."
      - url: https://docs.snyk.io/developer-tools/snyk-cli/authenticate-to-use-the-cli.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Map your securely stored PAT or API token to the `SNYK_TOKEN` environment variable, or map your OAuth token to `SNYK_OAUTH_TOKEN`, directly within your pipeline configuration or GitHub Actions `env` block."
      - url: https://docs.snyk.io/developer-tools/snyk-cli/commands/auth.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can set the client secret, and the id can be set in order to use the OAuth2 Client Credentials Grant."
      - url: https://docs.snyk.io/developer-tools/integrations/snyk-ci-cd-integrations/github-actions-for-snyk-setup-and-checking-for-vulnerabilities.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Snyk GitHub Actions examples on this page refer to a Snyk API token:"
      - url: https://docs.snyk.io/developer-tools/snyk-api/authentication-for-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To use the Snyk API, you must be an Enterprise plan customer and have a token from Snyk."
    notes: >-
      Graded at the best path, Enterprise OAuth service accounts. Free and Team plans get only
      personal tokens, which would be D or F. Both OAuth options start from a long-lived secret you
      hold. The signed JWT is not federation, because Snyk requires its issuer and subject to be the
      service account itself. A GitHub Actions or cloud token cannot be presented, and there is no
      token exchange. By precedent that is C at best. OAuth tokens work on the full REST API and
      CLI, so no weaker path lowers the grade.
  outbound:
    grade: B
    mechanism: >-
      Snyk assumes an AWS role with an External ID, uses a federated Azure credential, or
      impersonates a Google service account. GitHub and Bitbucket Cloud use installed apps. Other
      repos and registries want pasted tokens.
    tier_gated: Enterprise (AWS and Google Cloud integrations; Azure needs Business or Enterprise)
    evidence:
      - url: https://docs.snyk.io/scan-fix-and-prevent/scan-with-snyk/snyk-iac/cloud-platform-integrations/aws-integration/aws-integration-web-ui/step-2-create-the-snyk-iam-role.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Snyk generates this unique ID for your organization to prevent other parties from assuming the role without the ID, even if they have your role Amazon Resource Name (ARN)."
      - url: https://docs.snyk.io/scan-fix-and-prevent/scan-with-snyk/snyk-iac/cloud-platform-integrations/azure-integration-for-cloud-configurations/azure-integration-web-ui/step-2-create-the-entra-id-app-registration.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Additionally, Snyk has a security feature that locks the federated credential for a subscription and tenant to the Organization that onboards it."
      - url: https://docs.snyk.io/scan-fix-and-prevent/scan-with-snyk/snyk-iac/cloud-platform-integrations/google-cloud-integration/google-cloud-integration-web-ui/step-2-create-the-google-service-account-web-ui.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "IAM role to enable it to generate short-lived credentials for your service account."
      - url: https://docs.snyk.io/scan-fix-and-prevent/scan-with-snyk/snyk-container/container-registry-integrations/integrate-with-amazon-elastic-container-registry-ecr/add-more-organizations-to-your-aws-iam-role-for-snyk-authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Ensure the value of \"sts:ExternalId\" is enclosed with square brackets and insert the additional Organization ID inside those brackets."
      - url: https://docs.snyk.io/developer-tools/integrations/scm-integrations/organization-level-integrations/github-cloud-app.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The GitHub App performs Snyk-initiated pull requests directly rather than going through a service account."
      - url: https://docs.snyk.io/developer-tools/integrations/scm-integrations/organization-level-integrations/bitbucket-cloud-app.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To give Snyk access to your Bitbucket account, you need to install the Snyk App on your Bitbucket Cloud workspace."
      - url: https://docs.snyk.io/developer-tools/integrations/scm-integrations/organization-level-integrations/github-enterprise.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A personal access token (PAT) or fine-grained PAT must be generated in GitHub Enterprise under"
      - url: https://docs.snyk.io/developer-tools/integrations/scm-integrations/organization-level-integrations/gitlab.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This token is then authenticated with GitLab, enabling access by Snyk to the repositories in that GitLab account."
      - url: https://docs.snyk.io/developer-tools/integrations/scm-integrations/organization-level-integrations/azure-repositories-tfs.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Generate a unique Azure DevOps personal access token (PAT) for Snyk, based on a username and password combination, and configured with the specific permissions Snyk needs to access your Azure repositories."
      - url: https://docs.snyk.io/scan-fix-and-prevent/scan-with-snyk/snyk-container/container-registry-integrations/integrate-with-google-artifact-registry-gar.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In the JSON key file field, paste the entire contents of the JSON key file you downloaded when"
      - url: https://docs.snyk.io/scan-fix-and-prevent/scan-with-snyk/snyk-container/container-registry-integrations/integrate-with-microsoft-azure-container-registry-acr/configure-integration-for-acr.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter the user name, password, and container registry name (myregistry.azurecr.io) that you received when you generated a service principal for this integration."
      - url: https://docs.snyk.io/scan-fix-and-prevent/scan-with-snyk/snyk-container/container-registry-integrations/integrate-with-docker-hub/configure-the-integration-with-docker-hub.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter your Docker Hub username and Access Token."
      - url: https://docs.snyk.io/platform-administration/snyk-broker/classic-broker/prepare-snyk-broker-for-deployment/obtain-the-tokens-required-to-set-up-snyk-broker.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Snyk recommends rotating all API tokens and credentials used with Snyk Broker every 90 days."
    notes: >-
      Keyless: cloud scanning on AWS, Azure and GCP, ECR, and the GitHub and Bitbucket Cloud apps.
      Static: GitHub Enterprise, GitLab and Azure Repos take PATs. Google Artifact Registry and ACR
      take a JSON key or password, and Docker Hub, GHCR, Artifactory and Bitbucket Data Center want
      tokens or passwords. Snyk Broker, for private repos, runs in your network with your repo token
      plus a static Broker token. Docs scope these tokens and advise 90-day rotation. Keyless on all
      three clouds makes this B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.snyk.io/platform-administration/service-accounts/choose-a-service-account-type-to-use-with-snyk-apis.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API keys are quick to implement in a workflow and do not expire."
      - url: https://docs.snyk.io/platform-administration/service-accounts/manage-service-accounts-using-the-snyk-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The service account uses a legacy Snyk API key (no expiry)."
      - url: https://docs.snyk.io/developer-tools/snyk-api/authentication-for-api/personal-access-tokens-pats.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Users cannot create PATs that live for more than 90 days."
      - url: https://docs.snyk.io/developer-tools/snyk-cli/commands/auth.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Snyk API token can still be used as a fallback option."
    notes: >-
      PATs cap at 90 days, but legacy API tokens and api_key service accounts never expire, and no
      policy can disable them. An allowed option that cannot be forbidden fails, as on
      elastic-cloud-api.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.snyk.io/platform-administration/service-accounts/manage-service-accounts-using-the-snyk-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "simultaneously delete the existing client secret and generate a new secret."
      - url: https://docs.snyk.io/platform-administration/service-accounts/manage-service-accounts-using-the-snyk-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This call permanently deletes the specified service account and revokes its credentials."
      - url: https://docs.snyk.io/developer-tools/snyk-api/authentication-for-api/personal-access-tokens-pats.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "PATs can only be created through the UI, but can be revoked through the UI and API."
    notes: >-
      The REST API can create and delete service accounts and replace OAuth client secrets, with two
      active for overlap. PATs cannot be created by API, and legacy tokens rotate only in the web
      UI.
  scoping:
    pass: true
    evidence:
      - url: https://docs.snyk.io/platform-administration/service-accounts/service-accounts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "you can choose Organization-level roles, including"
      - url: https://docs.snyk.io/llms.txt
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Custom role template for a CLI Tester, an Organization-level role that lets CI/CD service accounts run Snyk CLI tests"
      - url: https://docs.snyk.io/platform-administration/service-accounts/service-accounts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Snyk prevents users from creating Organization service accounts with a role that has more privileges than those the user creating the service account has."
    notes: >-
      Service accounts are machine identities with their own roles, including custom roles. PATs and
      legacy tokens carry the person's full access.
  last_used:
    pass: false
    evidence:
      - url: https://docs.snyk.io/developer-tools/snyk-api/authentication-for-api/personal-access-tokens-pats.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can see the name, created date and expiry for each token of a PAT (but not the token), and these details can be seen in the UI and through the API."
    notes: >-
      PATs and service accounts show no last-used time. Enterprise audit logs keep 90 days of API
      access, but not per credential.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Snyk is not in GitHub's secret-scanning table, so a Snyk token pushed to a public repo is not
      reported to Snyk.

notes: >-
  Covers the REST API, CLI, CI plugins, IDE sign-in and integrations. Snyk API & Web (DAST) and Evo
  are not graded here. Inbound moves up only if Snyk accepts federated tokens from CI or cloud
  workloads. Outbound reaches A if registries and repos gain keyless options.
