id: sentinelone-singularity
vendor: SentinelOne
product: Singularity
covers: "The Management Console API, Cloud Native Security and Data Lake."
aliases:
  - Singularity Data Lake
  - Cloud Native Security
website: https://www.sentinelone.com
docs: https://github.com/Sentinel-One/ai-siem/blob/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
category: security
status: listed
confidence:
  level: low
  reason: >-
    SentinelOne's docs are behind a login, so receipts come from its GitHub repos and blog. The
    expiry and last-used passes are thin. If both fail, inbound drops to F.
summary: >-
  Workloads call the SentinelOne Management API with a static API token, usually owned by a Service
  User. No OIDC path exists. Tokens must have an expiry and can be scoped and rotated by API.
  SentinelOne reaches AWS without keys, but repo scanning and some exports want static keys.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static API token, minted for a Service User with a role and a required expiry, or as a
      personal token. Raw log ingest uses a separate static write key.
    evidence:
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"securityDefinitions": {"ApiTokenAuth": {"type": "apiKey", "name": "Authorization", "in": "header", "description": "Authorization Token"}}'
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/docs/credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Settings → Users → Service Users → Create Service User → copy the API token."
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/docs/credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`S1_CONSOLE_URL` and `S1_CONSOLE_API_TOKEN` are the minimum, and between them they authorise every SDL query and configuration operation including parser and dashboard deployment."
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/docs/credentials.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The SDL Log Write Key: Console → Singularity Data Lake → API Keys → Log Write Key. No API mints one."
      - url: https://raw.githubusercontent.com/Sentinel-One/purple-mcp/main/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Purple MCP uses a SentinelOne Console token configured at startup via environment variables."
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Log in to the API with a token. To learn more about temporary and 6-month tokens and how to generate them"
    notes: >-
      SentinelOne's own docs need a login, so this card relies on its public GitHub repos. The API
      spec declares only the token header, and nothing public offers OIDC or workload identity.
      Human SSO and passwords are not workload paths. Whether federation exists behind the login is
      unknown. The Data Lake keys are a second static type, created only in the console. Inbound
      moves to B or A only with a federated token.
  outbound:
    grade: B
    mechanism: >-
      SentinelOne reaches AWS by assuming an IAM role you create, with an External ID for S3 export.
      Repo scanning wants personal access tokens, and S3-compatible stores take static keys.
    tier_gated: Separate licenses (Cloud Native Security, Cloud Funnel / Singularity Data Lake)
    evidence:
      - url: https://www.sentinelone.com/blog/feature-spotlight-auto-discover-unprotected-amazon-ec2-instances-with-cloud-rogues/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Once creation of the Connection Stack is complete, copy the Role ARN value, return to the SentinelOne console, and paste the Role ARN value where indicated in the AWS Standalone Account Protection pop-up."
      - url: https://www.sentinelone.com/blog/feature-spotlight-auto-discover-unprotected-amazon-ec2-instances-with-cloud-rogues/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To get started, Singularity Cloud Workload Security customers need to first grant SentinelOne read-only access to their AWS cloud accounts."
      - url: https://www.sentinelone.com/blog/cloud-native-security-prioritize-better-response-faster-with-verified-exploit-paths/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "It provides templates to deploy, and within minutes, allows customers to set up read-access across AWS, Microsoft Azure, Google GCP, Oracle Cloud, Alibaba Cloud, and Digital Ocean."
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Get the AWS assume role external ID"
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If set to true, activates the AWS AssumeRole functionality for accessing S3 buckets or other associated resources."
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Access key id, for S3 compatible storages (e.g. R2)"
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This endpoint allows users to onboard a new VCS integration, enabling automated scanning for secrets and IaC misconfigurations."
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"gitlabPersonalAccessToken": {"maxLength": 200, "minLength": 0, "type": "string"}'
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"azurePersonalAccessToken": {"type": "string"}'
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/pipelines/pull/object_store/aws/cloudtrail/metadata.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Requires an AWS account with an IAM role that Data Pipelines can assume (auth.assume_role + auth.external_id) and an SQS queue wired to the S3 bucket(s) containing CloudTrail logs."
    notes: >-
      AWS account connections use a role from a CloudFormation stack. Steps for Azure, GCP and other
      clouds are behind the login, so their credentials are unknown. GitLab and Azure Repos take
      personal tokens. The GitHub setup takes an app's private key, but whose app is unclear, so
      GitHub is not counted. S3 exports assume your role, while R2 and similar stores take static
      keys. B because AWS is keyless and repo scanning wants static tokens. A needs keyless Azure
      and GCP plus app installs instead of tokens. A documented Azure secret or GCP key would not
      drop it below B.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"required": ["expirationDate", "name", "scope"]'
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '{"expirationDate": {"type": "string", "format": "date-time", "description": "Date when the generated token expires"}}, "required": ["expirationDate"]'
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To learn more about temporary and 6-month tokens and how to generate them"
    notes: >-
      Passes with a caveat. Unlike elastic-cloud-api, there is no never option. Service User tokens
      require an expiry and personal tokens last six months. If any far-future date is accepted,
      this fails and inbound drops to F.
  rotation_api:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/references/tags/Service_Users.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Generate a new API token for a service user and revoke the existing API token."
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/references/tags/Service_Users.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create a new service user."
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Revoke an API token."
    notes: >-
      The API can create Service Users, regenerate their tokens and revoke them. Regenerating kills
      the old token at once, so overlap needs a second Service User.
  scoping:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"scope": {"type": "string", "description": "User scope", "example": "tenant", "enum": ["tenant", "account", "site"]}'
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "List of id and role id, id is mandatory for user in scope account/site."
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/docs/read-only.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use a dedicated service user with the least-privileged role that covers the task."
    notes: >-
      Service Users are machine identities with their own scope and role. Personal tokens get the
      human's access.
  last_used:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/spec/swagger_2_1.json
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"description": "Last activation"'
      - url: https://raw.githubusercontent.com/Sentinel-One/ai-siem/main/plugins/s1-secops-skills/skills/mgmt-console-api/references/tags/Users.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "User was last active before this timestamp."
    notes: >-
      Judgment call. A Service User shows when it was last active, which can only happen through its
      token. If this does not track API calls, it fails, and D then holds only if expiry does.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      SentinelOne is not in GitHub's secret-scanning patterns, so leaked tokens or keys are not
      reported.

notes: >-
  Covers the Management API, cloud account connections, Cloud Funnel exports and Data Lake
  ingestion. Agent enrollment tokens are not graded. Expiry and last use are judgment calls, and if
  both fail, inbound drops to F. A federated token path for the Management API would lift inbound to
  B or A.
