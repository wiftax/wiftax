id: doppler-secrets
vendor: Doppler
product: SecretOps Platform
covers: "The API, CLI and secrets syncs."
website: https://www.doppler.com
docs: https://docs.doppler.com/reference/api
category: security
status: listed
summary: >-
  On Team and Enterprise plans, your code can trade a token from any OIDC issuer you configure for a
  short-lived Doppler token. The free plan only has static tokens. Syncs into AWS, GCP and Azure are
  keyless, but most CI and hosting syncs want a pasted API token.

surfaces:
  inbound:
    grade: A
    tier_gated: Team or Enterprise (Service Accounts and Service Account Identities)
    mechanism: >-
      Service Account Identities accept an OIDC token from any issuer's discovery URL, check
      audience, subject and optional custom claims, and return a short-lived Doppler token.
    issuers: ["any"]
    evidence:
      - url: https://docs.doppler.com/docs/service-account-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Identities allow a service account to authenticate to Doppler via OIDC without using a static API token. Any tool that can generate OIDC tokens (e.g., CI tools like GitHub or GitLab) is compatible with Doppler."
      - url: https://docs.doppler.com/docs/service-account-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Select your provider (or provide a custom Discovery URL - you can verify the discovery data by clicking on the generated link below the field)"
      - url: https://docs.doppler.com/docs/service-account-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Audience and subject claims are required."
      - url: https://docs.doppler.com/docs/service-account-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "This feature is available with our Team and Enterprise plans."
      - url: https://docs.doppler.com/reference/auth-oidc
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Authenticate via a Service Account Identity with OIDC. Returns a short lived API token."
      - url: https://docs.doppler.com/docs/aws-ec2-oidc
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Doppler accepts these JWTs via its OIDC login flow and exchanges them for short-lived Doppler API tokens."
      - url: https://docs.doppler.com/docs/kubernetes-operator-oidc
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Doppler Kubernetes Operator supports OIDC authentication, allowing your cluster to authenticate with Doppler using short-lived tokens instead of static API tokens."
    notes: >-
      The custom discovery URL lets you bring any issuer. Doppler documents GitHub Actions, GitLab,
      CircleCI, AWS and any Kubernetes cluster with a public issuer. Federation needs the Team or
      Enterprise plan. Free plan users get static service tokens, or personal tokens with the user's
      full access. The Kubernetes Operator defaults to a static token in a Kubernetes secret and
      uses OIDC only if you configure it. The CLI, GitHub action and Terraform provider still accept
      static tokens too.
  outbound:
    grade: B
    mechanism: >-
      Doppler assumes an AWS role with an External ID, federates into GCP, and uses app consent or a
      federated credential on Azure. Most CI and hosting syncs want a pasted API token.
    evidence:
      - url: https://docs.doppler.com/docs/aws-secrets-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Doppler uses an IAM role you provide to assume into your account."
      - url: https://docs.doppler.com/docs/aws-secrets-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Enter your workplace slug for the External ID. You can obtain your workplace slug by visiting the Doppler dashboard."
      - url: https://docs.doppler.com/docs/gcp-secret-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Workload identity federation is recommended, since it leaves no credential stored in Doppler."
      - url: https://docs.doppler.com/docs/gcp-secret-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Because the subject contains the connection ID, trust you grant to one connection never extends to another."
      - url: https://docs.doppler.com/docs/gcp-secret-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Use this method if you'd rather give Doppler a service account key than set up federation."
      - url: https://docs.doppler.com/docs/azure-key-vault
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "You'll then be redirected to the Azure Portal to approve Doppler's access to your Azure Key Vault."
      - url: https://docs.doppler.com/docs/azure-dynamic-service-principal
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Doppler can authenticate to this integration without you storing a long-lived credential."
      - url: https://docs.doppler.com/docs/github-actions
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "to provide access for syncing secrets from Doppler to a chosen repository."
      - url: https://docs.doppler.com/docs/vercel
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Click Authorize which will take you back to the Doppler dashboard."
      - url: https://docs.doppler.com/docs/gitlab-sync-integration
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "You can use Personal, Group, or Project access tokens from GitLab with this integration."
      - url: https://docs.doppler.com/docs/cloudflare-pages
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "paste the API token you created in the previous step into the API Token field."
      - url: https://docs.doppler.com/docs/ekm-aws
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "IAM User Secret access key"
    notes: >-
      AWS, GCP and Azure syncs and rotation are keyless, as are GitHub, Vercel, Heroku and Netlify
      through app installs. GitLab, Bitbucket, CircleCI, Cloudflare, Terraform Cloud and others take
      pasted tokens, and AWS EKM takes an IAM user key. That makes it B. The AWS External ID is your
      workplace slug, which shows in your dashboard URL and is shared by every AWS connection. AWS
      wants an ID unique per customer and not chosen by them, and Doppler does not document that.
      GCP and Azure, where Doppler is the OIDC issuer, are the stronger design.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.doppler.com/reference/service_account_tokens-create
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The datetime at which the API token should expire. If not provided, the API token will remain vaild indefinitely unless manually revoked"
      - url: https://docs.doppler.com/docs/service-tokens
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "An ephemeral Service Token can be created by setting an expiration time. Once the duration is reached, the token is automatically deleted."
    notes: >-
      Service and service account tokens can expire, but expiry is optional and defaults to never.
      No workplace policy forces a maximum lifetime.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.doppler.com/reference/service_account_tokens-create
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Generate a new service account API token."
      - url: https://docs.doppler.com/reference/service_account_tokens-delete
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Revoke an existing service account API token."
    notes: >-
      Service tokens can also be created and deleted through the API. The dashboard can roll service
      account tokens.
  scoping:
    pass: true
    evidence:
      - url: https://docs.doppler.com/docs/service-tokens
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A Doppler Service Token provides read-only secrets access to a specific config within a project."
      - url: https://docs.doppler.com/docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "By default, service accounts do not have a workplace role or any project access granted to them and thus can't do anything until access is granted."
    notes: >-
      Service tokens cover one config and are read-only by default. Service accounts have their own
      roles and per-project access. Personal and CLI tokens get the user's full access.
  last_used:
    pass: true
    evidence:
      - url: https://docs.doppler.com/reference/service_account_tokens-list
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "last_seen_at"
      - url: https://docs.doppler.com/reference/service_account_tokens-list
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "List information about existing service account API tokens."
    notes: >-
      The API shows when a service account token was last seen. Service tokens show no last use, so
      dead ones are harder to find.
  leak_revocation:
    pass: true
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Doppler Service Account Token"
      - url: https://github.blog/changelog/2023-05-03-doppler-is-a-github-secret-scanning-partner/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "GitHub will forward access tokens found in public repositories to Doppler, who will revoke the tokens and email affected customers."
    notes: >-
      GitHub reports every Doppler token type pushed to public repos to Doppler. Each type has its
      own prefix, such as dp.st or dp.pt.

notes: >-
  Graded on Doppler's cloud platform and REST API. The A needs the Team or Enterprise plan. On the
  free plan, Doppler is effectively a D: static tokens, 4 of 5 hygiene checks, no forced expiry.
  Doppler is now an OIDC issuer for outbound connections, but only GCP and Azure rotation use it.
