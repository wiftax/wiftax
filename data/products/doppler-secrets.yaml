id: doppler-secrets
vendor: Doppler
product: SecretOps platform (API, CLI, secrets syncs)
website: https://www.doppler.com
docs: https://docs.doppler.com/reference/api
category: security
status: listed
summary: >-
  On Team and Enterprise plans a workload can swap a token from any OIDC issuer you configure for a
  short-lived Doppler token, though the free plan only offers static tokens that never expire by
  default. Outbound syncs into AWS, GCP and Azure are keyless, but most CI and PaaS syncs (GitLab,
  Bitbucket, CircleCI, Cloudflare, Render, Fly.io) still want a pasted API token.

surfaces:
  inbound:
    grade: A
    tier_gated: Team or Enterprise (Service Accounts and Service Account Identities)
    mechanism: >-
      Service Account Identities accept an OIDC token from a preset provider or any custom
      discovery URL, validate required audience and subject claims plus optional custom claims
      (JSON Pointer for nested claims), and return a short-lived dp.said token via POST
      /v3/auth/oidc.
    issuers: ["any"]
    evidence:
      - url: https://docs.doppler.com/docs/service-account-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Identities allow a service account to authenticate to Doppler via OIDC without using a static API token. Any tool that can generate OIDC tokens (e.g., CI tools like GitHub or GitLab) is compatible with Doppler."
      - url: https://docs.doppler.com/docs/service-account-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Select your provider (or provide a custom Discovery URL - you can verify the discovery data by clicking on the generated link below the field)"
      - url: https://docs.doppler.com/docs/service-account-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Audience and subject claims are required."
      - url: https://docs.doppler.com/docs/service-account-identities
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "This feature is available with our Team and Enterprise plans."
      - url: https://docs.doppler.com/reference/auth-oidc
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Authenticate via a Service Account Identity with OIDC. Returns a short lived API token."
      - url: https://docs.doppler.com/docs/aws-ec2-oidc
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Doppler accepts these JWTs via its OIDC login flow and exchanges them for short-lived Doppler API tokens."
      - url: https://docs.doppler.com/docs/kubernetes-operator-oidc
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Doppler Kubernetes Operator supports OIDC authentication, allowing your cluster to authenticate with Doppler using short-lived tokens instead of static API tokens."
    notes: >-
      The custom Discovery URL is the bring-your-own-issuer path: Doppler documents CircleCI,
      GitHub Actions, GitLab, AWS IAM outbound identity federation (EC2) and any Kubernetes cluster
      whose issuer is publicly reachable. Federation is gated to Team and Enterprise; Developer
      (free) plan users are left with static Service Tokens (one config, optional expiry) or
      Personal/CLI tokens that carry the user's full read/write access. The Kubernetes Operator
      (Doppler's in-cluster agent) defaults to a static token stored in a Kubernetes secret
      ("tokenSecret", a service account token in production) and only uses OIDC if you configure
      it. The CLI, the GitHub secrets-fetch action and the Terraform provider all still accept
      static tokens too.
  outbound:
    grade: B
    mechanism: >-
      Keyless into the clouds: AWS via a cross-account IAM role with External ID, GCP via workload
      identity federation trusting Doppler's own OIDC issuer (per-connection subject), Azure via
      admin consent to Doppler's registered app or a federated credential; GitHub, Vercel, Heroku
      and Netlify via the vendor's app/OAuth install. Most other CI and PaaS syncs want a pasted
      long-lived API token.
    evidence:
      - url: https://docs.doppler.com/docs/aws-secrets-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Doppler uses an IAM role you provide to assume into your account."
      - url: https://docs.doppler.com/docs/aws-secrets-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Enter your workplace slug for the External ID. You can obtain your workplace slug by visiting the Doppler dashboard."
      - url: https://docs.doppler.com/docs/gcp-secret-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Workload identity federation is recommended, since it leaves no credential stored in Doppler."
      - url: https://docs.doppler.com/docs/gcp-secret-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Because the subject contains the connection ID, trust you grant to one connection never extends to another."
      - url: https://docs.doppler.com/docs/gcp-secret-manager
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Use this method if you'd rather give Doppler a service account key than set up federation."
      - url: https://docs.doppler.com/docs/azure-key-vault
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "You'll then be redirected to the Azure Portal to approve Doppler's access to your Azure Key Vault."
      - url: https://docs.doppler.com/docs/azure-dynamic-service-principal
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Doppler can authenticate to this integration without you storing a long-lived credential."
      - url: https://docs.doppler.com/docs/github-actions
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "to provide access for syncing secrets from Doppler to a chosen repository."
      - url: https://docs.doppler.com/docs/vercel
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Click Authorize which will take you back to the Doppler dashboard."
      - url: https://docs.doppler.com/docs/gitlab-sync-integration
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "You can use Personal, Group, or Project access tokens from GitLab with this integration."
      - url: https://docs.doppler.com/docs/cloudflare-pages
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "paste the API token you created in the previous step into the API Token field."
      - url: https://docs.doppler.com/docs/ekm-aws
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "IAM User Secret access key"
    notes: >-
      Connectors checked. Keyless: AWS Secrets Manager, AWS Parameter Store, AWS IAM dynamic
      secrets/rotation and SQS log forwarding (IAM role + External ID); GCP Secret Manager (WIF
      recommended, service-account JSON key still offered) and GCP SA-key rotation
      (impersonation of a Doppler-owned service account); Azure Key Vault and App Service (consent
      to Doppler's app; Key Vault also offers a customer service principal with client secret),
      Azure service principal rotation/dynamic secrets (federated credential recommended, client
      secret optional); GitHub (Doppler GitHub App), Vercel, Heroku, Netlify (OAuth install).
      Static tokens: GitLab (PAT/group/project token), Bitbucket (access token), CircleCI
      (personal API token), Cloudflare Pages, Render, Fly.io, Terraform Cloud (org token),
      Railway, Supabase, Qovery (API tokens), Cloudflare token rotation (managing token), AWS EKM
      (IAM user access key pair). No Okta, Entra/M365 or Google Workspace connectors exist; those
      appear only as SAML/SCIM for human login. AWS External ID: confirmed that Doppler tells you
      to use your workplace slug, a value visible in your dashboard URL rather than a
      Doppler-generated per-connection secret. AWS's confused-deputy guidance wants an ID that is
      unique per customer and not chosen by the customer; that holds only if Doppler always
      sends the calling workplace's own slug and slugs cannot be chosen or reused. Doppler does
      not document either property, and every AWS connection in a workplace shares the same
      External ID. The GCP and Azure keyless paths, which use Doppler as an OIDC issuer with a
      per-connection subject, are the stronger design.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.doppler.com/reference/service_account_tokens-create
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The datetime at which the API token should expire. If not provided, the API token will remain vaild indefinitely unless manually revoked"
      - url: https://docs.doppler.com/docs/service-tokens
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "An ephemeral Service Token can be created by setting an expiration time. Once the duration is reached, the token is automatically deleted."
    notes: >-
      Service tokens and service account tokens can carry an expiry, but it is optional and the
      default is indefinite. No workplace policy to force a maximum token lifetime was found in
      the public docs; workplace settings only offer a bulk "Revoke Access Tokens" for personal and
      CLI tokens.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.doppler.com/reference/service_account_tokens-create
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Generate a new service account API token."
      - url: https://docs.doppler.com/reference/service_account_tokens-delete
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Revoke an existing service account API token."
    notes: Service tokens also have create and delete endpoints; the dashboard offers a "roll" action for service account tokens.
  scoping:
    pass: true
    evidence:
      - url: https://docs.doppler.com/docs/service-tokens
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "A Doppler Service Token provides read-only secrets access to a specific config within a project."
      - url: https://docs.doppler.com/docs/service-accounts
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "By default, service accounts do not have a workplace role or any project access granted to them and thus can't do anything until access is granted."
    notes: >-
      Service tokens (one config, read-only by default) and service accounts (own workplace role,
      per-project and per-environment access, inline custom roles) are purpose-built machine
      principals. Personal and CLI tokens inherit the user's full read/write access.
  last_used:
    pass: true
    evidence:
      - url: https://docs.doppler.com/reference/service_account_tokens-list
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "last_seen_at"
      - url: https://docs.doppler.com/reference/service_account_tokens-list
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "List information about existing service account API tokens."
    notes: >-
      Service account tokens expose last_seen_at through the API. The public service token list
      endpoint shows no last-used field, so dead per-config service tokens are harder to find.
  leak_revocation:
    pass: true
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Doppler Service Account Token"
      - url: https://github.blog/changelog/2023-05-03-doppler-is-a-github-secret-scanning-partner/
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "GitHub will forward access tokens found in public repositories to Doppler, who will revoke the tokens and email affected customers."
    notes: >-
      Partner patterns (public-repo scanning) cover Doppler audit, CLI, personal, SCIM, service
      account and service tokens. Each token type has a distinct prefix (dp.st, dp.sa, dp.pt and so
      on) to aid scanning.

notes: >-
  Graded the Doppler cloud SecretOps platform and its REST API. Docs are public (docs.doppler.com,
  including Markdown copies and OpenAPI per endpoint), so nothing was gated. The A depends on the
  Team or Enterprise tier; a Developer-plan customer is effectively at D (static tokens, 4 of 5
  hygiene checks, no forced expiry). Doppler is now itself an OIDC issuer (https://api.doppler.com)
  for outbound connections, but only the GCP and Azure-rotation docs use it; AWS connections still
  rely on the workplace-slug External ID.
