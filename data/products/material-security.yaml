id: material-security
vendor: Material Security
product: Material platform (API v1)
website: https://material.security
docs: https://docs.material.security/reference/api-v1/authentication
category: security
status: listed
summary: >-
  Material's API accepts only a static per-account token in an x-material-client-secret header,
  with no documented expiry, last-used timestamp, token API or leak revocation. Material reaches
  Google Workspace through domain-wide delegation to its own app, but Okta, Duo, OneLogin, Slack
  and SIEM connectors all want a pasted token or secret.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      Static API token created in the Material console, tied to one Material account and sent in
      the x-material-client-secret header; it carries that account's current role permissions.
    issuers: []
    evidence:
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Each API token is tied to a specific account. You can create as many tokens as needed."
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Requests are checked against the account's current permissions, not the permissions it had when the token was created."
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "For production use, we recommend creating a new service account to generate the API token. Once the token is created, you can reset and discard the account's login details."
      - url: https://docs.material.security/reference/material-mcp-server
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "OAuth is the recommended way to connect: each person authorizes with their own Material account, and token issuing and refresh are handled for you, so there's no long-lived secret to store or rotate."
      - url: https://docs.material.security/reference/material-mcp-server
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Use an API token when your AI client doesn't support OAuth, or when you'd rather manage a long-lived token yourself."
    notes: >-
      No OIDC federation, workload identity, or client-credentials flow is documented for the REST
      API. The Material MCP server supports OAuth, but that is an interactive per-person
      authorization for AI clients, not a machine flow, and the MCP fallback is the same static API
      token. The beta API predates v1 and is documented only in-app; it was not assessed. Material
      is agent-free (no on-prem collectors). Public docs (docs.material.security) are not gated.
  outbound:
    grade: B
    mechanism: >-
      Google Workspace is connected by granting scopes to Material via domain-wide delegation and
      Microsoft 365 by an in-app enrollment run by a Global Administrator; Okta, Duo, OneLogin,
      Slack, PagerDuty and SIEM/SOAR/webhook destinations take customer-created static tokens.
    evidence:
      - url: https://docs.material.security/working-with-issues/explorer/file-search
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "File Search requires (2) additional Google Drive scopes to be granted to Material via domain-wide delegation:"
      - url: https://docs.material.security/email-protections/email-threats/detections/material-email-threat-detections/calendar-invite-attacks
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "When the scope is missing, your Material instance displays a warning prompting you to grant it. Click the button in the prompt to navigate to Google where you can grant it, then give Google time to apply the change:"
      - url: https://docs.material.security/getting-started/deployment-guides/your-first-30-days/1-connect-and-sync
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "In some cases it can take up to 30 minutes for your email tenant to reflect the changes and give Material access."
      - url: https://docs.material.security/integrations/integration-fundamentals/identity-integrations
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Copy your API token because you will only see it one time. Paste it into Material."
      - url: https://docs.material.security/integrations/integration-fundamentals/identity-integrations/okta-ssf
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Token: The token you created in step 4."
      - url: https://docs.material.security/integrations/integration-fundamentals/messaging-and-ticketing-integrations
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "On the Install App page, there should now be a Bot User OAuth Token. Paste this value in Material."
      - url: https://docs.material.security/integrations/integration-fundamentals/siem-integrations/crowdstrike-ng-siem
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Copy the API key and API URL — you'll need both in Part Two."
      - url: https://material.security/products/deployment-and-security
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Your team has full access to and ownership of the underlying infrastructure. Material only has access to deploy updates."
    notes: >-
      Connectors checked: Google Workspace (keyless: domain-wide delegation to Material, per-scope
      grants in Google Admin); Microsoft 365 (enrollment is an in-app flow run by a Global
      Administrator with the steps shown only in the product, so the mechanism, presumably admin
      consent to Material's multi-tenant app, is not publicly documented; no client secret is
      mentioned); Okta Token and Okta SSF (static Okta SSWS API token from a dedicated Okta admin,
      with least-privilege admin roles listed); Duo Auth API (integration key + secret key);
      OneLogin (API client ID + client secret); Slack (the customer creates its own Slack app from
      Material's manifest and pastes the long-lived Bot User OAuth Token); PagerDuty (integration
      key); SIEM/SOAR/custom webhooks incl. Panther and CrowdStrike NG-SIEM (customer-supplied
      bearer/API keys in request headers). SAML identity integrations exchange only metadata. No
      AWS, GCP or Azure cloud connectors are documented. The single-tenant "Semi-managed" and
      "Customer Managed" deployments into customer cloud are described only on marketing pages;
      how Material authenticates into that infrastructure to deploy updates is not public.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Name the token descriptively, then click Create Token. It's useful to include a use case if you have many tokens stored."
      - url: https://docs.material.security/reference/material-mcp-server
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "This path uses an API token instead of OAuth, so storing and rotating it is on you."
    notes: >-
      Token creation takes only a name; no expiry field or org-level expiry policy is documented.
      Admins can only toggle API token creation off entirely.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.material.security/reference/api-v1
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Material Security API v1 includes these resources: Issues, Messages, Accounts, Groups, Roles, OAuth Apps, and Trusted Entities."
    notes: >-
      Tokens are created and modified in the console (Integrations > API and MCP > Tokens and MCP
      Connections). The API v1 OpenAPI spec has no token endpoints, so rotation cannot be
      automated without a browser.
  scoping:
    pass: true
    evidence:
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "For production use, create a dedicated service account for generating API tokens"
      - url: https://docs.material.security/administration/admin-roles/permissions-matrices
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Global role permissions apply to all tenants. Tenant role permissions apply only to the tenant the user is assigned the role in."
    notes: >-
      Tokens have no scopes of their own; they inherit the roles of the account that owns them.
      Passed because Material documents a dedicated service account as the production pattern and
      that account can be given a narrow built-in role (e.g. Analyst) limited to one tenant. A
      token on a human admin's account carries all of that admin's permissions.
  last_used:
    pass: false
    evidence:
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Audit Log opens, pre-filtered to this token's events within the last week. Update the filter as needed."
    notes: >-
      The token list links to a per-token Audit Log filter, but no last-used timestamp on the
      token is documented. Finding dead tokens means querying the audit log per token.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: Material Security does not appear in GitHub's secret scanning partner list.

notes: >-
  Graded the Material platform's API v1 (Email Security, Account Security, Google Drive Security
  and OAuth Security all share it). Material sells single-tenant deployment options (fully managed,
  semi-managed, customer managed in the customer's own cloud); auth for those deployments is not
  publicly documented. Inbound improves if Material adds token expiry, a last-used field and token
  management endpoints (D), or any federated machine flow (B or better). Outbound would reach A only
  if Okta and Slack moved to vendor-owned apps (Okta OIN service app, Material-owned Slack app).
