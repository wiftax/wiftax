id: material-security
vendor: Material Security
product: Platform
covers: The platform API v1.
website: https://material.security
docs: https://docs.material.security/reference/api-v1/authentication
category: security
status: listed
summary: >-
  Your code calls Material's API with a static per-account token, with no documented expiry, last
  use, token API or leak revocation. Material reaches Google Workspace through domain-wide
  delegation, but Okta, Duo, OneLogin, Slack and SIEM connectors want a pasted token or secret.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static API token made in the Material console and tied to one account, carrying that
      account's role permissions.
    issuers: []
    evidence:
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Each API token is tied to a specific account. You can create as many tokens as needed."
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Requests are checked against the account's current permissions, not the permissions it had when the token was created."
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "For production use, we recommend creating a new service account to generate the API token. Once the token is created, you can reset and discard the account's login details."
      - url: https://docs.material.security/reference/material-mcp-server
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "OAuth is the recommended way to connect: each person authorizes with their own Material account, and token issuing and refresh are handled for you, so there's no long-lived secret to store or rotate."
      - url: https://docs.material.security/reference/material-mcp-server
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Use an API token when your AI client doesn't support OAuth, or when you'd rather manage a long-lived token yourself."
    notes: >-
      No OIDC, workload identity or client-credentials flow is documented for the REST API. The MCP
      server's OAuth is a per-person login for AI clients, not a machine flow, and its fallback is
      the same static token. The in-app-only beta API was not assessed. Material runs no on-prem
      collectors.
  outbound:
    grade: B
    mechanism: >-
      Google Workspace is keyless through domain-wide delegation, and Microsoft 365 uses an in-app
      enrollment by a Global Administrator. Okta, Duo, OneLogin, Slack, PagerDuty and SIEM
      destinations take static tokens.
    evidence:
      - url: https://docs.material.security/working-with-issues/explorer/file-search
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "File Search requires (2) additional Google Drive scopes to be granted to Material via domain-wide delegation:"
      - url: https://docs.material.security/email-protections/email-threats/detections/material-email-threat-detections/calendar-invite-attacks
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "When the scope is missing, your Material instance displays a warning prompting you to grant it. Click the button in the prompt to navigate to Google where you can grant it, then give Google time to apply the change:"
      - url: https://docs.material.security/getting-started/deployment-guides/your-first-30-days/1-connect-and-sync
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "In some cases it can take up to 30 minutes for your email tenant to reflect the changes and give Material access."
      - url: https://docs.material.security/integrations/integration-fundamentals/identity-integrations
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Copy your API token because you will only see it one time. Paste it into Material."
      - url: https://docs.material.security/integrations/integration-fundamentals/identity-integrations/okta-ssf
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Token: The token you created in step 4."
      - url: https://docs.material.security/integrations/integration-fundamentals/messaging-and-ticketing-integrations
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "On the Install App page, there should now be a Bot User OAuth Token. Paste this value in Material."
      - url: https://docs.material.security/integrations/integration-fundamentals/siem-integrations/crowdstrike-ng-siem
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Copy the API key and API URL — you'll need both in Part Two."
      - url: https://material.security/products/deployment-and-security
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Your team has full access to and ownership of the underlying infrastructure. Material only has access to deploy updates."
    notes: >-
      Google Workspace grants scopes to Material, with no key. Microsoft 365 enrollment steps appear
      only in the product. It is presumably admin consent, and no client secret is mentioned. Okta
      takes a static API token, with least-privilege roles listed. Duo and OneLogin take key and
      secret pairs. Slack needs a bot token from an app you create. PagerDuty and SIEM or webhook
      destinations take your keys. No cloud connectors are documented. How Material deploys updates
      into single-tenant customer clouds is not public.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Name the token descriptively, then click Create Token. It's useful to include a use case if you have many tokens stored."
      - url: https://docs.material.security/reference/material-mcp-server
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "This path uses an API token instead of OAuth, so storing and rotating it is on you."
    notes: >-
      Token creation takes only a name, with no expiry or org policy. Admins can only turn token
      creation off entirely.
  rotation_api:
    pass: false
    evidence:
      - url: https://docs.material.security/reference/api-v1
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Material Security API v1 includes these resources: Issues, Messages, Accounts, Groups, Roles, OAuth Apps, and Trusted Entities."
    notes: >-
      Tokens are managed in the console, and the API has no token endpoints. Rotation needs a
      browser.
  scoping:
    pass: true
    evidence:
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "For production use, create a dedicated service account for generating API tokens"
      - url: https://docs.material.security/administration/admin-roles/permissions-matrices
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Global role permissions apply to all tenants. Tenant role permissions apply only to the tenant the user is assigned the role in."
    notes: >-
      Tokens inherit their account's roles. It passes because Material documents a dedicated service
      account as the production pattern, with a narrow role in one tenant. A token on an admin's
      account carries all their permissions.
  last_used:
    pass: false
    evidence:
      - url: https://docs.material.security/reference/api-v1/authentication
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "The Audit Log opens, pre-filtered to this token's events within the last week. Update the filter as needed."
    notes: >-
      No last-used time is documented on tokens. Finding dead ones means checking the audit log per
      token.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: >-
      Material Security is not on GitHub's secret-scanning partner list.

notes: >-
  Graded on API v1, shared by all Material products. Auth for single-tenant deployments is not
  public. Inbound reaches D with expiry, last use and token endpoints, and B or better with any
  federated machine flow. Outbound reaches A only if Okta and Slack move to vendor-owned apps.
