id: cisco-duo-admin-api
vendor: Duo
product: Admin API
parent: Cisco
aliases:
  - Cisco Duo
  - Duo Security
website: https://duo.com
docs: https://duo.com/docs/adminapi
category: identity
status: listed
summary: >-
  To automate Duo, your code holds an Admin API integration key and secret that sign every request.
  There is no OIDC login. Directory sync from Entra ID and Google uses admin consent, but
  device-trust integrations want pasted secrets, API keys or passwords.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static integration key and secret key from an Admin API app, used to HMAC-sign every
      request.
    tier_gated: Duo Essentials, Advantage or Premier (Admin API is not on the free plan)
    evidence:
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Locate the entry for Admin API in the catalog. Click the + Add button to create the application, and get your integration key, secret key, and API hostname."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API uses HTTP Basic Authentication to authenticate requests. Use your Duo application's integration key as the HTTP Username."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Lastly, compute the HMAC-SHA512 of this canonical representation, using your Duo application's secret key as the HMAC key."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The security of your Duo application is tied to the security of your secret key (skey)."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Duo Admin API is automatically available to paying Duo Premier, Duo Advantage, and Duo Essentials plan customers and new customers with an Advantage or Premier trial."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Admin API performs the IP check after verifying the authentication signature in a request."
    notes: >-
      The Admin API documents no OIDC, token exchange, cloud workload identity or mTLS option. HMAC
      signing keeps the secret off the wire and limits replay. It is still a long-lived shared
      secret, and Duo can return it in plain text to a privileged Admin API app. IP allowlisting
      helps but is not an identity. The OAuth client-credentials integration type is Duo acting as
      an OAuth server for your APIs, not a way into Duo. With 2 of 5 hygiene checks, the grade is F.
  outbound:
    grade: B
    mechanism: >-
      Entra ID and Google directory sync use admin consent, with no key. Device-trust integrations
      such as Intune, Jamf and CrowdStrike want a pasted client secret, password or API key.
    evidence:
      - url: https://duo.com/docs/azuresync
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Once you've signed in to Entra ID, you must click Accept to grant Duo the read rights needed to import users from your Entra ID domain."
      - url: https://duo.com/docs/googlesync
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Once you've signed in to Google, review and grant the requested permissions and click Continue to grant Duo the read rights needed to import users from your Google directory."
      - url: https://duo.com/docs/adsync
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you chose to create a new connection then your next step is to install the Duo Authentication Proxy software on a machine that can connect to both Duo's cloud service and to your AD domain controller."
      - url: https://duo.com/docs/adsync
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The account used to bind to Active Directory. This account needs read-only access to your directory."
      - url: https://duo.com/docs/oktasync
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The SCIM token expires every 90 days. You will need to regenerate the token in Duo and update it in Okta for continued inbound provisioning."
      - url: https://duo.com/docs/trusted-endpoints-intune
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy the Azure application client secret value that you created during the Azure configuration steps, and paste the copied secret into the Azure Secret Value field in the Duo Admin Panel."
      - url: https://duo.com/docs/trusted-endpoints-intune
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Under \"Client secrets\" click + New client secret. In the Description leave a comment, then under \"Expires\" select 730 days (24 months) (the permitted maximum)."
      - url: https://duo.com/docs/trusted-endpoints-jamf
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter the password for the Jamf Pro standard or LDAP user in the \"Jamf Pro account password\" field."
      - url: https://duo.com/docs/trusted-endpoints-crowdstrike-falcon
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy the Secret value from CrowdStrike and paste it into the Client Secret field in the Duo Admin Panel."
      - url: https://duo.com/docs/trusted-endpoints-cisco-amp
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy the API Key from the Cisco Secure Endpoint console and paste this in Duo as the API Key value in the \"Enter Cisco Secure Endpoint Credentials\" section."
      - url: https://duo.com/docs/trusted-endpoints-meraki
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Copy the new API key from the Meraki Dashboard. Return to the Duo Admin Panel and paste the Meraki API key in the Meraki API Key box in the \"Create a REST API key\" section."
      - url: https://duo.com/docs/trusted-endpoints-workspaceone
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create a read-only API user and role and an API key in Workspace ONE for Duo to obtain managed endpoint information."
    notes: >-
      Entra ID and Google sync are keyless. Okta and SCIM push into Duo with a Duo-issued token, so
      Duo never reaches into them. AD and OpenLDAP sync keep the bind password on a proxy host you
      run. The device-trust integrations are the static part. Intune wants a client secret on an
      Entra app you register. Jamf and similar tools want an API user's password. Meraki and
      CrowdStrike want API keys or client secrets. Duo gives least-privilege guidance throughout.
      Keyless on some, static on others is B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://duo.com/docs/protecting-applications
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you suspect a compromise of the credentials of your Duo application you may want to reset the application's secret."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secret used when configuring systems to use this integration. The secret key will be hidden, showing only the last four characters."
    notes: >-
      No expiry date or policy exists. The secret lives until someone resets it, and Duo treats a
      reset as a response to compromise.
  rotation_api:
    pass: true
    evidence:
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If set to 1, resets the integration's secret key to a new, randomly generated value. The new secret key is returned in the return value."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create a new integration. The new integration key and secret key are randomly generated and returned in the response."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Attempting to reset the secret key for the same Admin API integration whose integration key and secret key are used to make this call will return an error."
      - url: https://duo.com/docs/protecting-applications
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "There is no way to make the previously-used secret key or client secret value valid for use after the reset."
    notes: >-
      The Admin API can create apps, reset a secret and delete apps. A reset is an instant cutover,
      and an app cannot reset its own secret, so rotation needs a second privileged app.
  scoping:
    pass: true
    evidence:
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Determine the permissions you want to grant to this Admin API application."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Admin API application can read authentication, offline access, telephony, and administrator action log information."
    notes: >-
      Each Admin API app is a machine identity with its own permission toggles and optional IP
      limits. Permissions are account-wide per category, not per object.
  last_used:
    pass: false
    evidence:
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The date the WebAuthn credential was last used."
      - url: https://duo.com/docs/adminapi
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Returns a paged list of integrations."
    notes: >-
      Admin API apps show no last-used time. Admin logs record what an app changed, not when its key
      was last used.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Duo and Cisco are not in GitHub's secret-scanning program, so a leaked Duo secret is not
      reported to Duo.

notes: >-
  Graded on the Admin API, the documented way to automate Duo. The Auth API uses the same HMAC
  scheme and is not graded separately. Inbound moves to D with an enforced expiry and a last-used
  timestamp. It moves to B or A only if the Admin API accepts a federated token.
