id: nscale
vendor: Nscale
product: Cloud
covers: The control-plane API, CLI, Terraform, serverless inference and object storage.
website: https://www.nscale.com
docs: https://docs.nscale.com/docs/manage/service-tokens
category: cloud
status: listed
summary: >-
  To call Nscale's APIs, CLI, Terraform or inference, your code needs a static service account
  token. It expires after 90 days and rotates by API. Object storage uses static S3 keys. Importing
  a private Hugging Face model takes a pasted HF token.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static service account token, sent as a bearer token to every control-plane API, the CLI,
      Terraform and the inference API. No workload federation is self-serve.
    issuers: []
    evidence:
      - url: https://docs.nscale.com/docs/manage/service-tokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Each token is a signed JSON Web Token that your services can present to authenticate against the Nscale API."
      - url: https://docs.nscale.com/docs/faqs/deprecations.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service tokens now provide the authentication surface for all automation and integrations, offering finer-grained scoping and rotation controls."
      - url: https://docs.nscale.com/docs/cli/serviceaccounts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service accounts provide machine-to-machine authentication for CI/CD pipelines and automated workflows."
      - url: https://docs.nscale.com/docs/manage/terraform.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The provider authenticates with Nscale using a service token, which you can generate and rotate in the"
      - url: https://docs.nscale.com/docs/use-cases/chat.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "\"Authorization\": \"Bearer <SERVICE-TOKEN>\""
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/identity/latest/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A long lived access token that can be exchanged for an API access token."
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/identity/latest/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Domain based authentication allows integration with user provided OIDC compliant identity services."
      - url: https://raw.githubusercontent.com/nscaledev/uni-identity/main/pkg/oauth2/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Providers in organization namespaces are never trusted."
      - url: https://raw.githubusercontent.com/nscaledev/uni-identity/main/pkg/oauth2/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "looks up UNI organization membership by email, and builds the userinfo and source-claims pair."
      - url: https://docs.nscale.com/docs/storage/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create credentials tied to an identity policy. The secret is returned only once"
    notes: >-
      The service token is the only workload path. Nscale's identity service can exchange tokens
      from external OIDC issuers, but only Nscale's operators can set that trust. Each token must
      also map to an existing member's verified email. That is human SSO, not workload federation,
      so it does not lift the grade. Nscale swaps the service token for a JWT at its own edge, but
      the workload still holds the long-lived token, so this is D, not C. Object storage uses static
      S3 key pairs. Three of five hygiene checks pass.
  outbound:
    grade: F
    mechanism: >-
      Importing a model from a private or gated Hugging Face repo takes a raw Hugging Face token.
      Nscale documents no other reach-in.
    tier_gated: Private cloud organizations (beta)
    evidence:
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/ims/main/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Queue a Hugging Face model for procurement into the caller's private Model Catalog."
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/ims/main/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Optional raw Hugging Face token used only by the processor Job."
      - url: https://docs.nscale.com/docs/dedicated-models/deploy-a-model.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The **Your Models** tab lists your project's own models."
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/region/latest/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create a compute image from a public URL."
      - url: https://docs.nscale.com/docs/faqs/deprecations.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Fine-tuning service"
    notes: >-
      Images, storage and the rest reach nothing outside Nscale, and fine-tuning's Hugging Face push
      was removed in May 2026. Model import takes a raw Hugging Face token with no advice on scoping
      or rotation. It appears only in the API spec, for a private-cloud beta, so a reviewer could
      call it undocumented. Outbound would then be N/A and the headline D. Graded F as on
      cudo-compute. Scoped-token guidance would make it D.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/identity/latest/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "At present a service account token defaults to a 90 day lifetime."
      - url: https://raw.githubusercontent.com/nscaledev/uni-identity/main/pkg/handler/serviceaccounts/client.go
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Default service account token lifetime, defaults to 90 days"
      - url: https://raw.githubusercontent.com/nscaledev/uni-identity/main/pkg/handler/serviceaccounts/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "a group membership on a service account rides a token that lives for up to 90 days and that the account can keep renewing itself."
    notes: >-
      Unlike a changeable default, Nscale fixes the 90-day lifetime server-side. Requests carry no
      lifetime field, so you cannot mint a non-expiring token.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.nscale.com/api-reference/service-accounts/rotate-service-account-token.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Rotates a service account's access token. The returned access token can only be read once."
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/identity/latest/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Removes a service account and revokes an access token."
      - url: https://docs.nscale.com/docs/cli/serviceaccounts.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Rotate the access token for a service account. The old token is invalidated and a new one is returned."
    notes: >-
      The Identity API and CLI can create, rotate and delete tokens, so a job can rotate them.
  scoping:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/nscaledev/uni-identity/main/pkg/handler/serviceaccounts/README.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This package manages organization-local non-human identities."
      - url: https://docs.nscale.com/docs/manage/roles-and-groups.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A group can be scoped to specific projects, limiting where its access applies."
      - url: https://docs.nscale.com/docs/manage/roles-and-groups.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Read-only access to resources in the projects the group is assigned to."
    notes: >-
      Service accounts are machine identities that get predefined roles on chosen projects through
      groups. Only private organizations can manage groups, so a self-serve serverless org may not
      be able to narrow a token.
  last_used:
    pass: false
    evidence:
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/identity/latest/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The last time a user performed some action."
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/identity/latest/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When the service token is due to expire."
    notes: >-
      Users show last activity, but service accounts and storage keys show no last-used time.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Nscale is not in GitHub's secret-scanning patterns table.

notes: >-
  Covers the shared identity layer behind Nscale's control plane, inference and Terraform. NKS
  clusters have their own card because they can trust your OIDC issuers. Much of the detail comes
  from Nscale's public specs and source code. Self-serve token exchange for service accounts would
  lift inbound.
