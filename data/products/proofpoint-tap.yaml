id: proofpoint-tap
vendor: Proofpoint
product: Targeted Attack Protection
covers: TAP and the Threat Protection APIs.
aliases:
  - TAP
website: https://www.proofpoint.com
docs: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation
category: security
status: listed
confidence:
  level: low
  reason: >-
    Proofpoint's credential and integration docs are behind a login. All five hygiene checks fail
    partly for lack of public docs. Outbound A rests on a product page and a sibling product's
    consent flow.
summary: >-
  The TAP SIEM and related APIs take a static service principal and secret on every request. No
  federation exists, and public docs show no hygiene check passing. Into Microsoft 365, Proofpoint
  documents admin consent to its own app, with no secret handed over.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static service principal and secret, sent with HTTP Basic auth to the SIEM, People,
      Forensics and Campaign APIs. Newer report APIs trade a static key for a one-hour token.
    evidence:
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Threat Insight Dashboard provides several different API endpoints for integration with other products in your security ecosystem."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/SIEM_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "service credentials to authenticate to the API."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/SIEM_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "the HTTP Basic Authorization method."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/SIEM_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "# The service principal and secret are used to authenticate to the SIEM API. They are generated on the settings page of the Threat Insight Dashboard."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/People_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "MUST use service credentials to authenticate to the API."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Forensics_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "They correspond to the service principal and secret that was created on the Settings page."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Campaign_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "MUST use the HTTP Basic Authorization method."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/URL_Decoder_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The number of queries to this endpoint are limited by a simple, rolling 24-hour throttle per service credential."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Navigate to the API Key Management section and click + Create New to generate a new API key and secret for the Threat Protection API."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use the key and secret generated from the Admin Portal (See API Key Management) to generate an authentication token. The token is valid for 1 hour."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: 'BODY="grant_type=client_credentials&client_id=<KEY>&client_secret=<SECRET>"'
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Email_Bomb_Events_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Credentials are provisioned through Cloud Admin UI (Threat Protection Page) > Settings > API Key Management > Threat Protection tab (generate and manage keys)."
    notes: >-
      Graded on the path a workload must use. Pulling TAP events into a SIEM goes through the SIEM
      API, which takes only the static principal and secret. The newer report APIs' client
      credentials path is C at best and covers reporting only, so it does not lift the grade. No
      OIDC or workload identity exists for any Proofpoint API. The admin guide pages on credential
      lifetime and roles are behind a login. The Proofpoint Essentials API is weaker still, with a
      username and password in headers.
  outbound:
    grade: A
    mechanism: >-
      Microsoft 365 protection connects through Microsoft Graph. The only public setup doc is admin
      consent to Proofpoint's Entra app, with no customer secret.
    evidence:
      - url: https://www.proofpoint.com/us/products/advanced-threat-protection/targeted-attack-protection
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Integrate with Microsoft Graph API for rapid deployment, with automated learning, to protect your environment in just days."
      - url: https://www.proofpoint.com/us/products/advanced-threat-protection/targeted-attack-protection
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Secure Microsoft 365 via API while enabling SOC analysts to view and respond to Proofpoint detections in their Microsoft 365 console."
      - url: https://help.proofpoint.com/Essentials/Product_Documentation/Account_Management/Integrations/Microsoft_365_Integration_MX
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "During the Microsoft 365 setup process, the administrator is redirected to a Microsoft Online login. This is referred to by Microsoft as an “Admin Consent Flow”."
      - url: https://help.proofpoint.com/Essentials/Product_Documentation/Account_Management/Integrations/Microsoft_365_Integration_MX
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Proofpoint Essentials M365 Application will be installed in the organizations Azure tenant as a security principle."
      - url: https://www.proofpoint.com/us/resources/white-papers/understanding-core-email-protection-api-and-adaptive-email-dlp
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You’ll learn about deploying the products via API, how the API works and the onboarding process to get started quickly."
    notes: >-
      Provisional, and the main call for a reviewer. TAP's own Microsoft 365 setup steps are behind
      a login. The grade is inferred from the TAP product page and the public Essentials admin
      consent flow to a Proofpoint-owned app. No public doc says how Google Workspace, Account
      Takeover Protection, TRAP or CASB connect. Nothing public asks for a cloud key or client
      secret. If gated docs show a customer app with a client secret, as older TRAP setups
      reportedly use, this drops to C. A Google service-account key would make it B.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/SIEM_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This script can be run as a cron job on any Unix OS which supports the bash shell. The service principal and secret must be customized before use."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/Concepts/Managing_Service_Credentials
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No public page says TAP credentials or API keys expire, or that an admin can enforce a
      lifetime. The management page is behind a login. A documented enforced lifetime would flip
      this.
  rotation_api:
    pass: false
    evidence:
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Forensics_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "They correspond to the service principal and secret that was created on the Settings page."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Credentials are provisioned through Cloud Admin UI > Settings > API Key Management > Threat Protection tab."
      - url: https://posthog.com/docs/cdp/sources/proofpoint-tap.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In the TAP dashboard, go to **Settings** > **Connected Applications**, create a new service principal, and save the generated credentials."
    notes: >-
      Both credential types are created in an admin web UI. No public API endpoint creates, lists or
      revokes them. A third-party guide is cited because Proofpoint's page is gated.
  scoping:
    pass: false
    evidence:
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/SIEM_API
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The user is authenticated for the service but is not authorized to access data for the given customer."
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/Concepts/Managing_Service_Credentials
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      The service principal is a separate machine credential, but no public doc gives it a role or
      limits it. Third-party guides mention scopes, but Proofpoint's own page is behind a login.
  last_used:
    pass: false
    evidence:
      - url: https://help.proofpoint.com/Threat_Insight_Dashboard/Concepts/Managing_Service_Credentials
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No public doc shows a last-used time. The management page is behind a login.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Proofpoint is not in GitHub's secret-scanning patterns, so a leaked credential is not reported
      to Proofpoint.

notes: >-
  Covers TAP's APIs, including the newer report APIs. Essentials, Threat Response, CASB and other
  siblings are not graded here. Much of the admin documentation needs a login, so this card grades
  what is public. Inbound moves to D with three documented hygiene passes, to C if the SIEM API
  takes the one-hour token, and to B or A with federation.
