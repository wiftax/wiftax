id: sf-compute
vendor: SF Compute
product: GPU Cloud
covers: The v2 API and sf CLI.
aliases:
  - San Francisco Compute Company
  - sf CLI
website: https://sfcompute.com
docs: https://docs.sfcompute.com/preview/tokens
category: cloud
status: listed
summary: >-
  To drive SF Compute's API or sf CLI, your code needs a static sk_live_ token. There is no OIDC
  path. Tokens get scoped roles, show last use and rotate from the CLI, but can be set to never
  expire. SF Compute never reaches into your cloud.

surfaces:
  inbound:
    grade: D
    mechanism: >-
      A static organization API token sent as a bearer token, created with the sf CLI or dashboard
      and given roles. The API and CLI both use it.
    issuers: []
    evidence:
      - url: https://docs.sfcompute.com/preview/using-the-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All requests require a Bearer token."
      - url: https://docs.sfcompute.com/preview/using-the-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This prints a token starting with `sk_live_`."
      - url: https://docs.sfcompute.com/preview/tokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use tokens for CI/CD (continuous integration and delivery) pipelines, automation, and service accounts."
      - url: https://docs.sfcompute.com/api-reference/account/get-the-authenticated-account-and-logged-in-user.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Create an API token using `sf tokens create` or at https://sfcompute.com/dashboard/tokens."
      - url: https://docs.sfcompute.com/preview/quick-start.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This opens your browser to sign in and stores your credentials locally."
      - url: https://raw.githubusercontent.com/sfcompute/skills/main/sf-cli/SKILL.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For scripts: set `SF_BEARER_TOKEN` or `SF_API_KEY`."
    notes: >-
      The docs, API scheme and CLI reference show no OIDC or workload identity path. sf login is a
      browser session for humans. The full API spec is behind a login and was not read. Graded D on
      the control-plane token every workload must hold. Object storage keys are graded F on their
      own card, following the coreweave-object-storage split. The legacy v1 API also takes bearer
      tokens.
  outbound:
    grade: N/A
    mechanism: >-
      SF Compute has no integration that reaches into your clouds, registries or SaaS. You push data
      and images in with your own tools.
    evidence:
      - url: https://docs.sfcompute.com/preview/object-storage.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Data passes through the machine running rclone."
      - url: https://docs.sfcompute.com/preview/images.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Upload a raw disk image with `sf images upload`."
      - url: https://docs.sfcompute.com/llms.txt
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Every docs page was checked. Dataset imports run rclone on your machine, and images are
      uploaded from the CLI. No bucket, registry or Hugging Face integration exists. Instance
      secrets are served to your own VMs, not used to reach out.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.sfcompute.com/preview/tokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Without `--expires`, interactive runs prompt for an expiration and non-interactive runs default to 90 days."
      - url: https://docs.sfcompute.com/preview/tokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Pass `--no-expire` to create a token that never expires."
      - url: https://sfcompute.com/changelog
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "now correctly never expire instead of defaulting to 14 days"
      - url: https://raw.githubusercontent.com/sfcompute/cli/main/src/lib/tokens.ts
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "name: \"Never Expire\","
    notes: >-
      Scripted tokens default to 90 days, but the CLI and dashboard can both mint tokens that never
      expire, and no policy forbids it. Unlike temporal's enforced cap, a changeable default fails.
      An org-wide maximum would pass.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.sfcompute.com/preview/tokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Creating or deleting a token requires a role with `token` permissions."
      - url: https://docs.sfcompute.com/preview/tokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Deleting a token revokes it immediately."
      - url: https://docs.sfcompute.com/preview/roles.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "token = [\"*\"] # Manage tokens"
    notes: >-
      The CLI creates and deletes tokens without a browser, and a token can hold permission to
      manage tokens. So a job can replace itself. This passes on the CLI, as temporal's does, since
      no REST endpoint is documented.
  scoping:
    pass: true
    evidence:
      - url: https://docs.sfcompute.com/preview/using-the-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Tokens start with no permissions."
      - url: https://docs.sfcompute.com/preview/tokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Attach a role at creation time with `--role`, and pass `--workspace` to limit it to 1 workspace or `--org` to apply it organization-wide."
      - url: https://docs.sfcompute.com/preview/grants.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Grant roles to tokens for CI/CD pipelines and other automation."
      - url: https://docs.sfcompute.com/preview/roles.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Full access to instances, read access to pools, secrets, and SSH keys, and nothing else."
    notes: >-
      Tokens are their own principals with no access by default. They get built-in or custom roles
      per workspace. Role controls are in public preview.
  last_used:
    pass: true
    evidence:
      - url: https://docs.sfcompute.com/preview/tokens.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "NAME SUFFIX CREATED LAST USED EXPIRES"
    notes: >-
      The sf tokens list command shows a last-used column for every token.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      SF Compute is not in GitHub's secret-scanning patterns, despite its greppable sk_live_ prefix.

notes: >-
  Graded on the v2 API and Rust sf CLI. An enforced maximum lifetime or GitHub scanning would add a
  fourth hygiene pass. Inbound moves to B or A only with a federated token. Object storage, the
  weakest credential here, is graded F on its own card.
