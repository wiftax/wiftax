id: descope-agentic-identity-hub
vendor: Descope
product: Platform
covers: The Descope platform and Agentic Identity Hub, via the Management API, SDKs, Terraform and CLI.
aliases:
  - Agentic Identity Hub
  - Management API
website: https://www.descope.com
docs: https://docs.descope.com/management
category: identity
status: listed
summary: >-
  To manage Descope through its API, SDKs, Terraform or CLI, your code holds a static management key
  that can be set to never expire. Descope's AWS connectors can assume a role you create, but GCP
  and most SaaS connectors want a pasted key, token or client secret.
surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static management key, sent with the project ID as a bearer token to the Management API,
      SDKs, CLI and Terraform provider.
    evidence:
      - url: https://docs.descope.com/management
        checked_on: 2026-11-09
        checked_by: sisyphus
        quote: Use a management key with your Project ID to call the management SDK or API.
      - url: https://docs.descope.com/management
        checked_on: 2026-11-09
        checked_by: sisyphus
        quote: A management key works until it expires or is deactivated.
      - url: https://raw.githubusercontent.com/descope/terraform-provider-descope/main/docs/index.md
        checked_on: 2026-11-09
        checked_by: sisyphus
        quote: >-
          The provider authenticates with the Descope API using a management key. You can create
          management keys in the Company Settings section of the Descope console.
      - url: https://docs.descope.com/managing-environments/manage-envs-in-github
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          The management key should be stored as a secret by clicking the `New Repository Secret`
          button.
      - url: https://docs.descope.com/agentic-identity-hub/core-components/clients/workloads
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          Your agent never needs a long-lived secret. It authenticates as a workload, gets a scoped
          Descope token, and uses that token to reach your APIs and MCP servers.
      - url: >-
          https://docs.descope.com/agentic-identity-hub/core-components/connections/fetching-connection-tokens
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          A Management Key bypasses policies and grants full administrative access, so use it
          deliberately:
    notes: >-
      Descope does federation for your own workloads. Its JWT Bearer grant accepts tokens from any
      issuer you trust. But the token it returns is for your APIs and MCP servers, and is not
      documented for the management API. That API, the CLI, the Terraform provider and Descope's CI
      templates all take a static management key. The API reference shows an undocumented
      trustedIssuer field on management keys. No guide, SDK or Terraform attribute exposes it, so it
      does not count yet. Project access keys trade a static key for an app token, not a management
      one.
  outbound:
    grade: B
    mechanism: >-
      AWS connectors such as S3, SES and SNS can assume your IAM role with an External ID. GCP
      connectors want a JSON key, and SaaS connectors want pasted keys or secrets.
    evidence:
      - url: >-
          https://docs.descope.com/connectors/connector-configuration-guides/audit-and-troubleshooting/aws-eventbridge
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          Use role-based permissions to authenticate instead of long-lived credentials. You will
          need to provide:
      - url: >-
          https://docs.descope.com/connectors/connector-configuration-guides/audit-and-troubleshooting/aws-s3
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          When creating a custom IAM role for the AWS S3 connector, you must include the following
          trust policy to allow Descope to assume the role:
      - url: https://docs.descope.com/connectors/connector-configuration-guides/kyc/aws-rekognition
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: Generate Access Key ID and Secret Access Key from
      - url: >-
          https://docs.descope.com/connectors/connector-configuration-guides/analytics/google-cloud-logging
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          A Service Account Key JSON file created from a service account on your Google Cloud
          project.
      - url: https://docs.descope.com/connectors/connector-configuration-guides/marketing/salesforce
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: The connector requires authentication using OAuth 2.0 Client Credentials grant type.
      - url: https://docs.descope.com/connectors/connector-configuration-guides/messaging/slack
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: "Token: The OAuth token for Slack's Bot User, used to authenticate API requests."
      - url: >-
          https://docs.descope.com/connectors/connector-configuration-guides/audit-and-troubleshooting/datadog
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: Create a new API Key or use an existing one.
      - url: https://docs.descope.com/identity-federation/outbound-apps/creating-outbound-apps
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: The secret from the provider when creating your authentication account
    notes: >-
      AWS S3, EventBridge, SES and SNS offer a role with an External ID, with access keys as an
      alternative. Rekognition and Translate on AWS take access keys only. Google Cloud connectors
      take a service-account JSON key. SaaS connectors such as Slack and Snowflake take pasted
      tokens or secrets. There is no Azure connector. Okta, Entra and GitHub appear only as human
      SSO or as apps needing a client secret you register. Keyless on part of AWS, static everywhere
      else, so B.
hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.descope.com/management
        checked_on: 2026-11-09
        checked_by: sisyphus
        quote: When you create a key, you set a name and an expiration (30, 60, or 90 days, or never).
      - url: https://docs.descope.com/management/company-settings/mgmt-keys-sdks
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          description, expiration (`expiresIn` in seconds; `0` for no expiration), and permitted IPs
          are optional.
      - url: >-
          https://raw.githubusercontent.com/descope/terraform-provider-descope/main/docs/resources/management_key.md
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: If not set, the key will not expire.
    notes: >-
      Keys can expire, but "never" is allowed and is the API and Terraform default. No policy forces
      a maximum lifetime.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.descope.com/management/company-settings/mgmt-keys-sdks
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          You can use the Descope management SDK to create, update, delete, load, or search
          Management Keys.
      - url: https://docs.descope.com/management
        checked_on: 2026-11-09
        checked_by: sisyphus
        quote: >-
          The three-dot menu on an active key offers Edit, Rotate, Deactivate, and Delete, the same
          actions as access keys.
    notes: >-
      Keys can be created and deleted through the API and Terraform. The in-place Rotate button is
      console only.
  scoping:
    pass: true
    evidence:
      - url: https://docs.descope.com/management
        checked_on: 2026-11-09
        checked_by: sisyphus
        quote: >-
          This section defines what roles the management key has. You can choose whether these roles
          are defined on a company level, for specific projects or for Descopers for SCIM only
          usage.
      - url: https://docs.descope.com/management
        checked_on: 2026-11-09
        checked_by: sisyphus
        quote: >-
          Each management key can include a list of permitted IPs. When that list is set, the key
          only works from those originating addresses.
    notes: Keys are their own principal, with company, project or tag-level roles and IP allowlists.
  last_used:
    pass: false
    evidence:
      - url: https://docs.descope.com/management/company-settings/mgmt-keys-sdks
        checked_on: 2026-10-13
        checked_by: tehreet
        quote: >-
          This operation loads an existing Management Key by ID, including its name, description,
          status, expiration, permitted IPs, and role configuration.
    notes: >-
      Keys record creation and expiry times but not last use. Creating and changing keys is audited,
      but use is not shown.
  leak_revocation:
    pass: false
    evidence:
      - url: >-
          https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-13
        checked_by: tehreet
    notes: Descope is not in GitHub's secret scanning partner list.
notes: >-
  Graded on the Management API, which CI and Terraform use to configure Descope. Descope sells
  keyless workload identity for your agents and APIs, but its own control plane does not accept it.
  The management key schema already has a trustedIssuer field. Re-check when that ships as a
  documented feature.
