id: sysdig-secure
vendor: Sysdig
product: Sysdig Secure
covers: "The API, agents and cloud onboarding."
website: https://sysdig.com
docs: https://docs.sysdig.com/en/developer-tools/sysdig-api/
category: security
status: listed
confidence:
  level: low
  reason: >-
    Sysdig's full API reference requires a login. No last-used field is publicly documented. If one
    exists, inbound would be D.
summary: >-
  Scripts, CI and Terraform call Sysdig Secure with a static token, and agents connect with a static
  access key. There is no OIDC login. Cloud onboarding is keyless on AWS, Azure and GCP, but
  registry scans, Okta and Jira take static secrets.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static bearer token from a service account or a user's API token, for the APIs, CI and
      Terraform. Agents connect with a static access key.
    evidence:
      - url: https://docs.sysdig.com/en/developer-tools/sysdig-api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To use the APIs, you must authenticate with one of the following authentication options:"
      - url: https://docs.sysdig.com/en/developer-tools/sysdig-api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Authorization: Bearer { team-based service account | global service account | api token }"
      - url: https://docs.sysdig.com/en/administration/retrieve-the-sysdig-api-token/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When using the Sysdig API with custom scripts or applications, an API security token, specific to each user and team, must be supplied."
      - url: https://docs.sysdig.com/en/developer-tools/managing-access-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Access Key is a token that you must configure on Sysdig Agents to successfully forward data from your environment to the Sysdig backend."
      - url: https://docs.sysdig.com/en/administration/teams-administration/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Applications or scripts can use Service Accounts to access Sysdig APIs."
      - url: https://docs.sysdig.com/en/sysdig-secure/github-action-integration/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Use the SECURE_SECURE_TOKEN environment variable to define the secret containing the API Token and make it available in the pipeline."
      - url: https://raw.githubusercontent.com/sysdiglabs/terraform-provider-sysdig/master/website/docs/index.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The provider needs to be configured with proper API token before it can be used."
    notes: >-
      Graded on Sysdig Secure SaaS. The API docs list three token options, all static. The only OIDC
      in the docs is human SSO. Graded on the weakest path: every agent needs an access key that
      never expires, so even a well-managed service account does not lift the grade. The Next Gen
      API reference needs a login, so it could not be checked. Sysdig Monitor shares the same
      credentials. IBM-hosted Sysdig uses IBM IAM keys and is not graded here.
  outbound:
    grade: B
    mechanism: >-
      Sysdig assumes an AWS role with your External ID, uses its multi-tenant Entra app, and
      federates into GCP service accounts. Registry Scan Now, Okta and Jira take static secrets.
    evidence:
      - url: https://docs.sysdig.com/en/sysdig-secure/connect-aws/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Sysdig: A set of IAM Roles created during onboarding with specific, less permissive permissions attached."
      - url: https://raw.githubusercontent.com/sysdiglabs/terraform-aws-secure/master/modules/onboarding/main.tf
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: '"sts:ExternalId": "${data.sysdig_secure_tenant_external_id.external_id.external_id}"'
      - url: https://raw.githubusercontent.com/sysdiglabs/terraform-azurerm-secure/master/modules/onboarding/main.tf
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "# Create service principal in customer tenant, using the Sysdig Managed Application for Onboarding"
      - url: https://docs.sysdig.com/en/sysdig-secure/azure-permissions-and-resources/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Sysdig: A Service Principal (robot user) created during onboarding with specific, less permissive roles."
      - url: https://docs.sysdig.com/en/sysdig-secure/gcp-permissions-and-resources/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Attaches the Workload Identity Federation to the service accounts."
      - url: https://raw.githubusercontent.com/sysdiglabs/terraform-google-secure/master/modules/onboarding/main.tf
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: 'attribute_condition = "attribute.aws_role==\"arn:aws:sts::${data.sysdig_secure_trusted_cloud_identity.trusted_identity.aws_account_id}:assumed-role/${data.sysdig_secure_trusted_cloud_identity.trusted_identity.aws_role_name}/${data.sysdig_secure_tenant_external_id.external_id.external_id}\""'
      - url: https://docs.sysdig.com/en/sysdig-secure/vm-registry/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Type: Select the type of Registry you are adding. Depending on your selection, additional parameters will appear, such as the Access Key and Secret Key for AWS ECR."
      - url: https://docs.sysdig.com/en/sysdig-secure/vm-registry/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "For example, username/password for Docker Registry and JSON key for Google Container Registry."
      - url: https://docs.sysdig.com/en/sysdig-secure/integrations-okta/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Enter the Client Secret, Okta Domain, and Client ID you saved from Okta (toggling back to the Okta interface if needed)."
      - url: https://docs.sysdig.com/en/sysdig-secure/integrations-jira-ticketing/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API token must be created by the same User you input when creating a new Jira Ticketing Integration."
      - url: https://docs.sysdig.com/en/sysdig-secure/aws-elastic-container-registry/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You need to provide either an Access Key/Secret Key or a service account that has the necessary permissions."
      - url: https://docs.sysdig.com/en/sysdig-secure/google-registry/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "<GAR_REGISTRY_PASSWORD>: Base64 encoded Service Account JSON access key."
    notes: >-
      On GCP, the identity pool trusts only Sysdig's AWS role and your External ID, so no key is
      made. An older Terraform module creates one, but current modules do not. Sysdig is handed
      static secrets for Scan Now registry credentials, an Okta client secret and a user's Jira API
      token. The self-hosted Registry Scanner keeps its credentials in your cluster. OCI was not
      checked in detail. A would need keyless Scan Now, for example through the onboarded cloud
      roles.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://raw.githubusercontent.com/sysdiglabs/terraform-provider-sysdig/master/website/docs/r/team_service_account.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`expiration_date` (Required) The service account expiration date."
      - url: https://docs.sysdig.com/en/administration/teams-administration/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service accounts expire after a set period."
      - url: https://raw.githubusercontent.com/sysdiglabs/terraform-provider-sysdig/master/website/docs/r/agent_access_key.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`enabled` - (Optional) Whether the agent access key is enabled or not."
      - url: https://docs.sysdig.com/en/administration/retrieve-the-sysdig-api-token/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can Copy the token for use, or click the Reset Token button to generate a new one."
    notes: >-
      Service account tokens must expire, which alone would pass, as on sentinelone-singularity. But
      agent access keys and user tokens never expire, and no policy can cap them. Every agent needs
      a key, so this fails.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.sysdig.com/en/developer-tools/managing-access-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If the access key is compromised or you have a policy to renew it, you can generate a new access key and disable the old one."
      - url: https://docs.sysdig.com/en/developer-tools/global-service-accounts/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Admins can create or delete a global service account by performing an API call."
      - url: https://raw.githubusercontent.com/sysdiglabs/terraform-provider-sysdig/master/website/docs/r/team_service_account.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Creates a team service account in Sysdig."
    notes: >-
      The API creates, disables and deletes access keys and service accounts. User API tokens reset
      only in the UI.
  scoping:
    pass: true
    evidence:
      - url: https://docs.sysdig.com/en/administration/teams-administration/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Unlike users, service accounts have no permissions out of the box. They only have the permissions granted by the role you assign them."
      - url: https://docs.sysdig.com/en/administration/teams-administration/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Service accounts are not bound to a user, but to a team."
      - url: https://docs.sysdig.com/en/developer-tools/global-service-accounts/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Each role has only the permissions needed to perform a specific task, such as managing access keys, or ingesting Prometheus remote write metric."
    notes: >-
      Team service accounts are machine identities with one team role. User tokens inherit the
      user's role, and agent keys can be limited only by agent count, not permissions.
  last_used:
    pass: false
    evidence:
      - url: https://docs.sysdig.com/en/developer-tools/managing-access-keys/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The output provides a list of the access keys in the response and indicates whether they are enabled."
      - url: https://raw.githubusercontent.com/sysdiglabs/terraform-provider-sysdig/master/website/docs/r/agent_access_key.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "`date_created` - Date when the agent key was created."
    notes: >-
      Access keys and service accounts show creation and expiry dates, but no last use. The
      login-walled API reference might show more.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Sysdig is not in GitHub's secret-scanning table, and its tokens are plain UUIDs with no
      detectable prefix.

notes: >-
  Sysdig Monitor uses the same credentials and would grade the same inbound. Expiry on access keys
  and user tokens would lift inbound to D. Inbound moves to B or A only if the API and agents accept
  a federated token. Review call: expiry fails even though service accounts require one.
