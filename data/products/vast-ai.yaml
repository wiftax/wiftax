id: vast-ai
vendor: Vast.ai
product: GPU Cloud
covers: "The REST API, vastai CLI and SDK, and Cloud Sync."
aliases: ["vastai"]
website: https://vast.ai
docs: https://docs.vast.ai/guides/reference/api-keys.md
category: cloud
status: listed
summary: >-
  To call Vast.ai, your code needs a static API key that never expires. There is no OIDC login.
  Cloud Sync reaches Google Drive and Dropbox through OAuth consent, but S3, Backblaze, Hugging Face
  and private registries need pasted static credentials.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static API key sent as a Bearer token, optionally scoped by permission. The API, CLI, SDK
      and Serverless endpoints all use it.
    issuers: []
    evidence:
      - url: https://docs.vast.ai/api-reference/authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Every request to the Vast.ai API must include an API key."
      - url: https://docs.vast.ai/api-reference/authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Include your key as a Bearer token in the `Authorization` header:"
      - url: https://docs.vast.ai/guides/reference/api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You'll need a key for any programmatic access; the web console works without one."
      - url: https://docs.vast.ai/cli/authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This is recommended for CI pipelines, Docker containers, and scripts, it avoids writing keys to disk and makes it easy to inject secrets via your platform's secret manager."
      - url: https://docs.vast.ai/api-reference/accounts/create-api-key.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "All endpoints require `Authorization: Bearer $VAST_API_KEY`."
      - url: https://docs.vast.ai/guides/serverless/openai-compatible-api.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If your code already uses the OpenAI Python client (or any OpenAI-compatible HTTP client), you can switch to Vast by changing two values: the **API key** and the **base URL**."
      - url: https://docs.vast.ai/guides/reference/keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "These keys are automatically created when you log in and will expire in one week."
    notes: >-
      The docs, API spec and CLI source describe no OIDC, cloud workload identity or token exchange.
      One-week session keys are browser logins for humans. Instance SSH keys reach a rented
      container, not the API. Only two of five hygiene checks pass, so F. No tier gate: scoped keys
      and Teams roles come with every account.
  outbound:
    grade: B
    mechanism: >-
      Google Drive and Dropbox connect through OAuth consent. S3, Backblaze and Hugging Face take
      pasted static keys, and private registries take a username and password.
    evidence:
      - url: https://docs.vast.ai/guides/instances/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Submit the name, after which a new tab should open up asking if you would like to give Vast access to your Google Drive."
      - url: https://docs.vast.ai/guides/instances/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Submit the name, after which a new tab should open up asking if you would like to give Vast access to your Dropbox."
      - url: https://docs.vast.ai/guides/instances/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Once the access key is created, you will be prompted with an Access Key, and a Secret access Key. This will be the information required to use your AWS user permissions on Vast."
      - url: https://docs.vast.ai/guides/instances/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Vast connects at the IAM-user level, so create a new IAM user scoped to the data you want to sync rather than reusing an existing one."
      - url: https://docs.vast.ai/guides/instances/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Note the keyId and the applicationKey that are returned to you. This is the data required for Vast."
      - url: https://docs.vast.ai/guides/instances/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Vast connects to Hugging Face through its S3-compatible Storage Buckets: generate S3 credentials on Hugging Face, then add them to Vast."
      - url: https://docs.vast.ai/guides/instances/storage/cloud-sync.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Cloud Sync credentials are temporarily copied onto your instance's host machine, and Vast connects with the full access those credentials carry."
      - url: https://docs.vast.ai/guides/instances/storage/cloud-backups.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Before creating backup jobs, you need to ensure you have a cloud storage connection set up in your Vast.ai account."
      - url: https://docs.vast.ai/guides/templates/template-settings.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you are using a private Docker image then you will need to add authentication credentials so the machine running the instance can download it."
      - url: https://raw.githubusercontent.com/vast-ai/vast-cli/master/vast.py
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "docker login arguments for private repo authentication, surround with ''"
    notes: >-
      Google Drive and Dropbox are OAuth consents, which the rubric counts as keyless. That alone
      makes this B rather than D. Every cloud storage link is static. S3 needs an IAM user's access
      key, with no cross-account role. The docs do give bucket-scoped least-privilege guidance.
      There is no GCS or Azure Blob option. Vast copies these credentials, OAuth grants included,
      onto the host running your instance. That host may be an individual's machine unless you pick
      Secure Cloud. A reviewer who reads B as needing a keyless cloud would put this at D.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://docs.vast.ai/api-reference/authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API keys do not expire by default."
      - url: https://docs.vast.ai/cli/authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API keys do not expire by default. You can revoke a key at any time from the [Keys page](https://cloud.vast.ai/manage-keys/) or with `vastai delete api-key`."
      - url: https://docs.vast.ai/guides/reference/api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A 90-day rotation is a reasonable baseline for production keys."
    notes: >-
      Keys never expire, and neither the API nor the CLI can set an expiry. No org policy caps
      lifetime. The 90-day figure is advice, not enforcement.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.vast.ai/api-reference/authentication.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can also create keys programmatically via the API ([Create API Key](/api-reference/accounts/create-api-key.md)), CLI ([`vastai create api-key`](/cli/reference/create-api-key)), or SDK ([`vast.create_api_key()`](/sdk/python/reference/create-api-key))."
      - url: https://docs.vast.ai/api-reference/accounts/delete-api-key.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The API key is soft-deleted by setting a deleted_at timestamp."
      - url: https://docs.vast.ai/guides/reference/api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The old key stops working as soon as you reset; there's no overlap window."
    notes: >-
      The API can create, list and revoke keys, and the SDK can reset one. For overlap, create a
      second key before deleting the first.
  scoping:
    pass: true
    evidence:
      - url: https://docs.vast.ai/guides/reference/api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "By default, API keys have full access to your account."
      - url: https://docs.vast.ai/api-reference/permissions.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When you create a scoped API key, you include only the categories the key needs."
      - url: https://docs.vast.ai/api-reference/permissions.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Constraints narrow a permission category to specific parameter values. This lets you create keys that can only operate on certain resources."
    notes: >-
      Each key carries its own permissions, narrowable down to parameters like instance ID. The
      default is full access. There is no service account, so keys belong to a user or team.
  last_used:
    pass: false
    evidence:
      - url: https://docs.vast.ai/api-reference/accounts/show-api-keys.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Retrieves all API keys associated with the authenticated user."
      - url: https://docs.vast.ai/api-reference/accounts/show-ipaddrs.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "This endpoint retrieves the history of IP address accesses for the authenticated user."
    notes: >-
      The key list shows no last-used or created time. Account IP history exists but is not tied to
      a key.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Vast.ai is not in GitHub's secret scanning patterns, so leaked keys are not reported to Vast.

notes: >-
  One card for the whole platform, which runs on one account API key. Inbound moves to B or A only
  with federation. Before that, an enforced expiry plus a last-used time would lift it to D.
  Outbound reaches A with an IAM role for S3 and token or consent flows for the rest.
