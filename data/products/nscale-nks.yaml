id: nscale-nks
vendor: Nscale
product: Kubernetes Service
aliases:
  - NKS
website: https://www.nscale.com
docs: https://docs.nscale.com/docs/platform-services/managed-kubernetes
category: cloud
status: listed
summary: >-
  This card covers the NKS cluster API server. A cluster can trust up to eight OIDC issuers you
  choose and can turn off Nscale credentials. It can also publish its own OIDC issuer. By default,
  kubectl uses your Nscale login or static service token, graded D on the nscale card.

surfaces:
  inbound:
    grade: A
    mechanism: >-
      At creation, a cluster can list up to 8 OIDC issuers with audiences and claims, bound to
      built-in roles. The default kubeconfig runs the CLI on your Nscale login or service token.
    issuers:
      - any
    evidence:
      - url: https://docs.nscale.com/docs/platform-services/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can also let people sign in with your own OpenID Connect (OIDC) provider, and give them one of the built-in roles: 'cluster-admin', 'admin', 'edit', or 'view'."
      - url: https://docs.nscale.com/docs/platform-services/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Your provider's 'https://' URL, with no query string or fragment. It must match the 'iss' claim in your tokens exactly. Up to 8 issuers."
      - url: https://docs.nscale.com/docs/platform-services/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "At least one. The token's 'aud' claim must match one of them."
      - url: https://docs.nscale.com/docs/platform-services/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "People only get the access you bind. Someone with a valid token but no binding is refused everything."
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/nks-core/main/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Additional external JWT/OIDC issuers the cluster's API server trusts."
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/nks-core/main/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "JWT claim mapped to the authenticated username."
      - url: https://docs.nscale.com/docs/cli/kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you disable Nscale credentials, you must add at least one issuer, otherwise nobody could sign in."
      - url: https://docs.nscale.com/docs/cli/kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Credentials are refreshed the same way as for every other command, and 'NSCALE_SERVICE_TOKEN' is honored for CI."
      - url: https://docs.nscale.com/docs/platform-services/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The kubeconfig contains no password or token."
    notes: >-
      This is kube-apiserver's JWT authenticator. Any HTTPS issuer works, audience is required, and
      the subject maps to cluster-admin, admin, edit or view. So a GitHub Actions or cloud token can
      drive kubectl with no Nscale secret. Judgment calls: the docs say it lets "people" sign in,
      but nothing limits it to humans, and coreweave-cks got an A for the same mechanism. The A also
      requires opting in. The issuer list cannot change after creation, and creating the cluster
      needs the service token graded on the nscale card.
  outbound:
    grade: A
    mechanism: >-
      A cluster can publish a public OIDC issuer for its service account tokens, which AWS, GCP,
      Azure or others can trust. NKS holds no credential for your infrastructure.
    evidence:
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/nks-core/main/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The public OIDC issuer URL of the cluster's ServiceAccount tokens. Use it to configure external relying parties."
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/nks-core/main/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "It is absent when the cluster uses only its in-cluster issuer."
      - url: https://docs.nscale.com/docs/platform-services/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Applications running in the cluster should use projected ServiceAccount tokens."
      - url: https://docs.nscale.com/docs/platform-services/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A request for longer is shortened to 24 hours without an error, so check the expiry you get back."
    notes: >-
      NKS has no managed integration into your cloud, registry or SaaS. Being an OIDC issuer you can
      trust scores A, as on coreweave-cks. Caveats: the issuer appears only in the API spec, with no
      cloud setup guide, and how to enable it is undocumented. If that fails "documented for
      workloads", outbound becomes N/A and the headline stays A.

hygiene:
  expiry:
    pass: true
    evidence:
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/identity/latest/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "At present a service account token defaults to a 90 day lifetime."
      - url: https://raw.githubusercontent.com/nscaledev/uni-identity/main/pkg/handler/serviceaccounts/client.go
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Default service account token lifetime, defaults to 90 days"
    notes: >-
      Hygiene covers the service token used on the default path. The OIDC path has no Nscale secret.
      Nscale fixes the 90-day lifetime server-side, so you cannot mint a non-expiring token.
  rotation_api:
    pass: true
    evidence:
      - url: https://docs.nscale.com/api-reference/service-accounts/rotate-service-account-token.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Rotates a service account's access token. The returned access token can only be read once."
    notes: >-
      The kubeconfig holds no token, so rotating the service token needs no kubeconfig change.
  scoping:
    pass: true
    evidence:
      - url: https://docs.nscale.com/docs/platform-services/managed-kubernetes.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "**Read** gives you read-only access (the Kubernetes 'view' role)."
      - url: https://docs.nscale.com/docs/manage/roles-and-groups.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "A group can be scoped to specific projects, limiting where its access applies."
    notes: >-
      A service account gets cluster access through its groups' roles, scoped to projects. Read maps
      to view and update to cluster-admin. Coarse, but a machine identity with its own role counts.
  last_used:
    pass: false
    evidence:
      - url: https://raw.githubusercontent.com/nscaledev/openapi/main/identity/latest/openapi.yaml
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "When the service token is due to expire."
    notes: >-
      Service accounts show expiry but no last-used time. Only human users have one.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Nscale is not in GitHub's secret-scanning patterns table.

notes: >-
  Split from nscale because the cluster API server can trust your own OIDC issuers. The A holds only
  for clusters created with external issuers, ideally with Nscale credentials disabled.
