id: genesis-cloud
vendor: Genesis Cloud
product: Platform
covers: "Compute API, Object Storage and Inference Service."
website: https://www.genesiscloud.com
docs: https://developers.genesiscloud.com/compute-api/
category: cloud
status: listed
summary: >-
  The Compute API, Terraform, Object Storage and Inference API all take static secrets made by hand
  in the console, each with full account access. No hygiene check passes and there is no OIDC path.
  Genesis never reaches into your cloud or SaaS.

surfaces:
  inbound:
    grade: F
    mechanism: >-
      A static API token made in the console and sent as a bearer token. Object Storage uses a
      static S3-style access key and secret.
    issuers: []
    evidence:
      - url: https://developers.genesiscloud.com/compute-api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Each request made to Genesis Cloud APIs must be authenticated."
      - url: https://developers.genesiscloud.com/compute-api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "You can generate an API token by visiting the Keys and Tokens section of the dashboard."
      - url: https://developers.genesiscloud.com/compute-api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The X-Auth-Token authentication header is now deprecated."
      - url: https://web.archive.org/web/20260211062742/https://support.genesiscloud.com/support/solutions/articles/47001126146-how-to-generate-an-api-token-
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "API tokens are unique identifiers associated with your Genesis Cloud account and consist of an ID and a Secret Token."
      - url: https://raw.githubusercontent.com/genesiscloud/terraform-provider-genesiscloud/main/docs/index.md
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Set the `GENESISCLOUD_TOKEN` env var or specify the `token` in the provider"
      - url: https://web.archive.org/web/20250316115632/https://support.genesiscloud.com/support/solutions/articles/47001255868-object-storage
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: 'On the left sidebar "Keys & Tokens", you need to generate new Access key and a Secret token with an Object Storage type and copy them.'
      - url: https://developers.genesiscloud.com/inference-service-api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Make sure to select Inference Service when creating a new token."
    notes: >-
      Compute, object storage and inference share one console page of static secrets, so one card.
      No OIDC, GitHub Actions, workload identity or token exchange is documented anywhere. Every
      path a workload must use runs on a long-lived secret. Support articles are cited from Wayback
      captures, since the live site blocks automated fetches. A managed Kubernetes or registry, if
      one exists, is not documented and was not graded.
  outbound:
    grade: N/A
    mechanism: >-
      Genesis never needs access to your infrastructure. Custom image import fetches a URL you
      supply, with no credential.
    evidence:
      - url: https://developers.genesiscloud.com/compute-api/snapshots
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To create a new snapshot from a custom image URL, send a request to:"
      - url: https://developers.genesiscloud.com/compute-api/snapshots
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "url String Required - The url pointing to a raw or raw with zstd compressed image."
      - url: https://web.archive.org/web/20260130173913/https://support.genesiscloud.com/support/solutions/articles/47001260907-uploading-custom-images-using-our-api
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "In every case you will end up with a URL from which you can access your image, which is all you need to create a snapshot using our API."
    notes: >-
      No integration with your AWS, GCP or Azure account, registry, Hugging Face or W&B is
      documented. Startup scripts run inside your instance, not as Genesis reaching out. Image
      import is N/A, not keyless access, since the documented flow hosts the image in Genesis's own
      storage. On together-ai, by contrast, you sign a URL into your own S3 bucket.

hygiene:
  expiry:
    pass: false
    evidence:
      - url: https://web.archive.org/web/20260211062742/https://support.genesiscloud.com/support/solutions/articles/47001126146-how-to-generate-an-api-token-
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Secret Token is required to authenticate against our API and will only be displayed when you create the token."
      - url: https://developers.genesiscloud.com/compute-api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If you accidentally publish your token, please immediately revoke it."
    notes: >-
      No expiry, default lifetime or org policy is documented. Manual revocation is the only end.
      The console is login-walled, so any expiry field there gets no credit.
  rotation_api:
    pass: false
    evidence:
      - url: https://developers.genesiscloud.com/compute-api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "The Compute API allows you to manage your Compute Service resources:"
      - url: https://web.archive.org/web/20260211062742/https://support.genesiscloud.com/support/solutions/articles/47001126146-how-to-generate-an-api-token-
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "To generate a new token, click on 'Generate new API Token' in the 'API Tokens' section of the page."
      - url: https://raw.githubusercontent.com/genesiscloud/genesiscloud-go/main/client.gen.go
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      No API or client operation manages tokens or storage keys. They are created and deleted only
      in the console.
  scoping:
    pass: false
    evidence:
      - url: https://developers.genesiscloud.com/compute-api/
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "It is absolutely essential that you keep your secret token private as it provides access to everything in your Genesis Cloud account."
      - url: https://web.archive.org/web/20260211062742/https://support.genesiscloud.com/support/solutions/articles/47001126146-how-to-generate-an-api-token-
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "If someone else sees your Token, they can gain full access to your resources."
      - url: https://web.archive.org/web/20230607230619/https://support.genesiscloud.com/support/solutions/articles/47001243575-overview-of-project-roles-and-permissions
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Members of a project can have one of three roles: admin, editor, or viewer."
    notes: >-
      Tokens have a service type, but Genesis says a token "provides access to everything" in the
      account. Project roles apply to people, and there is no service account or per-token role.
  last_used:
    pass: false
    evidence:
      - url: https://web.archive.org/web/20260211062742/https://support.genesiscloud.com/support/solutions/articles/47001126146-how-to-generate-an-api-token-
        checked_on: 2026-10-22
        checked_by: tehreet
        quote: "Only the ID and Description will show on your screen."
    notes: >-
      No last-used time is documented, and the console is login-walled. Even if expiry and last use
      passed there, inbound would stay F.
  leak_revocation:
    pass: false
    evidence:
      - url: https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
        checked_on: 2026-10-22
        checked_by: tehreet
    notes: >-
      Genesis Cloud is not in GitHub's secret scanning table at all.

notes: >-
  Every machine path runs on a full-account static token or S3 key, with no hygiene check passing.
  Any three of a token API, enforced expiry, per-token roles, a last-used column and GitHub partner
  scanning would make inbound D. B or A needs OIDC federation into the API and Object Storage.
